<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sonoplastia IASD">
<meta name="theme-color" content="#0b1120">
<title>Sonoplastia IASD - Gerenciador de Culto</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root {
    --bg-page: #0b1120; --border-soft: rgba(148,163,184,0.14);
    --text-hi: #f1f5f9; --text-mid: #94a3b8; --text-dim: #64748b;
    --accent-1: #2563eb; --accent-2: #0891b2; --accent-3: #7c3aed;
    --glass-bg: #0f172acc;
    --highlight: #fb923c; --text-on-highlight: #1c1917;
    --success-1: #10b981; --success-2: #10b981; --danger: #ef4444;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-page: #eef2f9; --border-soft: rgba(30,41,59,0.1);
      --text-hi: #0f172a; --text-mid: #475569; --text-dim: #64748b;
    }
  }
  :root[data-theme="dark"] { --bg-page: #0b1120; --border-soft: rgba(148,163,184,0.14); --text-hi: #f1f5f9; --text-mid: #94a3b8; --text-dim: #64748b; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { background: var(--bg-page); color: var(--text-hi); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; min-height:100vh; position:relative; zoom:1.18; }
  body::before {
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px) 0 0 / 42px 42px,
      linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px) 0 0 / 42px 42px,
      radial-gradient(1000px 520px at 6% -6%, rgba(236,72,153,0.20), transparent 60%),
      radial-gradient(950px 480px at 108% 6%, rgba(139,92,246,0.20), transparent 60%),
      radial-gradient(800px 460px at 100% 100%, rgba(6,182,212,0.16), transparent 60%),
      radial-gradient(700px 400px at 0% 115%, rgba(251,146,60,0.10), transparent 60%);
    background-color: var(--bg-page); background-size: 42px 42px, 42px 42px, 200% 200%, 200% 200%, 200% 200%, 200% 200%; animation: aurora 24s ease-in-out infinite;
  }
  @keyframes aurora { 0%,100%{background-position:0% 0%;} 50%{background-position:100% 60%;} }
  * { scrollbar-width: thin; scrollbar-color: rgba(99,102,241,.45) transparent; }
  *::-webkit-scrollbar{width:8px;height:8px;} *::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent-1),var(--accent-2));border-radius:999px;}
  .glass{background:var(--glass-bg, #0f172acc);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border-soft);}
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .glass{background:var(--glass-bg, #ffffffee);} }
  :root[data-theme="dark"] .glass{background:var(--glass-bg, #0f172acc);}
  .grad-text{background:linear-gradient(90deg,var(--accent-1),var(--accent-3),var(--accent-2),var(--accent-1));background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gf 7s linear infinite;}
  @keyframes gf{to{background-position:300% center;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .fade-up{animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both;}
  .breathe{animation:breathe 4s ease-in-out infinite;} @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  button{font-family:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,0.28),0 4px 10px -2px rgba(0,0,0,0.35);transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s ease,filter .16s ease;transform:translateY(0) scale(1);}
  button:not(:disabled):hover{filter:brightness(1.1);transform:translateY(-2px) scale(1.035);box-shadow:0 4px 0 rgba(0,0,0,0.28),0 10px 20px -5px rgba(0,0,0,0.42);}
  button:not(:disabled):active{transform:translateY(1px) scale(0.965);box-shadow:0 1px 0 rgba(0,0,0,0.28),0 2px 4px -1px rgba(0,0,0,0.3);filter:brightness(0.95);}
  button:disabled{box-shadow:none;cursor:default;}
  .nav-tile{position:relative;overflow:hidden;}
  .nav-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,0.35) 42%,transparent 64%);background-size:220% 220%;background-position:-140% -140%;opacity:0;transition:opacity .2s ease;pointer-events:none;}
  .nav-tile:not(:disabled):hover::after{opacity:1;animation:navShine .9s ease forwards;}
  @keyframes navShine{from{background-position:-140% -140%;}to{background-position:140% 140%;}}
  .nav-tile:not(:disabled):hover{filter:brightness(1.12);transform:translateY(-3px) scale(1.06);box-shadow:0 12px 22px -6px var(--tc1, rgba(0,0,0,0.5));}
  .nav-tile:not(:disabled):active{transform:translateY(0) scale(0.94);}
  input,select{font-family:inherit;}
  ::placeholder{color:var(--text-dim);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useMemo, useRef } = React;

const DB_KEY = 'gc_igrejas_db_v1';
const LOG_KEY = 'gc_log_v1';
const SESSION_KEY = 'gc_session_v1';

const DEV_ACCOUNT = { login: 'paulo', password: '221844', name: 'Paulo', role: 'developer' };

function loadDB() {
  try { const raw = localStorage.getItem(DB_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function saveDB(list) { try { localStorage.setItem(DB_KEY, JSON.stringify(list)); } catch(e) {} }
function loadLog() {
  try { const raw = localStorage.getItem(LOG_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function saveLog(list) { try { localStorage.setItem(LOG_KEY, JSON.stringify(list)); } catch(e) {} }
function pushLog(list, entry) {
  const next = [{...entry, id:'log-'+Date.now()+Math.random().toString(36).slice(2,6), at:new Date().toISOString()}, ...list].slice(0,200);
  saveLog(next);
  return next;
}

const SUGGESTIONS_KEY = 'gc_suggestions_v1';
function loadSuggestions() {
  try { const raw = localStorage.getItem(SUGGESTIONS_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function saveSuggestions(list) { try { localStorage.setItem(SUGGESTIONS_KEY, JSON.stringify(list)); } catch(e) {} }

const inputStyle = { padding:'11px 13px', borderRadius:'10px', border:'1px solid var(--border-soft)', background:'rgba(15,23,42,0.35)', color:'var(--text-hi)', fontSize:'13.5px', outline:'none', width:'100%' };
const btnPrimary = { padding:'12px 18px', borderRadius:'14px', border:'none', background:'linear-gradient(150deg,var(--accent-1),var(--accent-2))', color:'#fff', fontWeight:800, fontSize:'13px', width:'100%', boxShadow:'0 6px 16px -6px rgba(0,0,0,0.5)', cursor:'pointer' };
const btnGhost = { padding:'10px 14px', borderRadius:'14px', border:'none', background:'rgba(148,163,184,0.14)', color:'var(--text-mid)', fontWeight:700, fontSize:'12.5px', cursor:'pointer' };
const errorBox = { padding:'10px 12px', borderRadius:'10px', background:'color-mix(in srgb, var(--danger) 14%, transparent)', border:'1px solid color-mix(in srgb, var(--danger) 32%, transparent)', color:'var(--danger)', fontSize:'12.5px' };
const sectionLabelStyle = { fontSize:'10.5px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.05em', marginTop:'6px', marginBottom:'-2px' };

function Brand() {
  return html`
    <div style=${{textAlign:'center', marginBottom:'22px'}}>
      <div class="breathe" style=${{width:'56px',height:'56px',borderRadius:'18px',background:'linear-gradient(135deg,var(--accent-1),var(--accent-2),var(--accent-3))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'26px',margin:'0 auto 10px',boxShadow:'0 10px 26px -10px rgba(79,70,229,.6)'}}>⛪</div>
      <div class="grad-text" style=${{fontWeight:800,fontSize:'20px'}}>Sonoplastia IASD</div>
      <div style=${{fontSize:'12px',color:'var(--text-mid)',marginTop:'2px'}}>Sistema Multi-Igrejas de Liturgia, Som & Telão</div>
    </div>
  `;
}

function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [selectedChurchLogin, setSelectedChurchLogin] = useState('');
  const [login, setLogin] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [forgotOpen, setForgotOpen] = useState(false);
  const [showPassword, setShowPassword] = useState(false);
  const churches = useMemo(() => loadDB(), [mode, forgotOpen]);

  const [name, setName] = useState('');
  const [city, setCity] = useState('');
  const [state, setState] = useState('');
  const [address, setAddress] = useState('');
  const [association, setAssociation] = useState('');
  const [district, setDistrict] = useState('');
  const [isDistrictSeat, setIsDistrictSeat] = useState(false);
  const [pastorName, setPastorName] = useState('');
  const [elderName, setElderName] = useState('');
  const [ministryLeaders, setMinistryLeaders] = useState([{ ministry:'', leader:'' }]);
  const [newLogin, setNewLogin] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [recoveryQuestion, setRecoveryQuestion] = useState('');
  const [recoveryAnswer, setRecoveryAnswer] = useState('');

  const updateLeaderRow = (idx, field, value) => {
    setMinistryLeaders(rows => rows.map((r,i) => i===idx ? {...r, [field]: value} : r));
  };
  const addLeaderRow = () => setMinistryLeaders(rows => [...rows, { ministry:'', leader:'' }]);
  const removeLeaderRow = (idx) => setMinistryLeaders(rows => rows.length > 1 ? rows.filter((_,i)=>i!==idx) : rows);


  const doLogin = (e) => {
    e.preventDefault();
    setError('');
    if (!login.trim() || !password.trim()) { setError('Digite usuário e senha.'); return; }

    if (login.trim().toLowerCase() === DEV_ACCOUNT.login && password === DEV_ACCOUNT.password) {
      onLogin({ type:'developer', name: DEV_ACCOUNT.name });
      return;
    }

    const db = loadDB();
    const church = db.find(c => c.login.toLowerCase() === login.trim().toLowerCase() && c.password === password);
    if (!church) { setError('Usuário ou senha incorretos.'); return; }
    onLogin({ type:'church', church });
  };

  const doRegister = (e) => {
    e.preventDefault();
    setError('');
    if (!name.trim()) { setError('Informe o nome da igreja.'); return; }
    if (!newLogin.trim()) { setError('Escolha um login de acesso.'); return; }
    if (!newPassword.trim() || newPassword.length < 4) { setError('A senha deve ter no mínimo 4 caracteres.'); return; }
    if (!recoveryQuestion.trim() || !recoveryAnswer.trim()) { setError('Preencha a pergunta e a resposta de segurança — é por elas que você vai recuperar a senha se esquecer.'); return; }

    const db = loadDB();
    if (db.some(c => c.login.toLowerCase() === newLogin.trim().toLowerCase()) || newLogin.trim().toLowerCase() === DEV_ACCOUNT.login) {
      setError('Esse login já está em uso. Escolha outro.');
      return;
    }

    const now = new Date().toISOString();
    const church = {
      id:'igreja-'+Date.now(), name:name.trim(), city:city.trim(), state:state.trim(),
      address: address.trim(), association: association.trim(), district: district.trim(),
      isDistrictSeat, pastorName: pastorName.trim(), elderName: elderName.trim(),
      ministryLeaders: ministryLeaders.filter(r => r.ministry.trim() || r.leader.trim()),
      login:newLogin.trim(), password:newPassword,
      recoveryQuestion: recoveryQuestion.trim(), recoveryAnswer: recoveryAnswer.trim().toLowerCase(),
      createdAt: now, updatedAt: now
    };
    const nextDB = [...db, church];
    saveDB(nextDB);
    pushLog(loadLog(), { type:'cadastro', churchName: church.name, churchId: church.id });

    onLogin({ type:'church', church });
  };

  return html`
    <div style=${{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'20px'}}>
      <div class="fade-up" style=${{width:'100%', maxWidth: mode==='register' ? '480px' : '420px'}}>
        <${Brand} />
        <div class="glass" style=${{borderRadius:'20px', padding:'22px', display:'grid', gap:'16px', maxHeight:'80vh', overflowY:'auto'}}>
          <div style=${{display:'flex', padding:'4px', background:'rgba(15,23,42,0.5)', borderRadius:'12px', border:'1px solid var(--border-soft)', position:'sticky', top:0}}>
            <button onClick=${()=>{setMode('login'); setError('');}} style=${{flex:1, padding:'9px', borderRadius:'8px', border:'none', fontSize:'12.5px', fontWeight:700, background: mode==='login' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: mode==='login' ? '#fff' : 'var(--text-mid)'}}>Entrar</button>
            <button onClick=${()=>{setMode('register'); setError('');}} style=${{flex:1, padding:'9px', borderRadius:'8px', border:'none', fontSize:'12.5px', fontWeight:700, background: mode==='register' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: mode==='register' ? '#fff' : 'var(--text-mid)'}}>Cadastrar Igreja</button>
          </div>

          ${error && html`<div style=${errorBox}>${error}</div>`}

          ${mode === 'login' ? html`
            <form onSubmit=${doLogin} style=${{display:'grid', gap:'10px'}}>
              <select value=${selectedChurchLogin} onChange=${e=>{ setSelectedChurchLogin(e.target.value); setLogin(e.target.value === '__dev__' ? '' : e.target.value); }} style=${inputStyle}>
                <option value="">Selecione sua igreja...</option>
                ${churches.map(c => html`<option key=${c.id} value=${c.login}>${c.name}${c.city ? ' — '+c.city : ''}</option>`)}
                <option value="__dev__">Sou desenvolvedor</option>
              </select>
              ${selectedChurchLogin === '__dev__' && html`
                <input placeholder="Usuário do desenvolvedor" value=${login} onChange=${e=>setLogin(e.target.value)} style=${inputStyle} />
              `}
              <div style=${{position:'relative'}}>
                <input type=${showPassword ? 'text' : 'password'} placeholder="Senha" value=${password} onChange=${e=>setPassword(e.target.value)} style=${{...inputStyle, paddingRight:'42px'}} />
                <button type="button" onClick=${()=>setShowPassword(v=>!v)} style=${{position:'absolute', right:'6px', top:'50%', transform:'translateY(-50%)', background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'15px', padding:'4px 6px', cursor:'pointer'}} title=${showPassword ? 'Ocultar senha' : 'Mostrar senha'}>${showPassword ? '🙈' : '👁️'}</button>
              </div>
              <button type="submit" style=${btnPrimary}>Entrar no Sistema</button>
              <button type="button" onClick=${()=>setForgotOpen(true)} style=${{background:'transparent', border:'none', color:'var(--accent-1)', fontSize:'11.5px', fontWeight:700, cursor:'pointer', padding:'2px'}}>Esqueci minha senha</button>
              <div style=${{fontSize:'11px', color:'var(--text-dim)', textAlign:'center'}}>Não encontrou sua igreja? Cadastre na aba ao lado.</div>
            </form>
          ` : html`
            <form onSubmit=${doRegister} style=${{display:'grid', gap:'10px'}}>
              <div style=${sectionLabelStyle}>Identificação da Igreja</div>
              <input placeholder="Nome da igreja adventista" value=${name} onChange=${e=>setName(e.target.value)} style=${inputStyle} autoFocus />
              <input placeholder="Endereço completo" value=${address} onChange=${e=>setAddress(e.target.value)} style=${inputStyle} />
              <div style=${{display:'grid', gridTemplateColumns:'1fr 90px', gap:'10px'}}>
                <input placeholder="Cidade" value=${city} onChange=${e=>setCity(e.target.value)} style=${inputStyle} />
                <input placeholder="UF" maxlength="2" value=${state} onChange=${e=>setState(e.target.value.toUpperCase())} style=${inputStyle} />
              </div>

              <div style=${sectionLabelStyle}>Organização Administrativa</div>
              <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px'}}>
                <input placeholder="Associação" value=${association} onChange=${e=>setAssociation(e.target.value)} style=${inputStyle} />
                <input placeholder="Distrito" value=${district} onChange=${e=>setDistrict(e.target.value)} style=${inputStyle} />
              </div>
              <label style=${{display:'flex', alignItems:'center', gap:'8px', fontSize:'12.5px', color:'var(--text-mid)', padding:'2px 2px'}}>
                <input type="checkbox" checked=${isDistrictSeat} onChange=${e=>setIsDistrictSeat(e.target.checked)} style=${{width:'16px',height:'16px'}} />
                Esta igreja é sede de distrito
              </label>

              <div style=${sectionLabelStyle}>Liderança</div>
              <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px'}}>
                <input placeholder="Nome do pastor" value=${pastorName} onChange=${e=>setPastorName(e.target.value)} style=${inputStyle} />
                <input placeholder="Nome do 1º ancião" value=${elderName} onChange=${e=>setElderName(e.target.value)} style=${inputStyle} />
              </div>

              <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <div style=${{...sectionLabelStyle, marginBottom:0}}>Líderes dos Ministérios</div>
                <button type="button" onClick=${addLeaderRow} style=${{...btnGhost, padding:'5px 10px', fontSize:'11px'}}>+ Ministério</button>
              </div>
              ${ministryLeaders.map((row, idx) => html`
                <div key=${idx} style=${{display:'grid', gridTemplateColumns:'1fr 1fr 30px', gap:'8px'}}>
                  <input placeholder="Ministério (ex: Louvor)" value=${row.ministry} onChange=${e=>updateLeaderRow(idx,'ministry',e.target.value)} style=${inputStyle} />
                  <input placeholder="Nome do líder" value=${row.leader} onChange=${e=>updateLeaderRow(idx,'leader',e.target.value)} style=${inputStyle} />
                  <button type="button" onClick=${()=>removeLeaderRow(idx)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'16px'}}>✕</button>
                </div>
              `)}

              <div style=${sectionLabelStyle}>Acesso ao Sistema</div>
              <input placeholder="Login de acesso desejado" value=${newLogin} onChange=${e=>setNewLogin(e.target.value)} style=${inputStyle} />
              <input type="password" placeholder="Senha (mínimo 4 caracteres)" value=${newPassword} onChange=${e=>setNewPassword(e.target.value)} style=${inputStyle} />

              <div style=${sectionLabelStyle}>Recuperação de Senha</div>
              <div style=${{fontSize:'10.5px', color:'var(--text-dim)', marginTop:'-4px'}}>Se um dia esquecer a senha, é essa pergunta que vai te ajudar a criar uma nova.</div>
              <input placeholder="Pergunta de segurança (ex: Nome do seu primeiro pet)" value=${recoveryQuestion} onChange=${e=>setRecoveryQuestion(e.target.value)} style=${inputStyle} />
              <input placeholder="Resposta" value=${recoveryAnswer} onChange=${e=>setRecoveryAnswer(e.target.value)} style=${inputStyle} />

              <button type="submit" style=${btnPrimary}>Cadastrar e Entrar</button>
            </form>
          `}
        </div>
      </div>
      ${forgotOpen && html`<${ForgotPasswordModal} onClose=${()=>setForgotOpen(false)} />`}
    </div>
  `;
}

function ForgotPasswordModal({ onClose }) {
  const [step, setStep] = useState('select'); // select | answer | reset | done
  const [churchLogin, setChurchLogin] = useState('');
  const [answer, setAnswer] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [error, setError] = useState('');
  const churches = useMemo(() => loadDB(), []);
  const church = churches.find(c => c.login === churchLogin);

  const goAnswer = (e) => {
    e.preventDefault();
    setError('');
    if (!churchLogin) { setError('Selecione sua igreja.'); return; }
    if (!church || !church.recoveryQuestion) {
      setError('Essa igreja ainda não tem uma pergunta de segurança cadastrada. Peça ao desenvolvedor (Paulo) para redefinir a senha pelo Painel do Desenvolvedor.');
      return;
    }
    setStep('answer');
  };

  const checkAnswer = (e) => {
    e.preventDefault();
    setError('');
    if (answer.trim().toLowerCase() !== (church.recoveryAnswer || '')) { setError('Resposta incorreta. Tente novamente.'); return; }
    setStep('reset');
  };

  const doReset = (e) => {
    e.preventDefault();
    setError('');
    if (!newPassword.trim() || newPassword.length < 4) { setError('A nova senha deve ter no mínimo 4 caracteres.'); return; }
    if (newPassword !== confirmPassword) { setError('As senhas não conferem.'); return; }
    const db = loadDB();
    const next = db.map(c => c.id === church.id ? { ...c, password: newPassword, updatedAt: new Date().toISOString() } : c);
    saveDB(next);
    pushLog(loadLog(), { type:'atualizacao', churchName: church.name, churchId: church.id, detail: 'Senha redefinida via recuperação de senha' });
    setStep('done');
  };

  return html`
    <div style=${{position:'fixed', inset:0, background:'rgba(2,6,23,0.65)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:220, padding:'16px'}} onClick=${onClose}>
      <div class="glass fade-up" style=${{maxWidth:'400px', width:'100%', padding:'22px', borderRadius:'20px', display:'grid', gap:'12px'}} onClick=${e=>e.stopPropagation()}>
        <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div style=${{fontWeight:800, fontSize:'15px'}}>🔑 Recuperar Senha</div>
          <button onClick=${onClose} style=${{background:'transparent', border:'none', color:'var(--text-mid)', fontSize:'18px'}}>✕</button>
        </div>

        ${error && html`<div style=${errorBox}>${error}</div>`}

        ${step === 'select' && html`
          <form onSubmit=${goAnswer} style=${{display:'grid', gap:'10px'}}>
            <div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>Selecione sua igreja para ver sua pergunta de segurança.</div>
            <select value=${churchLogin} onChange=${e=>setChurchLogin(e.target.value)} style=${inputStyle} autoFocus>
              <option value="">Selecione sua igreja...</option>
              ${churches.map(c => html`<option key=${c.id} value=${c.login}>${c.name}${c.city ? ' — '+c.city : ''}</option>`)}
            </select>
            <button type="submit" style=${btnPrimary}>Continuar</button>
          </form>
        `}

        ${step === 'answer' && church && html`
          <form onSubmit=${checkAnswer} style=${{display:'grid', gap:'10px'}}>
            <div style=${{fontSize:'12px', color:'var(--text-hi)'}}><b>${church.recoveryQuestion}</b></div>
            <input placeholder="Sua resposta" value=${answer} onChange=${e=>setAnswer(e.target.value)} style=${inputStyle} autoFocus />
            <div style=${{display:'flex', gap:'8px', justifyContent:'flex-end'}}>
              <button type="button" onClick=${()=>{ setStep('select'); setError(''); }} style=${btnGhost}>Voltar</button>
              <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 18px'}}>Confirmar</button>
            </div>
          </form>
        `}

        ${step === 'reset' && html`
          <form onSubmit=${doReset} style=${{display:'grid', gap:'10px'}}>
            <div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>Resposta certa! Agora crie sua nova senha.</div>
            <input type="password" placeholder="Nova senha (mínimo 4 caracteres)" value=${newPassword} onChange=${e=>setNewPassword(e.target.value)} style=${inputStyle} autoFocus />
            <input type="password" placeholder="Confirmar nova senha" value=${confirmPassword} onChange=${e=>setConfirmPassword(e.target.value)} style=${inputStyle} />
            <button type="submit" style=${btnPrimary}>Salvar Nova Senha</button>
          </form>
        `}

        ${step === 'done' && html`
          <div style=${{display:'grid', gap:'12px', textAlign:'center'}}>
            <div style=${{fontSize:'28px'}}>✅</div>
            <div style=${{fontSize:'12.5px', color:'var(--text-hi)'}}>Senha redefinida com sucesso! Já pode entrar com a nova senha.</div>
            <button onClick=${onClose} style=${btnPrimary}>Fechar</button>
          </div>
        `}
      </div>
    </div>
  `;
}

function PasswordResetRow({ church, onReset, onCancel }) {
  const [pass, setPass] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState('');
  const submit = (e) => {
    e.preventDefault();
    if (!pass.trim() || pass.length < 4) { setError('A senha deve ter no mínimo 4 caracteres.'); return; }
    if (pass !== confirm) { setError('As senhas não conferem.'); return; }
    onReset(pass);
  };
  return html`
    <form onSubmit=${submit} class="fade-up" style=${{marginTop:'10px', padding:'12px', borderRadius:'12px', background:'rgba(2,6,23,0.3)', border:'1px solid var(--border-soft)', display:'grid', gap:'8px'}}>
      <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>Nova senha para <b>${church.name}</b> (login: ${church.login}):</div>
      ${error && html`<div style=${errorBox}>${error}</div>`}
      <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px'}}>
        <input type="password" placeholder="Nova senha" value=${pass} onChange=${e=>setPass(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} autoFocus />
        <input type="password" placeholder="Confirmar" value=${confirm} onChange=${e=>setConfirm(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
      </div>
      <div style=${{display:'flex', gap:'8px', justifyContent:'flex-end'}}>
        <button type="button" onClick=${onCancel} style=${btnGhost}>Cancelar</button>
        <button type="submit" style=${{...btnPrimary, width:'auto', padding:'8px 16px'}}>Salvar Nova Senha</button>
      </div>
    </form>
  `;
}

function DeveloperPanel({ onLogout }) {
  const [db, setDb] = useState(loadDB);
  const [log, setLog] = useState(loadLog);
  const [suggestions, setSuggestions] = useState(loadSuggestions);
  const [tab, setTab] = useState('igrejas');
  const [expandedId, setExpandedId] = useState(null);
  const [resetId, setResetId] = useState(null);

  const refresh = () => { setDb(loadDB()); setLog(loadLog()); setSuggestions(loadSuggestions()); };

  const removeChurch = (id) => {
    const church = db.find(c=>c.id===id);
    const next = db.filter(c=>c.id!==id);
    saveDB(next);
    const nl = pushLog(loadLog(), { type:'remocao', churchName: church ? church.name : id, churchId: id });
    setDb(next); setLog(nl);
  };

  const resetChurchPassword = (id, newPass) => {
    const church = db.find(c=>c.id===id);
    const next = db.map(c => c.id===id ? { ...c, password: newPass, updatedAt: new Date().toISOString() } : c);
    saveDB(next);
    const nl = pushLog(loadLog(), { type:'atualizacao', churchName: church ? church.name : id, churchId: id, detail: 'Senha redefinida pelo desenvolvedor' });
    setDb(next); setLog(nl); setResetId(null);
  };

  const respondSuggestion = (id, response) => {
    setSuggestions(list => {
      const next = list.map(s => s.id===id ? { ...s, response, status:'answered', respondedAt: new Date().toISOString() } : s);
      saveSuggestions(next);
      return next;
    });
  };
  const pendingCount = suggestions.filter(s => s.status !== 'answered').length;

  return html`
    <div style=${{maxWidth:'820px', margin:'0 auto', padding:'20px 16px 60px'}}>
      <div class="glass fade-up" style=${{padding:'16px 20px', borderRadius:'18px', marginBottom:'18px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'10px'}}>
        <div style=${{display:'flex', alignItems:'center', gap:'10px'}}>
          <div class="breathe" style=${{width:'38px',height:'38px',borderRadius:'12px',background:'linear-gradient(135deg,var(--accent-1),var(--accent-2),var(--accent-3))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}}>👑</div>
          <div>
            <div style=${{fontWeight:800, fontSize:'14px'}}>Painel do Desenvolvedor</div>
            <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>${db.length} igreja(s) cadastrada(s)</div>
          </div>
        </div>
        <button onClick=${onLogout} style=${btnGhost}>Sair</button>
      </div>

      <div style=${{display:'flex', gap:'6px', marginBottom:'16px', flexWrap:'wrap'}}>
        <button onClick=${()=>setTab('igrejas')} style=${{padding:'8px 16px', borderRadius:'10px', fontSize:'12px', fontWeight:700, border:'1px solid var(--border-soft)', background: tab==='igrejas' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: tab==='igrejas' ? '#fff' : 'var(--text-mid)'}}>Igrejas Cadastradas</button>
        <button onClick=${()=>setTab('log')} style=${{padding:'8px 16px', borderRadius:'10px', fontSize:'12px', fontWeight:700, border:'1px solid var(--border-soft)', background: tab==='log' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: tab==='log' ? '#fff' : 'var(--text-mid)'}}>Histórico de Atividade</button>
        <button onClick=${()=>setTab('sugestoes')} style=${{padding:'8px 16px', borderRadius:'10px', fontSize:'12px', fontWeight:700, border:'1px solid var(--border-soft)', background: tab==='sugestoes' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: tab==='sugestoes' ? '#fff' : 'var(--text-mid)', display:'flex', alignItems:'center', gap:'6px'}}>
          💡 Sugestões
          ${pendingCount > 0 && html`<span style=${{padding:'1px 7px', borderRadius:'999px', fontSize:'10px', background:'var(--highlight)', color:'var(--text-on-highlight)', fontWeight:800}}>${pendingCount}</span>`}
        </button>
        <button onClick=${refresh} style=${btnGhost}>↻ Atualizar</button>
      </div>

      ${tab === 'igrejas' && html`
        <div style=${{display:'grid', gap:'10px'}}>
          ${db.length === 0 && html`<div class="glass fade-up" style=${{padding:'24px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'13px'}}>Nenhuma igreja cadastrada ainda.</div>`}
          ${db.map((c,i) => html`
            <div key=${c.id} class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'14px', animationDelay:(i*0.03)+'s'}}>
              <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px', flexWrap:'wrap'}}>
                <div>
                  <div style=${{fontWeight:700, fontSize:'13.5px'}}>${c.name}</div>
                  <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>${c.city}${c.state ? ' - '+c.state : ''} • login: ${c.login}</div>
                  <div style=${{fontSize:'10px', color:'var(--text-dim)', marginTop:'2px'}}>Cadastrada em ${new Date(c.createdAt).toLocaleString('pt-BR')}</div>
                </div>
                <div style=${{display:'flex', gap:'6px'}}>
                  <button onClick=${()=>setExpandedId(expandedId===c.id ? null : c.id)} style=${btnGhost}>${expandedId===c.id ? 'Fechar' : 'Ver detalhes'}</button>
                  <button onClick=${()=>{ setResetId(resetId===c.id ? null : c.id); }} style=${btnGhost}>🔑 Redefinir Senha</button>
                  <button onClick=${()=>removeChurch(c.id)} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>Remover</button>
                </div>
              </div>

            </div>
          `)}
        </div>
      `}

      ${tab === 'log' && html`
        <div style=${{display:'grid', gap:'8px'}}>
          ${log.length === 0 && html`<div class="glass fade-up" style=${{padding:'24px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'13px'}}>Nenhuma atividade registrada ainda.</div>`}
          ${log.map((l,i) => html`
            <div key=${l.id} class="glass fade-up" style=${{padding:'12px 16px', borderRadius:'12px', display:'flex', alignItems:'center', gap:'10px', animationDelay:(i*0.02)+'s'}}>
              <span style=${{fontSize:'16px'}}>${l.type==='cadastro' ? '🆕' : l.type==='remocao' ? '🗑️' : '✏️'}</span>
              <div style=${{flex:1}}>
                <div style=${{fontSize:'12.5px', fontWeight:600}}>
                  ${l.type==='cadastro' ? 'Nova igreja cadastrada: ' : l.type==='remocao' ? 'Igreja removida: ' : 'Atualização em '}${l.churchName}
                </div>
                ${l.detail && html`<div style=${{fontSize:'10.5px', color:'var(--text-mid)'}}>${l.detail}</div>`}
                <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>${new Date(l.at).toLocaleString('pt-BR')}</div>
              </div>
            </div>
          `)}
        </div>
      `}

      ${tab === 'sugestoes' && html`
        <div style=${{display:'grid', gap:'10px'}}>
          <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para ver as sugestões de melhoria enviadas pelas igrejas e responder a cada uma.</div>
          ${suggestions.length === 0 && html`<div class="glass fade-up" style=${{padding:'24px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'13px'}}>Nenhuma sugestão enviada ainda.</div>`}
          ${suggestions.map((s,i) => html`<${SuggestionDevCard} key=${s.id} s=${s} idx=${i} onRespond=${respondSuggestion} />`)}
        </div>
      `}
    </div>
  `;
}

function SuggestionDevCard({ s, idx, onRespond }) {
  const [text, setText] = useState(s.response || '');
  const submit = (e) => { e.preventDefault(); onRespond(s.id, text.trim()); };
  return html`
    <div class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'14px', display:'grid', gap:'10px', animationDelay:(idx*0.03)+'s', border: s.status==='answered' ? '1px solid var(--success-1)' : '1px solid var(--highlight)'}}>
      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:'10px'}}>
        <div>
          <div style=${{fontWeight:700, fontSize:'13px'}}>${s.churchName}</div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)'}}>${new Date(s.createdAt).toLocaleString('pt-BR')}</div>
        </div>
        <span style=${{fontSize:'10px', fontWeight:800, padding:'3px 9px', borderRadius:'999px', background: s.status==='answered' ? 'color-mix(in srgb, var(--success-1) 20%, transparent)' : 'color-mix(in srgb, var(--highlight) 20%, transparent)', color: s.status==='answered' ? 'var(--success-1)' : 'var(--highlight)'}}>${s.status==='answered' ? 'Respondida' : 'Pendente'}</span>
      </div>
      <div style=${{fontSize:'12.5px', color:'var(--text-hi)'}}>${s.text}</div>
      <form onSubmit=${submit} style=${{display:'grid', gap:'8px'}}>
        <textarea placeholder="Escreva sua resposta..." value=${text} onChange=${e=>setText(e.target.value)} rows="2" style=${{...inputStyle, resize:'vertical', fontFamily:'inherit'}}></textarea>
        <button type="submit" style=${{...btnPrimary, width:'auto', padding:'8px 16px', justifySelf:'end'}}>${s.status==='answered' ? 'Atualizar Resposta' : 'Responder'}</button>
      </form>
    </div>
  `;
}

function youtubeSearchUrl(query) { return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query); }
function weekDateSuffix() {
  const sat = keyToDate(getSaturdaysForMonths(1)[0]);
  return sat.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
}
function mediaLibraryUrl(m) {
  if (m.directUrl) return m.directUrl;
  return youtubeSearchUrl(m.dynamic ? m.query + ' ' + weekDateSuffix() : m.query);
}

function extractYouTubeId(url) {
  if (!url) return null;
  const patterns = [/[?&]v=([^&]+)/, /youtu\.be\/([^?&]+)/, /embed\/([^?&]+)/];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

function ConfirmVideoLink({ media, onChange }) {

    onChange({ ...media, videoId: id, url: 'https://www.youtube.com/watch?v='+id });
  };
  return html`
    <form onSubmit=${confirm} style=${{display:'flex', gap:'6px'}}>
      <input placeholder="Colar aqui o link do vídeo certo (depois de achar no YouTube)" value=${link} onChange=${e=>setLink(e.target.value)} style=${{...inputStyle, fontSize:'11px'}} />
      <button type="submit" style=${{...btnGhost, padding:'7px 10px', fontSize:'11px', whiteSpace:'nowrap'}}>✅ Confirmar</button>

function loadActivities(churchId) {

  return DEFAULT_ACTIVITIES;
}
function saveActivities(churchId, list) {
  try { localStorage.setItem(activitiesKey(churchId), JSON.stringify(list)); } catch(e) {}
}

function defaultLiturgyKey(churchId) { return 'gc_default_liturgy_' + churchId; }
function loadDefaultLiturgy(churchId) {
  try {
    const raw = localStorage.getItem(defaultLiturgyKey(churchId));
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.list) && !Array.isArray(data.versions)) {
        // Formato antigo (uma única lista) — migra automaticamente para o novo formato com versões
        const migrated = { password: data.password, versions: [{ at: new Date().toISOString(), list: data.list }] };
        try { localStorage.setItem(defaultLiturgyKey(churchId), JSON.stringify(migrated)); } catch(e) {}
        return migrated;
      }
      return data;
    }
  } catch(e) {}
  return null;
}
function saveDefaultLiturgyVersion(churchId, list, password) {
  const current = loadDefaultLiturgy(churchId) || { password, versions: [] };
  const versions = [{ at: new Date().toISOString(), list }, ...current.versions].slice(0, 10);
  const data = { password: current.password || password, versions };
  try { localStorage.setItem(defaultLiturgyKey(churchId), JSON.stringify(data)); } catch(e) {}
  return data;
}

    e.preventDefault();
    setError('');

// Janelas de projeção compartilhadas entre abas/telas da aplicação (evita reabrir com popup toda vez)
const projectionWindows = {};

function screensEnabledKey(churchId) { return 'gc_telas_habilitadas_' + churchId; }
function loadEnabledScreens(churchId) {

}

}
function screenSig(s) { return s.width+'x'+s.height+'@'+s.left+','+s.top; }
function getProjectorScreen(churchId) {

function videoEmbedHtml(media) {
  const src = media.videoId
    ? 'https://www.youtube.com/embed/'+media.videoId+'?autoplay=1&rel=0'
    : media.playlistId
    ? 'https://www.youtube.com/embed/videoseries?list='+media.playlistId+'&autoplay=1&rel=0'
    : null;
  if (!src) return null;
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Projeção</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;}iframe{position:fixed;inset:0;width:100%;height:100%;border:none;}#fs-fallback{position:fixed;bottom:16px;right:16px;padding:10px 16px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #475569;font-size:14px;cursor:pointer;z-index:10;}</style></head><body><iframe src="'+src+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe><button id="fs-fallback" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();this.style.display=\'none\';">⛶ Tela Cheia</button><scr'+'ipt>try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().then(()=>{var b=document.getElementById(\'fs-fallback\');if(b)b.style.display=\'none\';}).catch(()=>{});}catch(e){}<\/scr'+'ipt></body></html>';
}

function openMediaInNewTab(media) {
  try {
    const embedHtml = videoEmbedHtml(media);
    const win = window.open('', '_blank');
    if (!win) { alert('Erro: o navegador bloqueou a abertura da nova aba. Vá nas configurações do navegador e permita pop-ups pra este site.'); return; }
    if (embedHtml) {
      win.document.open();
      win.document.write(embedHtml);
      win.document.close();
    } else {
      win.location.href = media.url;
    }
  } catch (e) {
    alert('Erro ao tentar tocar o vídeo: ' + (e && e.message ? e.message : String(e)));
  }
}

function sendToScreenObj(scr, kind, payload) {
  try {
    const sig = screenSig(scr);
    const features = 'left='+scr.left+',top='+scr.top+',width='+scr.width+',height='+scr.height;
    let win = projectionWindows[sig];
    if (!win || win.closed) {
      win = window.open('', 'gc_screen_'+sig, features);
      projectionWindows[sig] = win;
    } else {
      try { win.moveTo(scr.left, scr.top); win.resizeTo(scr.width, scr.height); } catch(e) {}
    }
    if (!win) { alert('Erro: o navegador bloqueou a abertura da janela de projeção. Vá nas configurações do navegador e permita pop-ups pra este site (só precisa autorizar uma vez).'); return; }

    if (kind === 'media') {
      const media = (payload && typeof payload === 'object') ? payload : { url: payload };
      const embedHtml = videoEmbedHtml(media);
      if (embedHtml) {
        win.document.open();
        win.document.write(embedHtml);
        win.document.close();
      } else if (media.url) {
        win.location.href = media.url;
      } else {
        alert('Erro: esse item não tem vídeo nem link válido pra projetar.');
        return;
      }
    } else if (kind === 'texto') {
      win.document.open();
      win.document.write(blankWindowHtml('Transmissão', '<h1>'+(payload || '').replace(/</g,'&lt;')+'</h1>'));
      win.document.close();
    } else {
      win.document.open();
      win.document.write(blankWindowHtml('Tela Preta', ''));
      win.document.close();
    }
    win.focus();
  } catch (e) {
    alert('Erro ao enviar para a tela: ' + (e && e.message ? e.message : String(e)));
  }
}

function closeAllProjectionScreens() {
  Object.keys(projectionWindows).forEach(sig => {
    const win = projectionWindows[sig];
    try { if (win && !win.closed) win.close(); } catch(e) {}
    delete projectionWindows[sig];
  });
}

function CronometroTool() {
  const [ms, setMs] = useState(0);
  const [running, setRunning] = useState(false);
  const startRef = useRef(0);
  useEffect(() => {
    if (!running) return;
    startRef.current = Date.now() - ms;
    const id = setInterval(() => setMs(Date.now() - startRef.current), 50);
    return () => clearInterval(id);
  }, [running]);
  const format = (t) => {
    const totalSec = Math.floor(t/1000);
    const m = String(Math.floor(totalSec/60)).padStart(2,'0');
    const s = String(totalSec%60).padStart(2,'0');
    const cs = String(Math.floor((t%1000)/10)).padStart(2,'0');
    return m+':'+s+'.'+cs;
  };
  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px', textAlign:'center'}}>
      <div style=${{fontWeight:800, fontSize:'13px', textAlign:'left'}}>⏱️ Cronômetro</div>
      <div style=${{fontSize:'40px', fontWeight:800, fontVariantNumeric:'tabular-nums'}}>${format(ms)}</div>
      <div style=${{display:'flex', gap:'8px', justifyContent:'center'}}>
        <button onClick=${()=>setRunning(r=>!r)} style=${{...btnPrimary, width:'auto', padding:'9px 18px'}}>${running ? '⏸ Pausar' : '▶ Iniciar'}</button>
        <button onClick=${()=>{ setRunning(false); setMs(0); }} style=${{...btnGhost, padding:'9px 18px'}}>↺ Zerar</button>
      </div>
    </div>
  `;
}

function PowerpointTool({ churchName }) {
  const [title, setTitle] = useState('');
  const [subtitle, setSubtitle] = useState('');
  const [slides, setSlides] = useState([{ title:'', body:'' }]);
  const [status, setStatus] = useState('');

  const removeSlide = (i) => setSlides(s => s.filter((_,idx)=>idx!==i));

  const gerar = async () => {
    if (!title.trim()) { alert('Dê um título pra apresentação.'); return; }
    setStatus('Gerando...');
    try {
      const pptx = new window.PptxGenJS();
      const capa = pptx.addSlide();
      capa.background = { color: '1e293b' };
      capa.addText(title, { x:0.5, y:2.2, w:9, h:1.2, fontSize:36, bold:true, color:'FFFFFF', align:'center' });
      if (subtitle.trim()) capa.addText(subtitle, { x:0.5, y:3.3, w:9, h:0.8, fontSize:18, color:'CBD5E1', align:'center' });
      if (churchName) capa.addText(churchName, { x:0.5, y:6.6, w:9, h:0.5, fontSize:12, color:'94A3B8', align:'center' });

      slides.forEach(sl => {
        if (!sl.title.trim() && !sl.body.trim()) return;
        const s = pptx.addSlide();
        s.background = { color: 'FFFFFF' };
        if (sl.title.trim()) s.addText(sl.title, { x:0.5, y:0.4, w:9, h:0.8, fontSize:26, bold:true, color:'1e293b' });
        if (sl.body.trim()) s.addText(sl.body, { x:0.5, y:1.4, w:9, h:5, fontSize:16, color:'334155' });
      });

      const blob = await pptx.write({ outputType:'blob' });
      const dl = await claude.use('downloads');
      if (!dl) { setStatus('Download não disponível aqui.'); return; }
      const res = await dl.save({ filename: title.replace(/[^a-z0-9áéíóúàâêôãõç \-]/gi,'').trim()+'.pptx', data: blob });
      setStatus(res.status === 'saved' ? '✅ Salvo!' : '');
    } catch (e) {
      setStatus('Não foi possível gerar agora.');
    }
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>

        ${slides.map((sl,i) => html`
          <div key=${i} class="glass fade-up" style=${{padding:'10px', borderRadius:'12px', display:'grid', gap:'6px'}}>
            <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <span style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Slide ${i+2}</span>
              <button onClick=${()=>removeSlide(i)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'13px'}}>✕</button>
            </div>
            <input placeholder="Título do slide" value=${sl.title} onChange=${e=>updateSlide(i,{title:e.target.value})} style=${{...inputStyle, fontSize:'12px'}} />
            <textarea placeholder="Texto do slide" value=${sl.body} onChange=${e=>updateSlide(i,{body:e.target.value})} rows="3" style=${{...inputStyle, fontSize:'12px', resize:'vertical', fontFamily:'inherit'}}></textarea>
          </div>
        `)}
      </div>
      <button onClick=${addSlide} style=${{...btnGhost, justifySelf:'start'}}>+ Adicionar Slide</button>
      <button onClick=${gerar} style=${{...btnPrimary, width:'auto', justifySelf:'start', padding:'10px 20px'}}>📥 Gerar e Baixar PowerPoint</button>
      ${status && html`<div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>${status}</div>`}

  `;
}

    const range = hi - lo + 1;
    const pool = [];
    for (let i=lo; i<=hi; i++) pool.push(i);
    const count = Math.min(14, range);
    const chosen = [];
    for (let i=0; i<count; i++) {
      const idx = Math.floor(Math.random()*pool.length);
      chosen.push(pool.splice(idx,1)[0]);
    }
    const arr = chosen.map((num, i) => ({
      id: i,
      num,
      dur: 1.6 + Math.random()*1.2,
      delay: Math.random()*0.6,
      size: 34 + Math.random()*14,
      x1: Math.random()*70+5, y1: Math.random()*70+5,
      x2: Math.random()*70+5, y2: Math.random()*70+5,
      x3: Math.random()*70+5, y3: Math.random()*70+5,
      hue: Math.floor(Math.random()*360),
    }));
    setBalls(arr);
  }, [min, max]);

  const sortear = () => {
    const lo = Math.min(min, max), hi = Math.max(min, max);
    const n = Math.max(1, Math.min(qty, hi-lo+1));
    setSpinning(true);
    setResult([]);
    setTimeout(() => {
      const pool = [];
      for (let i=lo; i<=hi; i++) pool.push(i);
      const drawn = [];
      for (let i=0; i<n; i++) {
        const idx = Math.floor(Math.random()*pool.length);
        drawn.push(pool.splice(idx,1)[0]);
      }
      const sorted = drawn.sort((a,b)=>a-b);
      setResult(sorted);
      setHistory(h => [...h, ...sorted]);
      setSpinning(false);
    }, 2400);
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'12px'}}>
      <div style=${{fontWeight:800, fontSize:'13px'}}>🎱 Sorteador de Números (Globo)</div>

      <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px'}}>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>De</div>
          <input type="number" value=${min} onChange=${e=>setMin(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>Até</div>
          <input type="number" value=${max} onChange=${e=>setMax(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>Quantos</div>
          <input type="number" min="1" value=${qty} onChange=${e=>setQty(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
      </div>

      <div style=${{
        position:'relative', width:'220px', height:'220px', margin:'0 auto', borderRadius:'50%',
        background:'radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 40%, transparent 60%), radial-gradient(circle, rgba(148,163,184,0.12), rgba(15,23,42,0.5))',
        border:'3px solid rgba(148,163,184,0.35)', overflow:'hidden', boxShadow:'inset 0 0 30px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3)'
      }}>
        ${balls.map(b => html`
          <div key=${b.id} style=${{
            position:'absolute', width:b.size+'px', height:b.size+'px', borderRadius:'50%',
            left:'0%', top:'0%',
            background:'hsl('+b.hue+',70%,55%)',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:(b.size*0.4)+'px', fontWeight:800, color:'#fff',
            boxShadow:'inset -3px -3px 6px rgba(0,0,0,0.35), inset 2px 2px 4px rgba(255,255,255,0.4)',
            animation: spinning ? ('ballBounce'+b.id+' '+b.dur+'s ease-in-out '+b.delay+'s infinite alternate') : 'none',
            transform: spinning ? undefined : 'translate(90px,90px)',
            transition: spinning ? 'none' : 'transform 0.6s ease'
          }}>${b.num}</div>
          <style>
            @keyframes ballBounce${b.id} {
              0% { transform: translate(${b.x1}%, ${b.y1}%); }
              50% { transform: translate(${b.x2}%, ${b.y2}%); }
              100% { transform: translate(${b.x3}%, ${b.y3}%); }
            }
          </style>
        `)}
      </div>

      <button onClick=${sortear} disabled=${spinning} style=${{...btnPrimary, width:'auto', justifySelf:'center', padding:'10px 22px'}}>${spinning ? 'Sorteando...' : '🎱 Girar e Sortear'}</button>

      ${result.length > 0 && html`
        <div style=${{display:'grid', gap:'10px'}}>
          <div style=${{display:'flex', gap:'8px', justifyContent:'center', flexWrap:'wrap'}}>
            ${result.map(n => html`
              <div key=${n} style=${{width:'46px', height:'46px', borderRadius:'50%', background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:'16px', boxShadow:'0 4px 10px rgba(0,0,0,0.3)'}}>${n}</div>
            `)}
          </div>
          <button onClick=${()=>{
            const projector = loadEnabledScreens(churchId).find(s=>s.isProjector) || loadEnabledScreens(churchId)[0];
            if (!projector) { alert('Nenhuma tela habilitada ainda. Vá na aba "Telas" e habilite pelo menos uma.'); return; }
            sendToScreenObj(projector, 'texto', result.join('  -  '));
          }} style=${{...btnGhost, justifySelf:'center', padding:'8px 16px'}}>📽️ Projetar no Telão</button>
        </div>
      `}

      ${history.length > 0 && html`
        <div style=${{borderTop:'1px solid var(--border-soft)', paddingTop:'12px', display:'grid', gap:'8px'}}>
          <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em'}}>Já sorteados (${history.length})</div>
            <button onClick=${()=>setHistory([])} style=${{...btnGhost, padding:'5px 10px', fontSize:'10.5px'}}>🗑️ Limpar</button>
          </div>
          <div style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
            ${history.map((n,i) => html`
              <div key=${i} style=${{width:'32px', height:'32px', borderRadius:'50%', background:'rgba(148,163,184,0.16)', color:'var(--text-hi)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:'12px'}}>${n}</div>
            `)}
          </div>
        </div>
      `}
    </div>
  `;
}

  const [newYear, setNewYear] = useState('');

  const [links, setLinks] = useState(() => loadColetaneasLinks(churchId));
  const [linkingId, setLinkingId] = useState(null);

  useEffect(() => saveColetaneasCustom(churchId, custom), [custom, churchId]);
  useEffect(() => saveColetaneasLinks(churchId, links), [links, churchId]);

  const all = [...COLETANEAS_SEED, ...COLETANEAS_ADORADORES, ...COLETANEAS_CANTORES, ...COLETANEAS_CELEBRASP, ...custom];
  const isTodas = category === 'Todas';

    e.preventDefault();

    setCustom(list => [...list, { id:'cust-'+Date.now(), category: isTodas ? newCat : category, title:newTitle.trim(), year:newYear.trim()||null, custom:true }]);

  };
  const removeItem = (id) => setCustom(list => list.filter(c => c.id !== id));
  const setLink = (itemId, videoId) => { setLinks(m => ({ ...m, [itemId]: videoId })); setLinkingId(null); };
  const unlink = (itemId) => setLinks(m => { const next = { ...m }; delete next[itemId]; return next; });

  return html`
    <div class="glass fade-up" style=${{borderRadius:'16px', padding:'14px'}}>
      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px'}}>

function MomentosLouvorTool({ churchId }) {
  const storeKey = 'gc_momentos_louvor_' + churchId;
  const load = () => { try { const raw = localStorage.getItem(storeKey); if (raw) return JSON.parse(raw); } catch(e) {} return []; };
  const save = (list) => { try { localStorage.setItem(storeKey, JSON.stringify(list)); } catch(e) {} };

  const [items, setItems] = useState(load);
  const [title, setTitle] = useState('');
  const [leader, setLeader] = useState('');
  const [moment, setMoment] = useState('');
  const [notes, setNotes] = useState('');

  useEffect(() => save(items), [items]);

  const add = (e) => {
    e.preventDefault();
    if (!title.trim()) return;
    setItems(list => [...list, { id:'ml-'+Date.now(), title:title.trim(), leader:leader.trim(), moment:moment.trim(), notes:notes.trim() }]);
    setTitle(''); setLeader(''); setMoment(''); setNotes('');
  };
  const remove = (id) => setItems(list => list.filter(i => i.id !== id));
  const move = (idx, dir) => setItems(list => {
    const next = [...list];
    const target = idx + dir;
    if (target < 0 || target >= next.length) return list;
    [next[idx], next[target]] = [next[target], next[idx]];
    return next;
  });

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'12px'}}>
      <div style=${{fontWeight:800, fontSize:'13px'}}>🎤 Momentos de Louvor</div>
      <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Cadastre aqui a ordem dos louvores do culto — título, quem vai apresentar e observações. Isso não inclui letra da música, só a organização.</div>

      <form onSubmit=${add} style=${{display:'grid', gap:'8px'}}>
        <input placeholder="Título do louvor (ex: Hino 480, ou nome da música)" value=${title} onChange=${e=>setTitle(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
        <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px'}}>
          <input placeholder="Quem vai apresentar" value=${leader} onChange=${e=>setLeader(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
          <input placeholder="Momento (ex: Abertura, Especial)" value=${moment} onChange=${e=>setMoment(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
        <input placeholder="Observações (opcional)" value=${notes} onChange=${e=>setNotes(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
        <button type="submit" style=${{...btnPrimary, width:'auto', justifySelf:'start', padding:'9px 16px'}}>+ Adicionar Momento</button>
      </form>

      <div style=${{display:'grid', gap:'8px'}}>
        ${items.length === 0 && html`<div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Nenhum momento de louvor cadastrado ainda.</div>`}
        ${items.map((it,idx) => html`
          <div key=${it.id} class="glass fade-up" style=${{padding:'10px 12px', borderRadius:'12px', display:'flex', alignItems:'center', gap:'10px'}}>
            <div style=${{display:'flex', flexDirection:'column', gap:'2px'}}>
              <button type="button" onClick=${()=>move(idx,-1)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'11px', padding:0}}>▲</button>
              <button type="button" onClick=${()=>move(idx,1)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'11px', padding:0}}>▼</button>
            </div>
            <div style=${{flex:1}}>
              <div style=${{fontWeight:700, fontSize:'12.5px'}}>${idx+1}. ${it.title}</div>
              <div style=${{fontSize:'10.5px', color:'var(--text-mid)'}}>${it.leader || 'Sem responsável definido'}${it.moment ? ' • '+it.moment : ''}</div>
              ${it.notes && html`<div style=${{fontSize:'10px', color:'var(--text-dim)', marginTop:'2px'}}>${it.notes}</div>`}
            </div>
            <button type="button" onClick=${()=>remove(it.id)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'14px'}}>✕</button>
          </div>
        `)}

  `;
}

// Busca de vídeo no YouTube pra uso livre (fora dos 3 itens fixos da semana). O YouTube não deixa um
// site como este trazer resultados prontos (com miniatura) sem servidor próprio — então o caminho é:
// sugestão de texto em tempo real (vem direto do Google, sem precisar de servidor) + abrir a busca de
// verdade no youtube.com com um toque + colar o link do vídeo certo de volta aqui pra deixar pronto
// pra tocar e projetar.
function YoutubeQuickSearch({ churchId }) {
  const [search, setSearch] = useState('');
  const [suggestions, setSuggestions] = useState([]);
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [searching, setSearching] = useState(false);
  const [link, setLink] = useState('');
  const [result, setResult] = useState(null);
  const [serverResults, setServerResults] = useState(null); // null = não tentou/sem backend; [] = tentou e veio vazio
  const [serverSearching, setServerSearching] = useState(false);
  const debounceRef = useRef(null);

  const runSearch = (q) => {
    setSearching(true);
    fetchYoutubeSuggestions(q, (list) => {
      setSearching(false);
      setSuggestions(list);
      setSuggestOpen(true); // mostra o resultado mesmo quando vier vazio, pra sempre dar um retorno
    });
  };
  const onSearchChange = (val) => {
    setSearch(val);
    setServerResults(null);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    const q = val.trim();
    if (q.length < 2) { setSuggestions([]); setSuggestOpen(false); setSearching(false); return; }
    debounceRef.current = setTimeout(() => runSearch(q), 400);
  };
  const openSearch = (q) => { if (q.trim()) window.open(youtubeSearchUrl(q.trim()), '_blank', 'noopener'); };
  const pickSuggestion = (text) => { setSearch(text); setSuggestOpen(false); doServerSearch(text); };

  // Tenta buscar de verdade (com miniatura) pelo servidor próprio primeiro; se não tiver servidor
  // (como aqui dentro do Claude, ou hospedagem só estática), cai pro fluxo simples de sempre.
  const doServerSearch = async (q) => {
    const query = (q || search).trim();
    if (!query) return;
    setSuggestOpen(false);
    setServerSearching(true);
    const videos = await searchYoutubeServer(query);
    setServerSearching(false);
    if (videos && videos.length > 0) { setServerResults(videos); return; }
    setServerResults(videos && videos.length === 0 ? [] : null);
    if (!videos) openSearch(query); // sem backend disponível — abre a busca real do YouTube como sempre
  };

  const pickServerResult = (v) => {
    setResult({ title: v.title, videoId: v.videoId, url: v.watchUrl || ('https://www.youtube.com/watch?v='+v.videoId), thumbnail: v.thumbnail, channel: v.channel });
    setServerResults(null);
  };

  const confirmLink = (e) => {
    e.preventDefault();
    const id = extractYouTubeId(link.trim());
    if (!id) { alert('Não consegui reconhecer esse link como um vídeo do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    setResult({ title: search.trim() || 'Vídeo buscado', videoId: id, url: 'https://www.youtube.com/watch?v='+id });
    setLink('');
  };
  const newSearch = () => { setResult(null); setSearch(''); setLink(''); setServerResults(null); };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
      <div style=${{fontWeight:800, fontSize:'13.5px'}}>🔎 Buscar vídeo no YouTube</div>
      <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Digite pra ver sugestões em tempo real, toque numa delas (ou aperte Enter) pra abrir a busca de verdade no YouTube, ache o vídeo certo e cole o link dele aqui embaixo pra deixar pronto pra tocar/projetar.</div>

      ${!result ? html`
        <div style=${{position:'relative', zIndex: suggestOpen ? 300 : 'auto'}}>
          <div style=${{display:'flex', gap:'6px'}}>
            <input
              placeholder="Buscar no YouTube e apertar Enter..." value=${search}
              onChange=${e=>onSearchChange(e.target.value)}
              onFocus=${()=>{ if (suggestions.length>0) setSuggestOpen(true); }}
              onBlur=${()=>setTimeout(()=>setSuggestOpen(false), 150)}
              onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); doServerSearch(); } if(e.key==='Escape'){ setSuggestOpen(false); } }}
              style=${{...inputStyle, fontSize:'12px', flex:1}}
            />
            <button type="button" onClick=${()=>doServerSearch()} disabled=${!search.trim() || serverSearching} style=${{...btnPrimary, width:'auto', padding:'9px 14px', opacity: (search.trim() && !serverSearching) ? 1 : 0.5}}>${serverSearching ? '⏳' : '🔎'} Buscar</button>
          </div>
          ${searching && html`<div style=${{fontSize:'10.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Buscando sugestões...</div>`}
          ${!searching && suggestOpen && suggestions.length === 0 && search.trim().length >= 2 && html`
            <div style=${{fontSize:'10.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Não veio nenhuma sugestão agora (pode ser instabilidade da rede). Toque em "🔎 Buscar" pra ir direto pro YouTube com o que você digitou.</div>
          `}
          ${suggestOpen && suggestions.length > 0 && html`
            <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, borderRadius:'10px', padding:'4px', display:'grid', gap:'2px', maxHeight:'220px', overflowY:'auto', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'2px 4px'}}>Toque pra buscar (com miniatura, quando disponível):</div>
              ${suggestions.map((s,si) => html`
                <button key=${si} type="button" onMouseDown=${e=>e.preventDefault()} onClick=${()=>pickSuggestion(s)} style=${{textAlign:'left', padding:'7px 9px', borderRadius:'7px', border:'none', background:'transparent', color:'var(--text-mid)', fontSize:'11.5px'}}>🔎 ${s}</button>
              `)}
            </div>
          `}
        </div>

        ${serverResults && serverResults.length > 0 && html`
          <div style=${{display:'grid', gap:'6px', maxHeight:'320px', overflowY:'auto'}}>
            ${serverResults.map((v,vi) => html`
              <button key=${v.videoId+vi} type="button" onClick=${()=>pickServerResult(v)} style=${{display:'flex', gap:'10px', alignItems:'center', padding:'6px', borderRadius:'10px', border:'1px solid var(--border-soft)', background:'var(--glass-bg)', textAlign:'left'}}>
                <img src=${v.thumbnail} alt="" style=${{width:'72px', height:'42px', objectFit:'cover', borderRadius:'6px', flexShrink:0}} />
                <div style=${{minWidth:0}}>
                  <div style=${{fontSize:'11.5px', fontWeight:700, color:'var(--text-hi)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>${v.title}</div>
                  <div style=${{fontSize:'10px', color:'var(--text-dim)'}}>${v.channel || ''}${v.duration ? ' • '+v.duration : ''}</div>
                </div>
              </button>
            `)}
          </div>
        `}
        ${serverResults && serverResults.length === 0 && html`
          <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Nenhum resultado encontrado pelo servidor pra essa busca.</div>
        `}

        <form onSubmit=${confirmLink} style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
          <input placeholder="Ou colar aqui o link do vídeo (se você já tiver achado no YouTube)" value=${link} onChange=${e=>setLink(e.target.value)} style=${{...inputStyle, fontSize:'11.5px', flex:1, minWidth:'200px'}} />
          <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 16px'}}>✅ Confirmar</button>
        </form>
      ` : html`
        <div class="fade-up" style=${{borderRadius:'14px', padding:'14px', display:'flex', flexDirection:'column', gap:'8px', background:'linear-gradient(150deg,#2563eb,#1e3a8a)', color:'#fff'}}>
          <div style=${{fontWeight:800, fontSize:'12.5px'}}>🎬 ${result.title}</div>
          <div style=${{display:'flex', gap:'8px', flexWrap:'wrap'}}>
            <button type="button" onClick=${()=>openMediaInNewTab(result)} style=${{fontSize:'11px', fontWeight:700, color:'#fff', background:'rgba(255,255,255,0.22)', border:'none', padding:'6px 12px', borderRadius:'9px'}}>▶ Play</button>
            <${ProjectButton} churchId=${churchId} media=${result} />
            <button type="button" onClick=${newSearch} style=${{fontSize:'11px', fontWeight:700, color:'#fff', background:'rgba(0,0,0,0.2)', border:'none', padding:'6px 12px', borderRadius:'9px'}}>🔄 Nova busca</button>
          </div>
        </div>
      `}
    </div>
  `;
}

function TelasView({ churchId }) {
  const [screens, setScreens] = useState(null);
  const [permissionMsg, setPermissionMsg] = useState('');
  const [enabled, setEnabled] = useState(() => loadEnabledScreens(churchId));
  const [choices, setChoices] = useState({});
  const activities = loadActivities(churchId);

  const mediaOptions = activities.filter(a => a.media && a.media.title).map(a => ({ label: a.name+' — '+a.media.title, url: a.media.url, playlistId: a.media.playlistId || null, videoId: a.media.videoId || null }));

  const detectScreens = async () => {
    setPermissionMsg('');
    if ('getScreenDetails' in window) {
      try {
        const details = await window.getScreenDetails();
        const list = details.screens.map((s,i) => ({ label: (s.isPrimary ? 'Tela Principal' : 'Tela '+(i+1))+' — '+s.width+'x'+s.height, left: s.left, top: s.top, width: s.width, height: s.height }));
        setScreens(list);
      } catch (e) {
        setPermissionMsg('Permissão de telas negada ou indisponível. Usando apenas a tela atual.');
        setScreens([{ label: 'Tela Atual', left:0, top:0, width: window.screen.width, height: window.screen.height }]);
      }
    } else {
      setPermissionMsg('Seu navegador não suporta detectar múltiplas telas automaticamente (funciona no Chrome/Edge no computador). Você ainda pode abrir uma janela e arrastar manualmente pra outra tela.');
      setScreens([{ label: 'Tela Atual', left:0, top:0, width: window.screen.width, height: window.screen.height }]);
    }
  };

  useEffect(() => { detectScreens(); }, []);

  const toggleEnabled = (scr) => {
    const sig = screenSig(scr);
    setEnabled(list => {
      const exists = list.some(s => screenSig(s) === sig);
      const next = exists ? list.filter(s => screenSig(s) !== sig) : [...list, { ...scr, isProjector: list.length === 0 }];
      saveEnabledScreens(churchId, next);
      return next;
    });
  };
  const setProjector = (sig) => {
    setEnabled(list => {
      const next = list.map(s => ({ ...s, isProjector: screenSig(s) === sig }));
      saveEnabledScreens(churchId, next);
      return next;
    });
  };

  const setChoice = (sig, patch) => setChoices(c => ({ ...c, [sig]: { ...(c[sig]||{type:'blank'}), ...patch } }));

  const sendToScreen = (scr, sig) => {
    const choice = choices[sig] || { type:'blank' };
    if (choice.type === 'media' && mediaOptions[choice.mediaIdx]) sendToScreenObj(scr, 'media', mediaOptions[choice.mediaIdx]);
    else if (choice.type === 'texto') sendToScreenObj(scr, 'texto', choice.text);
    else sendToScreenObj(scr, 'blank');
  };

  const enabledSigs = enabled.map(screenSig);

  return html`
    <div style=${{maxWidth:'700px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'16px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para habilitar quais telas conectadas recebem transmissão e marcar qual delas é o projetor principal.</div>

                  </div>

                    <button onClick=${()=>setProjector(sig)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px', color: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--text-dim)', borderColor: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--border-soft)'}}>${enabledObj && enabledObj.isProjector ? '📽️ Projetor' : 'Definir como Projetor'}</button>
                  `}
