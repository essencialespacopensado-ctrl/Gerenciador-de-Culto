// Modo Ao Vivo: uma tela em foco total pro operador seguir durante o culto de verdade — mostra só a
// etapa atual (bem grande) e a próxima, com um botão único e óbvio pra avançar. Sem distração, sem menu.
function CultoLiveMode({ activities, sections, churchId, church, onUpdateChurch, onAdvance, onClose, onOpenFinalize }) {
  const ordered = useMemo(() => sections.flatMap(sec => activities.filter(a => a.section === sec)), [activities, sections]);
  const firstPending = ordered.findIndex(a => !a.done);
  const [idx, setIdx] = useState(firstPending === -1 ? 0 : firstPending);

  // Programação automática: avança sozinho pra próxima etapa, sem precisar tocar em "PRÓXIMO" — pra
  // quando o operador tá de mãos ocupadas (som, projeção) e não quer ficar de olho no relógio.
  // Desligado por padrão. Pra NUNCA cortar um vídeo/música no meio (pedido dele), o comportamento
  // muda conforme a etapa tem mídia (vídeo/música) vinculada ou não:
  //  - Etapa COM vídeo/música: espera o vídeo avisar sozinho que terminou de verdade (a janela de
  //    projeção manda esse aviso), e só DEPOIS conta o "tempo ocioso" (configurável, por etapa ou um
  //    padrão geral) antes de avançar. "min/etapa" vira um teto de segurança — só avança sem esperar
  //    o aviso se passar todo esse tempo (ex: o operador esqueceu de clicar em Projetar).
  //  - Etapa SEM vídeo/música: continua como antes, avança sozinha depois de "min/etapa".
  // Os dois números (min/etapa e o tempo ocioso padrão) ficam salvos na conta da igreja, valendo em
  // qualquer aparelho/login dela — mesmo padrão usado pra tema, fundo musical etc.
  const [autoOn, setAutoOn] = useState(false);
  const [autoMinutes, setAutoMinutes] = useState(() => {
    if (church && typeof church.autoProgMinutes === 'number' && church.autoProgMinutes > 0) return church.autoProgMinutes;
    try { const v = localStorage.getItem('gc_auto_prog_min_' + churchId); return v ? Math.max(1, Number(v)) : 5; } catch (e) { return 5; }
  });
  const [idleSecDefault, setIdleSecDefault] = useState(() => {
    if (church && typeof church.autoProgIdleSec === 'number' && church.autoProgIdleSec >= 0) return church.autoProgIdleSec;
    try { const v = localStorage.getItem('gc_auto_prog_idle_' + churchId); return v !== null ? Math.max(0, Number(v)) : 5; } catch (e) { return 5; }
  });
  const [secondsLeft, setSecondsLeft] = useState(null);
  const [waitingMedia, setWaitingMedia] = useState(false);
  const goNextRef = useRef(() => {});

  const current = ordered[idx];
  const next = ordered[idx+1];
  const isLast = idx >= ordered.length - 1;
  const currentHasMedia = !!(current && current.media && current.media.title);

  const goNext = () => {
    if (!current) return;
    onAdvance(current.id);
    if (isLast) { setAutoOn(false); onOpenFinalize(); return; }
    setIdx(i => Math.min(i+1, ordered.length-1));
  };
  const goBack = () => setIdx(i => Math.max(i-1, 0));
  goNextRef.current = goNext;

  // Salva os dois números neste aparelho na hora (offline-safe) e também na conta da igreja.
  useEffect(() => {
    try { localStorage.setItem('gc_auto_prog_min_' + churchId, String(autoMinutes)); } catch (e) {}
    try { localStorage.setItem('gc_auto_prog_idle_' + churchId, String(idleSecDefault)); } catch (e) {}
    if (church && (church.autoProgMinutes !== autoMinutes || church.autoProgIdleSec !== idleSecDefault)) {
      const docId = church.fbDocId || church.docId;
      if (docId) fbUpdateChurchFields(docId, { autoProgMinutes: autoMinutes, autoProgIdleSec: idleSecDefault });
      if (onUpdateChurch) onUpdateChurch({ ...church, autoProgMinutes: autoMinutes, autoProgIdleSec: idleSecDefault });
    }
  }, [autoMinutes, idleSecDefault, churchId]);

  // Reinicia a contagem sempre que muda de etapa (manual ou automático) ou liga/desliga o automático.
  // Com vídeo/música: começa "aguardando" (teto de segurança = min/etapa). Sem mídia: usa a duração
  // planejada da própria etapa (act.plannedSeconds — o mesmo número configurado no cronômetro dela lá
  // na Liturgia, pedido do Paulo 25/09) quando existir; sem duração planejada, cai no "min/etapa" geral.
  useEffect(() => {
    if (!autoOn) { setSecondsLeft(null); setWaitingMedia(false); return; }
    const plannedSecs = (!currentHasMedia && current && typeof current.plannedSeconds === 'number' && current.plannedSeconds > 0) ? current.plannedSeconds : (autoMinutes * 60);
    setSecondsLeft(plannedSecs);
    setWaitingMedia(currentHasMedia);
  }, [autoOn, idx]);

  // Ouve o aviso de "vídeo/música terminou de verdade" que a janela de projeção manda. Quando chega
  // (e essa etapa tinha mídia e ainda tava esperando), troca pra contagem do tempo ocioso configurado
  // pra essa etapa (ou o padrão geral) antes de avançar.
  useEffect(() => {
    if (!autoOn) return;
    const onMsg = (ev) => {
      const d = ev.data;
      if (!d || d.gcType !== 'gc_media_ended') return;
      setWaitingMedia(w => {
        if (!w) return w;
        const secs = (current && typeof current.idleSeconds === 'number') ? current.idleSeconds : idleSecDefault;
        setSecondsLeft(Math.max(0, secs));
        return false;
      });
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [autoOn, current, idleSecDefault]);

  // O intervalo roda continuamente enquanto autoOn estiver ligado — chama sempre o goNext mais atual
  // (via ref), pra nunca avançar a partir de uma etapa "velha". Se a etapa tem mídia e ainda tá
  // "aguardando" o vídeo terminar, esse tempo é só o teto de segurança (última opção).
  useEffect(() => {
    if (!autoOn) return;
    const iv = setInterval(() => {
      setSecondsLeft(s => {
        if (s === null) return s;
        if (s <= 1) { goNextRef.current(); return autoMinutes * 60; }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [autoOn, autoMinutes]);

  if (!current) {
    return html`
      <div style=${{position:'fixed', inset:0, background:'var(--bg-1, #0b1120)', zIndex:200, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'16px', padding:'24px', textAlign:'center'}}>
        <div style=${{fontSize:'40px'}}>📋</div>
        <div style=${{fontWeight:800, fontSize:'18px'}}>Nenhuma atividade cadastrada ainda</div>
        <button onClick=${onClose} style=${{...btnGhost, padding:'12px 24px'}}>Fechar</button>
      </div>
    `;
  }

  const mm = Math.floor((secondsLeft||0)/60);
  const ss = (secondsLeft||0)%60;
  const timeLabel = mm + ':' + String(ss).padStart(2,'0');

  return html`
    <div style=${{position:'fixed', inset:0, background:'var(--bg-1, #0b1120)', zIndex:200, display:'flex', flexDirection:'column', padding:'20px 16px', overflowY:'auto'}}>
      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'18px', gap:'10px', flexWrap:'wrap'}}>
        <div style=${{fontSize:'11.5px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.05em'}}>
          Etapa ${idx+1} de ${ordered.length} • ${SECTION_LABELS[current.section]}
        </div>
        <div style=${{display:'flex', alignItems:'center', gap:'10px'}}>
          ${autoOn
            ? html`<button onClick=${()=>setAutoOn(false)} title="Toque pra desligar" style=${{...btnGhost, padding:'6px 12px', fontSize:'11px', fontWeight:700, color:'var(--success)', borderColor:'var(--success)'}}>
                ${waitingMedia ? '🎬 Aguardando vídeo/música terminar…' : '⏱️ ' + timeLabel + (!currentHasMedia && current && current.plannedSeconds > 0 ? ' (duração da etapa)' : '')} — Automático ligado
              </button>`
            : html`
              <div style=${{display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap'}}>
                <input type="number" min="1" value=${autoMinutes} onChange=${e=>setAutoMinutes(Math.max(1, Number(e.target.value)||1))} style=${{...inputStyle, width:'50px', padding:'5px 6px', fontSize:'11px', textAlign:'center'}} />
                <span style=${{fontSize:'10px', color:'var(--text-dim)'}}>min/etapa (teto)</span>
                <input type="number" min="0" value=${idleSecDefault} onChange=${e=>setIdleSecDefault(Math.max(0, Number(e.target.value)||0))} style=${{...inputStyle, width:'50px', padding:'5px 6px', fontSize:'11px', textAlign:'center'}} title="Tempo ocioso após o vídeo/música terminar, antes de avançar" />
                <span style=${{fontSize:'10px', color:'var(--text-dim)'}}>seg. ocioso</span>
                <button onClick=${()=>setAutoOn(true)} style=${{...btnGhost, padding:'6px 12px', fontSize:'11px'}}>⏱️ Programação Automática</button>
              </div>
            `}
          <button onClick=${onClose} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'20px', padding:'4px 8px'}} title="Sair do Modo Ao Vivo">✕</button>
        </div>
      </div>

      <div style=${{width:'100%', height:'6px', borderRadius:'999px', background:'rgba(148,163,184,0.18)', overflow:'hidden', marginBottom:'24px'}}>
        <div style=${{width: ((idx)/ordered.length*100)+'%', height:'100%', background:'linear-gradient(90deg,var(--success-1),var(--success-2))', transition:'width .3s'}}></div>
      </div>

      <div style=${{flex:1, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', textAlign:'center', gap:'18px'}}>
        <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.08em'}}>Agora</div>
        <div style=${{fontSize:'56px', lineHeight:1}}>${CATEGORY_ICON[current.category] || '📌'}</div>
        <div style=${{fontWeight:900, fontSize:'28px', lineHeight:1.2, maxWidth:'560px'}}>${current.name}</div>
        <div style=${{fontSize:'15px', color:'var(--text-mid)', fontWeight:600}}>${current.responsible}${current.time && current.time !== '--:--' ? ' • ' + current.time : ''}</div>
        ${current.media && current.media.title && html`
          <div style=${{display:'flex', flexDirection:'column', alignItems:'center', gap:'8px', marginTop:'4px'}}>
            <div style=${{fontSize:'12.5px', color:'var(--text-mid)'}}>🎬 ${current.media.title}</div>
            <${ProjectButton} churchId=${churchId} media=${current.media} itemKey=${current.id} />
          </div>
        `}

        ${next && html`
          <div class="glass fade-up" style=${{marginTop:'28px', padding:'12px 20px', borderRadius:'14px', display:'flex', alignItems:'center', gap:'10px', maxWidth:'420px'}}>
            <span style=${{fontSize:'10.5px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase'}}>A seguir</span>
            <span style=${{fontSize:'18px'}}>${CATEGORY_ICON[next.category] || '📌'}</span>
            <span style=${{fontWeight:700, fontSize:'13px'}}>${next.name}</span>
          </div>
        `}
        ${!next && html`
          <div style=${{marginTop:'28px', fontSize:'12.5px', color:'var(--text-dim)'}}>Última etapa do culto 🎉</div>
        `}
      </div>

      <div style=${{display:'grid', gridTemplateColumns: idx>0 ? '1fr 2fr' : '1fr', gap:'10px', marginTop:'20px', maxWidth:'560px', width:'100%', marginLeft:'auto', marginRight:'auto'}}>
        ${idx>0 && html`<button onClick=${goBack} style=${{...btnGhost, padding:'16px', fontSize:'14px'}}>◀ Voltar</button>`}
        <button onClick=${goNext} style=${{...btnPrimary, padding:'16px', fontSize:'16px', fontWeight:800}}>
          ${isLast ? '✅ Finalizar Culto' : 'PRÓXIMO ▶'}
        </button>
      </div>
    </div>
  `;
}

function LiturgiaView({ churchId, churchName, church, onUpdateChurch, mensagemItems, mensagemCurrent, setMensagemCurrent }) {
  // Liturgia (programação do sábado) — antes só ficava salva no armazenamento local do navegador,
  // então "sumia" pra quem abria em outro computador/celular ou depois de limpar os dados do
  // navegador (esse era o bug relatado: "estou cadastrando... mas não estão ficando salvas").
  // Corrigido (24/09): mesmo padrão já usado em Gestão — o valor vindo da nuvem tem prioridade no
  // carregamento inicial, e toda alteração é gravada local (cache, funciona offline) e na nuvem.
  const docId = church && (church.fbDocId || church.docId);
  const [activities, setActivities] = useState(() => (church && church.activities) ? church.activities : loadActivities(churchId));
  const [adding, setAdding] = useState(false);
  const [assistantOpen, setAssistantOpen] = useState(false);
  const [finalizeOpen, setFinalizeOpen] = useState(false);
  const [makeDefaultGate, setMakeDefaultGate] = useState(false);

  // Trava de segurança: a primeira vez que este efeito roda (assim que a tela abre) só NÃO manda
  // nada pra nuvem quando a nuvem já tinha algo (church.activities definido) — evita que, no
  // instante entre abrir a tela e a nuvem confirmar o que já existe, a gente grave por cima o que
  // já estava salvo com um valor "vazio"/de exemplo carregado só como ponto de partida. MAS se a
  // nuvem não tinha NADA ainda pra essa igreja (campo indefinido — igreja nova, ou programação que
  // só existe neste aparelho e nunca foi enviada), manda esse primeiro valor sim: não existe risco
  // de apagar nada, e sem isso uma programação feita só localmente (num aparelho que nunca chegou a
  // fazer uma "segunda" edição) ficava presa pra sempre nesse aparelho, nunca aparecendo em outro
  // (bug relatado em 25/09: "a programação feita em outro aparelho não está salvando na nuvem").
  const skipFirstSync = useRef(!!(church && church.activities !== undefined));
  useEffect(() => {
    saveActivities(churchId, activities);
    if (skipFirstSync.current) { skipFirstSync.current = false; return; }
    if (docId) fbUpdateChurchFields(docId, { activities });
    if (onUpdateChurch) onUpdateChurch({ activities });
  }, [activities, churchId]);

  // Atualiza sozinho o link de itens dinâmicos (Provai e Vede / Informativo) e completa quem ainda não tem
  useEffect(() => {
    setActivities(list => {
      let changed = false;
      const next = list.map(a => {
        if (a.media && a.media.dynamic) {
          const lib = MEDIA_LIBRARY.find(m => m.title === a.media.libTitle);
          if (lib) {
            const freshUrl = mediaLibraryUrl(lib);
            if (freshUrl !== a.media.url || lib.playlistId !== a.media.playlistId) {
              changed = true;
              return { ...a, media: { ...a.media, url: freshUrl, playlistId: lib.playlistId || null } };
            }
          }
          return a;
        }
        // Completa automaticamente quem ainda não tem mídia nenhuma (liturgias salvas antes dessa função existir)
        if (!a.media) {
          let lib = null;
          if (a.id === 'a5' || a.name.toLowerCase().includes('informativo mundial')) lib = MEDIA_LIBRARY.find(m => m.title === 'Informativo Mundial das Missões');
          else if (a.id === 'b3' || a.name.toLowerCase().includes('provai e vede')) lib = MEDIA_LIBRARY.find(m => m.title === 'Provai e Vede - Vídeo Oficial');
          if (lib) {
            changed = true;
            return { ...a, media: { title: lib.title, url: mediaLibraryUrl(lib), dynamic:true, libTitle: lib.title, playlistId: lib.playlistId || null } };
          }
        }
        return a;
      });
      return changed ? next : list;
    });
  }, [churchId]);

  // Confere se o vídeo vinculado (Provai e Vede / Informativo / Vida e Saúde) já é o certo desta
  // semana (25/09 — pedido do Paulo: o vídeo estava errado, pegando uma PRÉ-ESTREIA agendada do canal
  // que ainda nem foi ao ar, em vez do vídeo mais recente já lançado). A playlist de uploads do canal
  // lista pré-estreias agendadas ANTES dos vídeos já lançados; a busca normal do YouTube nunca traz
  // agendados, só o que já está no ar de verdade — por isso usamos ela pra achar o vídeo certo e
  // corrigir sozinho sempre que o título ainda estiver com a data de uma semana antiga.
  useEffect(() => {
    const suffix = weekDateSuffix();
    const stale = activities.filter(a => a.media && a.media.dynamic && a.media.libTitle && !(a.media.title || '').includes(suffix));
    if (stale.length === 0) return;
    let cancelled = false;
    (async () => {
      for (const a of stale) {
        const lib = MEDIA_LIBRARY.find(m => m.title === a.media.libTitle);
        if (!lib) continue;
        const results = await searchYoutubeServer(lib.query);
        if (cancelled) return;
        const videoId = (results && results[0] && results[0].videoId) || null;
        setActivities(list => list.map(act => {
          if (act.id !== a.id || !act.media || !act.media.dynamic) return act;
          return { ...act, media: { ...act.media, title: lib.title + ' (' + suffix + ')', videoId: videoId || act.media.videoId || null } };
        }));
      }
    })();
    return () => { cancelled = true; };
  }, [churchId, activities.map(a => (a.media && a.media.dynamic) ? a.media.title : '').join('|')]);

  // Trilhas Fixas (25/09) — vídeos/músicas de toda semana (música das ofertas, entrada/saída das
  // crianças, entrada da plataforma etc), cadastrados em Gestão. Mesmo padrão de sincronização com a
  // nuvem já usado pra activities acima.
  const [fixedTracks, setFixedTracks] = useState(() => (church && church.fixedTracks) ? church.fixedTracks : loadFixedTracks(churchId));
  const skipFirstFixedTracksSync = useRef(!!(church && church.fixedTracks !== undefined));
  useEffect(() => {
    saveFixedTracks(churchId, fixedTracks);
    if (skipFirstFixedTracksSync.current) { skipFirstFixedTracksSync.current = false; return; }
    if (docId) fbUpdateChurchFields(docId, { fixedTracks });
    if (onUpdateChurch) onUpdateChurch({ fixedTracks });
  }, [fixedTracks, churchId]);

  // Garante que toda atividade marcada como "acontece todo sábado" (📅) tenha um espaço criado em
  // Gestão > Trilhas Fixas pra receber a URL — mesmo que ainda esteja vazio.
  useEffect(() => {
    const weeklyNames = activities.filter(a => a.weeklyFixed && a.name && a.name.trim()).map(a => a.name.trim());
    if (weeklyNames.length === 0) return;
    setFixedTracks(list => {
      let changed = false;
      const next = [...list];
      weeklyNames.forEach(name => {
        if (!findFixedTrack(next, name)) { changed = true; next.push({ id:'fx-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), name, url:'', videoId:null }); }
      });
      return changed ? next : list;
    });
  }, [activities]);

  // Mantém a mídia das atividades "todo sábado" sempre igual ao que está cadastrado em Trilhas
  // Fixas — se o Paulo trocar o link lá, a atividade já reflete sozinha, do mesmo jeito que já
  // acontece com Provai e Vede/Informativo (dinâmicos).
  useEffect(() => {
    setActivities(list => {
      let changed = false;
      const next = list.map(a => {
        if (!a.weeklyFixed) return a;
        const track = findFixedTrack(fixedTracks, a.name);
        if (!track || !track.videoId) {
          if (a.media && a.media.fromFixedTrack) { changed = true; return { ...a, media: null }; }
          return a;
        }
        if (a.media && a.media.fromFixedTrack && a.media.videoId === track.videoId) return a;
        changed = true;
        return { ...a, media: { title: a.name, url: track.url, videoId: track.videoId, fromFixedTrack: true } };
      });
      return changed ? next : list;
    });
  }, [fixedTracks]);

  const toggle = (id) => setActivities(list => list.map(a => a.id===id ? {...a, done: !a.done} : a));
  const markDone = (id) => setActivities(list => list.map(a => a.id===id ? {...a, done:true} : a));
  const [liveMode, setLiveMode] = useState(false);
  const remove = (id) => setActivities(list => list.filter(a => a.id !== id));
  const edit = (updated) => setActivities(list => list.map(a => a.id === updated.id ? updated : a));
  const toggleFix = (id) => setActivities(list => list.map(a => a.id===id ? {...a, fixed: !a.fixed} : a));
  const toggleWeekly = (id) => setActivities(list => list.map(a => a.id===id ? {...a, weeklyFixed: !a.weeklyFixed} : a));
  // Mover de lugar (25/09, a pedido do Paulo): mesma lógica de "antes de/depois de" do Acrescentar
  // Atividade, só que reordenando quem já existe em vez de inserir um item novo.
  const moveActivity = (id, refId, position) => {
    setActivities(list => {
      if (!refId || refId === id) return list;
      const item = list.find(a => a.id === id);
      if (!item) return list;
      const without = list.filter(a => a.id !== id);
      const refIdx = without.findIndex(a => a.id === refId);
      if (refIdx === -1) return list;
      const insertAt = position === 'antes' ? refIdx : refIdx + 1;
      const next = without.slice();
      next.splice(insertAt, 0, item);
      return next;
    });
  };
  // Zera de verdade (25/09, corrigido a pedido do Paulo): não mantém nada de exceção (nem trancado 🔒,
  // nem nenhuma outra marcação) — troca a programação inteira pelo exato conteúdo da Liturgia Padrão
  // salva, sem acrescentar nada a mais. Se ainda não existe um padrão salvo, só esvazia mesmo.
  const zerarProgramacao = () => {
    const def = (church && church.defaultLiturgy) || loadDefaultLiturgy(churchId);
    const hasDefault = def && def.versions && def.versions.length > 0;
    if (!hasDefault) {
      if (!window.confirm('Você ainda não tem uma Liturgia Padrão salva. Isso vai APAGAR toda a programação atual, ficando vazia. Continuar?')) return;
      setActivities([]);
      pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Programação zerada (ficou vazia — nenhuma Liturgia Padrão salva ainda)' });
      return;
    }
    if (!window.confirm('Isso vai APAGAR a programação atual e colocar no lugar exatamente a Liturgia Padrão salva — nada além dela fica. Continuar?')) return;
    setActivities(def.versions[0].list.map(a => ({ ...a, done:false })));
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Programação zerada e recolocada exatamente igual à Liturgia Padrão' });
  };
  const addAt = (act, refId, position) => {
    setActivities(list => {
      if (!refId) return [...list, act];
      const idx = list.findIndex(a => a.id === refId);
      if (idx === -1) return [...list, act];
      const insertAt = position === 'antes' ? idx : idx + 1;
      const next = [...list];
      next.splice(insertAt, 0, act);
      return next;
    });
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Nova atividade: '+act.name });
  };
  const importFromAssistant = (drafts) => {
    const newActs = drafts.map((d,i) => ({
      id: 'act-'+Date.now()+'-'+i, name: d.name.trim(), section: d.section, category: d.category,
      responsible: (d.responsible || 'A definir').trim(), time: d.time || '--:--', dur: 5, done:false, media:null
    }));
    setActivities(list => [...list, ...newActs]);
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Assistente de liturgia: '+newActs.length+' atividade(s) adicionada(s) por texto' });
  };

  const savedDefault = (church && church.defaultLiturgy) || loadDefaultLiturgy(churchId);

  // Restaura o padrão SEM apagar o que está trancado (🔒): tudo que não tem cadeado é removido e
  // trocado pelo conteúdo do modelo padrão; o que está trancado fica exatamente onde estava.
  const applyVersion = (version) => {
    setActivities(current => {
      const lockedIds = new Set(current.filter(a => a.fixed).map(a => a.id));
      const next = [];
      sections.forEach(sec => {
        current.filter(a => a.section === sec && a.fixed).forEach(a => next.push(a));
        version.list.filter(a => a.section === sec && !lockedIds.has(a.id)).forEach(a => next.push({ ...a, done:false }));
      });
      // Qualquer seção fora da lista conhecida (não deveria acontecer, mas por garantia não perde nada trancado)
      current.filter(a => a.fixed && !sections.includes(a.section)).forEach(a => next.push(a));
      return next;
    });
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Liturgia restaurada para o padrão de '+new Date(version.at).toLocaleString('pt-BR')+' (itens trancados foram preservados)' });
  };
  const resetToDefault = () => {
    if (!savedDefault || !savedDefault.versions || savedDefault.versions.length === 0) {
      // Ainda não existe um padrão salvo — em vez de mandar a pessoa ir configurar em outra aba,
      // já oferece criar o padrão agora, com a liturgia atual, e explica em uma frase o que fazer
      // se quiser trocar isso depois.
      if (window.confirm('Você ainda não tem uma Liturgia Padrão salva, então não tem o que restaurar. Quer usar a liturgia de AGORA como o padrão? (dá pra trocar depois em Gestão > 🔒 Liturgia Padrão)')) {
        const newDefault = saveDefaultLiturgyVersion(churchId, activities.map(a => ({...a})), null);
        if (docId) fbUpdateChurchFields(docId, { defaultLiturgy: newDefault });
        if (onUpdateChurch) onUpdateChurch({ defaultLiturgy: newDefault });
        pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Liturgia padrão criada a partir da liturgia atual' });
        alert('Pronto! Essa liturgia agora é o seu padrão. Da próxima vez que clicar em "Restaurar Padrão", tudo que não estiver trancado (🔒) volta pra esse ponto.');
      }
      return;
    }
    if (!window.confirm('Isso vai remover tudo que NÃO está trancado (🔒) e colocar no lugar o modelo padrão. O que estiver trancado continua do jeito que está. Continuar?')) return;
    applyVersion(savedDefault.versions[0]);
  };

  // Salva a liturgia de AGORA (como está na tela) como o novo modelo padrão — direto por aqui,
  // sem precisar ir em Gestão. Continua protegido por senha, igual ao fluxo de lá.
  const makeCurrentDefault = (password) => {
    const newDefault = saveDefaultLiturgyVersion(churchId, activities.map(a => ({...a})), password);
    if (docId) fbUpdateChurchFields(docId, { defaultLiturgy: newDefault });
    if (onUpdateChurch) onUpdateChurch({ defaultLiturgy: newDefault });
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Liturgia padrão atualizada a partir da liturgia atual' });
    setMakeDefaultGate(false);
    alert('Pronto! A liturgia de agora foi salva como o novo padrão (já na nuvem). Toda vez que clicar em "Restaurar Padrão", tudo que não estiver trancado (🔒) volta pra esse ponto.');
  };
  // Botão "Tornar Padrão" (25/09, a pedido do Paulo): por enquanto sem exigir senha — se já existe uma
  // senha configurada de antes (em Gestão > Liturgia Padrão), continua pedindo ela pra não tirar uma
  // proteção que a pessoa já tinha montado; se não existe nenhuma, salva direto, sem abrir gate nenhum.
  const doMakeDefault = () => {
    if (savedDefault && savedDefault.password) { setMakeDefaultGate(true); return; }
    if (!window.confirm('Salvar a liturgia de AGORA como o novo Padrão (fica salvo na nuvem)? Da próxima vez que clicar em "Restaurar Padrão", tudo que não estiver trancado (🔒) volta pra esse ponto.')) return;
    makeCurrentDefault(null);
  };

  const buildFinalizeSummary = () => {
    const church = loadDB().find(c => c.id === churchId) || {};
    const teams = loadTeams(churchId);
    const targetKey = getSaturdaysForMonths(3)[0];
    const sono = getScheduledGroupForDate(churchId, 'sonoplastia', teams.sonoplastia, targetKey);
    const midia = getScheduledGroupForDate(churchId, 'midia', teams.midia, targetKey);
    const louvor = getScheduledLouvorForDate(churchId, teams.louvorTeams, targetKey);
    return {
      church, teams, targetKey, sono, midia, louvor,
      dateLabel: formatSaturday(keyToDate(targetKey)),
      activitiesCount: activities.length,
      pastorName: church.pastorName, elderName: church.elderName,
      sonoNames: sono.map(m=>m.name).join(', '),
      midiaNames: midia.map(m=>m.name).join(', '),
      louvorTeamName: louvor.team ? louvor.team.teamName : '',
      musica: louvor.musica,
    };
  };
  const [finalizeSummary, setFinalizeSummary] = useState(null);
  const openFinalize = () => { setFinalizeSummary(buildFinalizeSummary()); setFinalizeOpen(true); };
  const confirmFinalize = () => {
    const s = finalizeSummary;
    const record = {
      id: 'culto-'+Date.now(),
      date: s.targetKey,
      finalizedAt: new Date().toISOString(),
      activities: activities.map(a => ({...a})),
      church: { name: s.church.name, pastorName: s.church.pastorName, elderName: s.church.elderName, association: s.church.association, district: s.church.district },
      sonoplastia: s.sono.map(m => ({ name:m.name, function:m.function })),
      midia: s.midia.map(m => ({ name:m.name, function:m.function })),
      louvor: { teamName: s.louvorTeamName, musica: s.musica, members: s.louvor.team ? s.louvor.team.members.map(m=>({name:m.name, function:m.function})) : [] },
    };
    const arch = loadArchive(churchId);
    // Limita a 20 cultos arquivados (os mais recentes) — evita que o histórico cresça sem limite e
    // estoure o tamanho máximo de um documento no banco compartilhado (Firestore, 1MB por igreja).
    const newArch = [record, ...arch].slice(0, 20);
    saveArchive(churchId, newArch);
    if (docId) fbUpdateChurchFields(docId, { archive: newArch });
    if (onUpdateChurch) onUpdateChurch({ archive: newArch });
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Culto finalizado e arquivado ('+s.dateLabel+')' });
    setFinalizeOpen(false);
  };

  const sections = ['escola_sabatina', 'culto_divino'];
  const totalDone = activities.filter(a=>a.done).length;

  return html`
    <div style=${{maxWidth:'760px', margin:'0 auto', padding:'20px 16px 60px'}}>
      <div class="glass fade-up" style=${{padding:'16px 20px', borderRadius:'18px', marginBottom:'20px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'10px'}}>
        <div>
          <div style=${{fontWeight:800, fontSize:'15px'}}>Liturgia do Sábado</div>
          <div style=${{fontSize:'12px', color:'var(--text-mid)'}}>${totalDone} de ${activities.length} atividades concluídas</div>
        </div>
        <div style=${{width:'140px', height:'8px', borderRadius:'999px', background:'rgba(148,163,184,0.18)', overflow:'hidden'}}>
          <div style=${{width: (activities.length ? (totalDone/activities.length*100) : 0)+'%', height:'100%', background:'linear-gradient(90deg,var(--success-1),var(--success-2))', transition:'width .3s'}}></div>
        </div>
      </div>

      <button onClick=${()=>setLiveMode(true)} style=${{...btnPrimary, width:'100%', marginBottom:'20px', padding:'16px', fontSize:'15px', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px'}}>
        ▶️ Iniciar Modo Ao Vivo
      </button>
      ${liveMode && html`<${CultoLiveMode} activities=${activities} sections=${sections} churchId=${churchId} church=${church} onUpdateChurch=${onUpdateChurch} onAdvance=${markDone} onClose=${()=>setLiveMode(false)} onOpenFinalize=${()=>{ setLiveMode(false); openFinalize(); }} />`}

      <div class="glass fade-up" style=${{padding:'12px 14px', borderRadius:'14px', marginBottom:'20px', display:'flex', alignItems:'center', gap:'10px', fontSize:'11.5px', color:'var(--text-mid)'}}>
        <span style=${{fontSize:'18px'}}>🎚️</span>
        <span>Os fundos musicais agora têm um mixer flutuante — aparece em qualquer aba, no botão do canto da tela. O áudio continua tocando mesmo trocando de aba.</span>
      </div>

      <button onClick=${()=>setAssistantOpen(true)} style=${{...btnGhost, width:'100%', marginBottom:'8px', padding:'12px', border:'1.5px dashed var(--accent-1)', color:'var(--accent-1)', fontWeight:700}}>🤖 Assistente de Liturgia (colar texto)</button>
      <button onClick=${()=>setAdding(v=>!v)} style=${{...btnGhost, width:'100%', border:'1.5px dashed var(--border-soft)', padding:'12px', marginBottom:'8px'}}>➕ Acrescentar Atividade</button>
      <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px', marginBottom:'8px'}}>
        <button onClick=${resetToDefault} style=${{...btnGhost, padding:'12px'}}>🔄 Restaurar Padrão</button>
        <button onClick=${doMakeDefault} style=${{...btnGhost, padding:'12px'}}>💾${savedDefault && savedDefault.password ? '🔒' : ''} Tornar Padrão</button>
      </div>
      <div style=${{fontSize:'10.5px', color:'var(--text-dim)', marginBottom:'8px'}}>"Tornar Padrão" salva a liturgia de agora como o novo modelo. "Restaurar Padrão" volta tudo (menos o trancado 🔒) pro último modelo salvo. Pra apagar a senha ou ver versões antigas, vá em Gestão > 🔒 Liturgia Padrão.</div>
      ${makeDefaultGate && html`<${DefaultLiturgyPasswordGate} hasPassword=${!!(savedDefault && savedDefault.password)} onUnlock=${makeCurrentDefault} onClose=${()=>setMakeDefaultGate(false)} />`}
      <button onClick=${openFinalize} style=${{...btnGhost, width:'100%', marginBottom:'8px', padding:'12px', border:'1px solid var(--success-1)', color:'var(--success-1)'}}>✅ Finalizar Culto</button>
      <button onClick=${zerarProgramacao} style=${{...btnGhost, width:'100%', marginBottom:'16px', padding:'12px', border:'1px solid var(--danger)', color:'var(--danger)'}}>🧹 Zerar Programação (volta exatamente pro Padrão)</button>

      ${finalizeOpen && finalizeSummary && html`<${FinalizeCultoModal} summary=${finalizeSummary} onConfirm=${confirmFinalize} onClose=${()=>setFinalizeOpen(false)} />`}
      ${adding && html`<${AddActivityForm} defaultSection="escola_sabatina" activities=${activities} onAddAt=${addAt} onClose=${()=>setAdding(false)} fixedTracks=${fixedTracks} />`}
      ${assistantOpen && html`<${LiturgyAssistantModal} onImportAll=${importFromAssistant} onClose=${()=>setAssistantOpen(false)} />`}

      ${sections.map(sec => {
        const items = activities.filter(a => a.section === sec);
        return html`
          <div key=${sec} style=${{marginBottom:'26px'}}>
            <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'0 0 10px 4px'}}>${SECTION_LABELS[sec]}</h3>
            <div style=${{display:'grid', gap:'8px'}}>
              ${items.length === 0 && html`<div style=${{color:'var(--text-dim)', fontSize:'12.5px', padding:'8px 4px'}}>Nenhuma atividade cadastrada ainda.</div>`}
              ${items.map((a,i) => html`<${ActivityCard} key=${a.id} act=${a} idx=${i} onToggle=${toggle} onDelete=${remove} onEdit=${edit} onToggleFix=${toggleFix} onToggleWeekly=${toggleWeekly} onReorder=${moveActivity} siblings=${items} fixedTracks=${fixedTracks} churchId=${churchId} mensagemItems=${mensagemItems} mensagemCurrent=${mensagemCurrent} setMensagemCurrent=${setMensagemCurrent} />`)}
            </div>
          </div>
        `;
      })}
    </div>
  `;
}

    <button onClick=${()=>onOpen(h)} class="glass fade-up" style=${{textAlign:'left', padding:'14px', borderRadius:'14px', border:'1px solid var(--border-soft)', display:'flex', flexDirection:'column', gap:'6px', cursor:'pointer'}}>

      </div>
      <div style=${{fontWeight:700, fontSize:'13.5px'}}>${h.t}</div>

  `;
}

function HymnDetail({ h, onClose }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const text = '#'+h.n+' - '+h.t+'\\nTom: '+h.k+'\\n\\n'+(h.full ? h.full.join('\\n\\n') : h.s);
    navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
    setCopied(true); setTimeout(()=>setCopied(false), 1800);
  };
  return html`
    <div style=${{position:'fixed', inset:0, background:'rgba(2,6,23,0.6)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:50, padding:'16px'}} onClick=${onClose}>
      <div class="glass fade-up" style=${{maxWidth:'440px', width:'100%', padding:'22px', borderRadius:'20px', maxHeight:'80vh', overflowY:'auto'}} onClick=${e=>e.stopPropagation()}>
        <div style=${{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'10px'}}>
          <div>
            <div style=${{fontSize:'11px', fontWeight:800, color:'var(--highlight)'}}>Hino ${h.n} • Tom ${h.k}</div>
            <div style=${{fontWeight:800, fontSize:'18px'}}>${h.t}</div>
            <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>${h.c}</div>
          </div>
          <button onClick=${onClose} style=${{background:'transparent', border:'none', color:'var(--text-mid)', fontSize:'18px'}}>✕</button>
        </div>
        <div style=${{fontSize:'13px', lineHeight:1.7, whiteSpace:'pre-line', margin:'14px 0'}}>${(h.full || [h.s]).join('\\n\\n')}</div>
        <button onClick=${copy} style=${btnPrimary}>${copied ? '✓ Copiado!' : '📋 Copiar letra'}</button>
      </div>
    </div>
  `;
}

function HinarioView() {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('Todos');
  const [selected, setSelected] = useState(null);

  const categories = useMemo(() => ['Todos', ...new Set(HYMNS.map(h=>h.c))], []);
  const filtered = useMemo(() => HYMNS.filter(h => {
    const matchCat = cat === 'Todos' || h.c === cat;
    const s = q.toLowerCase().trim();
    if (!s) return matchCat;
    return matchCat && (String(h.n) === s || h.t.toLowerCase().includes(s) || h.s.toLowerCase().includes(s));
  }), [q, cat]);

  return html`
    <div style=${{maxWidth:'760px', margin:'0 auto', padding:'20px 16px 60px'}}>
      <div class="glass fade-up" style=${{padding:'16px', borderRadius:'18px', marginBottom:'18px', display:'grid', gap:'10px'}}>
        <input placeholder="Buscar por número, título ou trecho da letra..." value=${q} onChange=${e=>setQ(e.target.value)} style=${inputStyle} />
        <div style=${{display:'flex', gap:'6px', overflowX:'auto', paddingBottom:'2px'}}>

/* ============ ESCALA AUTOMÁTICA (3 meses, editável, com datas extras) ============ */

const SCHEDULE_EPOCH = new Date('2024-01-06T00:00:00'); // um sábado de referência

function getSaturdaysForMonths(months) {
  const today = new Date();
  const result = [];
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const daysUntilSaturday = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + (daysUntilSaturday === 0 ? 0 : daysUntilSaturday));
  const limit = new Date(today.getFullYear(), today.getMonth() + months, today.getDate());
  while (d <= limit) {
    result.push(dateKey(new Date(d)));
    d.setDate(d.getDate() + 7);
  }
  return result;
}
function dateKey(date) {
  const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2,'0'), d = String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}
function keyToDate(key) {
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
function weeksSinceEpoch(date) {
  return Math.round((date - SCHEDULE_EPOCH) / (7 * 24 * 60 * 60 * 1000));
}
function formatSaturday(date) {
  return date.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}
function autoGroupForDate(dateKeyStr, teamKey, validMembers, groupSize) {
  if (validMembers.length === 0) return [];
  const n = validMembers.length;
  const size = Math.max(1, Math.min(groupSize || 2, n));
  const w = weeksSinceEpoch(keyToDate(dateKeyStr)) + (teamKey ? teamKey.length : 0);
  const result = [];
  const usedIdx = new Set();
  for (let i = 0; i < size; i++) {
    const idx = ((w + i) % n + n) % n;
    if (!usedIdx.has(idx)) { usedIdx.add(idx); result.push(validMembers[idx]); }
  }
  return result;
}

function scheduleStoreKey(churchId, teamKey) { return 'gc_schedule_' + churchId + '_' + teamKey; }
function loadSchedule(churchId, teamKey) {
  try { const raw = localStorage.getItem(scheduleStoreKey(churchId, teamKey)); if (raw) return JSON.parse(raw); } catch(e) {}
  return { overrides:{}, extraDates:[], groupSize:2 };
}
function saveSchedule(churchId, teamKey, data) {
  try { localStorage.setItem(scheduleStoreKey(churchId, teamKey), JSON.stringify(data)); } catch(e) {}
}
function getScheduledGroupForDate(churchId, teamKey, allMembers, dKey) {
  const validMembers = allMembers.filter(m => m.name && m.name.trim());
  const sched = loadSchedule(churchId, teamKey);
  const groupSize = sched.groupSize || 2;
  const auto = autoGroupForDate(dKey, teamKey, validMembers, groupSize);
  const ov = sched.overrides[dKey];
  if (!ov) return auto;
  return Array.from({length: groupSize}, (_, i) => {
    const id = ov[i];
    return id ? (validMembers.find(m=>m.id===id) || auto[i]) : auto[i];
  }).filter(Boolean);
}

function AutoSchedule({ churchId, teamKey, members, reminderTemplateForDate, docId, onUpdateChurch, remoteSchedules }) {
  const validMembers = members.filter(m => m.name && m.name.trim());
  const [sched, setSched] = useState(() => (remoteSchedules && remoteSchedules[teamKey]) ? remoteSchedules[teamKey] : loadSchedule(churchId, teamKey));
  const [showAddDate, setShowAddDate] = useState(false);
  const [newDate, setNewDate] = useState('');
  const [newLabel, setNewLabel] = useState('');
  const groupSize = sched.groupSize || 2;

  // Escala (quem está de plantão em cada data) — sincroniza com a nuvem igual às equipes/funções
  // (mesmo motivo: sem isso, os ajustes de escala só ficavam salvos no navegador de quem editou).
  // Usa caminho com ponto ("schedules.sonoplastia") no Firestore pra atualizar só essa equipe sem
  // sobrescrever a escala de outra equipe salva ao mesmo tempo por outra pessoa. A trava só pula o
  // primeiríssimo envio quando a nuvem JÁ tinha algo pra essa equipe — se ainda não tinha nada
  // (igreja nova ou escala feita só neste aparelho e nunca enviada), manda de primeira, sem esperar
  // uma segunda mudança (25/09 — mesma correção da Liturgia, ver comentário lá).
  const skipFirstSchedSync = useRef(!!(remoteSchedules && remoteSchedules[teamKey] !== undefined));
  useEffect(() => {
    saveSchedule(churchId, teamKey, sched);
    if (skipFirstSchedSync.current) { skipFirstSchedSync.current = false; return; }
    if (docId) fbUpdateChurchFields(docId, { ['schedules.' + teamKey]: sched });
    if (onUpdateChurch) onUpdateChurch({ schedules: { ...(remoteSchedules || {}), [teamKey]: sched } });
  }, [sched, churchId, teamKey]);

  const todayKey = dateKey(new Date());
  const regularKeys = useMemo(() => getSaturdaysForMonths(3), []);
  const extraKeys = sched.extraDates.map(e => e.date);
  const allKeys = Array.from(new Set([...regularKeys, ...extraKeys])).filter(k => k >= todayKey).sort();

  const labelFor = (k) => { const ex = sched.extraDates.find(e => e.date === k); return ex ? ex.label : 'Sábado'; };
  const isExtra = (k) => sched.extraDates.some(e => e.date === k);

  const groupFor = (k) => {
    const auto = autoGroupForDate(k, teamKey, validMembers, groupSize);
    const ov = sched.overrides[k]; // [id0, id1, ...] | undefined
    if (!ov) return auto;
    return Array.from({length: groupSize}, (_, i) => {
      const id = ov[i];
      return id ? (validMembers.find(m=>m.id===id) || auto[i]) : auto[i];
    }).filter(Boolean);
  };

  const setGroupSize = (n) => {
    const size = Math.max(1, Math.min(6, n));
    setSched(s => ({ ...s, groupSize: size }));
  };
  const setOverrideSlot = (k, slot, memberId) => {
    setSched(s => {
      const cur = s.overrides[k] || [];
      const next = [...cur];
      next[slot] = memberId === '__auto__' ? null : memberId;
      const overrides = { ...s.overrides, [k]: next };
      if (next.every(v => !v)) delete overrides[k];
      return { ...s, overrides };
    });
  };
  const addExtraDate = (e) => {
    e.preventDefault();
    if (!newDate) return;
    setSched(s => ({ ...s, extraDates: [...s.extraDates.filter(x=>x.date!==newDate), { date:newDate, label: newLabel.trim() || 'Data Especial' }] }));
    setNewDate(''); setNewLabel(''); setShowAddDate(false);
  };
  const removeExtraDate = (k) => {
    setSched(s => { const overrides = {...s.overrides}; delete overrides[k]; return { ...s, extraDates: s.extraDates.filter(e => e.date !== k), overrides }; });
  };

  if (validMembers.length === 0) {
    return html`<div class="glass fade-up" style=${{padding:'16px', borderRadius:'14px', fontSize:'11.5px', color:'var(--text-dim)', textAlign:'center'}}>Cadastre pelo menos um membro para gerar a escala automática.</div>`;
  }

  return html`
    <div style=${{display:'grid', gap:'10px'}}>
      <div class="glass fade-up" style=${{padding:'10px 14px', borderRadius:'12px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'8px'}}>
        <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>Pessoas por escala:</div>
        <div style=${{display:'flex', alignItems:'center', gap:'8px'}}>
          <button type="button" onClick=${()=>setGroupSize(groupSize-1)} style=${{...btnGhost, width:'30px', height:'30px', padding:0, borderRadius:'50%'}}>−</button>
          <span style=${{fontWeight:800, fontSize:'14px', minWidth:'18px', textAlign:'center'}}>${groupSize}</span>
          <button type="button" onClick=${()=>setGroupSize(groupSize+1)} style=${{...btnGhost, width:'30px', height:'30px', padding:0, borderRadius:'50%'}}>+</button>
        </div>
      </div>

      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Próximos 3 meses • ${allKeys.length} datas • ${groupSize} por escala</div>
        <button onClick=${()=>setShowAddDate(v=>!v)} style=${btnGhost}>+ Data Especial</button>
      </div>

      ${showAddDate && html`
        <form onSubmit=${addExtraDate} class="glass fade-up" style=${{padding:'12px', borderRadius:'12px', display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:'8px', alignItems:'center'}}>
          <input type="date" value=${newDate} onChange=${e=>setNewDate(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} required />
          <input placeholder="Ex: Semana de Oração" value=${newLabel} onChange=${e=>setNewLabel(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
          <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 14px'}}>Adicionar</button>
        </form>
      `}

      <div style=${{display:'grid', gap:'8px'}}>
        ${allKeys.map((k, i) => {
          const sat = keyToDate(k);
          const group = groupFor(k);
          const ov = sched.overrides[k] || [];
          const isNext = i === 0;
          const extra = isExtra(k);
          return html`
            <div key=${k} class="glass fade-up" style=${{padding:'11px 14px', borderRadius:'12px', display:'grid', gap:'8px', border: isNext ? '1.5px solid var(--accent-1)' : extra ? '1px solid var(--highlight)' : '1px solid var(--border-soft)'}}>
              <div style=${{display:'flex', alignItems:'center', gap:'10px'}}>
                <div style=${{width:'42px', textAlign:'center', flexShrink:0}}>
                  <div style=${{fontSize:'10px', fontWeight:800, color: isNext ? 'var(--accent-1)' : 'var(--text-dim)', textTransform:'uppercase'}}>${formatSaturday(sat).split(' ')[1]}</div>
                  <div style=${{fontSize:'15px', fontWeight:800}}>${formatSaturday(sat).split(' ')[0]}</div>
                </div>
                <div style=${{flex:1}}>
                  <div style=${{fontSize:'13px', fontWeight:700}}>${group.length ? group.map(m=>m.name).join(' + ') : '—'}</div>
                  <div style=${{fontSize:'10.5px', color: extra ? 'var(--highlight)' : 'var(--text-mid)'}}>${labelFor(k)}</div>
                </div>
                ${extra && html`<button onClick=${()=>removeExtraDate(k)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'15px'}}>✕</button>`}
              </div>

              ${Array.from({length: groupSize}, (_, i) => i).map(slot => html`
                <div key=${slot} style=${{display:'flex', gap:'6px', alignItems:'center'}}>
                  <select value=${ov[slot] || '__auto__'} onChange=${e=>setOverrideSlot(k, slot, e.target.value)} style=${{...inputStyle, padding:'6px 10px', fontSize:'11.5px', flex:1}}>

                    ${validMembers.map(m => html`<option key=${m.id} value=${m.id}>${m.name}${m.function ? ' — '+m.function : ''}</option>`)}
                  </select>
                  <a
                    href=${group[slot] && group[slot].whatsapp ? waLink(group[slot].whatsapp, reminderTemplateForDate(group[slot], sat, labelFor(k))) : undefined}
                    target="_blank" rel="noopener"
                    style=${{...btnGhost, padding:'6px 9px', fontSize:'10.5px', textDecoration:'none', opacity: group[slot] && group[slot].whatsapp ? 1 : 0.4, pointerEvents: group[slot] && group[slot].whatsapp ? 'auto' : 'none'}}
                  >💬</a>
                </div>
              `)}
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

// Lê o arquivo e devolve na melhor qualidade possível: se já for um arquivo leve, mantém do
// jeito que foi enviado; se for muito grande, redimensiona (mantendo proporção) pra caber numa
// tela cheia sem pesar demais no armazenamento do navegador.
// Logo da igreja: redimensiona pra um tamanho pequeno (ela vai aparecer só como um selinho por cima
// da projeção) e mantém PNG (preserva fundo transparente, comum em logos) — só cai pra JPEG se mesmo
// assim o arquivo ficar grande demais.
function readLogoFileSmart(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler o arquivo.'));
    reader.onload = () => {
      const originalDataUrl = reader.result;
      const img = new Image();
      img.onerror = () => resolve(originalDataUrl);
      img.onload = () => {
        try {
          const maxSide = 500;
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            const scale = maxSide / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          let out = canvas.toDataURL('image/png');
          if (out.length > 700 * 1024) out = canvas.toDataURL('image/jpeg', 0.9);
          resolve(out);
        } catch (e) { resolve(originalDataUrl); }
      };
      img.src = originalDataUrl;
    };
    reader.readAsDataURL(file);
  });
}

function readImageFileSmart(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler o arquivo.'));
    reader.onload = () => {
      const originalDataUrl = reader.result;
      if (file.size <= 700 * 1024) { resolve(originalDataUrl); return; }
      const img = new Image();
      img.onerror = () => resolve(originalDataUrl);
      img.onload = () => {
        try {
          const maxSide = 2000;
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            const scale = maxSide / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.9));
        } catch (e) { resolve(originalDataUrl); }
      };
      img.src = originalDataUrl;
    };
    reader.readAsDataURL(file);
  });
}

// Lembretes automáticos por WhatsApp (25/09): liga/desliga o envio automático, feito por um
// programinha à parte que roda no computador de quem administra (conectado ao WhatsApp Web,
// não é a API oficial). O app só guarda aqui a preferência (lembretesAtivo) e mostra o status
// que esse programinha vai reportando (lembretesStatus) — o app em si NUNCA manda mensagem
// sozinho, só combina com o programinha externo quando enviar.
function timeAgoPtBr(iso) {
  if (!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  if (isNaN(diffMs)) return null;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return 'há ' + min + ' min';
  const h = Math.floor(min / 60);
  if (h < 24) return 'há ' + h + (h === 1 ? ' hora' : ' horas');
  const d = Math.floor(h / 24);
  return 'há ' + d + (d === 1 ? ' dia' : ' dias');
}

// Equipes e funções (Gestão) — antes só ficavam salvas no armazenamento local do navegador (por
// aparelho/navegador), então "sumiam" pra quem abria em outro computador, celular ou depois de
// limpar os dados do navegador. Corrigido (23/09): igual já acontecia com Dados da Igreja e os
// fundos musicais, agora sincroniza com o banco compartilhado (Firestore) — o valor vindo da nuvem
// (church.teams/church.functionsList) tem prioridade no carregamento inicial, e toda alteração é
// gravada tanto localmente (cache, funciona offline) quanto na nuvem, além de atualizar a sessão na
// hora (onUpdateChurch) pra refletir imediatamente em qualquer aba/tela aberta.
function GestaoView({ churchId, churchName, church, onUpdateChurch }) {
  const docId = church && (church.fbDocId || church.docId);
  const [teams, setTeams] = useState(() => (church && church.teams) ? church.teams : loadTeams(churchId));
  const [section, setSection] = useState(null);
  const [activeLouvorId, setActiveLouvorId] = useState(null);
  const [functionsList, setFunctionsList] = useState(() => (church && church.functionsList) ? church.functionsList : loadFunctionsList(churchId));
  // Mesma trava de segurança usada na Liturgia (24/09, refinada em 25/09): só pula o primeiríssimo
  // envio pra nuvem quando a nuvem JÁ tinha algo (church.teams/functionsList definidos) — evita
  // apagar dado real com um "vazio" de partida caso a tela abra antes da nuvem confirmar o que já
  // existe. Se a nuvem não tinha NADA ainda (igreja nova, ou equipes cadastradas só neste aparelho
  // e nunca enviadas), manda de primeira — sem isso, ficava preso só no aparelho até uma "segunda"
  // edição, e nunca aparecia em outro computador/celular.
  const skipFirstTeamsSync = useRef(!!(church && church.teams !== undefined));
  const skipFirstFunctionsSync = useRef(!!(church && church.functionsList !== undefined));
  useEffect(() => {
    saveTeams(churchId, teams);
    if (skipFirstTeamsSync.current) { skipFirstTeamsSync.current = false; return; }
    if (docId) fbUpdateChurchFields(docId, { teams });
    if (onUpdateChurch) onUpdateChurch({ teams });
  }, [teams, churchId]);
  useEffect(() => {
    saveFunctionsList(churchId, functionsList);
    if (skipFirstFunctionsSync.current) { skipFirstFunctionsSync.current = false; return; }
    if (docId) fbUpdateChurchFields(docId, { functionsList });
    if (onUpdateChurch) onUpdateChurch({ functionsList });
  }, [functionsList, churchId]);

  // Trilhas Fixas (25/09) — mesmo padrão de sincronização usado acima pra teams/functionsList.
  const [fixedTracks, setFixedTracks] = useState(() => (church && church.fixedTracks) ? church.fixedTracks : loadFixedTracks(churchId));
  const skipFirstFixedTracksSync = useRef(!!(church && church.fixedTracks !== undefined));
  useEffect(() => {
    saveFixedTracks(churchId, fixedTracks);
    if (skipFirstFixedTracksSync.current) { skipFirstFixedTracksSync.current = false; return; }
    if (docId) fbUpdateChurchFields(docId, { fixedTracks });
    if (onUpdateChurch) onUpdateChurch({ fixedTracks });
  }, [fixedTracks, churchId]);
  useEffect(() => {
    if (!activeLouvorId && teams.louvorTeams.length > 0) setActiveLouvorId(teams.louvorTeams[0].id);
  }, [teams.louvorTeams, activeLouvorId]);

  const functionsFor = (group) => functionsList[group] || [];
  const addFunction = (group, name) => {
    const clean = name.trim();
    if (!clean) return;
    setFunctionsList(fl => {
      if ((fl[group]||[]).some(f => f.toLowerCase() === clean.toLowerCase())) return fl;
      return { ...fl, [group]: [...(fl[group]||[]), clean] };
    });
  };
  const removeFunction = (group, name) => {
    setFunctionsList(fl => ({ ...fl, [group]: (fl[group]||[]).filter(f => f !== name) }));
  };
  const renameFunction = (group, oldName, newName) => {
    setFunctionsList(fl => ({ ...fl, [group]: (fl[group]||[]).map(f => f === oldName ? newName : f) }));
  };

  const setSonoplastia = (list) => setTeams(t => ({...t, sonoplastia: list}));
  const setMidia = (list) => setTeams(t => ({...t, midia: list}));

  const updateLouvorTeam = (idx, patch) => setTeams(t => ({...t, louvorTeams: t.louvorTeams.map((lt,i) => i===idx ? {...lt, ...patch} : lt)}));
  const addLouvorTeam = () => {
    const id = 'lv-'+Date.now();
    setTeams(t => ({...t, louvorTeams: [...t.louvorTeams, { id, teamName:'Nova Equipe', members:[] }]}));
    setActiveLouvorId(id);
  };
  const removeLouvorTeam = (idx) => setTeams(t => ({...t, louvorTeams: t.louvorTeams.filter((_,i)=>i!==idx)}));

  const sonoReminder = (m) => 'Olá '+(m.name||'')+'! Passando pra lembrar que você está escalado(a) na Sonoplastia como '+(m.function||'apoio')+' para o próximo culto. Contamos com você! 🎚️';
  const louvorReminder = (teamName) => (m) => 'Olá '+(m.name||'')+'! Lembrete: você está na equipe de louvor "'+teamName+'" como '+(m.function||'membro')+' para o próximo culto. Nos vemos lá! 🎵';
  const midiaReminder = (m) => 'Olá '+(m.name||'')+'! Lembrete: você está escalado(a) na equipe de mídia como '+(m.function||'apoio')+' para o próximo culto. Contamos com você! 🎬';

function FunctionEditRow({ name, onRename, onRemove }) {
  const [value, setValue] = useState(name);
  useEffect(() => setValue(name), [name]);
  const commit = () => { const v = value.trim(); if (v && v !== name) onRename(name, v); else setValue(name); };
  return html`
    <div style=${{display:'flex', alignItems:'center', gap:'6px'}}>
      <input value=${value} onChange=${e=>setValue(e.target.value)} onBlur=${commit} onKeyDown=${e=>{ if (e.key==='Enter') e.target.blur(); }} style=${{...inputStyle, padding:'6px 10px', fontSize:'11.5px', flex:1}} />
      <button onClick=${()=>onRemove(name)} style=${{background:'transparent', border:'none', color:'var(--danger)', fontSize:'14px', padding:'2px 6px'}} title="Remover função">✕</button>
    </div>
  `;
}

function FunctionGroupEditor({ label, functions, onAdd, onRemove, onRename }) {

function churchLocationKey(churchId) { return 'gc_church_location_' + churchId; }
function loadChurchLocation(churchId) {
  try { const raw = localStorage.getItem(churchLocationKey(churchId)); if (raw) return JSON.parse(raw); } catch(e) {}
  return null;
}
function saveChurchLocation(churchId, loc) { try { localStorage.setItem(churchLocationKey(churchId), JSON.stringify(loc)); } catch(e) {} }
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
const PRESENCE_RADIUS_M = 200;

function PresencaView({ churchId, church, onUpdateChurch }) {
  // Localização da igreja e confirmações de presença — antes só ficavam salvas no aparelho de quem
  // definiu/confirmou. Corrigido (24/09): sincroniza com a nuvem (mesmo padrão de Gestão/Liturgia),
  // senão a presença confirmada no celular de uma pessoa nunca apareceria no computador de quem está
  // conferindo a escala, nem a localização da igreja definida num aparelho valeria nos outros.
  const docId = church && (church.fbDocId || church.docId);
  const [teams, setTeams] = useState(() => loadTeams(churchId));
  const targetKey = useMemo(() => getSaturdaysForMonths(3)[0], []);
  const targetDate = keyToDate(targetKey);
  const scheduled = useMemo(() => getScheduledGroupForDate(churchId, 'sonoplastia', teams.sonoplastia, targetKey), [teams.sonoplastia, targetKey]);
  const remotePresence = church && church.presence && church.presence[targetKey];
  const [presence, setPresence] = useState(() => remotePresence || loadPresence(churchId, targetKey));
  const [status, setStatus] = useState({});
  const [churchLoc, setChurchLoc] = useState(() => (church && church.churchLocation) || loadChurchLocation(churchId));
  const [settingLoc, setSettingLoc] = useState(false);

  const markPresent = (memberId, method, coords) => {
    setPresence(p => {
      const next = { ...p, [memberId]: { method, at: new Date().toISOString(), coords: coords || null } };
      savePresence(churchId, targetKey, next);
      if (docId) fbUpdateChurchFields(docId, { ['presence.' + targetKey]: next });
      if (onUpdateChurch) onUpdateChurch({ presence: { ...(church && church.presence || {}), [targetKey]: next } });
      return next;
    });
  };

  const defineChurchLocation = () => {
    if (!navigator.geolocation) return;
    setSettingLoc(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        saveChurchLocation(churchId, loc);
        setChurchLoc(loc);
        if (docId) fbUpdateChurchFields(docId, { churchLocation: loc });
        if (onUpdateChurch) onUpdateChurch({ churchLocation: loc });
        setSettingLoc(false);
      },
      () => setSettingLoc(false),
      { enableHighAccuracy:true, timeout:10000 }
    );
  };

  const confirmSouEu = (memberId) => {
    if (!navigator.geolocation || !churchLoc) {
      setStatus(s => ({...s, [memberId]: 'Localização da igreja não configurada. Use o computador central.'}));
      return;
    }
    setStatus(s => ({...s, [memberId]: 'Verificando sua localização...'}));
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, churchLoc.lat, churchLoc.lng);
        if (dist <= PRESENCE_RADIUS_M) {
          markPresent(memberId, 'geo', { lat: pos.coords.latitude, lng: pos.coords.longitude, dist: Math.round(dist) });
          setStatus(s => ({...s, [memberId]: null}));
        } else {
          setStatus(s => ({...s, [memberId]: 'Você está a '+Math.round(dist)+'m da igreja — muito longe pra confirmar automático. Use o computador central.'}));
        }
      },
      () => setStatus(s => ({...s, [memberId]: 'Não foi possível acessar sua localização. Use o computador central.'})),
      { enableHighAccuracy:true, timeout:10000 }
    );
  };

  if (scheduled.length === 0) {
    return html`
      <div style=${{maxWidth:'600px', margin:'0 auto', padding:'20px 16px 60px'}}>
        <div style=${{fontSize:'11.5px', color:'var(--text-dim)', marginBottom:'14px'}}>Essa aba é para confirmar presença de quem está escalado na Sonoplastia.</div>
        <div class="glass fade-up" style=${{padding:'24px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'12.5px'}}>Ninguém está escalado na Sonoplastia para ${formatSaturday(targetDate)} ainda.</div>
      </div>
    `;
  }

  const presentCount = scheduled.filter(m => presence[m.id]).length;

  return html`
    <div style=${{maxWidth:'600px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'14px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para confirmar presença de quem está escalado na Sonoplastia.</div>

      ${!churchLoc && html`
        <div class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'16px', display:'grid', gap:'8px'}}>

function SugestoesView({ church }) {
  const [localSuggestions, setLocalSuggestions] = useState(loadSuggestions);
  const [remoteSuggestions, setRemoteSuggestions] = useState(null);
  const [text, setText] = useState('');

  useEffect(() => {
    const unsub = fbListenSuggestions((list) => setRemoteSuggestions(list), church.id);
    return () => { if (typeof unsub === 'function') unsub(); };
  }, [church.id]);

  // Enquanto o Firebase não estiver configurado (ou sem rede), mostra só o que está salvo neste
  // aparelho — igual funcionava antes. Quando conectado, mistura com o que veio de outros aparelhos.
  const mine = useMemo(() => {
    if (!remoteSuggestions) return localSuggestions.filter(s => s.churchId === church.id);
    const remoteLocalIds = new Set(remoteSuggestions.map(r => r.localId).filter(Boolean));
    const localOnly = localSuggestions.filter(s => s.churchId === church.id && !remoteLocalIds.has(s.id));
    const remoteMapped = remoteSuggestions.map(r => ({
      id: r.localId || r.docId, docId: r.docId, churchId: r.churchId, churchName: r.churchName,
      text: r.text, createdAt: r.createdAt, status: r.status, response: r.response, respondedAt: r.respondedAt
    }));
    return [...remoteMapped, ...localOnly];
  }, [remoteSuggestions, localSuggestions, church.id]);
  mine.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  const submit = (e) => {
    e.preventDefault();
    const clean = text.trim();
    if (!clean) return;
    const entry = { id:'sug-'+Date.now(), churchId: church.id, churchName: church.name, text: clean, createdAt: new Date().toISOString(), status:'pending', response:null, respondedAt:null };
    const next = [entry, ...loadSuggestions()];
    saveSuggestions(next);
    setLocalSuggestions(next);
    setText('');
    fbAddSuggestion(entry);
  };

  return html`
    <div style=${{maxWidth:'700px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'16px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para enviar sugestões de melhoria pro desenvolvedor e acompanhar a resposta dele.</div>

      <form onSubmit=${submit} class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
        <textarea placeholder="Descreva sua sugestão de melhoria..." value=${text} onChange=${e=>setText(e.target.value)} rows="3" style=${{...inputStyle, resize:'vertical', fontFamily:'inherit'}}></textarea>
        <button type="submit" style=${{...btnPrimary, width:'auto', justifySelf:'end', padding:'9px 18px'}}>Enviar Sugestão</button>
      </form>

      <div style=${{display:'grid', gap:'8px'}}>
        ${mine.length === 0 && html`<div class="glass fade-up" style=${{padding:'20px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'12.5px'}}>Você ainda não enviou nenhuma sugestão.</div>`}
        ${mine.map((s,i) => html`
          <div key=${s.id} class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'14px', display:'grid', gap:'8px', animationDelay:(i*0.03)+'s'}}>
            <div style=${{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:'10px'}}>
              <div style=${{fontSize:'12.5px', color:'var(--text-hi)'}}>${s.text}</div>
              <span style=${{fontSize:'10px', fontWeight:800, padding:'3px 9px', borderRadius:'999px', whiteSpace:'nowrap', background: s.status==='answered' ? 'color-mix(in srgb, var(--success-1) 20%, transparent)' : 'color-mix(in srgb, var(--highlight) 20%, transparent)', color: s.status==='answered' ? 'var(--success-1)' : 'var(--highlight)'}}>${s.status==='answered' ? 'Respondida' : 'Pendente'}</span>
            </div>
            <div style=${{fontSize:'10px', color:'var(--text-dim)'}}>${new Date(s.createdAt).toLocaleString('pt-BR')}</div>
            ${s.response && html`
              <div style=${{padding:'10px 12px', borderRadius:'10px', background:'rgba(15,23,42,0.4)', fontSize:'12px'}}>
                <div style=${{fontSize:'10px', fontWeight:800, color:'var(--accent-1)', marginBottom:'2px'}}>Resposta do desenvolvedor:</div>
                ${s.response}
              </div>
            `}
          </div>
        `)}
      </div>
    </div>
  `;
}

function ConfiguracoesView({ church, onUpdateChurch }) {
  const [section, setSection] = useState(null);

  /* ---- Dados da igreja ---- */
  const [name, setName] = useState(church.name || '');
  const [city, setCity] = useState(church.city || '');
  const [state, setState] = useState(church.state || '');
  const [address, setAddress] = useState(church.address || '');
  const [division, setDivision] = useState(church.division || '');
  const [union, setUnion] = useState(church.union || '');
  const [association, setAssociation] = useState(church.association || '');
  const [district, setDistrict] = useState(church.district || '');
  const [isDistrictSeat, setIsDistrictSeat] = useState(!!church.isDistrictSeat);
  const [pastorName, setPastorName] = useState(church.pastorName || '');
  const [elderName, setElderName] = useState(church.elderName || '');
  const [ministryLeaders, setMinistryLeaders] = useState(church.ministryLeaders && church.ministryLeaders.length ? church.ministryLeaders : [{ ministry:'', leader:'' }]);
  const [dataSaved, setDataSaved] = useState(false);
  const [logoDataUrl, setLogoDataUrl] = useState(church.logoDataUrl || '');
  const [logoSaving, setLogoSaving] = useState(false);

  const updateLeaderRow = (idx, field, value) => setMinistryLeaders(rows => rows.map((r,i) => i===idx ? {...r, [field]: value} : r));
  const addLeaderRow = () => setMinistryLeaders(rows => [...rows, { ministry:'', leader:'' }]);
  const removeLeaderRow = (idx) => setMinistryLeaders(rows => rows.length > 1 ? rows.filter((_,i)=>i!==idx) : rows);

  const persistChurch = (patch, logDetail) => {
    const db = loadDB();
    const updated = { ...church, ...patch, updatedAt: new Date().toISOString() };
    const next = db.map(c => c.id === church.id ? updated : c);
    saveDB(next);
    pushLog(loadLog(), { type:'atualizacao', churchName: updated.name, churchId: church.id, detail: logDetail });
    // Sincroniza com o banco compartilhado também (antes essa edição ficava só neste aparelho e
    // não aparecia em outros dispositivos da mesma igreja nem no Painel do Desenvolvedor).
    const docId = updated.fbDocId || updated.docId;
    if (docId) fbUpdateChurchFields(docId, patch);
    onUpdateChurch(updated);
    return updated;
  };

  const saveChurchData = (e) => {
    e.preventDefault();
    persistChurch({
      name: name.trim(), city: city.trim(), state: state.trim(), address: address.trim(),
      division: division.trim(), union: union.trim(),
      association: association.trim(), district: district.trim(), isDistrictSeat,
      pastorName: pastorName.trim(), elderName: elderName.trim(),
      ministryLeaders: ministryLeaders.filter(r => r.ministry.trim() || r.leader.trim()),
    }, 'Dados da igreja atualizados');
    setDataSaved(true);
    setTimeout(()=>setDataSaved(false), 2200);
  };

  /* ---- Logo (aparece por cima da projeção da Bíblia Sagrada) ---- */
  const handleLogoUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setLogoSaving(true);
    try {
      const dataUrl = await readLogoFileSmart(file);
      setLogoDataUrl(dataUrl);
      persistChurch({ logoDataUrl: dataUrl }, 'Logo da igreja atualizada');
    } catch (err) {
      alert('Erro ao carregar a logo: ' + (err && err.message ? err.message : err));
    } finally {
      setLogoSaving(false);
    }
  };
  const removeLogo = () => {
    setLogoDataUrl('');
    persistChurch({ logoDataUrl: '' }, 'Logo da igreja removida');
  };

  /* ---- Senha ---- */
  const [curPass, setCurPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [passError, setPassError] = useState('');
  const [passSaved, setPassSaved] = useState(false);
  const savePassword = (e) => {
    e.preventDefault();
    setPassError('');
    if (curPass !== church.password) { setPassError('Senha atual incorreta.'); return; }
    if (!newPass.trim() || newPass.length < 4) { setPassError('A nova senha deve ter no mínimo 4 caracteres.'); return; }
    if (newPass !== confirmPass) { setPassError('As senhas novas não conferem.'); return; }
    persistChurch({ password: newPass }, 'Senha alterada pela igreja');
    setCurPass(''); setNewPass(''); setConfirmPass('');
    setPassSaved(true);
    setTimeout(()=>setPassSaved(false), 2200);
  };

  /* ---- Palavra de recuperação ---- */
  const [recQuestion, setRecQuestion] = useState(church.recoveryQuestion || '');
  const [recAnswer, setRecAnswer] = useState('');
  const [recError, setRecError] = useState('');
  const [recSaved, setRecSaved] = useState(false);

    setRecError('');

  /* ---- Cores do tema ---- */
  const [theme, setTheme] = useState(loadTheme);

            <label style=${{...btnGhost, padding:'8px 14px', fontSize:'11.5px', cursor:'pointer'}}>

          <div style=${{fontSize:'10.5px', color:'var(--text-dim)', marginTop:'-4px'}}>Essa logo aparece junto com o versículo quando você projeta um texto pela ferramenta "📖 Bíblia Sagrada" (em Ferramentas).</div>
