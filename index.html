              `;
            })}
          </div>
        </div>

        ${enabled.length > 0 && html`
          <div>
            <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'16px 0 10px 0'}}>Transmitir</h3>
            <div style=${{display:'grid', gap:'12px'}}>
              ${enabled.map(scr => {
                const sig = screenSig(scr);
                const choice = choices[sig] || { type:'blank' };
                return html`
                  <div key=${sig} class="glass fade-up" style=${{padding:'14px', borderRadius:'14px', display:'grid', gap:'8px'}}>
                    <div style=${{fontWeight:700, fontSize:'12.5px'}}>${scr.label}${scr.isProjector ? ' 📽️' : ''}</div>
                    <select value=${choice.type} onChange=${e=>setChoice(sig, {type:e.target.value})} style=${{...inputStyle, fontSize:'12px'}}>
                      <option value="blank">⬛ Tela Preta</option>
                      <option value="media">🎬 Vídeo/Música da Liturgia</option>
                      <option value="texto">🔤 Texto Personalizado</option>
                    </select>
                    ${choice.type === 'media' && html`
                      <select value=${choice.mediaIdx ?? ''} onChange=${e=>setChoice(sig, {mediaIdx: Number(e.target.value)})} style=${{...inputStyle, fontSize:'12px'}}>
                        <option value="">${mediaOptions.length ? '(escolher)' : 'Nenhum vídeo/música anexado na liturgia ainda'}</option>
                        ${mediaOptions.map((m,i) => html`<option key=${i} value=${i}>${m.label}</option>`)}
                      </select>
                    `}
                    ${choice.type === 'texto' && html`
                      <input placeholder="Texto a exibir" value=${choice.text||''} onChange=${e=>setChoice(sig, {text:e.target.value})} style=${{...inputStyle, fontSize:'12px'}} />
                    `}
                    <button onClick=${()=>sendToScreen(scr, sig)} style=${{...btnPrimary, width:'auto', justifySelf:'start', padding:'8px 16px'}}>📤 Enviar para esta Tela</button>
                  </div>
                `;
              })}
            </div>
          </div>
        `}
      `}
    </div>
  `;
}

function ytPostCommand(win, func, args) {
  if (!win) return;
  try { win.postMessage(JSON.stringify({ event:'command', func, args: args || [] }), '*'); } catch(e) {}
}

// Sugestões de busca em tempo real (texto), pelo mesmo serviço que alimenta a caixinha de busca do
// próprio youtube.com — é do Google, super confiável e não usa fetch (usa JSONP, que não esbarra em CORS).
// Essa é a base garantida da busca em tempo real.
function fetchYoutubeSuggestions(query, callback) {
  try {
    const cbName = '__ytSuggest_' + Math.random().toString(36).slice(2);
    let done = false;
    const cleanup = () => { try { delete window[cbName]; } catch(e) {} if (script.parentNode) script.parentNode.removeChild(script); };
    const finish = (list) => { if (done) return; done = true; callback(list); cleanup(); };
    window[cbName] = (data) => {
      let list = [];
      try { list = (data && data[1]) ? data[1].map(x => Array.isArray(x) ? x[0] : x).filter(Boolean) : []; } catch(e) {}
      finish(list);
    };
    const script = document.createElement('script');
    script.src = 'https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=' + encodeURIComponent(query) + '&callback=' + cbName;
    script.onerror = () => finish([]);
    document.body.appendChild(script);
    setTimeout(() => finish([]), 4000); // trava de segurança caso a rede nunca responda
  } catch(e) { callback([]); }
}

// Busca de vídeo de verdade (com miniatura, canal, duração) via servidor próprio — só funciona quando
// este arquivo está hospedado junto com o backend Express (rota /api/search-weekly-videos). Dentro do
// Claude, ou em uma hospedagem só estática, essa chamada falha rápido e quem chamou cai no modo
// simples (sugestão de texto + colar link).
async function searchYoutubeServer(query) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch('/api/search-weekly-videos?q=' + encodeURIComponent(query), { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    const data = await res.json();
    return Array.isArray(data.videos) ? data.videos : null;
  } catch (e) { return null; } // sem backend, sem rede, ou bloqueado — retorna null pra cair no fallback
}

// O YouTube não permite (por política própria) que um site como este busque vídeos automaticamente
// sem um servidor próprio. Por isso o caminho aqui é o mais simples e confiável possível: sugestão de
// texto em tempo real (JSONP, do próprio Google) + um clique abre a busca de verdade no youtube.com +
// colar o link do vídeo escolhido de volta aqui.
function BackgroundAudioMixer() {
  const [tracks, setTracks] = useState([
    { name:'Fundo 1', mode:'none', fileName:'', videoId:null, playing:false, volume:60, search:'', link:'', suggestions:[], suggestOpen:false, searching:false },
    { name:'Fundo 2', mode:'none', fileName:'', videoId:null, playing:false, volume:60, search:'', link:'', suggestions:[], suggestOpen:false, searching:false },
    { name:'Fundo 3', mode:'none', fileName:'', videoId:null, playing:false, volume:60, search:'', link:'', suggestions:[], suggestOpen:false, searching:false },
  ]);
  const audioRefs = [useRef(null), useRef(null), useRef(null)];
  const iframeRefs = [useRef(null), useRef(null), useRef(null)];
  const fileInputRefs = [useRef(null), useRef(null), useRef(null)];
  const debounceRefs = [useRef(null), useRef(null), useRef(null)];

  const updateTrack = (i, patch) => setTracks(list => list.map((t,idx)=>idx===i?{...t,...patch}:t));

  const runSearch = (i, q) => {
    if (debounceRefs[i].current) clearTimeout(debounceRefs[i].current);
    if (q.length < 2) { updateTrack(i, { suggestions:[], suggestOpen:false, searching:false }); return; }
    updateTrack(i, { searching:true });
    fetchYoutubeSuggestions(q, (list) => {
      setTracks(cur => cur.map((t,idx) => {
        if (idx !== i) return t;
        if (t.search.trim() !== q) return t; // usuário já digitou outra coisa
        return { ...t, suggestions:list, suggestOpen: list.length>0, searching:false };
      }));
    });
  };

  const onSearchChange = (i, val) => {
    updateTrack(i, { search: val });
    if (debounceRefs[i].current) clearTimeout(debounceRefs[i].current);
    const q = val.trim();
    if (q.length < 2) { updateTrack(i, { suggestions:[], suggestOpen:false, searching:false }); return; }
    debounceRefs[i].current = setTimeout(() => runSearch(i, q), 400);
  };

  const onSearchEnter = (i) => {
    const q = tracks[i].search.trim();
    if (q) window.open(youtubeSearchUrl(q), '_blank', 'noopener');
  };

  const pickTextSuggestion = (i, text) => {
    updateTrack(i, { search:text, suggestOpen:false });
    window.open(youtubeSearchUrl(text), '_blank', 'noopener');
  };

  const pickFile = (i) => { fileInputRefs[i].current && fileInputRefs[i].current.click(); };

  const onFileChosen = (i, e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    updateTrack(i, { mode:'file', videoId:null });
    const url = URL.createObjectURL(file);
    const el = audioRefs[i].current;
    if (el) {
      el.src = url;
      el.loop = true;
      el.volume = tracks[i].volume / 100;
      el.play().then(() => updateTrack(i, { fileName: file.name, playing:true }))
               .catch(() => updateTrack(i, { fileName: file.name, playing:false }));
    }
    e.target.value = '';
  };

  const useYoutubeLink = (i) => {
    const id = extractYouTubeId((tracks[i].link || '').trim());
    if (!id) { alert('Não consegui reconhecer esse link do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    const audioEl = audioRefs[i].current;
    if (audioEl) { audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }
    updateTrack(i, { mode:'youtube', videoId:id, fileName:'', playing:true, link:'' });
  };

  const togglePlay = (i) => {
    const t = tracks[i];
    if (t.mode === 'file') {
      const el = audioRefs[i].current;
      if (!el || !el.src) { alert('Carregue um arquivo de áudio primeiro.'); return; }
      if (el.paused) { el.play().catch(()=>{}); updateTrack(i, { playing:true }); }
      else { el.pause(); updateTrack(i, { playing:false }); }
    } else if (t.mode === 'youtube') {
      const frame = iframeRefs[i].current;
      if (!frame) { alert('Cole um link do YouTube primeiro.'); return; }
      if (t.playing) { ytPostCommand(frame.contentWindow, 'pauseVideo'); updateTrack(i, { playing:false }); }
      else { ytPostCommand(frame.contentWindow, 'playVideo'); updateTrack(i, { playing:true }); }
    } else {
      alert('Carregue um arquivo de áudio ou cole um link do YouTube primeiro.');
    }
  };

  const stopTrack = (i) => {
    const t = tracks[i];
    if (t.mode === 'file') {
      const el = audioRefs[i].current;
      if (el) { el.pause(); el.removeAttribute('src'); el.load(); }
    } else if (t.mode === 'youtube') {
      const frame = iframeRefs[i].current;
      if (frame && frame.contentWindow) ytPostCommand(frame.contentWindow, 'stopVideo');
    }
    updateTrack(i, { mode:'none', fileName:'', videoId:null, playing:false });
  };

  const setVolume = (i, rawVal) => {
    const newVal = Math.max(0, Math.min(100, Number(rawVal)));
    setTracks(prev => {
      const next = prev.map(t => ({...t}));
      const delta = newVal - next[i].volume;
      next[i].volume = newVal;
      if (delta > 0) {
        const others = [0,1,2].filter(idx => idx !== i);
        const othersSum = others.reduce((s,idx) => s + next[idx].volume, 0);
        if (othersSum > 0) {
          others.forEach(idx => {
            const share = next[idx].volume / othersSum;
            next[idx].volume = Math.max(0, Math.round(next[idx].volume - delta * share));
          });
        }
      }
      return next;
    });
  };

  // Mantém o volume real (arquivo local ou player do YouTube) sincronizado sempre que muda
  useEffect(() => {
    tracks.forEach((t, i) => {
      if (t.mode === 'file') {
        const el = audioRefs[i].current;
        if (el) el.volume = t.volume / 100;
      } else if (t.mode === 'youtube') {
        const frame = iframeRefs[i].current;
        if (frame && frame.contentWindow) {
          ytPostCommand(frame.contentWindow, 'setVolume', [t.volume]);
          ytPostCommand(frame.contentWindow, t.volume === 0 ? 'mute' : 'unMute');
        }
      }
    });
  }, [tracks]);

  const onIframeLoad = (i) => {
    // dá um tempinho pro player do YouTube inicializar antes de mandar comandos
    setTimeout(() => {
      const frame = iframeRefs[i].current;
      if (!frame || !frame.contentWindow) return;
      ytPostCommand(frame.contentWindow, 'unMute');
      ytPostCommand(frame.contentWindow, 'setVolume', [tracks[i].volume]);
      ytPostCommand(frame.contentWindow, 'playVideo');
    }, 900);
  };

  return html`
    <div style=${{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:'8px', marginBottom:'10px'}}>
      ${tracks.map((t,i) => html`
        <div key=${i} class="glass fade-up" style=${{padding:'10px', borderRadius:'14px', display:'grid', gap:'6px'}}>
          <input value=${t.name} onChange=${e=>updateTrack(i,{name:e.target.value})} style=${{...inputStyle, fontSize:'11px', padding:'6px 8px', fontWeight:700}} />
          <div style=${{fontSize:'9.5px', color:'var(--text-dim)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
            ${t.mode === 'file' ? '🎵 '+t.fileName : t.mode === 'youtube' ? '▶️ Vídeo do YouTube tocando' : 'Nenhum áudio carregado'}
          </div>

          <input type="file" accept="audio/*" ref=${fileInputRefs[i]} style=${{display:'none'}} onChange=${e=>onFileChosen(i,e)} />
          <audio ref=${audioRefs[i]} />
          ${t.mode === 'youtube' && t.videoId && html`
            <iframe
              key=${t.videoId}
              ref=${iframeRefs[i]}
              src=${'https://www.youtube.com/embed/'+t.videoId+'?enablejsapi=1&autoplay=1&loop=1&playlist='+t.videoId+'&controls=0'}
              allow="autoplay; encrypted-media"
              onLoad=${()=>onIframeLoad(i)}
              style=${{width:'1px', height:'1px', opacity:0, position:'absolute', pointerEvents:'none'}}
            ></iframe>
          `}

          <div style=${{display:'flex', gap:'6px'}}>
            <button type="button" onClick=${()=>pickFile(i)} style=${{...btnGhost, padding:'6px 8px', fontSize:'10px', flex:1}}>📁 Arquivo</button>
            <button type="button" onClick=${()=>togglePlay(i)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px'}}>${t.playing ? '⏸' : '▶'}</button>
            <button type="button" onClick=${()=>stopTrack(i)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px'}}>⏹</button>
          </div>

          <div style=${{position:'relative', zIndex: t.suggestOpen ? 300 : 'auto'}}>
            <input
              placeholder="Buscar no YouTube e apertar Enter..." value=${t.search}
              onChange=${e=>onSearchChange(i, e.target.value)}
              onFocus=${()=>{ if (t.suggestions.length>0) updateTrack(i,{suggestOpen:true}); }}
              onBlur=${()=>setTimeout(()=>updateTrack(i,{suggestOpen:false}), 150)}
              onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); onSearchEnter(i); } if(e.key==='Escape'){ updateTrack(i,{suggestOpen:false}); } }}
              style=${{...inputStyle, fontSize:'10.5px', padding:'6px 8px', width:'100%'}}
            />
            ${t.searching && html`<div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Buscando...</div>`}
            ${!t.searching && t.suggestOpen && t.suggestions.length === 0 && t.search.trim().length >= 2 && html`
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Nenhuma sugestão pra essa palavra-chave. Aperte Enter pra buscar direto no YouTube.</div>
            `}
            ${t.suggestOpen && t.suggestions.length > 0 && html`
              <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, borderRadius:'10px', padding:'4px', display:'grid', gap:'2px', maxHeight:'220px', overflowY:'auto', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
                <div style=${{fontSize:'9px', color:'var(--text-dim)', padding:'2px 4px'}}>Toque pra abrir a busca no YouTube:</div>
                ${t.suggestions.map((s,si) => html`
                  <button key=${si} type="button" onMouseDown=${e=>e.preventDefault()} onClick=${()=>pickTextSuggestion(i, s)} style=${{textAlign:'left', padding:'6px 8px', borderRadius:'7px', border:'none', background:'transparent', color:'var(--text-mid)', fontSize:'11px'}}>🔎 ${s}</button>
                `)}
              </div>
            `}
          </div>
          <div style=${{display:'flex', gap:'4px'}}>
            <input placeholder="ou colar link do vídeo" value=${t.link} onChange=${e=>updateTrack(i,{link:e.target.value})} onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); useYoutubeLink(i); } }} style=${{...inputStyle, fontSize:'10.5px', padding:'6px 8px', flex:1}} />
            <button type="button" onClick=${()=>useYoutubeLink(i)} style=${{...btnGhost, padding:'6px 8px', fontSize:'10.5px'}}>✅</button>
          </div>

          <input type="range" min="0" max="100" value=${t.volume} onChange=${e=>setVolume(i, e.target.value)} style=${{width:'100%'}} />
          <div style=${{fontSize:'10px', color:'var(--text-dim)', textAlign:'center'}}>🔊 ${t.volume}%</div>
        </div>
      `)}
    </div>
  `;
}

// Modo Ao Vivo: uma tela em foco total pro operador seguir durante o culto de verdade — mostra só a
// etapa atual (bem grande) e a próxima, com um botão único e óbvio pra avançar. Sem distração, sem menu.
function CultoLiveMode({ activities, sections, churchId, onAdvance, onClose, onOpenFinalize }) {
  const ordered = useMemo(() => sections.flatMap(sec => activities.filter(a => a.section === sec)), [activities, sections]);
  const firstPending = ordered.findIndex(a => !a.done);
  const [idx, setIdx] = useState(firstPending === -1 ? 0 : firstPending);

  const current = ordered[idx];
  const next = ordered[idx+1];
  const isLast = idx >= ordered.length - 1;

  if (!current) {
    return html`
      <div style=${{position:'fixed', inset:0, background:'var(--bg-1, #0b1120)', zIndex:200, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'16px', padding:'24px', textAlign:'center'}}>
        <div style=${{fontSize:'40px'}}>📋</div>
        <div style=${{fontWeight:800, fontSize:'18px'}}>Nenhuma atividade cadastrada ainda</div>
        <button onClick=${onClose} style=${{...btnGhost, padding:'12px 24px'}}>Fechar</button>
      </div>
    `;
  }

  const goNext = () => {
    onAdvance(current.id);
    if (isLast) { onOpenFinalize(); return; }
    setIdx(i => Math.min(i+1, ordered.length-1));
  };
  const goBack = () => setIdx(i => Math.max(i-1, 0));

  return html`
    <div style=${{position:'fixed', inset:0, background:'var(--bg-1, #0b1120)', zIndex:200, display:'flex', flexDirection:'column', padding:'20px 16px', overflowY:'auto'}}>
      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'18px'}}>
        <div style=${{fontSize:'11.5px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.05em'}}>
          Etapa ${idx+1} de ${ordered.length} • ${SECTION_LABELS[current.section]}
        </div>
        <button onClick=${onClose} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'20px', padding:'4px 8px'}} title="Sair do Modo Ao Vivo">✕</button>
      </div>

      <div style=${{width:'100%', height:'6px', borderRadius:'999px', background:'rgba(148,163,184,0.18)', overflow:'hidden', marginBottom:'24px'}}>
        <div style=${{width: ((idx)/ordered.length*100)+'%', height:'100%', background:'linear-gradient(90deg,var(--success-1),var(--success-2))', transition:'width .3s'}}></div>
      </div>

      <div style=${{flex:1, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', textAlign:'center', gap:'18px'}}>
        <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.08em'}}>Agora</div>
        <div style=${{fontSize:'56px', lineHeight:1}}>${CATEGORY_ICON[current.category] || '📌'}</div>
        <div style=${{fontWeight:900, fontSize:'28px', lineHeight:1.2, maxWidth:'560px'}}>${current.name}</div>
        <div style=${{fontSize:'15px', color:'var(--text-mid)', fontWeight:600}}>${current.responsible}${current.time && current.time !== '--:--' ? ' • ' + current.time : ''}</div>
        ${current.media && current.media.title && html`
          <div style=${{display:'flex', flexDirection:'column', alignItems:'center', gap:'8px', marginTop:'4px'}}>
            <div style=${{fontSize:'12.5px', color:'var(--text-mid)'}}>🎬 ${current.media.title}</div>
            <${ProjectButton} churchId=${churchId} media=${current.media} />
          </div>
        `}

        ${next && html`
          <div class="glass fade-up" style=${{marginTop:'28px', padding:'12px 20px', borderRadius:'14px', display:'flex', alignItems:'center', gap:'10px', maxWidth:'420px'}}>
            <span style=${{fontSize:'10.5px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase'}}>A seguir</span>
            <span style=${{fontSize:'18px'}}>${CATEGORY_ICON[next.category] || '📌'}</span>
            <span style=${{fontWeight:700, fontSize:'13px'}}>${next.name}</span>
          </div>
        `}
        ${!next && html`
          <div style=${{marginTop:'28px', fontSize:'12.5px', color:'var(--text-dim)'}}>Última etapa do culto 🎉</div>
        `}
      </div>

      <div style=${{display:'grid', gridTemplateColumns: idx>0 ? '1fr 2fr' : '1fr', gap:'10px', marginTop:'20px', maxWidth:'560px', width:'100%', marginLeft:'auto', marginRight:'auto'}}>
        ${idx>0 && html`<button onClick=${goBack} style=${{...btnGhost, padding:'16px', fontSize:'14px'}}>◀ Voltar</button>`}
        <button onClick=${goNext} style=${{...btnPrimary, padding:'16px', fontSize:'16px', fontWeight:800}}>
          ${isLast ? '✅ Finalizar Culto' : 'PRÓXIMO ▶'}
        </button>
      </div>
    </div>
  `;
}

function LiturgiaView({ churchId, churchName }) {
  const [activities, setActivities] = useState(() => loadActivities(churchId));
  const [adding, setAdding] = useState(false);
  const [finalizeOpen, setFinalizeOpen] = useState(false);

  useEffect(() => saveActivities(churchId, activities), [activities, churchId]);

  // Atualiza sozinho o link de itens dinâmicos (Provai e Vede / Informativo) e completa quem ainda não tem
  useEffect(() => {
    setActivities(list => {
      let changed = false;
      const next = list.map(a => {
        if (a.media && a.media.dynamic) {
          const lib = MEDIA_LIBRARY.find(m => m.title === a.media.libTitle);
          if (lib) {
            const freshUrl = mediaLibraryUrl(lib);
            if (freshUrl !== a.media.url || lib.playlistId !== a.media.playlistId) {
              changed = true;
              return { ...a, media: { ...a.media, url: freshUrl, playlistId: lib.playlistId || null } };
            }
          }
          return a;
        }
        // Completa automaticamente quem ainda não tem mídia nenhuma (liturgias salvas antes dessa função existir)
        if (!a.media) {
          let lib = null;
          if (a.id === 'a5' || a.name.toLowerCase().includes('informativo mundial')) lib = MEDIA_LIBRARY.find(m => m.title === 'Informativo Mundial das Missões');
          else if (a.id === 'b3' || a.name.toLowerCase().includes('provai e vede')) lib = MEDIA_LIBRARY.find(m => m.title === 'Provai e Vede - Vídeo Oficial');
          if (lib) {
            changed = true;
            return { ...a, media: { title: lib.title, url: mediaLibraryUrl(lib), dynamic:true, libTitle: lib.title, playlistId: lib.playlistId || null } };
          }
        }
        return a;
      });
      return changed ? next : list;
    });
  }, [churchId]);

/* ============ ESCALA AUTOMÁTICA (3 meses, editável, com datas extras) ============ */

const SCHEDULE_EPOCH = new Date('2024-01-06T00:00:00'); // um sábado de referência

function getSaturdaysForMonths(months) {
  const today = new Date();
  const result = [];
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const daysUntilSaturday = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + (daysUntilSaturday === 0 ? 0 : daysUntilSaturday));
  const limit = new Date(today.getFullYear(), today.getMonth() + months, today.getDate());
  while (d <= limit) {
    result.push(dateKey(new Date(d)));
    d.setDate(d.getDate() + 7);
  }
  return result;
}
function dateKey(date) {
  const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2,'0'), d = String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}
function keyToDate(key) {
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
function weeksSinceEpoch(date) {
  return Math.round((date - SCHEDULE_EPOCH) / (7 * 24 * 60 * 60 * 1000));
}
function formatSaturday(date) {
  return date.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}
function autoGroupForDate(dateKeyStr, teamKey, validMembers, groupSize) {
  if (validMembers.length === 0) return [];
  const n = validMembers.length;
  const size = Math.max(1, Math.min(groupSize || 2, n));
  const w = weeksSinceEpoch(keyToDate(dateKeyStr)) + (teamKey ? teamKey.length : 0);
  const result = [];
  const usedIdx = new Set();
  for (let i = 0; i < size; i++) {
    const idx = ((w + i) % n + n) % n;
    if (!usedIdx.has(idx)) { usedIdx.add(idx); result.push(validMembers[idx]); }
  }
  return result;
}

function scheduleStoreKey(churchId, teamKey) { return 'gc_schedule_' + churchId + '_' + teamKey; }
function loadSchedule(churchId, teamKey) {
  try { const raw = localStorage.getItem(scheduleStoreKey(churchId, teamKey)); if (raw) return JSON.parse(raw); } catch(e) {}
  return { overrides:{}, extraDates:[], groupSize:2 };
}
function saveSchedule(churchId, teamKey, data) {
  try { localStorage.setItem(scheduleStoreKey(churchId, teamKey), JSON.stringify(data)); } catch(e) {}
}
function getScheduledGroupForDate(churchId, teamKey, allMembers, dKey) {
  const validMembers = allMembers.filter(m => m.name && m.name.trim());
  const sched = loadSchedule(churchId, teamKey);
  const groupSize = sched.groupSize || 2;
  const auto = autoGroupForDate(dKey, teamKey, validMembers, groupSize);
  const ov = sched.overrides[dKey];
  if (!ov) return auto;
  return Array.from({length: groupSize}, (_, i) => {
    const id = ov[i];
    return id ? (validMembers.find(m=>m.id===id) || auto[i]) : auto[i];
  }).filter(Boolean);
}

function presenceStoreKey(churchId, dKey) { return 'gc_presenca_sonoplastia_' + churchId + '_' + dKey; }
function loadPresence(churchId, dKey) {

  return {};
}

}

function AutoSchedule({ churchId, teamKey, members, reminderTemplateForDate }) {
  const validMembers = members.filter(m => m.name && m.name.trim());
  const [sched, setSched] = useState(() => loadSchedule(churchId, teamKey));
  const [showAddDate, setShowAddDate] = useState(false);
  const [newDate, setNewDate] = useState('');
  const [newLabel, setNewLabel] = useState('');
  const groupSize = sched.groupSize || 2;

  useEffect(() => saveSchedule(churchId, teamKey, sched), [sched, churchId, teamKey]);

  const todayKey = dateKey(new Date());
  const regularKeys = useMemo(() => getSaturdaysForMonths(3), []);
  const extraKeys = sched.extraDates.map(e => e.date);
  const allKeys = Array.from(new Set([...regularKeys, ...extraKeys])).filter(k => k >= todayKey).sort();

  const labelFor = (k) => { const ex = sched.extraDates.find(e => e.date === k); return ex ? ex.label : 'Sábado'; };
  const isExtra = (k) => sched.extraDates.some(e => e.date === k);

  const groupFor = (k) => {
    const auto = autoGroupForDate(k, teamKey, validMembers, groupSize);
    const ov = sched.overrides[k]; // [id0, id1, ...] | undefined
    if (!ov) return auto;
    return Array.from({length: groupSize}, (_, i) => {
      const id = ov[i];
      return id ? (validMembers.find(m=>m.id===id) || auto[i]) : auto[i];
    }).filter(Boolean);
  };

  const setGroupSize = (n) => {
    const size = Math.max(1, Math.min(6, n));
    setSched(s => ({ ...s, groupSize: size }));
  };
  const setOverrideSlot = (k, slot, memberId) => {
    setSched(s => {
      const cur = s.overrides[k] || [];
      const next = [...cur];
      next[slot] = memberId === '__auto__' ? null : memberId;
      const overrides = { ...s.overrides, [k]: next };
      if (next.every(v => !v)) delete overrides[k];
      return { ...s, overrides };
    });
  };
  const addExtraDate = (e) => {
    e.preventDefault();
    if (!newDate) return;
    setSched(s => ({ ...s, extraDates: [...s.extraDates.filter(x=>x.date!==newDate), { date:newDate, label: newLabel.trim() || 'Data Especial' }] }));
    setNewDate(''); setNewLabel(''); setShowAddDate(false);
  };
  const removeExtraDate = (k) => {
    setSched(s => { const overrides = {...s.overrides}; delete overrides[k]; return { ...s, extraDates: s.extraDates.filter(e => e.date !== k), overrides }; });
  };

  if (validMembers.length === 0) {
    return html`<div class="glass fade-up" style=${{padding:'16px', borderRadius:'14px', fontSize:'11.5px', color:'var(--text-dim)', textAlign:'center'}}>Cadastre pelo menos um membro para gerar a escala automática.</div>`;
  }

  return html`
    <div style=${{display:'grid', gap:'10px'}}>
      <div class="glass fade-up" style=${{padding:'10px 14px', borderRadius:'12px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'8px'}}>
        <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>Pessoas por escala:</div>
        <div style=${{display:'flex', alignItems:'center', gap:'8px'}}>
          <button type="button" onClick=${()=>setGroupSize(groupSize-1)} style=${{...btnGhost, width:'30px', height:'30px', padding:0, borderRadius:'50%'}}>−</button>
          <span style=${{fontWeight:800, fontSize:'14px', minWidth:'18px', textAlign:'center'}}>${groupSize}</span>
          <button type="button" onClick=${()=>setGroupSize(groupSize+1)} style=${{...btnGhost, width:'30px', height:'30px', padding:0, borderRadius:'50%'}}>+</button>
        </div>
      </div>

      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Próximos 3 meses • ${allKeys.length} datas • ${groupSize} por escala</div>
        <button onClick=${()=>setShowAddDate(v=>!v)} style=${btnGhost}>+ Data Especial</button>
      </div>

      ${showAddDate && html`
        <form onSubmit=${addExtraDate} class="glass fade-up" style=${{padding:'12px', borderRadius:'12px', display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:'8px', alignItems:'center'}}>
          <input type="date" value=${newDate} onChange=${e=>setNewDate(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} required />
          <input placeholder="Ex: Semana de Oração" value=${newLabel} onChange=${e=>setNewLabel(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
          <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 14px'}}>Adicionar</button>
        </form>
      `}

      <div style=${{display:'grid', gap:'8px'}}>
        ${allKeys.map((k, i) => {
          const sat = keyToDate(k);
          const group = groupFor(k);
          const ov = sched.overrides[k] || [];
          const isNext = i === 0;
          const extra = isExtra(k);
          return html`
            <div key=${k} class="glass fade-up" style=${{padding:'11px 14px', borderRadius:'12px', display:'grid', gap:'8px', border: isNext ? '1.5px solid var(--accent-1)' : extra ? '1px solid var(--highlight)' : '1px solid var(--border-soft)'}}>
              <div style=${{display:'flex', alignItems:'center', gap:'10px'}}>
                <div style=${{width:'42px', textAlign:'center', flexShrink:0}}>
                  <div style=${{fontSize:'10px', fontWeight:800, color: isNext ? 'var(--accent-1)' : 'var(--text-dim)', textTransform:'uppercase'}}>${formatSaturday(sat).split(' ')[1]}</div>
                  <div style=${{fontSize:'15px', fontWeight:800}}>${formatSaturday(sat).split(' ')[0]}</div>
                </div>
                <div style=${{flex:1}}>
                  <div style=${{fontSize:'13px', fontWeight:700}}>${group.length ? group.map(m=>m.name).join(' + ') : '—'}</div>
                  <div style=${{fontSize:'10.5px', color: extra ? 'var(--highlight)' : 'var(--text-mid)'}}>${labelFor(k)}</div>
                </div>
                ${extra && html`<button onClick=${()=>removeExtraDate(k)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'15px'}}>✕</button>`}
              </div>

              ${Array.from({length: groupSize}, (_, i) => i).map(slot => html`
                <div key=${slot} style=${{display:'flex', gap:'6px', alignItems:'center'}}>
                  <select value=${ov[slot] || '__auto__'} onChange=${e=>setOverrideSlot(k, slot, e.target.value)} style=${{...inputStyle, padding:'6px 10px', fontSize:'11.5px', flex:1}}>
                    <option value="__auto__">🔄 Automático (pessoa ${slot+1})</option>
                    ${validMembers.map(m => html`<option key=${m.id} value=${m.id}>${m.name}${m.function ? ' — '+m.function : ''}</option>`)}
                  </select>
                  <a
                    href=${group[slot] && group[slot].whatsapp ? waLink(group[slot].whatsapp, reminderTemplateForDate(group[slot], sat, labelFor(k))) : undefined}
                    target="_blank" rel="noopener"
                    style=${{...btnGhost, padding:'6px 9px', fontSize:'10.5px', textDecoration:'none', opacity: group[slot] && group[slot].whatsapp ? 1 : 0.4, pointerEvents: group[slot] && group[slot].whatsapp ? 'auto' : 'none'}}
                  >💬</a>
                </div>
              `)}
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

/* ============ ESCALA POR EQUIPE (Louvor) + Mensagem Musical editável ============ */

function autoTeamForDate(dateKeyStr, teams) {
  if (!teams || teams.length === 0) return null;
  const w = weeksSinceEpoch(keyToDate(dateKeyStr));
  return teams[((w % teams.length) + teams.length) % teams.length];
}

function AutoScheduleTeams({ churchId, louvorTeams }) {
  const scheduleId = 'louvor_equipes';
  const [sched, setSched] = useState(() => loadSchedule(churchId, scheduleId));
  const [showAddDate, setShowAddDate] = useState(false);
  const [newDate, setNewDate] = useState('');
  const [newLabel, setNewLabel] = useState('');

  useEffect(() => saveSchedule(churchId, scheduleId, sched), [sched, churchId]);

  const todayKey = dateKey(new Date());
  const regularKeys = useMemo(() => getSaturdaysForMonths(3), []);
  const extraKeys = sched.extraDates.map(e => e.date);
  const allKeys = Array.from(new Set([...regularKeys, ...extraKeys])).filter(k => k >= todayKey).sort();

  const labelFor = (k) => { const ex = sched.extraDates.find(e => e.date === k); return ex ? ex.label : 'Sábado'; };
  const isExtra = (k) => sched.extraDates.some(e => e.date === k);

  const teamFor = (k) => {
    const auto = autoTeamForDate(k, louvorTeams);
    const ovId = sched.overrides[k];
    if (!ovId) return auto;
    return louvorTeams.find(t => t.id === ovId) || auto;
  };
  const setOverride = (k, teamId) => {
    setSched(s => { const overrides = {...s.overrides}; if (teamId === '__auto__') delete overrides[k]; else overrides[k] = teamId; return { ...s, overrides }; });
  };
  const setSpecialMusic = (k, text) => {
    setSched(s => ({ ...s, specialMusic: { ...(s.specialMusic||{}), [k]: text } }));
  };
  const addExtraDate = (e) => {
    e.preventDefault();
    if (!newDate) return;
    setSched(s => ({ ...s, extraDates: [...s.extraDates.filter(x=>x.date!==newDate), { date:newDate, label: newLabel.trim() || 'Data Especial' }] }));
    setNewDate(''); setNewLabel(''); setShowAddDate(false);
  };
  const removeExtraDate = (k) => {
    setSched(s => { const overrides = {...s.overrides}; delete overrides[k]; return { ...s, extraDates: s.extraDates.filter(e => e.date !== k), overrides }; });
  };

  if (!louvorTeams || louvorTeams.length === 0) {
    return html`<div class="glass fade-up" style=${{padding:'16px', borderRadius:'14px', fontSize:'11.5px', color:'var(--text-dim)', textAlign:'center'}}>Crie pelo menos uma equipe de louvor para gerar a escala.</div>`;
  }

  return html`
    <div style=${{display:'grid', gap:'10px'}}>
      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Próximos 3 meses • rotação entre equipes</div>
        <button onClick=${()=>setShowAddDate(v=>!v)} style=${btnGhost}>+ Data Especial</button>
      </div>

      ${showAddDate && html`
        <form onSubmit=${addExtraDate} class="glass fade-up" style=${{padding:'12px', borderRadius:'12px', display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:'8px', alignItems:'center'}}>
          <input type="date" value=${newDate} onChange=${e=>setNewDate(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} required />
          <input placeholder="Ex: Semana de Oração" value=${newLabel} onChange=${e=>setNewLabel(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
          <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 14px'}}>Adicionar</button>
        </form>
      `}

      <div style=${{display:'grid', gap:'8px'}}>
        ${allKeys.map((k, i) => {
          const sat = keyToDate(k);
          const team = teamFor(k);
          const isNext = i === 0;
          const extra = isExtra(k);
          const music = (sched.specialMusic && sched.specialMusic[k]) || '';
          return html`
            <div key=${k} class="glass fade-up" style=${{padding:'11px 14px', borderRadius:'12px', display:'grid', gap:'8px', border: isNext ? '1.5px solid var(--accent-1)' : extra ? '1px solid var(--highlight)' : '1px solid var(--border-soft)'}}>
              <div style=${{display:'flex', alignItems:'center', gap:'10px'}}>
                <div style=${{width:'42px', textAlign:'center', flexShrink:0}}>
                  <div style=${{fontSize:'10px', fontWeight:800, color: isNext ? 'var(--accent-1)' : 'var(--text-dim)', textTransform:'uppercase'}}>${formatSaturday(sat).split(' ')[1]}</div>
                  <div style=${{fontSize:'15px', fontWeight:800}}>${formatSaturday(sat).split(' ')[0]}</div>
                </div>
                <div style=${{flex:1}}>
                  <div style=${{fontSize:'13px', fontWeight:700}}>${team ? team.teamName : '—'}</div>
                  <div style=${{fontSize:'10.5px', color: extra ? 'var(--highlight)' : 'var(--text-mid)'}}>${labelFor(k)}${team ? ' • '+team.members.filter(m=>m.name).length+' membro(s)' : ''}</div>
                </div>
                ${extra && html`<button onClick=${()=>removeExtraDate(k)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'15px'}}>✕</button>`}
              </div>

              <select value=${sched.overrides[k] || '__auto__'} onChange=${e=>setOverride(k, e.target.value)} style=${{...inputStyle, padding:'6px 10px', fontSize:'11.5px'}}>
                <option value="__auto__">🔄 Automático (rotação de equipes)</option>
                ${louvorTeams.map(t => html`<option key=${t.id} value=${t.id}>${t.teamName}</option>`)}
              </select>

              <input placeholder="Mensagem Musical (nome do solista / grupo)" value=${music} onChange=${e=>setSpecialMusic(k, e.target.value)} style=${{...inputStyle, padding:'7px 10px', fontSize:'11.5px'}} />
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

function FunctionEditRow({ name, onRename, onRemove }) {
  const [value, setValue] = useState(name);
  useEffect(() => setValue(name), [name]);
  const commit = () => { const v = value.trim(); if (v && v !== name) onRename(name, v); else setValue(name); };
  return html`
    <div style=${{display:'flex', alignItems:'center', gap:'6px'}}>
      <input value=${value} onChange=${e=>setValue(e.target.value)} onBlur=${commit} onKeyDown=${e=>{ if (e.key==='Enter') e.target.blur(); }} style=${{...inputStyle, padding:'6px 10px', fontSize:'11.5px', flex:1}} />
      <button onClick=${()=>onRemove(name)} style=${{background:'transparent', border:'none', color:'var(--danger)', fontSize:'14px', padding:'2px 6px'}} title="Remover função">✕</button>
    </div>
  `;
}

function churchLocationKey(churchId) { return 'gc_church_location_' + churchId; }
function loadChurchLocation(churchId) {
  try { const raw = localStorage.getItem(churchLocationKey(churchId)); if (raw) return JSON.parse(raw); } catch(e) {}
  return null;
}
function saveChurchLocation(churchId, loc) { try { localStorage.setItem(churchLocationKey(churchId), JSON.stringify(loc)); } catch(e) {} }
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
const PRESENCE_RADIUS_M = 200;

function PresencaView({ churchId }) {
  const [teams, setTeams] = useState(() => loadTeams(churchId));
  const targetKey = useMemo(() => getSaturdaysForMonths(3)[0], []);
  const targetDate = keyToDate(targetKey);
  const scheduled = useMemo(() => getScheduledGroupForDate(churchId, 'sonoplastia', teams.sonoplastia, targetKey), [teams.sonoplastia, targetKey]);
  const [presence, setPresence] = useState(() => loadPresence(churchId, targetKey));
  const [status, setStatus] = useState({});
  const [churchLoc, setChurchLoc] = useState(() => loadChurchLocation(churchId));
  const [settingLoc, setSettingLoc] = useState(false);

  const markPresent = (memberId, method, coords) => {
    setPresence(p => {
      const next = { ...p, [memberId]: { method, at: new Date().toISOString(), coords: coords || null } };
      savePresence(churchId, targetKey, next);
      return next;
    });
  };

  const defineChurchLocation = () => {
    if (!navigator.geolocation) return;
    setSettingLoc(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        saveChurchLocation(churchId, loc);
        setChurchLoc(loc);
        setSettingLoc(false);
      },
      () => setSettingLoc(false),
      { enableHighAccuracy:true, timeout:10000 }
    );
  };

  const confirmSouEu = (memberId) => {
    if (!navigator.geolocation || !churchLoc) {
      setStatus(s => ({...s, [memberId]: 'Localização da igreja não configurada. Use o computador central.'}));
      return;
    }
    setStatus(s => ({...s, [memberId]: 'Verificando sua localização...'}));
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, churchLoc.lat, churchLoc.lng);
        if (dist <= PRESENCE_RADIUS_M) {
          markPresent(memberId, 'geo', { lat: pos.coords.latitude, lng: pos.coords.longitude, dist: Math.round(dist) });
          setStatus(s => ({...s, [memberId]: null}));
        } else {
          setStatus(s => ({...s, [memberId]: 'Você está a '+Math.round(dist)+'m da igreja — muito longe pra confirmar automático. Use o computador central.'}));
        }
      },
      () => setStatus(s => ({...s, [memberId]: 'Não foi possível acessar sua localização. Use o computador central.'})),
      { enableHighAccuracy:true, timeout:10000 }
    );
  };

  if (scheduled.length === 0) {
    return html`
      <div style=${{maxWidth:'600px', margin:'0 auto', padding:'20px 16px 60px'}}>
        <div style=${{fontSize:'11.5px', color:'var(--text-dim)', marginBottom:'14px'}}>Essa aba é para confirmar presença de quem está escalado na Sonoplastia.</div>
        <div class="glass fade-up" style=${{padding:'24px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'12.5px'}}>Ninguém está escalado na Sonoplastia para ${formatSaturday(targetDate)} ainda.</div>
      </div>
    `;
  }

  const presentCount = scheduled.filter(m => presence[m.id]).length;

  return html`
    <div style=${{maxWidth:'600px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'14px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para confirmar presença de quem está escalado na Sonoplastia.</div>

      ${!churchLoc && html`
        <div class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'16px', display:'grid', gap:'8px'}}>
          <div style=${{fontSize:'12px', color:'var(--text-mid)'}}>A localização da igreja ainda não foi definida. Enquanto estiver aqui dentro, toque abaixo pra configurar (só precisa fazer uma vez).</div>
          <button onClick=${defineChurchLocation} style=${{...btnPrimary, width:'auto'}} disabled=${settingLoc}>${settingLoc ? 'Obtendo localização...' : '📍 Definir esta localização como a da igreja'}</button>
        </div>
      `}

      <div class="glass fade-up" style=${{padding:'14px 18px', borderRadius:'16px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div>
          <div style=${{fontWeight:800, fontSize:'14px'}}>Sonoplastia — ${formatSaturday(targetDate)}</div>
          <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>${presentCount} de ${scheduled.length} confirmaram presença</div>
        </div>
        <div style=${{width:'44px', height:'44px', borderRadius:'50%', border:'3px solid var(--success-1)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:'13px', color:'var(--success-1)'}}>${presentCount}/${scheduled.length}</div>
      </div>

      <div style=${{display:'grid', gap:'10px'}}>
        ${scheduled.map((m, i) => {
          const pres = presence[m.id];
          return html`
            <div key=${m.id} class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'16px', display:'grid', gap:'10px', animationDelay:(i*0.04)+'s', border: pres ? '1.5px solid var(--success-1)' : '1px solid var(--border-soft)'}}>
              <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <div>
                  <div style=${{fontWeight:700, fontSize:'13.5px'}}>${m.name}</div>
                  <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>${m.function || 'Sonoplastia'}</div>
                </div>
                ${pres ? html`
                  <span style=${{fontSize:'11px', fontWeight:800, color:'var(--success-1)', display:'flex', alignItems:'center', gap:'4px'}}>
                    ✅ ${pres.method === 'geo' ? 'Presença automática' : 'No computador central'}
                  </span>
                ` : html`<span style=${{fontSize:'11px', color:'var(--text-dim)'}}>⏳ Aguardando</span>`}
              </div>

              ${!pres && html`
                <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px'}}>
                  <button onClick=${()=>confirmSouEu(m.id)} style=${{...btnGhost, padding:'9px'}}>📍 Sou eu — confirmar</button>
                  <button onClick=${()=>markPresent(m.id, 'central', null)} style=${{...btnGhost, padding:'9px'}}>🖥️ Computador Central</button>
                </div>
              `}
              ${status[m.id] && html`<div style=${{fontSize:'10.5px', color:'var(--highlight)'}}>${status[m.id]}</div>`}
              ${pres && pres.at && html`<div style=${{fontSize:'10px', color:'var(--text-dim)'}}>Confirmado às ${new Date(pres.at).toLocaleTimeString('pt-BR')}</div>`}
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

  const [city, setCity] = useState(church.city || '');
  const [state, setState] = useState(church.state || '');
  const [address, setAddress] = useState(church.address || '');
  const [association, setAssociation] = useState(church.association || '');
  const [district, setDistrict] = useState(church.district || '');
  const [isDistrictSeat, setIsDistrictSeat] = useState(!!church.isDistrictSeat);
  const [pastorName, setPastorName] = useState(church.pastorName || '');
  const [elderName, setElderName] = useState(church.elderName || '');
  const [ministryLeaders, setMinistryLeaders] = useState(church.ministryLeaders && church.ministryLeaders.length ? church.ministryLeaders : [{ ministry:'', leader:'' }]);
  const [dataSaved, setDataSaved] = useState(false);

  const updateLeaderRow = (idx, field, value) => setMinistryLeaders(rows => rows.map((r,i) => i===idx ? {...r, [field]: value} : r));
  const addLeaderRow = () => setMinistryLeaders(rows => [...rows, { ministry:'', leader:'' }]);
  const removeLeaderRow = (idx) => setMinistryLeaders(rows => rows.length > 1 ? rows.filter((_,i)=>i!==idx) : rows);

  const persistChurch = (patch, logDetail) => {
    const db = loadDB();
    const updated = { ...church, ...patch, updatedAt: new Date().toISOString() };
    const next = db.map(c => c.id === church.id ? updated : c);
    saveDB(next);
    pushLog(loadLog(), { type:'atualizacao', churchName: updated.name, churchId: church.id, detail: logDetail });
    onUpdateChurch(updated);
    return updated;
  };

  const saveChurchData = (e) => {
    e.preventDefault();
    persistChurch({
      name: name.trim(), city: city.trim(), state: state.trim(), address: address.trim(),
      association: association.trim(), district: district.trim(), isDistrictSeat,
      pastorName: pastorName.trim(), elderName: elderName.trim(),
      ministryLeaders: ministryLeaders.filter(r => r.ministry.trim() || r.leader.trim()),
    }, 'Dados da igreja atualizados');
    setDataSaved(true);
    setTimeout(()=>setDataSaved(false), 2200);
  };

  /* ---- Senha ---- */
  const [curPass, setCurPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [passError, setPassError] = useState('');
  const [passSaved, setPassSaved] = useState(false);
  const savePassword = (e) => {
    e.preventDefault();
    setPassError('');
    if (curPass !== church.password) { setPassError('Senha atual incorreta.'); return; }
    if (!newPass.trim() || newPass.length < 4) { setPassError('A nova senha deve ter no mínimo 4 caracteres.'); return; }
    if (newPass !== confirmPass) { setPassError('As senhas novas não conferem.'); return; }
    persistChurch({ password: newPass }, 'Senha alterada pela igreja');
    setCurPass(''); setNewPass(''); setConfirmPass('');
    setPassSaved(true);
    setTimeout(()=>setPassSaved(false), 2200);
  };

  /* ---- Palavra de recuperação ---- */
  const [recQuestion, setRecQuestion] = useState(church.recoveryQuestion || '');
  const [recAnswer, setRecAnswer] = useState('');
  const [recError, setRecError] = useState('');
  const [recSaved, setRecSaved] = useState(false);
  const saveRecovery = (e) => {
    e.preventDefault();
    setRecError('');
    if (!recQuestion.trim() || !recAnswer.trim()) { setRecError('Preencha a pergunta e a resposta.'); return; }
    persistChurch({ recoveryQuestion: recQuestion.trim(), recoveryAnswer: recAnswer.trim().toLowerCase() }, 'Pergunta de segurança atualizada');
    setRecAnswer('');
    setRecSaved(true);
    setTimeout(()=>setRecSaved(false), 2200);
  };

  const SECTIONS = [['dados','🏠 Dados da Igreja'],['senha','🔒 Alterar Senha'],['recuperacao','🔑 Palavra de Recuperação']];

  return html`
    <div style=${{maxWidth:'640px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'16px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para editar os dados da igreja, trocar a senha de acesso e atualizar a pergunta de recuperação de senha.</div>

      <div style=${{display:'flex', gap:'8px', flexWrap:'wrap'}}>
        ${SECTIONS.map(([key,label],i) => html`<${TabTile} key=${key} text=${label} idx=${i} delay=${i} active=${section===key} onClick=${()=>setSection(key)} />`)}
      </div>

      ${!section && html`
        <div class="glass fade-up" style=${{padding:'18px 20px', borderRadius:'18px', fontSize:'12.5px', color:'var(--text-mid)', textAlign:'center'}}>
          Escolha uma opção acima para editar as configurações do aplicativo.
        </div>
      `}

      ${section === 'dados' && html`
        <form onSubmit=${saveChurchData} class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
          <div style=${sectionLabelStyle}>Identificação da Igreja</div>
          <input placeholder="Nome da igreja adventista" value=${name} onChange=${e=>setName(e.target.value)} style=${inputStyle} />
          <input placeholder="Endereço completo" value=${address} onChange=${e=>setAddress(e.target.value)} style=${inputStyle} />
          <div style=${{display:'grid', gridTemplateColumns:'1fr 90px', gap:'10px'}}>
            <input placeholder="Cidade" value=${city} onChange=${e=>setCity(e.target.value)} style=${inputStyle} />
            <input placeholder="UF" maxlength="2" value=${state} onChange=${e=>setState(e.target.value.toUpperCase())} style=${inputStyle} />
          </div>

          <div style=${sectionLabelStyle}>Organização Administrativa</div>
          <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px'}}>
            <input placeholder="Associação" value=${association} onChange=${e=>setAssociation(e.target.value)} style=${inputStyle} />
            <input placeholder="Distrito" value=${district} onChange=${e=>setDistrict(e.target.value)} style=${inputStyle} />
          </div>
          <label style=${{display:'flex', alignItems:'center', gap:'8px', fontSize:'12.5px', color:'var(--text-mid)', padding:'2px 2px'}}>
            <input type="checkbox" checked=${isDistrictSeat} onChange=${e=>setIsDistrictSeat(e.target.checked)} style=${{width:'16px',height:'16px'}} />
            Esta igreja é sede de distrito
          </label>

          <div style=${sectionLabelStyle}>Liderança</div>
          <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px'}}>
            <input placeholder="Nome do pastor" value=${pastorName} onChange=${e=>setPastorName(e.target.value)} style=${inputStyle} />
            <input placeholder="Nome do 1º ancião" value=${elderName} onChange=${e=>setElderName(e.target.value)} style=${inputStyle} />
          </div>

          <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div style=${{...sectionLabelStyle, marginBottom:0}}>Líderes dos Ministérios</div>
            <button type="button" onClick=${addLeaderRow} style=${{...btnGhost, padding:'5px 10px', fontSize:'11px'}}>+ Ministério</button>
          </div>
          ${ministryLeaders.map((row, idx) => html`
            <div key=${idx} style=${{display:'grid', gridTemplateColumns:'1fr 1fr 30px', gap:'8px'}}>
              <input placeholder="Ministério (ex: Louvor)" value=${row.ministry} onChange=${e=>updateLeaderRow(idx,'ministry',e.target.value)} style=${inputStyle} />
              <input placeholder="Nome do líder" value=${row.leader} onChange=${e=>updateLeaderRow(idx,'leader',e.target.value)} style=${inputStyle} />
              <button type="button" onClick=${()=>removeLeaderRow(idx)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'16px'}}>✕</button>
            </div>
          `)}

          <button type="submit" style=${btnPrimary}>${dataSaved ? '✅ Salvo!' : '💾 Salvar Dados da Igreja'}</button>
        </form>
      `}

      ${section === 'senha' && html`
        <form onSubmit=${savePassword} class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
          <div style=${{fontSize:'11px', color:'var(--text-dim)'}}>Trocar a senha usada para entrar no sistema.</div>
          ${passError && html`<div style=${errorBox}>${passError}</div>`}
          <input type="password" placeholder="Senha atual" value=${curPass} onChange=${e=>setCurPass(e.target.value)} style=${inputStyle} />
          <input type="password" placeholder="Nova senha (mínimo 4 caracteres)" value=${newPass} onChange=${e=>setNewPass(e.target.value)} style=${inputStyle} />
          <input type="password" placeholder="Confirmar nova senha" value=${confirmPass} onChange=${e=>setConfirmPass(e.target.value)} style=${inputStyle} />
          <button type="submit" style=${btnPrimary}>${passSaved ? '✅ Senha Alterada!' : '🔒 Salvar Nova Senha'}</button>
        </form>
      `}

      ${section === 'recuperacao' && html`
        <form onSubmit=${saveRecovery} class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
          <div style=${{fontSize:'11px', color:'var(--text-dim)'}}>Essa é a pergunta usada em "Esqueci minha senha" na tela de login. ${church.recoveryQuestion ? 'Pergunta atual: "'+church.recoveryQuestion+'".' : 'Nenhuma pergunta cadastrada ainda.'} Pra trocar, defina uma pergunta e resposta novas.</div>
          ${recError && html`<div style=${errorBox}>${recError}</div>`}
          <input placeholder="Pergunta de segurança (ex: Nome do seu primeiro pet)" value=${recQuestion} onChange=${e=>setRecQuestion(e.target.value)} style=${inputStyle} />
          <input placeholder="Resposta" value=${recAnswer} onChange=${e=>setRecAnswer(e.target.value)} style=${inputStyle} />
          <button type="submit" style=${btnPrimary}>${recSaved ? '✅ Salvo!' : '🔑 Salvar Pergunta de Recuperação'}</button>
        </form>
      `}
    </div>
  `;
}

  const [tab, setTab] = useState('liturgia');
  return html`
    <div>
      <${ChurchHeader} church=${church} tab=${tab} setTab=${setTab} onLogout=${onLogout} />
      ${tab === 'presenca' ? html`<${PresencaView} key="presenca" churchId=${church.id} />` : ''}
      ${tab === 'liturgia' ? html`<${LiturgiaView} key="lit" churchId=${church.id} churchName=${church.name} />` : ''}
      ${tab === 'musicas' ? html`<${MusicasView} key="musicas" churchId=${church.id} />` : ''}
      ${tab === 'gestao' ? html`<${GestaoView} key="gestao" churchId=${church.id} churchName=${church.name} />` : ''}
      ${tab === 'telas' ? html`<${TelasView} key="telas" churchId=${church.id} />` : ''}
      ${tab === 'buscas' ? html`<${BuscasSemanaisView} key="buscas" churchId=${church.id} />` : ''}
      ${tab === 'ferramentas' ? html`<${FerramentasView} key="ferramentas" churchName=${church.name} churchId=${church.id} />` : ''}

const THEME_KEY = 'gc_theme_v1';
function luminanceOf(hex) {
  const h = (hex || '#000000').replace('#','');
  const r = parseInt(h.substring(0,2),16)||0, g = parseInt(h.substring(2,4),16)||0, b = parseInt(h.substring(4,6),16)||0;
  return (r*299 + g*587 + b*114) / 1000;
}
const THEME_PRESETS = [
  { name:'Azul Tech', a1:'#2563eb', a2:'#0891b2', a3:'#7c3aed', bg:'#0b1120', text:'#f1f5f9', highlight:'#fb923c', success:'#10b981', danger:'#ef4444' },
  { name:'Rosa/Roxo', a1:'#ec4899', a2:'#8b5cf6', a3:'#06b6d4', bg:'#0b1120', text:'#f1f5f9', highlight:'#fb923c', success:'#10b981', danger:'#ef4444' },
  { name:'Verde Esmeralda', a1:'#10b981', a2:'#0891b2', a3:'#065f46', bg:'#0a1410', text:'#f1f5f9', highlight:'#fbbf24', success:'#34d399', danger:'#ef4444' },
  { name:'Âmbar Clássico', a1:'#d97706', a2:'#b45309', a3:'#92400e', bg:'#14100a', text:'#f1f5f9', highlight:'#fbbf24', success:'#84cc16', danger:'#ef4444' },
  { name:'Vermelho Fogo', a1:'#dc2626', a2:'#ea580c', a3:'#991b1b', bg:'#140a0a', text:'#f1f5f9', highlight:'#fbbf24', success:'#22c55e', danger:'#f87171' },
  { name:'Grafite', a1:'#475569', a2:'#334155', a3:'#1e293b', bg:'#0d0f13', text:'#f1f5f9', highlight:'#94a3b8', success:'#22c55e', danger:'#ef4444' },
  { name:'Claro', a1:'#2563eb', a2:'#0891b2', a3:'#7c3aed', bg:'#eef2f9', text:'#0f172a', highlight:'#d97706', success:'#059669', danger:'#dc2626' },
];
function loadTheme() {
  try { const raw = localStorage.getItem(THEME_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return THEME_PRESETS[0];
}
function saveThemeToStorage(t) { try { localStorage.setItem(THEME_KEY, JSON.stringify(t)); } catch(e) {} }
function applyTheme(t) {
  const set = (k,v) => v && document.documentElement.style.setProperty(k, v);
  set('--accent-1', t.a1); set('--accent-2', t.a2); set('--accent-3', t.a3);
  set('--highlight', t.highlight); set('--success-1', t.success); set('--success-2', t.success); set('--danger', t.danger);
  set('--text-on-highlight', luminanceOf(t.highlight) > 150 ? '#1c1917' : '#fff8f0');

  const bg = t.bg || '#0b1120';
  const isLight = luminanceOf(bg) > 150;
  set('--bg-page', bg);
  set('--text-hi', t.text || (isLight ? '#0f172a' : '#f1f5f9'));
  set('--text-mid', isLight ? '#475569' : '#94a3b8');
  set('--text-dim', isLight ? '#64748b' : '#64748b');
  set('--border-soft', isLight ? 'rgba(30,41,59,0.1)' : 'rgba(148,163,184,0.14)');
  set('--glass-bg', isLight ? '#ffffffee' : '#0f172acc');
}

function ThemeSwitcher() {
  const [open, setOpen] = useState(false);
  const [theme, setTheme] = useState(loadTheme);

  useEffect(() => { applyTheme(theme); }, []);

  const choose = (t) => {
    setTheme(t);
    applyTheme(t);
    saveThemeToStorage(t);
  };
  const customChange = (field, value) => {
    const next = { ...theme, [field]: value, name:'Personalizado' };
    choose(next);
  };

  const colorField = (label, field) => html`
    <div style=${{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'8px'}}>
      <span style=${{fontSize:'11px', color:'var(--text-mid)'}}>${label}</span>
      <input type="color" value=${theme[field]} onChange=${e=>customChange(field, e.target.value)} style=${{width:'44px', height:'26px', borderRadius:'6px', border:'1px solid var(--border-soft)', background:'transparent', padding:0}} />
    </div>
  `;

  return html`
    <div style=${{position:'fixed', top:'14px', right:'14px', zIndex:100}}>
      <button onClick=${()=>setOpen(o=>!o)} class="glass" style=${{width:'38px', height:'38px', borderRadius:'50%', border:'1px solid var(--border-soft)', fontSize:'16px', display:'flex', alignItems:'center', justifyContent:'center'}} title="Personalizar cores">🎨</button>
      ${open && html`
        <div class="glass fade-up" style=${{position:'absolute', top:'46px', right:0, width:'260px', padding:'14px', borderRadius:'16px', display:'grid', gap:'10px', maxHeight:'80vh', overflowY:'auto'}}>
          <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em'}}>Temas Prontos</div>
          <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'6px'}}>
            ${THEME_PRESETS.map(p => html`
              <button key=${p.name} onClick=${()=>choose(p)} style=${{display:'flex', alignItems:'center', gap:'6px', padding:'6px 8px', borderRadius:'10px', border: theme.name===p.name ? '1.5px solid '+p.a1 : '1px solid var(--border-soft)', background:'transparent', fontSize:'10.5px', color:'var(--text-mid)'}}>
                <span style=${{width:'14px', height:'14px', borderRadius:'50%', background:'linear-gradient(135deg,'+p.a1+','+p.a2+')', flexShrink:0, border:'1px solid rgba(255,255,255,0.15)'}}></span>
                ${p.name}
              </button>
            `)}
          </div>

          <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', marginTop:'6px', borderTop:'1px solid var(--border-soft)', paddingTop:'10px'}}>Cores Personalizadas</div>
          ${colorField('Fundo', 'bg')}
          ${colorField('Texto', 'text')}
          ${colorField('Destaque 1 (botões)', 'a1')}
          ${colorField('Destaque 2', 'a2')}
          ${colorField('Destaque 3', 'a3')}
          ${colorField('Realce (hinário)', 'highlight')}
          ${colorField('Sucesso / concluído', 'success')}
          ${colorField('Erro / remover', 'danger')}
        </div>
      `}
    </div>
  `;
}

function App() {
  const [session, setSession] = useState(() => {
    try { const raw = localStorage.getItem(SESSION_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
    return null;
  });

  useEffect(() => { applyTheme(loadTheme()); }, []);

  const login = (s) => {
    setSession(s);
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e) {}
  };
  const logout = () => {
    setSession(null);
    try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
  };
  const updateChurchSession = (updatedChurch) => {
    setSession(s => {
      const next = { ...s, church: updatedChurch };
      try { localStorage.setItem(SESSION_KEY, JSON.stringify(next)); } catch(e) {}
      return next;
    });
  };

  return html`
    <div>
      <${ThemeSwitcher} />
      ${!session ? html`<${LoginScreen} onLogin=${login} />` :
        session.type === 'developer' ? html`<${DeveloperPanel} onLogout=${logout} />` :
        html`<${ChurchDashboard} church=${session.church} onLogout=${logout} onUpdateChurch=${updateChurchSession} />`}
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
<script>
  // Se este arquivo estiver hospedado com o servidor próprio (Render, etc.), registra o service
  // worker que deixa o app instalável e atualiza sozinho. Dentro do Claude não existe /sw.js, então
  // essa chamada simplesmente falha em silêncio e não afeta nada.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
