function ProjectButton({ churchId, media, itemKey }) {
  const isMobile = useIsMobile();
  if (!media || !media.title) return '';

  const send = (scr, mute) => {
    try {
      sendToScreenObj(scr, 'media', media, { mute });
    } catch (e) {
      alert('Erro ao projetar: ' + (e && e.message ? e.message : e));
    }
  };

  // Pedido do Paulo (25/09): dois botões em vez de um só — "Operador" manda pra tela do próprio
  // operador SEM som (pra ele acompanhar sem incomodar quem está do lado), e "Projetor" manda pra
  // tela configurada como projetor COM som (o público ouve). "Projetor" usa a(s) tela(s) marcada(s)
  // como projetor em "Telas"; sem nenhuma marcada (configuração antiga, só uma tela), cai na mesma
  // lógica de sempre (preferência salva pra esse item, ou todas as telas habilitadas).
  const projectTo = (which) => {
    try {
      const enabled = loadEnabledScreens(churchId);
      if (enabled.length === 0) {
        alert('Nenhuma tela habilitada ainda. Vá na aba "Telas" e habilite pelo menos uma.');
        return;
      }
      let targets;
      if (which === 'projetor') {
        const projectors = enabled.filter(s => s.isProjector);
        targets = projectors.length > 0 ? projectors : pickTargetScreens(churchId, itemKey, enabled);
      } else {
        targets = enabled.filter(s => !s.isProjector);
        if (targets.length === 0) {
          alert('Nenhuma tela de operador configurada ainda. Vá na aba "Telas", habilite uma tela a mais (sem marcar como Projetor) pra usar esse botão sem som.');
          return;
        }
      }
      targets.forEach(scr => send(scr, which === 'operador'));
    } catch (e) {
      alert('Erro ao preparar a projeção: ' + (e && e.message ? e.message : e));
    }
  };

  const buttons = [
    { text:'🎧 Operador', title:'Projetar só na tela do operador, sem som', onClick:()=>projectTo('operador') },
    { text:'🔊 Projetor', title:'Projetar no projetor, com som', onClick:()=>projectTo('projetor') },
    ...screenQuickButtonDefs(churchId, (scr)=>send(scr, false)),
  ];

  return html`<${ScreenSendRow} isMobile=${isMobile} buttons=${buttons} extra=${itemKey && html`<${ScreenPickerButton} churchId=${churchId} itemKey=${itemKey} />`} />`;
}

// Cronômetro REGRESSIVO (contagem decrescente) pra atividades que NÃO têm vídeo/música (oração,
// sermão, avisos, momento de dízimo falado, etc.) — pedido do Paulo (25/09): escolher em que tela
// projetar (incluindo uma tela específica pelo número), a tela mostrar o que já está cadastrado na
// Liturgia (nome + responsável/horário) junto com o relógio, e a duração configurada aqui é a MESMA
// usada pela Programação Automática do Modo Ao Vivo pra avançar essa etapa sozinha quando chegar a
// zero (guardada em act.plannedSeconds, via onChangeDuration) — assim o tempo que aparece na tela é
// sempre o mesmo tempo que o sistema realmente vai esperar antes de passar pra próxima etapa.
// O tempo roda aqui no painel (a tela recalcula sozinha a partir de startedAt+remainingMs, então
// sobrevive a uma tela travando/recarregando) e só manda mensagem pra tela quando muda de estado.
// Controla qual cronômetro está "flutuando" na tela no momento — só um por vez, pra não empilhar
// janelinhas. Qualquer CronometroAtividadeButton pode abrir a sua; abrir uma fecha a anterior.
let _cronoFloatKey = null;
let _cronoFloatListeners = [];
function setCronoFloatOpen(key) {
  _cronoFloatKey = key;
  _cronoFloatListeners.forEach(fn => { try { fn(key); } catch(e) {} });
}
function useCronoFloatOpen(key) {
  const [openKey, setOpenKey] = useState(_cronoFloatKey);
  useEffect(() => {
    const fn = (k) => setOpenKey(k);
    _cronoFloatListeners.push(fn);
    return () => { _cronoFloatListeners = _cronoFloatListeners.filter(f => f !== fn); };
  }, []);
  return [openKey === key, () => setCronoFloatOpen(key), () => setCronoFloatOpen(null)];
}

function CronometroAtividadeButton({ churchId, itemKey, title, responsible, time, plannedSeconds, onChangeDuration }) {
  const isMobile = useIsMobile();
  const [isFloating, openFloat, closeFloat] = useCronoFloatOpen(itemKey);
  const initialMin = plannedSeconds && plannedSeconds > 0 ? Math.max(1, Math.round(plannedSeconds / 60)) : 5;
  const [durationMin, setDurationMin] = useState(initialMin);
  const [remainingMs, setRemainingMs] = useState(initialMin * 60000);
  const [running, setRunning] = useState(false);
  const baseRef = useRef(0);
  const startRef = useRef(0);
  const [targets, setTargets] = useState([]);

  useEffect(() => {
    if (!running) return;
    baseRef.current = remainingMs;
    startRef.current = Date.now();
    const id = setInterval(() => {
      const left = Math.max(0, baseRef.current - (Date.now() - startRef.current));
      setRemainingMs(left);
      if (left <= 0) setRunning(false);
    }, 200);
    return () => clearInterval(id);
  }, [running]);

  const pushToTargets = (scrs, runningNow, remainingNow) => {
    scrs.forEach(scr => {
      try {
        sendToScreenObj(scr, 'cronometro', { title, responsible, time, running: runningNow, startedAt: runningNow ? Date.now() : null, remainingMs: remainingNow });
      } catch (e) {}
    });
  };

  useEffect(() => {
    if (targets.length === 0) return;
    pushToTargets(targets, running, remainingMs);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [running]);

  const sendToMany = (scrs) => {
    setTargets(scrs);
    pushToTargets(scrs, running, remainingMs);
  };

  const sendTo = (which) => {
    try {
      const enabled = loadEnabledScreens(churchId);
      if (enabled.length === 0) { alert('Nenhuma tela habilitada ainda. Vá na aba "Telas" e habilite pelo menos uma.'); return; }
      let scrs;
      if (which === 'projetor') {
        const projectors = enabled.filter(s => s.isProjector);
        scrs = projectors.length > 0 ? projectors : pickTargetScreens(churchId, itemKey, enabled);
      } else if (which === 'retorno') {
        const ret = enabled.filter(s => s.isReturnScreen);
        if (ret.length === 0) { alert('Nenhuma tela de retorno configurada ainda. Vá na aba "Telas" e marque uma tela como "Definir como Retorno".'); return; }
        scrs = ret;
      } else {
        scrs = enabled.filter(s => !s.isProjector);
        if (scrs.length === 0) { alert('Nenhuma tela de operador configurada ainda. Vá na aba "Telas", habilite uma tela a mais (sem marcar como Projetor) pra usar esse botão sem som.'); return; }
      }
      sendToMany(scrs);
    } catch (e) {
      alert('Erro ao preparar a projeção: ' + (e && e.message ? e.message : e));
    }
  };

  const changeDuration = (min) => {
    const v = Math.max(1, Number(min) || 1);
    setDurationMin(v);
    if (!running) {
      const ms = v * 60000;
      setRemainingMs(ms);
      if (targets.length > 0) pushToTargets(targets, false, ms);
    }
  };
  const commitDuration = () => { if (onChangeDuration) onChangeDuration(durationMin * 60); };

  const reset = () => {
    setRunning(false);
    const ms = durationMin * 60000;
    setRemainingMs(ms);
    if (targets.length > 0) pushToTargets(targets, false, ms);
  };

  const format = (t) => {
    const totalSec = Math.ceil(t / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return h > 0 ? (h + ':' + m + ':' + s) : (m + ':' + s);
  };
  const done = remainingMs <= 0;

  const playButtons = [
    { text: running ? '⏸ Pausar' : (done ? '▶ Reiniciar' : '▶ Iniciar'), onClick: ()=>{ if (!running) openFloat(); setRunning(r=>!r); }, style: running ? { color:'var(--highlight)', borderColor:'var(--highlight)' } : {} },
    { text: '↺ Zerar', onClick: reset },
  ];
  const screenButtons = [
    { text:'🎧 Operador', title:'Mostrar o cronômetro só na tela do operador, sem som', onClick:()=>sendTo('operador') },
    { text:'🔊 Projetor', title:'Mostrar o cronômetro no projetor', onClick:()=>sendTo('projetor') },
    { text:'📺 Retorno', title:'Mostrar o cronômetro na tela de retorno (voltada pra quem está falando)', onClick:()=>sendTo('retorno') },
    ...screenQuickButtonDefs(churchId, (scr)=>sendToMany([scr])),
  ];
  const statusExtra = html`
    <${ScreenPickerButton} churchId=${churchId} itemKey=${itemKey} />
    ${targets.length > 0 && html`<span style=${{fontSize:'10px', color:'var(--success-1)', fontWeight:700}}>● cronômetro na tela</span>`}
  `;

  // Chip compacto — sempre presente no card da atividade, sem ocupar espaço. Clicar abre a janelinha
  // flutuante com os controles completos (só uma flutuante por vez, ver useCronoFloatOpen).
  const chip = html`
    <button type="button" onClick=${openFloat} style=${{...btnGhost, display:'flex', alignItems:'center', gap:'6px', padding:'6px 12px', fontSize:'12px', fontWeight:700, fontVariantNumeric:'tabular-nums', width: isMobile ? '100%' : 'auto', justifyContent:'center', color: done ? 'var(--danger)' : (running ? 'var(--highlight)' : 'inherit'), borderColor: running ? 'var(--highlight)' : 'var(--border-soft)'}}>
      ${running ? '⏳' : '⏱️'} ${format(remainingMs)} ${running ? html`<span style=${{fontSize:'9px', opacity:0.8}}>rodando</span>` : ''}
    </button>
  `;

  const floatPanel = isFloating && html`
    <div style=${{position:'fixed', zIndex:9999, ...(isMobile ? {left:'8px', right:'8px', bottom:'8px'} : {right:'16px', bottom:'16px', width:'300px'})}}>
      <div class="glass fade-up" style=${{padding:'12px', borderRadius:'14px', display:'grid', gap:'10px', boxShadow:'0 8px 28px rgba(0,0,0,0.35)', border:'1.5px solid var(--accent-1)'}}>
        <div style=${{display:'flex', alignItems:'center', gap:'8px'}}>
          <div style=${{flex:1, fontSize:'11px', fontWeight:700, color:'var(--text-dim)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}} title=${title}>⏱️ ${title || 'Cronômetro'}</div>
          <button type="button" onClick=${closeFloat} title="Minimizar (o cronômetro continua rodando)" style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'14px', padding:'2px 4px', cursor:'pointer'}}>─</button>
        </div>
        <div style=${{display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap'}}>
          <div style=${{fontSize:'22px', fontWeight:800, fontVariantNumeric:'tabular-nums', color: done ? 'var(--danger)' : 'inherit'}}>⏳ ${format(remainingMs)}</div>
          ${!running && html`
            <div style=${{display:'flex', alignItems:'center', gap:'4px'}}>
              <input type="number" min="1" value=${durationMin} onChange=${e=>changeDuration(e.target.value)} onBlur=${commitDuration} title="Duração planejada — também usada pra avançar sozinho na Programação Automática" style=${{...inputStyle, width:'54px', padding:'6px 7px', fontSize:'12px', textAlign:'center'}} />
              <span style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>min planejados</span>
            </div>
          `}
        </div>
        <${ScreenSendRow} isMobile=${isMobile} buttons=${playButtons} />
        <${ScreenSendRow} isMobile=${isMobile} label="Mostrar em" buttons=${screenButtons} extra=${itemKey && statusExtra} />
      </div>
    </div>
  `;

  return html`
    <div style=${{display:'contents'}}>
      ${chip}
      ${floatPanel}
    </div>
  `;
}

function ActivityCard({ act, onToggle, onDelete, onEdit, onToggleFix, onToggleWeekly, onReorder, siblings, fixedTracks, churchId, idx, mensagemItems, mensagemCurrent, setMensagemCurrent }) {
  const isMobile = useIsMobile();
  const [editing, setEditing] = useState(false);
  const [name, setName] = useState(act.name);
  const [responsible, setResponsible] = useState(act.responsible);
  const [category, setCategory] = useState(act.category);
  const [time, setTime] = useState(act.time === '--:--' ? '' : act.time);
  const [media, setMedia] = useState(act.media || null);
  const [sermaoExpanded, setSermaoExpanded] = useState(false);
  const [idleSeconds, setIdleSeconds] = useState(typeof act.idleSeconds === 'number' ? act.idleSeconds : '');
  // Mover de lugar (25/09, a pedido do Paulo): reaproveita o mesmo "antes de / depois de" que já existe
  // em Acrescentar Atividade, só que agora dentro do próprio Editar, pra reordenar sem apagar e recriar.
  const [movePosition, setMovePosition] = useState('depois');
  const [moveRefId, setMoveRefId] = useState('');
  // Antes só liberava a busca de vídeo/música pra "mensagem_musical"/"louvor" — mas os exemplos do
  // Paulo (música das ofertas, entrada/saída das crianças, entrada da plataforma) caem em outras
  // categorias (ofertas, infantil, abertura, vídeo...). Liberado pra qualquer categoria, exceto
  // oração e sermão (que já tem seu próprio fluxo de arquivos, na aba Mensagem).
  const needsMedia = category !== 'oracao' && category !== 'sermao';
  const weeklyTrack = act.weeklyFixed ? findFixedTrack(fixedTracks, act.name) : null;

  // Quando é "fixo semanal", a mídia é atualizada de fora (pela Trilhas Fixas, em Gestão) — sem isso,
  // o estado local `media` (que só reflete o valor de quando o card foi montado) ficava desatualizado
  // e o botão de Projetar nunca aparecia mesmo depois de cadastrar a URL.
  useEffect(() => { if (act.weeklyFixed) setMedia(act.media || null); }, [act.weeklyFixed, act.media]);

  const save = () => {
    onEdit({ ...act, name: name.trim() || act.name, responsible: responsible.trim() || 'A definir', category, time: time || '--:--', media: media || null, idleSeconds: idleSeconds === '' ? null : Math.max(0, Number(idleSeconds) || 0) });
    if (onReorder && moveRefId) onReorder(act.id, moveRefId, movePosition);
    setEditing(false);
  };

  if (editing) {
    return html`
      <div class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'16px', display:'grid', gap:'8px'}}>
        <input value=${name} onChange=${e=>setName(e.target.value)} style=${{...inputStyle, fontWeight:700}} autoFocus />
        <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px'}}>
          <input value=${responsible} onChange=${e=>setResponsible(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} placeholder="Responsável" />
          <select value=${category} onChange=${e=>setCategory(e.target.value)} style=${{...inputStyle, fontSize:'12px'}}>
            ${Object.keys(CATEGORY_ICON).map(c => html`<option key=${c} value=${c}>${CATEGORY_ICON[c]} ${c}</option>`)}
          </select>
        </div>
        <input type="time" value=${time} onChange=${e=>setTime(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />
        ${needsMedia && act.weeklyFixed && html`<div style=${{fontSize:'10.5px', color:'var(--text-dim)', padding:'6px 2px'}}>📅 Marcada como "todo sábado" — o vídeo/música vem do cadastro em Gestão &gt; Trilhas Fixas (destranque o 📅 aqui do lado pra escolher manualmente).</div>`}
        ${needsMedia && !act.weeklyFixed && html`<${MediaSearchField} media=${media} onChange=${setMedia} searchKey=${act.id} />`}
        ${needsMedia && html`
          <div style=${{display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap'}}>
            <input type="number" min="0" placeholder="padrão" value=${idleSeconds} onChange=${e=>setIdleSeconds(e.target.value)} style=${{...inputStyle, fontSize:'12px', width:'70px', flexShrink:0}} />
            <span style=${{fontSize:'10.5px', color:'var(--text-mid)'}}>seg. ocioso após o vídeo/música terminar, na Programação Automática (vazio = usa o padrão)</span>
          </div>
        `}
        ${onReorder && siblings && siblings.length > 0 && html`
          <div style=${{display:'grid', gap:'4px', paddingTop:'2px', borderTop:'1px solid var(--border-soft)'}}>
            <div style=${{fontSize:'9.5px', color:'var(--text-dim)', fontWeight:800, textTransform:'uppercase', letterSpacing:'0.05em', marginTop:'6px'}}>Mudar de lugar (opcional)</div>
            <div style=${{display:'grid', gridTemplateColumns:'110px 1fr', gap:'8px'}}>
              <select value=${movePosition} onChange=${e=>setMovePosition(e.target.value)} style=${{...inputStyle, fontSize:'12px'}}>
                <option value="antes">Antes de...</option>
                <option value="depois">Depois de...</option>
              </select>
              <select value=${moveRefId} onChange=${e=>setMoveRefId(e.target.value)} style=${{...inputStyle, fontSize:'12px'}}>
                <option value="">(não mudar de lugar)</option>
                ${siblings.filter(s => s.id !== act.id).map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}
              </select>
            </div>
          </div>
        `}
        <div style=${{display:'flex', gap:'8px', justifyContent:'flex-end'}}>
          <button onClick=${()=>setEditing(false)} style=${btnGhost}>Cancelar</button>
          <button onClick=${save} style=${{...btnPrimary, width:'auto', padding:'8px 16px'}}>Salvar</button>
        </div>
      </div>
    `;
  }

  return html`
    <div class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'16px', display:'grid', gap:'8px', animationDelay:(idx*0.04)+'s', opacity: act.done ? 0.55 : 1, border: act.fixed ? '1px solid var(--highlight)' : '1px solid transparent'}}>
      <div style=${{display:'flex', alignItems:'center', gap:'12px'}}>

// ---- Assistente de Liturgia: lê um texto colado e monta as atividades sozinho ----
// Reconhece cabeçalhos de seção (Escola Sabática / Culto Divino), horários, responsáveis
// (depois de um hífen ou entre parênteses) e tenta adivinhar a categoria pelas palavras usadas
// na linha. O resultado sempre passa por uma prévia editável antes de entrar na liturgia de verdade.
const LITURGY_CATEGORY_KEYWORDS = [
  ['sermao', ['sermão','sermao','pregação','pregacao','prédica','predica','palavra de deus','mensagem da palavra']],
  ['mensagem_musical', ['mensagem musical','especial musical','número musical','numero musical','solo de']],
  ['video', ['vídeo','video','filme','informativo mundial']],
  ['ofertas', ['oferta','dízimo','dizimo','provai e vede']],
  ['oracao', ['oração','oracao','bênção','bencao','benção','joelhos','intercess']],
  ['infantil', ['infantil','criança','crianca','jardim de infância','primários','primarios']],
  ['anuncios', ['aviso','anúncio','anuncio','comunicação','comunicacao']],
  ['abertura', ['boas-vindas','boas vindas','recepção','recepcao']],
  ['louvor', ['hino','louvor','cântico','cantico','prelúdio','preludio','coral']],
];
function guessLiturgyCategory(text) {
  const low = text.toLowerCase();
  for (const [cat, words] of LITURGY_CATEGORY_KEYWORDS) {
    if (words.some(w => low.includes(w))) return cat;
  }
  return 'geral';
}
function guessLiturgySection(text, current) {
  const low = text.toLowerCase();
  if (low.includes('escola sabatina') || low.includes('escola sabática') || low.includes('escola sabatica')) return 'escola_sabatina';
  if (low.includes('culto divino') || low.includes('culto de adoração') || low.includes('culto de adoracao')) return 'culto_divino';
  return current;
}
function parseLiturgyText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const drafts = [];
  let currentSection = 'escola_sabatina';
  let idx = 0;
  for (const raw of lines) {
    const low = raw.toLowerCase();
    const isHeader = raw.length < 40 && /(escola sabatina|escola sab[aá]tica|culto divino|culto de ador)/.test(low) && !/\d{1,2}[:h]\d{2}/.test(raw);
    if (isHeader) {
      currentSection = low.includes('escola') ? 'escola_sabatina' : 'culto_divino';
      continue;
    }

    let line = raw.replace(/^[-•*•\d]+[.\)]?\s*/, '');
    if (!line.trim()) continue;

    let time = '--:--';
    const timeMatch = line.match(/(\d{1,2})[:h](\d{2})/);
    if (timeMatch) {
      time = timeMatch[1].padStart(2,'0') + ':' + timeMatch[2];
      line = (line.slice(0, timeMatch.index) + line.slice(timeMatch.index + timeMatch[0].length)).trim();
    }
    line = line.replace(/^[-–—:\s]+|[-–—:\s]+$/g, '');
    if (!line) continue;

    let name = line, responsible = '';
    const parenMatch = line.match(/\(([^)]+)\)\s*$/);
    if (parenMatch) {
      responsible = parenMatch[1].trim();
      name = line.slice(0, parenMatch.index).trim();
    } else {
      const dashParts = line.split(/\s[-–—]\s/);
      if (dashParts.length >= 2) {
        name = dashParts[0].trim();
        responsible = dashParts.slice(1).join(' - ').trim();
      }
    }
    responsible = responsible.replace(/^(com|por)\s+/i, '').trim();
    name = name.replace(/^[-–—:\s]+|[-–—:\s]+$/g, '');
    if (!name) continue;

    currentSection = guessLiturgySection(raw, currentSection);
    const category = guessLiturgyCategory(raw);

    drafts.push({ tempId:'draft-'+(idx++), name, responsible: responsible || 'A definir', time, section: currentSection, category });
  }
  return drafts;
}

function DefaultLiturgyPasswordGate({ hasPassword, onUnlock, onClose }) {
  const [password, setPassword] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [error, setError] = useState('');

  const submit = (e) => {
    e.preventDefault();
    setError('');
    if (!hasPassword) {
      if (!password.trim() || password.length < 4) { setError('Crie uma senha com pelo menos 4 caracteres.'); return; }
      if (password !== confirmPass) { setError('As senhas não conferem.'); return; }
      onUnlock(password);
    } else {
      if (!password.trim()) { setError('Digite a senha do diretor.'); return; }
      onUnlock(password);
    }
  };

  return html`
    <div style=${{position:'fixed', inset:0, background:'rgba(2,6,23,0.6)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:200, padding:'16px'}} onClick=${onClose}>

        <div style=${{fontWeight:800, fontSize:'15px'}}>${hasPassword ? '🔒 Senha do Diretor' : '🆕 Criar Liturgia Padrão'}</div>
        <div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>
          ${hasPassword
            ? 'Digite a senha do diretor pra abrir a liturgia padrão e editá-la.'
            : 'Defina uma senha pra proteger a liturgia padrão — só quem souber ela poderá editá-la depois de criada.'}
        </div>
        ${error && html`<div style=${errorBox}>${error}</div>`}
        <form onSubmit=${submit} style=${{display:'grid', gap:'10px'}}>

function DefaultLiturgyEditor({ initialList, password, onSave, onClose, churchId }) {
  const [list, setList] = useState(() => initialList.map(a => ({...a})));
  const [adding, setAdding] = useState(false);

  const toggle = (id) => setList(l => l.map(a => a.id===id ? {...a, done: !a.done} : a));
  const remove = (id) => setList(l => l.filter(a => a.id !== id));
  const edit = (updated) => setList(l => l.map(a => a.id === updated.id ? updated : a));
  const toggleFix = (id) => setList(l => l.map(a => a.id===id ? {...a, fixed: !a.fixed} : a));
  const toggleWeekly = (id) => setList(l => l.map(a => a.id===id ? {...a, weeklyFixed: !a.weeklyFixed} : a));
  const moveActivity = (id, refId, position) => {
    setList(l => {
      if (!refId || refId === id) return l;
      const item = l.find(a => a.id === id);
      if (!item) return l;
      const without = l.filter(a => a.id !== id);
      const refIdx = without.findIndex(a => a.id === refId);
      if (refIdx === -1) return l;
      const insertAt = position === 'antes' ? refIdx : refIdx + 1;
      const next = without.slice();
      next.splice(insertAt, 0, item);
      return next;
    });
  };
  const [fixedTracksRef] = useState(() => loadFixedTracks(churchId));
  const addAt = (act, refId, position) => {
    setList(l => {
      if (!refId) return [...l, act];
      const idx = l.findIndex(a => a.id === refId);
      if (idx === -1) return [...l, act];
      const insertAt = position === 'antes' ? idx : idx + 1;
      const next = [...l];
      next.splice(insertAt, 0, act);
      return next;
    });
  };

  const sections = ['escola_sabatina', 'culto_divino'];

  return html`
    <div style=${{position:'fixed', inset:0, background:'rgba(2,6,23,0.7)', zIndex:200, overflowY:'auto', padding:'20px 16px'}}>
      <div style=${{maxWidth:'700px', margin:'0 auto', display:'grid', gap:'16px'}}>
        <div class="glass fade-up" style=${{padding:'16px 20px', borderRadius:'18px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'10px'}}>
          <div>
            <div style=${{fontWeight:800, fontSize:'15px'}}>🔒 Editando Liturgia Padrão</div>
            <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>Isso é o modelo que será usado sempre que alguém clicar em "Restaurar Padrão".</div>
          </div>
          <button onClick=${onClose} style=${btnGhost}>Fechar sem Salvar</button>
        </div>

        <button onClick=${()=>setAdding(v=>!v)} style=${{...btnGhost, border:'1.5px dashed var(--border-soft)', padding:'12px'}}>➕ Acrescentar Atividade ao Padrão</button>
        ${adding && html`<${AddActivityForm} defaultSection="escola_sabatina" activities=${list} onAddAt=${addAt} onClose=${()=>setAdding(false)} fixedTracks=${fixedTracksRef} />`}

        ${sections.map(sec => {
          const items = list.filter(a => a.section === sec);
          return html`
            <div key=${sec}>
              <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'0 0 10px 4px'}}>${SECTION_LABELS[sec]}</h3>
              <div style=${{display:'grid', gap:'8px'}}>
                ${items.length === 0 && html`<div style=${{color:'var(--text-dim)', fontSize:'12.5px', padding:'8px 4px'}}>Nenhuma atividade no padrão ainda.</div>`}
                ${items.map((a,i) => html`<${ActivityCard} key=${a.id} act=${a} idx=${i} onToggle=${toggle} onDelete=${remove} onEdit=${edit} onToggleFix=${toggleFix} onToggleWeekly=${toggleWeekly} onReorder=${moveActivity} siblings=${items} fixedTracks=${fixedTracksRef} churchId=${churchId} />`)}
              </div>
            </div>
          `;
        })}

        <div class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'16px', display:'flex', justifyContent:'flex-end', gap:'8px', position:'sticky', bottom:'12px'}}>
          <button onClick=${onClose} style=${btnGhost}>Cancelar</button>
          <button onClick=${()=>onSave(list.map(a=>({...a, done:false})))} style=${{...btnPrimary, width:'auto', padding:'10px 20px'}}>💾 Salvar Novo Padrão</button>

  `;
}

// Script comum injetado em toda janela de projeção: tenta tela cheia sozinho assim que a janela
// abre (funciona na maioria das vezes, porque ainda está "dentro" do clique em Projetar) e, se o
// navegador bloquear essa tentativa automática, QUALQUER toque/clique na tela — em qualquer lugar,
// não só no botãozinho — repete a tentativa e também manda o vídeo tocar (se houver um player do
// YouTube na página). Assim, na pior das hipóteses, é só um toque em vez de precisar caçar o botão
// de play E o de tela cheia separadamente.
function projectionAutoScript(withPlayer) {
  return '<scr'+'ipt>'
    + 'function gcTryStart(){'
    + 'try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().then(function(){var b=document.getElementById("fs-fallback");if(b)b.style.display="none";}).catch(function(){});}catch(e){}'
    + (withPlayer ? 'try{var f=document.getElementById("gc-player");if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:"command",func:"playVideo",args:[]}),"*");}catch(e){}' : '')
    + '}'
    + 'gcTryStart();'
    + 'document.addEventListener("click",gcTryStart);'
    + 'document.addEventListener("touchend",gcTryStart);'
    + '<\/scr'+'ipt>';
}

// Quando o vídeo projetado chega ao fim (evento ENDED da API do YouTube), desce o volume aos
// poucos em vez de cortar seco ou ficar preso no último quadro tocando alto. Só entra em ação no
// fim natural do vídeo — não interfere em nada enquanto ele está tocando normalmente.
function videoFadeOutScript() {
  return '<scr'+'ipt src="https://www.youtube.com/iframe_api"><\/scr'+'ipt>'
    + '<scr'+'ipt>'
    + 'var gcYtPlayer=null,gcFading=false;'
    + 'function gcFadeOutEnd(){'
      + 'if(gcFading||!gcYtPlayer)return;gcFading=true;'
      + 'var startVol=100;try{startVol=gcYtPlayer.getVolume();}catch(e){}'
      + 'var steps=16,n=0;'
      + 'var iv=setInterval(function(){'
        + 'n++;var v=Math.max(0,Math.round(startVol*(1-n/steps)));'
        + 'try{gcYtPlayer.setVolume(v);}catch(e){}'
        + 'if(n>=steps){clearInterval(iv);try{gcYtPlayer.pauseVideo();}catch(e){}}'
      + '},110);'
    + '}'
    + 'function onYouTubeIframeAPIReady(){'
      + 'try{gcYtPlayer=new YT.Player("gc-player",{events:{onStateChange:function(e){if(e.data===0)gcFadeOutEnd();}}});}catch(e){}'
    + '}'
    + '<\/scr'+'ipt>';
}

// Janelas de projeção compartilhadas entre abas/telas da aplicação (evita reabrir com popup toda vez)
const projectionWindows = {};

function screensEnabledKey(churchId) { return 'gc_telas_habilitadas_' + churchId; }
function loadEnabledScreens(churchId) {
  try { const raw = localStorage.getItem(screensEnabledKey(churchId)); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function saveEnabledScreens(churchId, list) {
  try { localStorage.setItem(screensEnabledKey(churchId), JSON.stringify(list)); } catch(e) {}
}
function screenSig(s) { return s.width+'x'+s.height+'@'+s.left+','+s.top; }

// Telas adicionadas "na mão" (pedido do Paulo, 25/09) — pra quando o navegador não detecta uma tela
// sozinho, ou pra deixar um "slot" já configurado com posição/tamanho antes mesmo de plugar o
// monitor/projetor. Ficam salvas neste aparelho (cada operador tem as suas), junto da lista de
// telas detectadas automaticamente, e entram no mesmo fluxo de habilitar/Projetor/Operador.
function manualScreensKey(churchId) { return 'gc_telas_manuais_' + churchId; }
function loadManualScreens(churchId) {
  try { const raw = localStorage.getItem(manualScreensKey(churchId)); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function saveManualScreens(churchId, list) {
  try { localStorage.setItem(manualScreensKey(churchId), JSON.stringify(list)); } catch(e) {}
}
function getProjectorScreen(churchId) {
  const list = loadEnabledScreens(churchId);
  return list.find(s => s.isProjector) || (list.length === 1 ? list[0] : null);
}
// Tela de Retorno — monitor voltado pra quem está na frente (pregador, apresentador), separado do
// projetor que a congregação vê. Usada pelo cronômetro pra mostrar a contagem pra quem está falando.
function getReturnScreen(churchId) {
  const list = loadEnabledScreens(churchId);
  return list.find(s => s.isReturnScreen) || null;
}

// Guarda, por item (uma atividade, um anúncio, um vídeo da semana), pra qual tela ele deve ir
// quando a pessoa aperta "Projetar" — em vez de mandar sempre pra todas as telas habilitadas.
// Fica salvo neste aparelho (cada operador escolhe suas próprias telas).
function screenPrefKey(churchId, itemKey) { return 'gc_tela_pref_' + churchId + '_' + itemKey; }
function loadScreenPref(churchId, itemKey) {
  if (!itemKey) return '';
  try { return localStorage.getItem(screenPrefKey(churchId, itemKey)) || ''; } catch(e) { return ''; }
}
function saveScreenPref(churchId, itemKey, sig) {
  if (!itemKey) return;
  try {
    if (sig) localStorage.setItem(screenPrefKey(churchId, itemKey), sig);
    else localStorage.removeItem(screenPrefKey(churchId, itemKey));
  } catch(e) {}
}
// Escolhe pra qual(is) tela(s) mandar: se tiver uma preferência salva pra esse item e a tela ainda
// existir entre as habilitadas, manda só pra ela; senão (sem preferência, ou a tela salva não existe
// mais), manda pra todas as habilitadas — o comportamento de sempre.
function pickTargetScreens(churchId, itemKey, enabled) {
  const sig = loadScreenPref(churchId, itemKey);
  if (!sig) return enabled;
  const chosen = enabled.filter(s => screenSig(s) === sig);
  return chosen.length > 0 ? chosen : enabled;
}

// Botãozinho "🖥️" que abre uma lista das telas habilitadas pra escolher (e salvar) qual delas deve
// receber esse item específico quando for projetado. Só aparece quando dá pra escolher (2+ telas
// habilitadas) — com 0 ou 1 tela não há o que escolher.
function ScreenPickerButton({ churchId, itemKey }) {
  const [open, setOpen] = useState(false);
  const [screens, setScreens] = useState(() => loadEnabledScreens(churchId));
  const [pref, setPref] = useState(() => loadScreenPref(churchId, itemKey));
  const toggle = () => { if (!open) setScreens(loadEnabledScreens(churchId)); setOpen(v=>!v); };
  if (screens.length < 2) return '';
  const choose = (sig) => { saveScreenPref(churchId, itemKey, sig); setPref(sig); setOpen(false); };
  const current = screens.find(s => screenSig(s) === pref);
  return html`
    <div style=${{position:'relative'}}>
      <button type="button" onClick=${toggle} title="Escolher em qual tela projetar" style=${{...btnGhost, padding:'6px 8px', fontSize:'10.5px', whiteSpace:'nowrap'}}>
        🖥️${current ? ' '+current.label : ''}
      </button>
      ${open && html`
        <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', right:0, zIndex:200, borderRadius:'10px', padding:'5px', display:'grid', gap:'3px', minWidth:'190px', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
          <button type="button" onClick=${()=>choose('')} style=${{textAlign:'left', padding:'6px 8px', borderRadius:'7px', border:'none', background: pref==='' ? 'rgba(99,102,241,0.18)' : 'transparent', fontSize:'11px', color:'var(--text-hi)'}}>📡 Todas as telas habilitadas</button>
          ${screens.map(s => html`
            <button key=${screenSig(s)} type="button" onClick=${()=>choose(screenSig(s))} style=${{textAlign:'left', padding:'6px 8px', borderRadius:'7px', border:'none', background: pref===screenSig(s) ? 'rgba(99,102,241,0.18)' : 'transparent', fontSize:'11px', color:'var(--text-hi)'}}>🖥️ ${s.label}${s.isProjector ? ' (projetor)' : ''}</button>
          `)}
        </div>
      `}
    </div>
  `;
}

function videoEmbedHtml(media) {
  // youtube-nocookie.com em vez de youtube.com: evita a caixinha de consentimento de cookies do
  // Google que às vezes aparece por cima do vídeo na primeira vez (a "caixa de popup" que atrapalha
  // a reprodução automática). modestbranding/rel/iv_load_policy tiram distrações da tela; playsinline
  // evita que o celular assuma um player nativo separado em vez da nossa própria tela cheia;
  // enablejsapi permite mandar o comando de "play" por script se a reprodução automática for bloqueada.
  const params = 'autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&enablejsapi=1&mute=0';
  const src = media.videoId
    ? 'https://www.youtube-nocookie.com/embed/'+media.videoId+'?'+params
    : media.playlistId
    ? 'https://www.youtube-nocookie.com/embed/videoseries?list='+media.playlistId+'&'+params
    : null;
  if (!src) return null;
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Projeção</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;}iframe{position:fixed;inset:0;width:100%;height:100%;border:none;}#fs-fallback{position:fixed;bottom:16px;right:16px;padding:10px 16px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #475569;font-size:14px;cursor:pointer;z-index:10;}</style></head><body><iframe id="gc-player" src="'+src+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe><button id="fs-fallback" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();this.style.display=\'none\';">⛶ Tela Cheia</button>'+videoFadeOutScript()+projectionAutoScript(true)+'</body></html>';
}

function openMediaInNewTab(media) {
  try {
    const embedHtml = videoEmbedHtml(media);
    const win = window.open('', '_blank');
    if (!win) { alert('Erro: o navegador bloqueou a abertura da nova aba. Vá nas configurações do navegador e permita pop-ups pra este site.'); return; }
    if (embedHtml) {
      win.document.open();

      win.location.href = media.url;
    }
  } catch (e) {
    alert('Erro ao tentar tocar o vídeo: ' + (e && e.message ? e.message : String(e)));
  }
}

// Página "casca" da janela de projeção: montada UMA vez só, quando a janela é aberta pela primeira
// vez. Cada vídeo/imagem/texto novo chega depois disso por postMessage, trocando só o conteúdo de
// dentro dela — sem nunca escrever a página de novo. Isso é o que resolve o pedido de tela cheia e
// reprodução automática: antes, cada "Projetar" reescrevia a janela inteira (document.write), o que
// por regra de segurança do navegador SEMPRE derrubava a tela cheia e exigia um novo toque; agora,
// a tela cheia (pedida uma vez, no primeiro toque) e a permissão de tocar som automaticamente
// (concedida pelo navegador depois desse primeiro toque nesta janela) continuam valendo pros
// próximos vídeos, porque a janela nunca é recriada.
function projectionShellHtml() {
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Projeção</title><style>'
    + 'html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:-apple-system,sans-serif;}'
    + '#gc-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;}'
    + '#gc-stage iframe{position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1;}'
    + '#gc-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}'
    + '#gc-stage video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}'
    + '#gc-stage h1{font-size:5vw;text-align:center;padding:0 4vw;}'
    // Camada separada, por cima do #gc-stage — pra dar pra projetar um texto (ex: versículo bíblico)
    // com fade suave SEM apagar o que já está sendo projetado embaixo (foto, slide, vídeo).
    + '#gc-overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:6vh 5vw;opacity:0;}'

      // Se não tinha nenhuma foto/slide/vídeo por baixo do texto (tela estava vazia, só o versículo

      + 'function closeIfStageEmpty(){try{if(!stage.innerHTML.trim())window.close();}catch(e){}}'
      + 'function clearOverlayText(){'

      + 'function fadeOutEnd(){'

        + 'var startVol=100;try{startVol=ytPlayer.getVolume();}catch(e){}'
        + 'var steps=16,n=0;'

          + 'try{ytPlayer.setVolume(v);}catch(e){}'
          + 'if(n>=steps){clearInterval(iv);try{ytPlayer.pauseVideo();}catch(e){}}'
        + '},110);'
      + '}'
      + 'function renderVideo(media,mute){'

      + 'window.onYouTubeIframeAPIReady=function(){if(document.getElementById("gc-player"))bindYt(lastMute);};'
      + 'var ytScript=document.createElement("scr"+"ipt");ytScript.src="https://www.youtube.com/iframe_api";document.head.appendChild(ytScript);'
      + 'window.addEventListener("message",function(ev){'

async function sendToScreenObj(scr, kind, payload, opts) {
  try {
    const sig = screenSig(scr);
    const features = 'left='+scr.left+',top='+scr.top+',width='+scr.width+',height='+scr.height;
    let win = projectionWindows[sig];
    let isNewWindow = false;

    // Se o navegador suportar (Chrome/Edge), pega o "objeto de tela" detalhado ANTES de abrir a
    // janela — é ele que permite pedir tela cheia numa tela específica (mesmo a de projeção, sem
    // mouse/teclado) direto pelo clique do usuário aqui no app principal, sem precisar de nenhum
    // clique dentro da janela projetada. Isso é o que resolve o "não vai pra tela cheia sozinho".
    let fsScreen = null;
    if (!win || win.closed) {
      try {
        if ('getScreenDetails' in window) {
          const details = await window.getScreenDetails();
          fsScreen = details.screens.find(s => s.left===scr.left && s.top===scr.top && s.width===scr.width && s.height===scr.height) || null;
        }
      } catch(e) {}
      win = window.open('', 'gc_screen_'+sig, features);
      projectionWindows[sig] = win;
      isNewWindow = true;
    } else {
      try { win.moveTo(scr.left, scr.top); win.resizeTo(scr.width, scr.height); } catch(e) {}
    }
    if (!win) { alert('Erro: o navegador bloqueou a abertura da janela de projeção. Vá nas configurações do navegador e permita pop-ups pra este site (só precisa autorizar uma vez).'); return; }

    if (isNewWindow) {
      // Só escreve a página inteira UMA vez, na primeira abertura desta tela — as próximas trocas
      // de conteúdo (mesmo de outra atividade, minutos depois) reaproveitam essa mesma janela.
      win.document.open();
      win.document.write(projectionShellHtml());
      win.document.close();
      // Pede tela cheia aqui mesmo, ainda dentro do clique do usuário. Quando o navegador suporta a
      // API de múltiplas telas (fsScreen preenchido), a tela cheia é pedida JÁ na tela de destino
      // certa, automaticamente — sem precisar de nenhum clique dentro da janela projetada. Sem essa
      // API (outro navegador, ou permissão de telas ainda não concedida), cai no botão "Tela Cheia"
      // que aparece dentro da janela como alternativa manual.
      const tryFs = () => {
        try {
          const el = win.document.documentElement;
          if (el && el.requestFullscreen && !win.document.fullscreenElement) {
            (fsScreen ? el.requestFullscreen({ screen: fsScreen }) : el.requestFullscreen()).catch(()=>{});
          }
        } catch(e) {}
      };
      tryFs();
      // Tenta de novo quando a janela terminar de carregar — em alguns casos o pedido de tela cheia
      // só é aceito pelo navegador depois desse evento (é o padrão que o próprio Chrome recomenda
      // pra esse cenário de "tela cheia numa tela específica").
      try { win.addEventListener('load', tryFs, { once: true }); } catch(e) {}
      try { setTimeout(tryFs, 300); } catch(e) {}
    }

    const mute = !!(opts && opts.mute);
    const msg = kind === 'media'
      ? { gcType:'media', media: (payload && typeof payload === 'object') ? payload : { url: payload }, mute }
      : kind === 'imagem' ? { gcType:'imagem', item: payload || {} }
      : kind === 'localvideo' ? { gcType:'localvideo', item: payload || {}, mute }
      : kind === 'texto' ? { gcType:'texto', text: payload || '' }
      : kind === 'cronometro' ? { gcType:'cronometro', item: payload || {} }
      : kind === 'overlay_texto' ? { gcType:'overlay_texto', item: payload || {} }
      : kind === 'overlay_limpar' ? { gcType:'overlay_limpar' }
      : kind === 'media_play' ? { gcType:'media_play' }
      : kind === 'media_pause' ? { gcType:'media_pause' }
      : { gcType:'blank' };
    const post = () => { try { win.postMessage(msg, '*'); } catch(e) {} };
    // Numa janela recém-criada, dá um tiquinho pro script da página terminar de registrar o "ouvinte"
    // de mensagens antes de mandar o conteúdo; numa janela já aberta, manda na hora.
    if (isNewWindow) { setTimeout(post, 60); } else { post(); }
    win.focus();
  } catch (e) {
    alert('Erro ao enviar para a tela: ' + (e && e.message ? e.message : String(e)));
  }
}

// Fecha de verdade a(s) aba(s)/janela(s) de projeção — pedido explícito do Paulo (25/09): quando
// apertar "Fechar", tem que fechar a aba completamente, não só apagar o conteúdo. Manda um aviso pra
// janela se fechar sozinha (isso NUNCA é bloqueado pelo navegador, mesmo que a referência aqui do
// lado do operador esteja "velha") e, por garantia, também tenta fechar direto pela referência.
function closeAllProjectionScreens() {
  Object.keys(projectionWindows).forEach(sig => {
    const win = projectionWindows[sig];
    try { if (win && !win.closed) win.postMessage({ gcType:'close_self' }, '*'); } catch(e) {}
    try { if (win && !win.closed) win.close(); } catch(e) {}
    delete projectionWindows[sig];
  });
}

// Play/Pause/Tela Cheia/Fechar do controle miniatura (ProjectionMiniControl) — pedido do Paulo
// (25/09): botões separados e diretos, agindo só nas janelas de projeção que já estiverem abertas
// (não abre uma janela nova só por apertar Play/Pause).
function playAllScreens(churchId) {
  Object.keys(projectionWindows).forEach(sig => {
    const win = projectionWindows[sig];
    try { if (win && !win.closed) win.postMessage({ gcType:'media_play' }, '*'); } catch(e) {}
  });
}
function pauseAllScreens(churchId) {
  Object.keys(projectionWindows).forEach(sig => {
    const win = projectionWindows[sig];
    try { if (win && !win.closed) win.postMessage({ gcType:'media_pause' }, '*'); } catch(e) {}
  });
}

// Pede tela cheia de novo pras janelas de projeção já abertas. Chamado direto (sem postMessage) a
// partir de um clique real do operador aqui na janela principal — é o mesmo truque usado quando a
// janela é aberta pela primeira vez: o navegador só permite pedir tela cheia numa janela de destino
// quando o pedido acontece durante o mesmo clique do usuário, mesmo que a chamada mire noutra janela.
function retryFullscreenAllScreens(churchId) {
  const enabled = loadEnabledScreens(churchId);
  enabled.forEach(scr => {
    const win = projectionWindows[screenSig(scr)];
    if (win && !win.closed) {
      try {
        const el = win.document.documentElement;
        if (el && el.requestFullscreen && !win.document.fullscreenElement) el.requestFullscreen().catch(()=>{});
      } catch(e) {}
    }
  });
}

// Bíblia Sagrada: busca o versículo (tenta automático pela internet, tradução Almeida; sempre dá pra
// ajustar/colar o texto à mão antes de projetar, do mesmo jeito confiável usado pra letra de música) e
// projeta como texto animado por cima do que já estiver na tela (foto/slide/vídeo) — não apaga o que já
// está projetado. Dá pra configurar o tempo de entrada/saída (fade) e quanto tempo fica na tela.
function BibliaTool({ churchId, churchLogo }) {
  const [bookIdx, setBookIdx] = useState(42); // João, o mais comum em pregações
  const [chapter, setChapter] = useState('3');
  const [verse, setVerse] = useState('16');
  const [text, setText] = useState('');
  const [reference, setReference] = useState('');
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState('');
  const [fadeSec, setFadeSec] = useState(0.8);
  const [holdSec, setHoldSec] = useState(8);
  const [holdForever, setHoldForever] = useState(false);

  const buscar = async () => {
    setSearching(true);
    setSearchError('');
    try {
      const [label, slug] = BIBLE_BOOKS[bookIdx];
      const ref = chapter.trim() + (verse.trim() ? ':' + verse.trim() : '');
      if (!chapter.trim()) throw new Error('sem capítulo');
      // Importante: NÃO usar encodeURIComponent na referência inteira — ela tem ":" (e às vezes "-" pra
      // intervalo de versículos), e essa API só reconhece a referência com esses caracteres "crus" na URL.
      // Só o espaço entre as palavras do nome do livro precisa virar %20.
      const url = 'https://bible-api.com/' + slug.split(' ').join('%20') + '%20' + ref + '?translation=almeida';
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok || !data.text) throw new Error(data.error || 'não encontrado');
      setText(data.text.trim());
      setReference(data.reference || (label + ' ' + ref));
    } catch (e) {
      setSearchError('Não consegui buscar esse automaticamente — sem problema, é só colar ou escrever o texto do versículo aqui embaixo.');
      const [label] = BIBLE_BOOKS[bookIdx];
      setReference(label + ' ' + chapter + (verse.trim() ? ':' + verse.trim() : ''));
    } finally {
      setSearching(false);
    }
  };

  const projetar = () => {
    if (!text.trim()) { alert('Escreva ou busque o texto do versículo primeiro.'); return; }
    try {
      const enabled = loadEnabledScreens(churchId);
      if (enabled.length === 0) { alert('Nenhuma tela habilitada ainda. Vá na aba "Telas" e habilite pelo menos uma.'); return; }
      const fadeMs = Math.max(100, Math.round((parseFloat(fadeSec) || 0.8) * 1000));
      const holdMs = holdForever ? 0 : Math.max(500, Math.round((parseFloat(holdSec) || 8) * 1000));
      pickTargetScreens(churchId, 'biblia-overlay', enabled).forEach(scr => {
        try { sendToScreenObj(scr, 'overlay_texto', { text: text.trim(), reference: reference.trim(), fadeMs, holdMs, logoDataUrl: churchLogo || '' }); } catch (e) { alert('Erro ao projetar: ' + (e && e.message ? e.message : e)); }
      });
    } catch (e) {
      alert('Erro ao preparar a projeção: ' + (e && e.message ? e.message : e));
    }
  };

  const tirarDaTela = () => {
    try {
      const enabled = loadEnabledScreens(churchId);
      pickTargetScreens(churchId, 'biblia-overlay', enabled).forEach(scr => {
        try { sendToScreenObj(scr, 'overlay_limpar'); } catch (e) {}
      });
    } catch (e) {}
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>Escolha o versículo, confira o texto e projete animado — funciona por cima de uma foto, slide ou vídeo que já esteja na tela, sem apagar o que tá lá. O texto aparece centralizado na tela, com a referência (livro e capítulo/versículo) e a logo da igreja (se você cadastrou uma em Config).</div>

function CronometroTool() {
  const [ms, setMs] = useState(0);
  const [running, setRunning] = useState(false);
  const startRef = useRef(0);
  useEffect(() => {
    if (!running) return;
    startRef.current = Date.now() - ms;
    const id = setInterval(() => setMs(Date.now() - startRef.current), 50);
    return () => clearInterval(id);
  }, [running]);
  const format = (t) => {
    const totalSec = Math.floor(t/1000);
    const m = String(Math.floor(totalSec/60)).padStart(2,'0');
    const s = String(totalSec%60).padStart(2,'0');
    const cs = String(Math.floor((t%1000)/10)).padStart(2,'0');
    return m+':'+s+'.'+cs;
  };
  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px', textAlign:'center'}}>
      <div style=${{fontWeight:800, fontSize:'13px', textAlign:'left'}}>⏱️ Cronômetro</div>
      <div style=${{fontSize:'40px', fontWeight:800, fontVariantNumeric:'tabular-nums'}}>${format(ms)}</div>
      <div style=${{display:'flex', gap:'8px', justifyContent:'center'}}>
        <button onClick=${()=>setRunning(r=>!r)} style=${{...btnPrimary, width:'auto', padding:'9px 18px'}}>${running ? '⏸ Pausar' : '▶ Iniciar'}</button>
        <button onClick=${()=>{ setRunning(false); setMs(0); }} style=${{...btnGhost, padding:'9px 18px'}}>↺ Zerar</button>
      </div>
    </div>
  `;
}

function PowerpointTool({ churchName }) {
  const [title, setTitle] = useState('');
  const [subtitle, setSubtitle] = useState('');
  const [slides, setSlides] = useState([{ title:'', body:'' }]);
  const [status, setStatus] = useState('');

  const updateSlide = (i, patch) => setSlides(s => s.map((sl,idx) => idx===i ? {...sl, ...patch} : sl));
  const addSlide = () => setSlides(s => [...s, { title:'', body:'' }]);
  const removeSlide = (i) => setSlides(s => s.filter((_,idx)=>idx!==i));

  const gerar = async () => {
    if (!title.trim()) { alert('Dê um título pra apresentação.'); return; }
    setStatus('Gerando...');
    try {
      const pptx = new window.PptxGenJS();
      const capa = pptx.addSlide();
      capa.background = { color: '1e293b' };
      capa.addText(title, { x:0.5, y:2.2, w:9, h:1.2, fontSize:36, bold:true, color:'FFFFFF', align:'center' });
      if (subtitle.trim()) capa.addText(subtitle, { x:0.5, y:3.3, w:9, h:0.8, fontSize:18, color:'CBD5E1', align:'center' });
      if (churchName) capa.addText(churchName, { x:0.5, y:6.6, w:9, h:0.5, fontSize:12, color:'94A3B8', align:'center' });

      slides.forEach(sl => {
        if (!sl.title.trim() && !sl.body.trim()) return;
        const s = pptx.addSlide();
        s.background = { color: 'FFFFFF' };
        if (sl.title.trim()) s.addText(sl.title, { x:0.5, y:0.4, w:9, h:0.8, fontSize:26, bold:true, color:'1e293b' });
        if (sl.body.trim()) s.addText(sl.body, { x:0.5, y:1.4, w:9, h:5, fontSize:16, color:'334155' });
      });

      const blob = await pptx.write({ outputType:'blob' });
      const dl = await claude.use('downloads');
      if (!dl) { setStatus('Download não disponível aqui.'); return; }
      const res = await dl.save({ filename: title.replace(/[^a-z0-9áéíóúàâêôãõç \-]/gi,'').trim()+'.pptx', data: blob });
      setStatus(res.status === 'saved' ? '✅ Salvo!' : '');
    } catch (e) {
      setStatus('Não foi possível gerar agora.');
    }
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
      <div style=${{fontWeight:800, fontSize:'13px'}}>📊 Criador de PowerPoint (Comunicação)</div>
      <input placeholder="Título da apresentação" value=${title} onChange=${e=>setTitle(e.target.value)} style=${inputStyle} />
      <input placeholder="Subtítulo (opcional)" value=${subtitle} onChange=${e=>setSubtitle(e.target.value)} style=${inputStyle} />
      <div style=${{display:'grid', gap:'8px'}}>
        ${slides.map((sl,i) => html`
          <div key=${i} class="glass fade-up" style=${{padding:'10px', borderRadius:'12px', display:'grid', gap:'6px'}}>
            <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <span style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Slide ${i+2}</span>
              <button onClick=${()=>removeSlide(i)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'13px'}}>✕</button>
            </div>
            <input placeholder="Título do slide" value=${sl.title} onChange=${e=>updateSlide(i,{title:e.target.value})} style=${{...inputStyle, fontSize:'12px'}} />
            <textarea placeholder="Texto do slide" value=${sl.body} onChange=${e=>updateSlide(i,{body:e.target.value})} rows="3" style=${{...inputStyle, fontSize:'12px', resize:'vertical', fontFamily:'inherit'}}></textarea>
          </div>
        `)}
      </div>
      <button onClick=${addSlide} style=${{...btnGhost, justifySelf:'start'}}>+ Adicionar Slide</button>
      <button onClick=${gerar} style=${{...btnPrimary, width:'auto', justifySelf:'start', padding:'10px 20px'}}>📥 Gerar e Baixar PowerPoint</button>
      ${status && html`<div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>${status}</div>`}
    </div>
  `;
}

function NumberDrawTool({ churchId }) {
  const [min, setMin] = useState(1);
  const [max, setMax] = useState(60);
  const [qty, setQty] = useState(1);
  const [balls, setBalls] = useState([]);
  const [result, setResult] = useState([]);
  const [spinning, setSpinning] = useState(false);
  const [history, setHistory] = useState([]);

  useEffect(() => {
    const lo = Math.min(min, max), hi = Math.max(min, max);
    const range = hi - lo + 1;
    const pool = [];
    for (let i=lo; i<=hi; i++) pool.push(i);
    const count = Math.min(14, range);
    const chosen = [];
    for (let i=0; i<count; i++) {
      const idx = Math.floor(Math.random()*pool.length);
      chosen.push(pool.splice(idx,1)[0]);
    }
    const arr = chosen.map((num, i) => ({
      id: i,
      num,
      dur: 1.6 + Math.random()*1.2,
      delay: Math.random()*0.6,
      size: 34 + Math.random()*14,
      x1: Math.random()*70+5, y1: Math.random()*70+5,
      x2: Math.random()*70+5, y2: Math.random()*70+5,
      x3: Math.random()*70+5, y3: Math.random()*70+5,
      hue: Math.floor(Math.random()*360),
    }));
    setBalls(arr);
  }, [min, max]);

  const sortear = () => {
    const lo = Math.min(min, max), hi = Math.max(min, max);
    const n = Math.max(1, Math.min(qty, hi-lo+1));
    setSpinning(true);
    setResult([]);
    setTimeout(() => {
      const pool = [];
      for (let i=lo; i<=hi; i++) pool.push(i);
      const drawn = [];
      for (let i=0; i<n; i++) {
        const idx = Math.floor(Math.random()*pool.length);
        drawn.push(pool.splice(idx,1)[0]);
      }
      const sorted = drawn.sort((a,b)=>a-b);
      setResult(sorted);
      setHistory(h => [...h, ...sorted]);
      setSpinning(false);
    }, 2400);
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'12px'}}>
      <div style=${{fontWeight:800, fontSize:'13px'}}>🎱 Sorteador de Números (Globo)</div>

      <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px'}}>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>De</div>
          <input type="number" value=${min} onChange=${e=>setMin(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>Até</div>
          <input type="number" value=${max} onChange=${e=>setMax(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>Quantos</div>
          <input type="number" min="1" value=${qty} onChange=${e=>setQty(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
      </div>

      <div style=${{
        position:'relative', width:'220px', height:'220px', margin:'0 auto', borderRadius:'50%',
        background:'radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 40%, transparent 60%), radial-gradient(circle, rgba(148,163,184,0.12), rgba(15,23,42,0.5))',
        border:'3px solid rgba(148,163,184,0.35)', overflow:'hidden', boxShadow:'inset 0 0 30px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3)'
      }}>
        ${balls.map(b => html`
          <div key=${b.id} style=${{
            position:'absolute', width:b.size+'px', height:b.size+'px', borderRadius:'50%',
            left:'0%', top:'0%',
            background:'hsl('+b.hue+',70%,55%)',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:(b.size*0.4)+'px', fontWeight:800, color:'#fff',
            boxShadow:'inset -3px -3px 6px rgba(0,0,0,0.35), inset 2px 2px 4px rgba(255,255,255,0.4)',
            animation: spinning ? ('ballBounce'+b.id+' '+b.dur+'s ease-in-out '+b.delay+'s infinite alternate') : 'none',
            transform: spinning ? undefined : 'translate(90px,90px)',
            transition: spinning ? 'none' : 'transform 0.6s ease'
          }}>${b.num}</div>
          <style>
            @keyframes ballBounce${b.id} {
              0% { transform: translate(${b.x1}%, ${b.y1}%); }
              50% { transform: translate(${b.x2}%, ${b.y2}%); }
              100% { transform: translate(${b.x3}%, ${b.y3}%); }
            }
          </style>
        `)}
      </div>

      <button onClick=${sortear} disabled=${spinning} style=${{...btnPrimary, width:'auto', justifySelf:'center', padding:'10px 22px'}}>${spinning ? 'Sorteando...' : '🎱 Girar e Sortear'}</button>

      ${result.length > 0 && html`
        <div style=${{display:'grid', gap:'10px'}}>
          <div style=${{display:'flex', gap:'8px', justifyContent:'center', flexWrap:'wrap'}}>
            ${result.map(n => html`
              <div key=${n} style=${{width:'46px', height:'46px', borderRadius:'50%', background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:'16px', boxShadow:'0 4px 10px rgba(0,0,0,0.3)'}}>${n}</div>
            `)}
          </div>
          <button onClick=${()=>{
            const projector = loadEnabledScreens(churchId).find(s=>s.isProjector) || loadEnabledScreens(churchId)[0];
            if (!projector) { alert('Nenhuma tela habilitada ainda. Vá na aba "Telas" e habilite pelo menos uma.'); return; }
            sendToScreenObj(projector, 'texto', result.join('  -  '));
          }} style=${{...btnGhost, justifySelf:'center', padding:'8px 16px'}}>📽️ Projetar no Telão</button>
        </div>
      `}

      ${history.length > 0 && html`
        <div style=${{borderTop:'1px solid var(--border-soft)', paddingTop:'12px', display:'grid', gap:'8px'}}>
          <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em'}}>Já sorteados (${history.length})</div>
            <button onClick=${()=>setHistory([])} style=${{...btnGhost, padding:'5px 10px', fontSize:'10.5px'}}>🗑️ Limpar</button>
          </div>
          <div style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
            ${history.map((n,i) => html`
              <div key=${i} style=${{width:'32px', height:'32px', borderRadius:'50%', background:'rgba(148,163,184,0.16)', color:'var(--text-hi)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:'12px'}}>${n}</div>
            `)}
          </div>
        </div>
      `}
    </div>
  `;
}

function MensagensMusicaisTool({ churchId, church, onUpdateChurch, shareUrl }) {
  const docId = church && (church.fbDocId || church.docId);
  const [activities, setActivities] = useState(() => (church && church.activities) || loadActivities(churchId));
  // Reagir quando "church.activities" chega/muda depois da montagem (por exemplo, na página pública
  // de cadastro, onde o documento vem do Firestore de forma assíncrona) — sem isso a lista ficava
  // presa no valor de quando o componente montou. Mesma causa raiz do bug já corrigido no ActivityCard.
  useEffect(() => { if (church && church.activities) setActivities(church.activities); }, [church && church.activities]);
  const items = activities.filter(a => a.category === 'mensagem_musical');

  const setMediaFor = (actId, media) => {
    setActivities(list => {
      const next = list.map(a => a.id === actId ? { ...a, media: media || null } : a);
      saveActivities(churchId, next);
      if (docId) fbUpdateChurchFields(docId, { activities: next });
      if (onUpdateChurch) onUpdateChurch({ activities: next });
      return next;
    });
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'12px'}}>

      <div style=${{display:'grid', gap:'10px'}}>
        ${items.length === 0 && html`<div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Nenhuma mensagem musical na liturgia desta semana ainda. Vá na aba Liturgia pra criar a atividade primeiro.</div>`}
        ${items.map((a,i) => html`
          <div key=${a.id} class="glass" style=${{padding:'12px', borderRadius:'14px', border:'1px solid var(--border-soft)', display:'grid', gap:'8px'}}>
            <div>
              <div style=${{display:'inline-flex', alignItems:'center', gap:'5px', padding:'3px 9px', borderRadius:'999px', background:'rgba(99,102,241,0.15)', color:'var(--accent-1)', fontWeight:800, fontSize:'10.5px', marginBottom:'6px'}}>🕐 ${a.time} · ${SECTION_LABELS[a.section] || a.section}</div>
              <div style=${{fontWeight:700, fontSize:'12.5px'}}>${items.length > 1 ? 'Mensagem Musical '+(i+1)+' — ' : ''}${a.name}</div>
              <div style=${{fontSize:'10.5px', color:'var(--text-mid)'}}>${a.responsible}</div>
            </div>
            <${MediaSearchField} media=${a.media} onChange=${(m)=>setMediaFor(a.id, m)} searchKey=${a.id} />
          </div>
        `)}
      </div>
    </div>
  `;
}

const SONG_COLLECTIONS = ['Hinário Adventista (Novo)', 'Hinário Adventista (Antigo)', 'Coletânea Jovem', 'CDs Jovens', 'Adoradores', 'Cantores', 'Outra Coleção'];

function CatalogoMusicasTool({ churchId }) {

  const storeKey = 'gc_catalogo_musicas_' + churchId + '_' + collection;
  const load = () => { try { const raw = localStorage.getItem(storeKey); if (raw) return JSON.parse(raw); } catch(e) {} return []; };
  const [items, setItems] = useState(load);
  useEffect(() => { setItems(load()); }, [collection]);
  const save = (list) => { try { localStorage.setItem(storeKey, JSON.stringify(list)); } catch(e) {} };

  const [number, setNumber] = useState('');
  const [title, setTitle] = useState('');
  const [notes, setNotes] = useState('');

  const add = (e) => {
    e.preventDefault();

          <div key=${it.id} class="glass fade-up" style=${{padding:'9px 12px', borderRadius:'10px', display:'flex', alignItems:'center', gap:'10px'}}>
            <div style=${{flex:1}}>
              <div style=${{fontWeight:700, fontSize:'12px'}}>${it.number ? '#'+it.number+' — ' : ''}${it.title}</div>
              ${it.notes && html`<div style=${{fontSize:'10px', color:'var(--text-dim)'}}>${it.notes}</div>`}

          </div>
        `)}
      </div>
    </div>
  `;
}

// Lê "?cad=louvor&id=<docId>" ou "?cad=mensagem&id=<docId>" da URL — os links públicos de cadastro
// (pedido do Paulo em 25/09: um link pros regentes da equipe de louvor, outro pra quem vai cantar a
// mensagem musical, sem acesso ao resto do app). Lido uma única vez, direto da URL: não muda durante
// a sessão, então não tem problema de regra dos hooks em App() decidir o "return" antes dos hooks dela.
function getPublicCadastroParams() {
  try {
    const params = new URLSearchParams(window.location.search);
    const cad = params.get('cad');
    const id = params.get('id');
    if ((cad === 'louvor' || cad === 'mensagem') && id) return { tipo: cad, docId: id };
  } catch(e) {}
  return null;
}

// Página pública e sem login: a pessoa abre o link, vê só o nome da igreja e a ferramenta certa
// (Momentos de Louvor ou Mensagem Musical) pra escolher a música dela — nada do resto do app. Lê a
// igreja direto do Firestore pelo docId (sem passar pela lista de login), então funciona em qualquer
// aparelho, mesmo sem nunca ter aberto o app antes.
function PublicCadastroPage({ tipo, docId }) {
  const [church, setChurch] = useState(null);
  const [status, setStatus] = useState('loading'); // loading | ok | notfound

  useEffect(() => { applyTheme(loadTheme()); }, []);

  useEffect(() => {
    let stopped = false;
    const unsub = fbListenWhenReady(() => {
      try {
        const { doc, onSnapshot } = window.__fb.helpers;
        return onSnapshot(doc(window.__fb.db, 'igrejas', docId), snap => {
          if (stopped) return;
          if (!snap.exists()) { setStatus('notfound'); return; }
          const data = snap.data() || {};
          setChurch({ id: data.churchId || docId, fbDocId: docId, name: data.name || 'Igreja', activities: data.activities || [] });
          setStatus('ok');
        }, () => { if (!stopped) setStatus('notfound'); });
      } catch(e) { setStatus('notfound'); return () => {}; }
    });
    return () => { stopped = true; try { unsub(); } catch(e) {} };
  }, [docId]);

  if (status === 'loading') {
    return html`<div style=${{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--text-dim)', fontSize:'13px'}}>Carregando...</div>`;
  }
  if (status === 'notfound' || !church) {
    return html`<div style=${{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--text-dim)', fontSize:'13px', textAlign:'center', padding:'24px'}}>Link inválido ou não encontrado.<br/>Peça um link novo pra quem cuida da sonoplastia.</div>`;
  }

  const Tool = tipo === 'louvor' ? MomentosLouvorTool : MensagensMusicaisTool;

  return html`
    <div style=${{minHeight:'100vh', maxWidth:'560px', margin:'0 auto', padding:'28px 16px 60px'}}>
      <div style=${{textAlign:'center', marginBottom:'20px'}}>
        <div style=${{fontSize:'22px', marginBottom:'4px'}}>${tipo === 'louvor' ? '🎤' : '🎙️'}</div>
        <div style=${{fontSize:'11px', color:'var(--text-dim)', fontWeight:700, letterSpacing:'0.5px', textTransform:'uppercase'}}>${church.name}</div>
        <div style=${{fontSize:'16px', fontWeight:800, marginTop:'4px'}}>${tipo === 'louvor' ? 'Cadastro de Momento de Louvor' : 'Cadastro de Mensagem Musical'}</div>
      </div>
      <${Tool} churchId=${church.id} church=${church} onUpdateChurch=${(patch)=>setChurch(c=>({...c, ...patch}))} />
    </div>
  `;
}

function loadColetaneasCustom(churchId) {
  try { const raw = localStorage.getItem('gc_coletaneas_custom_'+churchId); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function saveColetaneasCustom(churchId, list) { try { localStorage.setItem('gc_coletaneas_custom_'+churchId, JSON.stringify(list)); } catch(e) {} }

// Vídeo vinculado a cada coletânea (independente de ser item fixo ou adicionado pela igreja) — guarda
// só o ID do vídeo do YouTube que a igreja colou, pra poder tocar/projetar direto sem precisar buscar de novo.
function loadColetaneasLinks(churchId) {
  try { const raw = localStorage.getItem('gc_coletaneas_links_'+churchId); if (raw) return JSON.parse(raw); } catch(e) {}
  return {};
}
function saveColetaneasLinks(churchId, map) { try { localStorage.setItem('gc_coletaneas_links_'+churchId, JSON.stringify(map)); } catch(e) {} }

// Faixas (músicas) de cada coletânea — igual à ideia do "abrir o CD e ver as músicas dele", só que do
// jeitinho do Gerenciador: cada faixa pode ter vídeo vinculado e letra, guardado por coletânea (chave =
// id da coletânea, seed ou personalizada) e por igreja, pra cada uma montar seu próprio repertório.
function coletaneaTracksKey(churchId) { return 'gc_coletanea_tracks_' + churchId; }
function loadColetaneaTracksAll(churchId) {
  try { const raw = localStorage.getItem(coletaneaTracksKey(churchId)); if (raw) return JSON.parse(raw); } catch(e) {}
  return {};
}
function saveColetaneaTracksAll(churchId, map) { try { localStorage.setItem(coletaneaTracksKey(churchId), JSON.stringify(map)); } catch(e) {} }
// Conta faixas pra mostrar no card — usa o que a igreja já salvou, ou, se ainda não mexeu, o que já vem
// pronto (COLETANEA_TRACKS_SEED), pra não parecer "vazio" numa coletânea que já tem música cadastrada.
function computeTracksCounts(churchId) {
  const map = loadColetaneaTracksAll(churchId);
  const counts = {};
  const ids = new Set([...Object.keys(map), ...Object.keys(COLETANEA_TRACKS_SEED)]);
  ids.forEach(id => { counts[id] = (map[id] && map[id].length) || (COLETANEA_TRACKS_SEED[id] && COLETANEA_TRACKS_SEED[id].length) || 0; });
  return counts;
}

// Quebra a letra em estrofes (parágrafos separados por linha em branco), pra poder projetar uma de
// cada vez — igual a como qualquer sonoplastia de culto avança a letra aos poucos, em vez de jogar a
// música inteira de uma vez na tela.
function splitLyricsIntoStanzas(text) {
  return String(text || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
}

// Navegador de estrofes: mostra a estrofe atual, deixa ir pra próxima/anterior e projetar só ela.
function LetraProjectorPanel({ churchId, lyrics, itemKey }) {
  const stanzas = splitLyricsIntoStanzas(lyrics);
  const [idx, setIdx] = useState(0);
  useEffect(() => { setIdx(0); }, [lyrics]);
  if (stanzas.length === 0) return '';
  const current = stanzas[Math.min(idx, stanzas.length - 1)];

  const project = () => {
    try {
      const enabled = loadEnabledScreens(churchId);
      if (enabled.length === 0) { alert('Nenhuma tela habilitada ainda. Vá na aba "Telas" e habilite pelo menos uma.'); return; }
      pickTargetScreens(churchId, itemKey, enabled).forEach(scr => sendToScreenObj(scr, 'texto', current));
    } catch (e) { alert('Erro ao projetar: ' + (e && e.message ? e.message : e)); }
  };

  return html`
    <div style=${{display:'grid', gap:'6px', padding:'10px', borderRadius:'10px', background:'rgba(99,102,241,0.08)', border:'1px solid var(--border-soft)'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-mid)', whiteSpace:'pre-line', lineHeight:1.4, maxHeight:'110px', overflowY:'auto'}}>${current}</div>
      <div style=${{display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap'}}>
        <button type="button" onClick=${()=>setIdx(i=>Math.max(0,i-1))} disabled=${idx===0} style=${{...btnGhost, padding:'5px 9px', fontSize:'10.5px', opacity: idx===0?0.4:1}}>◀</button>
        <span style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Estrofe ${idx+1}/${stanzas.length}</span>
        <button type="button" onClick=${()=>setIdx(i=>Math.min(stanzas.length-1,i+1))} disabled=${idx===stanzas.length-1} style=${{...btnGhost, padding:'5px 9px', fontSize:'10.5px', opacity: idx===stanzas.length-1?0.4:1}}>▶</button>
        <button type="button" onClick=${project} style=${{...btnPrimary, width:'auto', padding:'6px 12px', fontSize:'10.5px'}}>📽️ Projetar Esta Estrofe</button>
        ${itemKey && html`<${ScreenPickerButton} churchId=${churchId} itemKey=${itemKey} />`}
      </div>
    </div>
  `;
}

// Uma faixa dentro de uma coletânea: título, duração, vídeo (busca/vincula/projeta) e letra
// (escreve/edita/projeta estrofe por estrofe).
function ColetaneaTrackRow({ churchId, coletaneaId, track, onChange, onRemove }) {
  const [editingLyrics, setEditingLyrics] = useState(false);
  const [lyricsDraft, setLyricsDraft] = useState(track.lyrics || '');
  const [linkingVideo, setLinkingVideo] = useState(false);
  const media = track.media || null;
  const trackKey = 'colet-faixa-' + coletaneaId + '-' + track.id;

  const setTitle = (title) => onChange({ ...track, title });
  const setDuration = (duration) => onChange({ ...track, duration });
  const setMedia = (media) => onChange({ ...track, media });
  const saveLyrics = () => { onChange({ ...track, lyrics: lyricsDraft.trim() }); setEditingLyrics(false); };

  return html`
    <div class="glass fade-up" style=${{padding:'12px', borderRadius:'12px', display:'grid', gap:'8px', border:'1px solid var(--border-soft)'}}>
      <div style=${{display:'flex', alignItems:'center', gap:'8px'}}>
        <input value=${track.title} onChange=${e=>setTitle(e.target.value)} placeholder="Nome da faixa" style=${{...inputStyle, fontSize:'12.5px', fontWeight:700, flex:1}} />
        <input value=${track.duration||''} onChange=${e=>setDuration(e.target.value)} placeholder="0:00" style=${{...inputStyle, fontSize:'11.5px', width:'56px', textAlign:'center'}} />
        <button type="button" onClick=${onRemove} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'14px'}}>✕</button>
      </div>

      <div style=${{display:'flex', gap:'6px', flexWrap:'wrap', alignItems:'center'}}>
        ${linkingVideo
          ? html`<${ColetaneaLinkForm} onLink=${(vid)=>{setMedia({ title: track.title, url:'https://www.youtube.com/watch?v='+vid, videoId: vid }); setLinkingVideo(false);}} onCancel=${()=>setLinkingVideo(false)} />`
          : media
          ? html`
            <a href=${media.url} target="_blank" rel="noopener" style=${{...btnGhost, textDecoration:'none', padding:'5px 9px', fontSize:'10.5px'}}>▶ Abrir</a>
            <${ProjectButton} churchId=${churchId} media=${media} itemKey=${trackKey} />
            <button type="button" onClick=${()=>setLinkingVideo(true)} style=${{...btnGhost, padding:'5px 9px', fontSize:'10.5px'}}>🔗 Trocar</button>
            <button type="button" onClick=${()=>setMedia(null)} style=${{...btnGhost, padding:'5px 9px', fontSize:'10.5px'}}>✕ Vídeo</button>
          `
          : html`
            <a href=${youtubeSearchUrl(track.title+' playback')} target="_blank" rel="noopener" style=${{...btnGhost, textDecoration:'none', padding:'5px 9px', fontSize:'10.5px'}}>🔎 Buscar Vídeo</a>
            <button type="button" onClick=${()=>setLinkingVideo(true)} style=${{...btnGhost, padding:'5px 9px', fontSize:'10.5px'}}>🔗 Vincular Vídeo</button>
          `}
      </div>

      ${editingLyrics
        ? html`
          <div style=${{display:'grid', gap:'6px'}}>
            <textarea value=${lyricsDraft} onChange=${e=>setLyricsDraft(e.target.value)} placeholder="Cole a letra aqui. Deixe uma linha em branco entre as estrofes pra poder projetar uma de cada vez." rows="6" style=${{...inputStyle, fontSize:'11.5px', fontFamily:'inherit', resize:'vertical'}} />
            <div style=${{display:'flex', gap:'6px'}}>
              <button type="button" onClick=${saveLyrics} style=${{...btnPrimary, width:'auto', padding:'6px 12px', fontSize:'10.5px'}}>💾 Salvar Letra</button>
              <button type="button" onClick=${()=>{setLyricsDraft(track.lyrics||''); setEditingLyrics(false);}} style=${{...btnGhost, padding:'6px 12px', fontSize:'10.5px'}}>Cancelar</button>
            </div>
          </div>
        `
        : track.lyrics
        ? html`
          <div style=${{display:'grid', gap:'6px'}}>
            <${LetraProjectorPanel} churchId=${churchId} lyrics=${track.lyrics} itemKey=${trackKey} />
            <button type="button" onClick=${()=>setEditingLyrics(true)} style=${{...btnGhost, padding:'5px 9px', fontSize:'10.5px', justifySelf:'start'}}>✏️ Editar Letra</button>
          </div>
        `
        : html`<button type="button" onClick=${()=>setEditingLyrics(true)} style=${{...btnGhost, padding:'5px 9px', fontSize:'10.5px', justifySelf:'start'}}>📝 Adicionar Letra</button>`}
    </div>
  `;
}

// Painel com as faixas de uma coletânea — aparece ao clicar em "🎵 Faixas" no card. Cada igreja monta
// as músicas do CD do jeito que for tocar (não precisa ser o CD inteiro, só o que interessa).
function ColetaneaTracksPanel({ churchId, coletanea, onClose }) {
  const [allTracks, setAllTracks] = useState(() => loadColetaneaTracksAll(churchId));
  const seed = COLETANEA_TRACKS_SEED[coletanea.id];
  const tracks = allTracks[coletanea.id] || (seed ? seed.map((t,i) => ({ id:'seed-trk-'+i, title:t.title, duration:t.duration, media:null, lyrics:'' })) : []);

  const persist = (next) => {
    setAllTracks(map => {
      const updated = { ...map, [coletanea.id]: next };
      saveColetaneaTracksAll(churchId, updated);
      return updated;
    });
  };

  const addTrack = () => persist([...tracks, { id:'trk-'+Date.now(), title:'Nova faixa', duration:'', media:null, lyrics:'' }]);
  const updateTrack = (id, next) => persist(tracks.map(t => t.id === id ? next : t));
  const removeTrack = (id) => persist(tracks.filter(t => t.id !== id));

  return html`
    <div class="glass fade-up" style=${{borderRadius:'16px', padding:'14px', display:'grid', gap:'10px'}}>
      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div style=${{display:'flex', gap:'8px', alignItems:'center'}}>
          ${COLETANEA_COVERS_SEED[coletanea.id] && html`<img src=${COLETANEA_COVERS_SEED[coletanea.id]} style=${{width:'32px', height:'32px', borderRadius:'7px', objectFit:'cover', boxShadow:'0 2px 6px rgba(0,0,0,0.3)'}} />`}
          <div style=${{fontWeight:800, fontSize:'13px'}}>🎵 Faixas — ${coletanea.title}${coletanea.year ? ' ('+coletanea.year+')' : ''}</div>
        </div>
        <button type="button" onClick=${onClose} style=${{...btnGhost, padding:'6px 10px', fontSize:'11px'}}>✕ Fechar</button>
      </div>
      <div style=${{display:'grid', gap:'8px'}}>
        ${tracks.length === 0 && html`<div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Nenhuma faixa cadastrada ainda. Toca em "+ Adicionar Faixa" pra montar as músicas dessa coletânea.</div>`}
        ${tracks.map(t => html`<${ColetaneaTrackRow} key=${t.id} churchId=${churchId} coletaneaId=${coletanea.id} track=${t} onChange=${(next)=>updateTrack(t.id, next)} onRemove=${()=>removeTrack(t.id)} />`)}
      </div>
      <button type="button" onClick=${addTrack} style=${{...btnGhost, justifySelf:'start', padding:'8px 14px', fontSize:'11.5px', border:'1.5px dashed var(--accent-1)', color:'var(--accent-1)', fontWeight:700}}>+ Adicionar Faixa</button>
    </div>
  `;
}

  const [link, setLink] = useState('');
  const confirm = (e) => {

    const id = extractYouTubeId(link);

    onLink(id);

  return html`

}

function ColetaneasCategoryGrid({ churchId, category }) {
