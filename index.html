function ChurchDashboard({ church, onLogout, onUpdateChurch }) {
  const [tab, setTab] = useState('liturgia');
  // Fica aqui (não dentro da aba Mensagem) de propósito: assim, os arquivos carregados do pendrive
  // continuam disponíveis mesmo trocando de aba (ex: voltar pra Liturgia pra ver a atividade do
  // sermão). Ainda assim NÃO é salvo em disco/nuvem — some se recarregar a página, como sempre foi.
  const [mensagemItems, setMensagemItems] = useState([]);
  const [mensagemCurrent, setMensagemCurrent] = useState(0);
  // Aparelho que fica logado (opção "Manter conectado") não passa mais pela tela de login a cada
  // acesso, que era o único lugar que buscava os dados atualizados da igreja no banco compartilhado.
  // Por isso os fundos musicais salvos na nuvem por outro aparelho podiam demorar a aparecer aqui —
  // só quando a pessoa deslogava e logava de novo. Este "ouvinte" corrige isso: fica escutando o
  // documento desta igreja no Firestore e, assim que algo mudar em qualquer aparelho, atualiza a
  // sessão automaticamente, sem precisar sair e entrar de novo.
  const docId = church.fbDocId || church.docId;
  useEffect(() => {
    if (!docId) return;
    const unsub = fbListenWhenReady(() => {
      try {
        const { doc, onSnapshot } = window.__fb.helpers;
        return onSnapshot(doc(window.__fb.db, 'igrejas', docId), snap => {
          if (!snap.exists()) return;
          const data = snap.data();
          const patch = {
            bgMusic: data.bgMusic || null,
            paused: !!data.paused,
            removed: !!data.removed,
          };
          // teams/functionsList/schedules só entram no patch quando a nuvem já tem algo salvo —
          // assim uma igreja antiga (criada antes desses campos existirem, sem nada salvo ainda na
          // nuvem) não sobrescreve com "vazio" o que já estiver carregado localmente nesta sessão.
          // Também grava no armazenamento local (cache) deste aparelho: assim uma tela que lê os
          // dados direto do armazenamento local sem passar pela sessão (como a Presença, que mostra
          // quem está escalado) também fica atualizada, mesmo sem ter sido aberta a aba Gestão aqui.
          if (data.teams) { patch.teams = data.teams; saveTeams(church.id, data.teams); }
          if (data.functionsList) { patch.functionsList = data.functionsList; saveFunctionsList(church.id, data.functionsList); }
          if (data.schedules) {
            patch.schedules = data.schedules;
            Object.keys(data.schedules).forEach(k => saveSchedule(church.id, k, data.schedules[k]));
          }
          // Mesmo motivo/padrão acima, agora também pra Liturgia (programação do sábado, padrão
          // salvo, arquivo de cultos finalizados), presença e localização da igreja (24/09) —
          // todas essas configurações também sincronizam com a nuvem e ficam disponíveis em
          // qualquer aparelho, sem precisar deslogar/logar de novo.
          if (data.activities) { patch.activities = data.activities; saveActivities(church.id, data.activities); }
          if (data.defaultLiturgy) { patch.defaultLiturgy = data.defaultLiturgy; try { localStorage.setItem(defaultLiturgyKey(church.id), JSON.stringify(data.defaultLiturgy)); } catch(e) {} }
          if (data.archive) { patch.archive = data.archive; saveArchive(church.id, data.archive); }
          if (data.churchLocation) { patch.churchLocation = data.churchLocation; saveChurchLocation(church.id, data.churchLocation); }
          if (data.presence) {
            patch.presence = data.presence;
            Object.keys(data.presence).forEach(k => savePresence(church.id, k, data.presence[k]));
          }
          // Preferência de lembretes automáticos e status reportado pelo programinha externo
          // (25/09) — sem cache local próprio, é só exibição, então basta refletir na sessão.
          if (data.lembretesAtivo !== undefined) patch.lembretesAtivo = data.lembretesAtivo;
          if (data.lembretesStatus) patch.lembretesStatus = data.lembretesStatus;
          // Trilhas Fixas (25/09): vídeos/músicas fixos cadastrados em Gestão, usados pelas
          // atividades da Liturgia marcadas como "acontece todo sábado" (📅).
          if (data.fixedTracks) { patch.fixedTracks = data.fixedTracks; saveFixedTracks(church.id, data.fixedTracks); }
          onUpdateChurch(patch);
        }, () => {});
      } catch(e) { return () => {}; }
    });
    return unsub;
  }, [docId]);
  return html`
    <div>
      <${ChurchHeader} church=${church} tab=${tab} setTab=${setTab} onLogout=${onLogout} />
      ${tab === 'presenca' ? html`<${PresencaView} key="presenca" churchId=${church.id} church=${church} onUpdateChurch=${onUpdateChurch} />` : ''}
      ${tab === 'liturgia' ? html`<${LiturgiaView} key="lit" churchId=${church.id} churchName=${church.name} church=${church} onUpdateChurch=${onUpdateChurch} mensagemItems=${mensagemItems} mensagemCurrent=${mensagemCurrent} setMensagemCurrent=${setMensagemCurrent} />` : ''}
      ${tab === 'musicas' ? html`<${MusicasView} key="musicas" churchId=${church.id} church=${church} onUpdateChurch=${onUpdateChurch} />` : ''}
      ${tab === 'gestao' ? html`<${GestaoView} key="gestao" churchId=${church.id} churchName=${church.name} church=${church} onUpdateChurch=${onUpdateChurch} />` : ''}
      ${tab === 'telas' ? html`<${TelasView} key="telas" churchId=${church.id} />` : ''}
      ${tab === 'mensagem' ? html`<${MensagemView} key="mensagem" churchId=${church.id} items=${mensagemItems} setItems=${setMensagemItems} current=${mensagemCurrent} setCurrent=${setMensagemCurrent} />` : ''}
      ${tab === 'buscas' ? html`<${BuscasSemanaisView} key="buscas" churchId=${church.id} />` : ''}
      ${tab === 'ferramentas' ? html`<${FerramentasView} key="ferramentas" churchName=${church.name} churchId=${church.id} churchLogo=${church.logoDataUrl || ''} />` : ''}
      ${tab === 'sugestoes' ? html`<${SugestoesView} key="sugestoes" church=${church} />` : ''}
      ${tab === 'config' ? html`<${ConfiguracoesView} key="config" church=${church} onUpdateChurch=${onUpdateChurch} />` : ''}
      <${GlobalMixerWidget} churchId=${church.id} church=${church} onUpdateChurch=${onUpdateChurch} />
      <${ProjectionMiniControl} churchId=${church.id} mensagemItems=${mensagemItems} mensagemCurrent=${mensagemCurrent} setMensagemCurrent=${setMensagemCurrent} />
    </div>
  `;
}

const THEME_KEY = 'gc_theme_v1';
function luminanceOf(hex) {
  const h = (hex || '#000000').replace('#','');
  const r = parseInt(h.substring(0,2),16)||0, g = parseInt(h.substring(2,4),16)||0, b = parseInt(h.substring(4,6),16)||0;
  return (r*299 + g*587 + b*114) / 1000;
}
const THEME_PRESETS = [
  { name:'Azul Tech', a1:'#2563eb', a2:'#0891b2', a3:'#7c3aed', bg:'#0b1120', text:'#f1f5f9', highlight:'#fb923c', success:'#10b981', danger:'#ef4444' },
  { name:'Rosa/Roxo', a1:'#ec4899', a2:'#8b5cf6', a3:'#06b6d4', bg:'#0b1120', text:'#f1f5f9', highlight:'#fb923c', success:'#10b981', danger:'#ef4444' },
  { name:'Verde Esmeralda', a1:'#10b981', a2:'#0891b2', a3:'#065f46', bg:'#0a1410', text:'#f1f5f9', highlight:'#fbbf24', success:'#34d399', danger:'#ef4444' },
  { name:'Âmbar Clássico', a1:'#d97706', a2:'#b45309', a3:'#92400e', bg:'#14100a', text:'#f1f5f9', highlight:'#fbbf24', success:'#84cc16', danger:'#ef4444' },
  { name:'Vermelho Fogo', a1:'#dc2626', a2:'#ea580c', a3:'#991b1b', bg:'#140a0a', text:'#f1f5f9', highlight:'#fbbf24', success:'#22c55e', danger:'#f87171' },
  { name:'Grafite', a1:'#475569', a2:'#334155', a3:'#1e293b', bg:'#0d0f13', text:'#f1f5f9', highlight:'#94a3b8', success:'#22c55e', danger:'#ef4444' },
  { name:'Claro', a1:'#2563eb', a2:'#0891b2', a3:'#7c3aed', bg:'#eef2f9', text:'#0f172a', highlight:'#d97706', success:'#059669', danger:'#dc2626' },
];
function loadTheme() {
  try { const raw = localStorage.getItem(THEME_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return THEME_PRESETS[0];
}
function saveThemeToStorage(t) { try { localStorage.setItem(THEME_KEY, JSON.stringify(t)); } catch(e) {} }
function applyTheme(t) {
  const set = (k,v) => v && document.documentElement.style.setProperty(k, v);
  set('--accent-1', t.a1); set('--accent-2', t.a2); set('--accent-3', t.a3);
  set('--highlight', t.highlight); set('--success-1', t.success); set('--success-2', t.success); set('--danger', t.danger);
  set('--text-on-highlight', luminanceOf(t.highlight) > 150 ? '#1c1917' : '#fff8f0');

  const bg = t.bg || '#0b1120';
  const isLight = luminanceOf(bg) > 150;
  set('--bg-page', bg);
  set('--text-hi', t.text || (isLight ? '#0f172a' : '#f1f5f9'));
  set('--text-mid', isLight ? '#475569' : '#94a3b8');
  set('--text-dim', isLight ? '#64748b' : '#64748b');
  set('--border-soft', isLight ? 'rgba(30,41,59,0.1)' : 'rgba(148,163,184,0.14)');
  set('--glass-bg', isLight ? '#ffffffee' : '#0f172acc');
}

/* ============ Aviso de atualização disponível ============ */
// Fica de olho na versão publicada no servidor (buscando o próprio index.html de tempos em
// tempos) e avisa com uma "abinha de mensagens" quando existe uma versão mais nova — sem
// recarregar sozinho, pra pessoa atualizar no momento que for melhor pra ela.
function useAppUpdateChecker() {
  const [updateAvailable, setUpdateAvailable] = useState(false);
  useEffect(() => {
    let stopped = false;
    const check = async () => {
      try {
        const res = await fetch(window.location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const text = await res.text();
        const m = text.match(/const APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
        if (m && m[1] && m[1] !== APP_VERSION && !stopped) setUpdateAvailable(true);
      } catch(e) {}
    };
    check();
    const id = setInterval(check, 5 * 60 * 1000);
    const onVisible = () => { if (document.visibilityState === 'visible') check(); };
    document.addEventListener('visibilitychange', onVisible);
    return () => { stopped = true; clearInterval(id); document.removeEventListener('visibilitychange', onVisible); };
  }, []);
  return updateAvailable;
}

function UpdateNotice() {
  const updateAvailable = useAppUpdateChecker();
  const [open, setOpen] = useState(false);
  if (!updateAvailable) return null;
  return html`
    <div style=${{position:'fixed', top:'14px', right:'14px', zIndex:500}}>
      <button onClick=${()=>setOpen(o=>!o)} title="Mensagens" style=${{width:'46px', height:'46px', borderRadius:'50%', border:'none', background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))', color:'#fff', fontSize:'20px', cursor:'pointer', boxShadow:'0 8px 22px -8px rgba(0,0,0,0.55)', position:'relative'}}>
        📬
        <span class="breathe" style=${{position:'absolute', top:'-1px', right:'-1px', width:'13px', height:'13px', borderRadius:'50%', background:'var(--danger)', border:'2px solid var(--bg-page)'}}></span>
      </button>
      ${open && html`
        <div class="glass fade-up" style=${{position:'absolute', top:'56px', right:0, width:'270px', padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
          <div style=${{fontWeight:800, fontSize:'13px'}}>📬 Mensagens</div>
          <div style=${{fontSize:'12px', color:'var(--text-hi)', lineHeight:1.45}}>Existe uma nova atualização do sistema disponível. Você pode continuar usando normalmente e atualizar quando for melhor pra você.</div>
          <div style=${{display:'flex', gap:'8px', justifyContent:'flex-end'}}>

        </div>
      `}
    </div>
  `;
}

/* ============ Sincroniza igrejas antigas que ainda não foram enviadas ao banco compartilhado ============ */
// Igrejas cadastradas antes de existir a sincronização (ou num momento em que a rede/Firebase
// falhou) ficam só neste aparelho. Assim que o Firebase estiver pronto, manda essas igrejas pro
// banco compartilhado (com hash de senha, nunca a senha em texto puro), pra elas passarem a
// aparecer e a conseguir logar em qualquer aparelho também.
function useChurchBackfillSync() {
  useEffect(() => {
    let stopped = false;
    let tries = 0;
    const attempt = () => {
      if (stopped) return;
      tries++;
      if (!fbIsReady()) { if (tries < 30) setTimeout(attempt, 1000); return; }
      const db = loadDB();
      const pending = db.filter(c => c.login && !c.fbDocId);
      pending.forEach(c => {
        const passwordHash = c.passwordHash || (c.password ? simpleHash(c.password) : null);
        const recoveryAnswerHash = c.recoveryAnswerHash || (c.recoveryAnswer ? simpleHash(c.recoveryAnswer) : null);
        fbAddChurch({ ...c, passwordHash, recoveryAnswerHash }).then(result => {
          if (result.docId) {
            const next = loadDB().map(x => x.id === c.id ? { ...x, fbDocId: result.docId, passwordHash, recoveryAnswerHash } : x);
            saveDB(next);
          } else if (result.loginTaken) {
            // Esse login foi ocupado por outra igreja antes desta cópia local (só neste
            // aparelho) conseguir sincronizar — registra no histórico pra Paulo ver e decidir
            // (renomear o login desta ou remover a duplicata) em vez de sincronizar silenciosamente
            // uma igreja "fantasma" que já perdeu a disputa pelo login.
            fbAddActivity({ id:'log-'+Date.now(), type:'conflito', churchName: c.name, churchId: c.id, detail: 'Login "'+c.login+'" já estava em uso ao tentar sincronizar esta igreja (cadastrada só neste aparelho). Ela não foi enviada ao banco compartilhado — verifique se é uma duplicata.', at: new Date().toISOString() });
          }
        });
      });
    };
    attempt();
    return () => { stopped = true; };
  }, []);
}

// "Manter conectado": por padrão a sessão vai pro localStorage (sobrevive a fechar o navegador,
// reiniciar o aparelho etc.). Se a pessoa desmarcar a opção no login, a sessão vai só pro
// sessionStorage (dura só enquanto essa aba/janela do navegador estiver aberta) — útil num aparelho
// compartilhado. Ao abrir o app, olha os dois lugares pra saber onde a sessão (se houver) está salva.
function readStoredSession() {
  try { const raw = localStorage.getItem(SESSION_KEY); if (raw) return { session: JSON.parse(raw), remember: true }; } catch(e) {}
  try { const raw = sessionStorage.getItem(SESSION_KEY); if (raw) return { session: JSON.parse(raw), remember: false }; } catch(e) {}
  return { session: null, remember: true };
}

function App() {
  // Link público de cadastro (Momentos de Louvor / Mensagem Musical) — vem fixo na URL, não muda
  // durante a sessão desta aba, então decidir o "return" aqui, antes dos hooks de sessão/login, não
  // causa problema de ordem de hooks pra esta instância de App().
  const publicCadastro = getPublicCadastroParams();
  if (publicCadastro) {
    return html`<${PublicCadastroPage} tipo=${publicCadastro.tipo} docId=${publicCadastro.docId} />`;
  }

  useChurchBackfillSync();
  const initialStored = useRef(null);
  if (!initialStored.current) initialStored.current = readStoredSession();
  const [session, setSession] = useState(() => initialStored.current.session);
  const rememberRef = useRef(initialStored.current.remember);

  useEffect(() => { applyTheme(loadTheme()); }, []);

  const login = (s, remember) => {
    rememberRef.current = remember !== false;
    setSession(s);
    try {
      if (rememberRef.current) {
        localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
        localStorage.removeItem(SESSION_KEY);
      }
    } catch(e) {}
  };
  const logout = () => {
    setSession(null);
    try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
  };
  // Sempre MESCLA os campos recebidos com o que já está na sessão (em vez de substituir a igreja
  // inteira) — assim uma atualização parcial vinda de um "ouvinte" em segundo plano (como os fundos
  // musicais chegando de outro aparelho) nunca apaga por acidente outro campo que tenha mudado
  // entre o momento em que a tela pegou os dados e agora.
  const updateChurchSession = (updatedChurch) => {
    setSession(s => {
      const next = { ...s, church: { ...s.church, ...updatedChurch } };
      try {
        if (rememberRef.current) localStorage.setItem(SESSION_KEY, JSON.stringify(next));
        else sessionStorage.setItem(SESSION_KEY, JSON.stringify(next));
      } catch(e) {}
      return next;
    });
  };

  return html`
    <div>
      <${UpdateNotice} />
      ${!session ? html`<${LoginScreen} onLogin=${login} />` :
        session.type === 'developer' ? html`<${DeveloperPanel} onLogout=${logout} />` :
        html`<${ChurchDashboard} church=${session.church} onLogout=${logout} onUpdateChurch=${updateChurchSession} />`}
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

  // Se este arquivo estiver hospedado com o servidor próprio (Render, etc.), registra o service
  // worker que deixa o app instalável e atualiza sozinho. Dentro do Claude não existe /sw.js, então
  // essa chamada simplesmente falha em silêncio e não afeta nada.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
