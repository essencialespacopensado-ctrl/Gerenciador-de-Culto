  const [adding, setAdding] = useState(false);
  const [newTitle, setNewTitle] = useState('');
  const [newYear, setNewYear] = useState('');
  const [newCat, setNewCat] = useState(COLETANEAS_CATEGORIES[0]);
  const [links, setLinks] = useState(() => loadColetaneasLinks(churchId));
  const [linkingId, setLinkingId] = useState(null);
  const [tracksOpenId, setTracksOpenId] = useState(null);
  const [tracksCounts, setTracksCounts] = useState(() => computeTracksCounts(churchId));

  useEffect(() => saveColetaneasCustom(churchId, custom), [custom, churchId]);
  useEffect(() => saveColetaneasLinks(churchId, links), [links, churchId]);

  const all = [...COLETANEAS_SEED_RECENTES, ...COLETANEAS_SEED, ...COLETANEAS_ADORADORES, ...COLETANEAS_CANTORES, ...COLETANEAS_CELEBRASP, ...custom];
  const isTodas = category === 'Todas';

    e.preventDefault();
    if (!newTitle.trim()) return;
    setCustom(list => [...list, { id:'cust-'+Date.now(), category: isTodas ? newCat : category, title:newTitle.trim(), year:newYear.trim()||null, custom:true }]);
    setNewTitle(''); setNewYear(''); setAdding(false);

  const setLink = (itemId, videoId) => { setLinks(m => ({ ...m, [itemId]: videoId })); setLinkingId(null); };
  const unlink = (itemId) => setLinks(m => { const next = { ...m }; delete next[itemId]; return next; });

  return html`

        <div style=${{fontWeight:800, fontSize:'13px'}}>${isTodas ? '📚 Todas as Coletâneas' : category} <span style=${{fontWeight:500, fontSize:'11px', color:'var(--text-dim)'}}>• ${shown.length} coletânea${shown.length===1?'':'s'}</span></div>
        <button onClick=${()=>setAdding(v=>!v)} style=${{...btnGhost, padding:'6px 10px', fontSize:'11px'}}>${adding ? 'Cancelar' : '+ Adicionar'}</button>
      </div>
      ${adding && html`

          <input placeholder="Ano" value=${newYear} onChange=${e=>setNewYear(e.target.value)} style=${{...inputStyle, fontSize:'12px', width:'70px'}} />
          ${isTodas && html`
            <select value=${newCat} onChange=${e=>setNewCat(e.target.value)} style=${{...inputStyle, fontSize:'12px'}}>
              ${COLETANEAS_CATEGORIES.map(c => html`<option key=${c} value=${c}>${c}</option>`)}
            </select>
          `}
          <button type="submit" style=${{...btnPrimary, width:'auto', padding:'8px 14px', fontSize:'12px'}}>Add</button>
        </form>
      `}
      <div style=${{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(130px, 1fr))', gap:'10px'}}>
        ${shown.length === 0 && html`<div style=${{fontSize:'12px', color:'var(--text-dim)', gridColumn:'1/-1'}}>Nenhuma coletânea aqui ainda. Toca em "+ Adicionar" pra cadastrar.</div>`}
        ${shown.map((c,i) => {
          const videoId = links[c.id];
          const media = videoId ? { title: c.title, videoId, url: 'https://www.youtube.com/watch?v='+videoId } : null;
          return html`
          <div key=${c.id} class="fade-up" style=${{borderRadius:'12px', padding:'14px 10px', minHeight:'70px', display:'flex', flexDirection:'column', justifyContent:'space-between', gap:'8px', background:COLETANEA_COVERS_SEED[c.id] ? '#111' : COLETANEAS_COLORS[i % COLETANEAS_COLORS.length], color:'#fff', overflow:'hidden', position:'relative'}}>

              <div>

            </div>
            <button onClick=${()=>setTracksOpenId(id => id===c.id ? null : c.id)} style=${{fontSize:'10.5px', fontWeight:700, color:'#fff', background: tracksOpenId===c.id ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.2)', border:'none', padding:'4px 8px', borderRadius:'7px', textAlign:'left'}}>🎵 Faixas${tracksCounts[c.id] ? ' ('+tracksCounts[c.id]+')' : ''}</button>
            ${linkingId === c.id
              ? html`<${ColetaneaLinkForm} onLink=${(vid)=>setLink(c.id, vid)} onCancel=${()=>setLinkingId(null)} />`
              : media
              ? html`
                <div style=${{display:'flex', flexDirection:'column', gap:'5px'}}>

                <div style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>

                  <button onClick=${()=>setLinkingId(c.id)} style=${{fontSize:'10.5px', fontWeight:700, color:'#fff', background:'rgba(255,255,255,0.2)', border:'none', padding:'4px 8px', borderRadius:'7px'}}>🔗 Vincular</button>
                  ${c.custom && html`<button onClick=${()=>removeItem(c.id)} style=${{fontSize:'10.5px', fontWeight:700, color:'#fff', background:'rgba(0,0,0,0.2)', border:'none', padding:'4px 8px', borderRadius:'7px'}}>✕</button>`}
                </div>
              `}
          </div>
        `;})}
      </div>
      ${tracksOpenId && html`
        <div style=${{marginTop:'12px'}}>
          <${ColetaneaTracksPanel}
            churchId=${churchId}
            coletanea=${all.find(c => c.id === tracksOpenId)}
            onClose=${()=>{
              setTracksOpenId(null);
              setTracksCounts(computeTracksCounts(churchId));
            }}
          />
        </div>
      `}
    </div>
  `;
}

// Ligado direto às atividades de categoria "louvor" da liturgia da semana (mesmo armazenamento
// usado pela aba Liturgia) — a equipe só escolhe qual louvor é o seu (1, 2 ou 3) e busca o vídeo;
// o horário já vem pronto. Pensado pra ser preenchido pelo celular, sem precisar mexer na liturgia inteira.
function MomentosLouvorTool({ churchId, church, onUpdateChurch, shareUrl }) {
  const docId = church && (church.fbDocId || church.docId);
  const [activities, setActivities] = useState(() => (church && church.activities) || loadActivities(churchId));
  // Mesma correção aplicada em MensagensMusicaisTool: reagir a "church.activities" chegando depois
  // da montagem (página pública de cadastro, onde o Firestore responde de forma assíncrona).
  useEffect(() => { if (church && church.activities) setActivities(church.activities); }, [church && church.activities]);
  const items = activities.filter(a => a.category === 'louvor');

  const setMediaFor = (actId, media) => {
    setActivities(list => {
      const next = list.map(a => a.id === actId ? { ...a, media: media || null } : a);
      saveActivities(churchId, next);
      if (docId) fbUpdateChurchFields(docId, { activities: next });
      if (onUpdateChurch) onUpdateChurch({ activities: next });
      return next;
    });
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'12px'}}>
      <div style=${{fontWeight:800, fontSize:'13px'}}>🎤 Momentos de Louvor</div>
      <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Feito pra usar pelo celular: escolha qual louvor da semana é o seu (Louvor 1, 2 ou 3) e busque o vídeo — o horário já vem certo. Isso atualiza na hora a liturgia do sábado.</div>
      ${shareUrl && html`<button type="button" onClick=${()=>shareLinkUrl(shareUrl, 'Cadastro de Momento de Louvor')} style=${{...btnGhost, fontSize:'11px', padding:'8px 12px', justifySelf:'start'}}>🔗 Copiar link pros regentes</button>`}

      <div style=${{display:'grid', gap:'10px'}}>
        ${items.length === 0 && html`<div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Nenhum momento de louvor na liturgia desta semana ainda. Vá na aba Liturgia pra criar a atividade primeiro.</div>`}
        ${items.map((a,i) => html`
          <div key=${a.id} class="glass" style=${{padding:'12px', borderRadius:'14px', border:'1px solid var(--border-soft)', display:'grid', gap:'8px'}}>
            <div>
              <div style=${{display:'inline-flex', alignItems:'center', gap:'5px', padding:'3px 9px', borderRadius:'999px', background:'rgba(99,102,241,0.15)', color:'var(--accent-1)', fontWeight:800, fontSize:'10.5px', marginBottom:'6px'}}>🕐 ${a.time} · ${SECTION_LABELS[a.section] || a.section}</div>
              <div style=${{fontWeight:700, fontSize:'12.5px'}}>Louvor ${i+1} — ${a.name}</div>
              <div style=${{fontSize:'10.5px', color:'var(--text-mid)'}}>${a.responsible}</div>
            </div>
            <${MediaSearchField} media=${a.media} onChange=${(m)=>setMediaFor(a.id, m)} searchKey=${a.id} />
          </div>
        `)}
      </div>
    </div>
  `;
}

// Busca de vídeo no YouTube pra uso livre (fora dos 3 itens fixos da semana). O YouTube não deixa um
// site como este trazer resultados prontos (com miniatura) sem servidor próprio — então o caminho é:
// sugestão de texto em tempo real (vem direto do Google, sem precisar de servidor) + abrir a busca de
// verdade no youtube.com com um toque + colar o link do vídeo certo de volta aqui pra deixar pronto
// pra tocar e projetar.
function YoutubeQuickSearch({ churchId }) {
  const [search, setSearch] = useState('');
  const [suggestions, setSuggestions] = useState([]);
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [searching, setSearching] = useState(false);
  const [link, setLink] = useState('');
  const [result, setResult] = useState(null);
  const [serverResults, setServerResults] = useState(null); // null = não tentou/sem backend; [] = tentou e veio vazio
  const [serverSearching, setServerSearching] = useState(false);
  const debounceRef = useRef(null);

  const runSearch = (q) => {
    setSearching(true);
    fetchYoutubeSuggestions(q, (list) => {
      setSearching(false);
      setSuggestions(list);
      setSuggestOpen(true); // mostra o resultado mesmo quando vier vazio, pra sempre dar um retorno
    });
  };
  const onSearchChange = (val) => {
    setSearch(val);
    setServerResults(null);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    const q = val.trim();
    if (q.length < 2) { setSuggestions([]); setSuggestOpen(false); setSearching(false); return; }
    debounceRef.current = setTimeout(() => runSearch(q), 400);
  };
  const openSearch = (q) => { if (q.trim()) window.open(youtubeSearchUrl(q.trim()), '_blank', 'noopener'); };
  const pickSuggestion = (text) => { setSearch(text); setSuggestOpen(false); doServerSearch(text); };

  // Tenta buscar de verdade (com miniatura) pelo servidor próprio primeiro; se não tiver servidor
  // (como aqui dentro do Claude, ou hospedagem só estática), cai pro fluxo simples de sempre.
  const doServerSearch = async (q) => {
    const query = (q || search).trim();
    if (!query) return;
    setSuggestOpen(false);
    setServerSearching(true);
    const videos = await searchYoutubeServer(query);
    setServerSearching(false);
    if (videos && videos.length > 0) { setServerResults(videos); return; }
    setServerResults(videos && videos.length === 0 ? [] : null);
    if (!videos) openSearch(query); // sem backend disponível — abre a busca real do YouTube como sempre
  };

  const pickServerResult = (v) => {
    setResult({ title: v.title, videoId: v.videoId, url: v.watchUrl || ('https://www.youtube.com/watch?v='+v.videoId), thumbnail: v.thumbnail, channel: v.channel });
    setServerResults(null);
  };

  const confirmLink = (e) => {
    e.preventDefault();
    const id = extractYouTubeId(link.trim());
    if (!id) { alert('Não consegui reconhecer esse link como um vídeo do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    setResult({ title: search.trim() || 'Vídeo buscado', videoId: id, url: 'https://www.youtube.com/watch?v='+id });
    setLink('');
  };
  const newSearch = () => { setResult(null); setSearch(''); setLink(''); setServerResults(null); };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
      <div style=${{fontWeight:800, fontSize:'13.5px'}}>🔎 Buscar vídeo no YouTube</div>
      <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Digite pra ver sugestões em tempo real, toque numa delas (ou aperte Enter) pra abrir a busca de verdade no YouTube, ache o vídeo certo e cole o link dele aqui embaixo pra deixar pronto pra tocar/projetar.</div>

      ${!result ? html`
        <div style=${{position:'relative', zIndex: suggestOpen ? 300 : 'auto'}}>
          <div style=${{display:'flex', gap:'6px'}}>
            <input
              placeholder="Buscar no YouTube e apertar Enter..." value=${search}
              onChange=${e=>onSearchChange(e.target.value)}
              onFocus=${()=>{ if (suggestions.length>0) setSuggestOpen(true); }}
              onBlur=${()=>setTimeout(()=>setSuggestOpen(false), 150)}
              onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); doServerSearch(); } if(e.key==='Escape'){ setSuggestOpen(false); } }}
              style=${{...inputStyle, fontSize:'12px', flex:1}}
            />
            <button type="button" onClick=${()=>doServerSearch()} disabled=${!search.trim() || serverSearching} style=${{...btnPrimary, width:'auto', padding:'9px 14px', opacity: (search.trim() && !serverSearching) ? 1 : 0.5}}>${serverSearching ? '⏳' : '🔎'} Buscar</button>
          </div>
          ${searching && html`<div style=${{fontSize:'10.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Buscando sugestões...</div>`}
          ${!searching && suggestOpen && suggestions.length === 0 && search.trim().length >= 2 && html`
            <div style=${{fontSize:'10.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Não veio nenhuma sugestão agora (pode ser instabilidade da rede). Toque em "🔎 Buscar" pra ir direto pro YouTube com o que você digitou.</div>
          `}
          ${suggestOpen && suggestions.length > 0 && html`
            <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, borderRadius:'10px', padding:'4px', display:'grid', gap:'2px', maxHeight:'220px', overflowY:'auto', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'2px 4px'}}>Toque pra buscar (com miniatura, quando disponível):</div>
              ${suggestions.map((s,si) => html`
                <button key=${si} type="button" onMouseDown=${e=>e.preventDefault()} onClick=${()=>pickSuggestion(s)} style=${{textAlign:'left', padding:'7px 9px', borderRadius:'7px', border:'none', background:'transparent', color:'var(--text-mid)', fontSize:'11.5px'}}>🔎 ${s}</button>
              `)}
            </div>
          `}
        </div>

        ${serverResults && serverResults.length > 0 && html`
          <div style=${{display:'grid', gap:'6px', maxHeight:'320px', overflowY:'auto'}}>
            ${serverResults.map((v,vi) => html`
              <button key=${v.videoId+vi} type="button" onClick=${()=>pickServerResult(v)} style=${{display:'flex', gap:'10px', alignItems:'center', padding:'6px', borderRadius:'10px', border:'1px solid var(--border-soft)', background:'var(--glass-bg)', textAlign:'left'}}>
                <img src=${v.thumbnail} alt="" style=${{width:'72px', height:'42px', objectFit:'cover', borderRadius:'6px', flexShrink:0}} />
                <div style=${{minWidth:0}}>
                  <div style=${{fontSize:'11.5px', fontWeight:700, color:'var(--text-hi)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>${v.title}</div>
                  <div style=${{fontSize:'10px', color:'var(--text-dim)'}}>${v.channel || ''}${v.duration ? ' • '+v.duration : ''}</div>
                </div>
              </button>
            `)}
          </div>
        `}
        ${serverResults && serverResults.length === 0 && html`
          <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Nenhum resultado encontrado pelo servidor pra essa busca.</div>
        `}

        <form onSubmit=${confirmLink} style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
          <input placeholder="Ou colar aqui o link do vídeo (se você já tiver achado no YouTube)" value=${link} onChange=${e=>setLink(e.target.value)} style=${{...inputStyle, fontSize:'11.5px', flex:1, minWidth:'200px'}} />
          <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 16px'}}>✅ Confirmar</button>
        </form>
      ` : html`
        <div class="fade-up" style=${{borderRadius:'14px', padding:'14px', display:'flex', flexDirection:'column', gap:'8px', background:'linear-gradient(150deg,#2563eb,#1e3a8a)', color:'#fff'}}>
          <div style=${{fontWeight:800, fontSize:'12.5px'}}>🎬 ${result.title}</div>
          <div style=${{display:'flex', gap:'8px', flexWrap:'wrap'}}>
            <button type="button" onClick=${()=>openMediaInNewTab(result)} style=${{fontSize:'11px', fontWeight:700, color:'#fff', background:'rgba(255,255,255,0.22)', border:'none', padding:'6px 12px', borderRadius:'9px'}}>▶ Play</button>
            <${ProjectButton} churchId=${churchId} media=${result} />
            <button type="button" onClick=${newSearch} style=${{fontSize:'11px', fontWeight:700, color:'#fff', background:'rgba(0,0,0,0.2)', border:'none', padding:'6px 12px', borderRadius:'9px'}}>🔄 Nova busca</button>
          </div>
        </div>
      `}
    </div>
  `;
}

  return html`

      <div style=${{display:'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : '1fr 1fr 1fr 1fr', gap:'6px'}}>
        <div>
          <div style=${{fontSize:'9.5px', color:'var(--text-dim)', marginBottom:'2px'}}>Posição X (left)</div>
          <input type="number" value=${left} onChange=${e=>setLeft(Number(e.target.value)||0)} style=${{...inputStyle, fontSize:'12px', padding:'6px 8px'}} />
        </div>
        <div>
          <div style=${{fontSize:'9.5px', color:'var(--text-dim)', marginBottom:'2px'}}>Posição Y (top)</div>
          <input type="number" value=${top} onChange=${e=>setTop(Number(e.target.value)||0)} style=${{...inputStyle, fontSize:'12px', padding:'6px 8px'}} />
        </div>
        <div>
          <div style=${{fontSize:'9.5px', color:'var(--text-dim)', marginBottom:'2px'}}>Largura</div>
          <input type="number" value=${width} onChange=${e=>setWidth(Number(e.target.value)||100)} style=${{...inputStyle, fontSize:'12px', padding:'6px 8px'}} />
        </div>
        <div>

          <input type="number" value=${height} onChange=${e=>setHeight(Number(e.target.value)||100)} style=${{...inputStyle, fontSize:'12px', padding:'6px 8px'}} />

        <button onClick=${submit} style=${{...btnPrimary, width:'auto', padding:'8px 16px'}}>Adicionar</button>

    </div>
  `;
}

  const [manualScreens, setManualScreens] = useState(() => loadManualScreens(churchId));
  const [showAddManual, setShowAddManual] = useState(false);
  const [choices, setChoices] = useState({});
  const activities = loadActivities(churchId);

  const mediaOptions = activities.filter(a => a.media && a.media.title).map(a => ({ label: a.name+' — '+a.media.title, url: a.media.url, playlistId: a.media.playlistId || null, videoId: a.media.videoId || null }));

  const detectScreens = async () => {
    setPermissionMsg('');
    if ('getScreenDetails' in window) {
      try {
        const details = await window.getScreenDetails();
        const list = details.screens.map((s,i) => ({ label: (s.isPrimary ? 'Tela Principal' : 'Tela '+(i+1))+' — '+s.width+'x'+s.height, left: s.left, top: s.top, width: s.width, height: s.height }));
        setScreens(list);
      } catch (e) {
        setPermissionMsg('Permissão de telas negada ou indisponível. Usando apenas a tela atual.');
        setScreens([{ label: 'Tela Atual', left:0, top:0, width: window.screen.width, height: window.screen.height }]);
      }
    } else {
      setPermissionMsg('Seu navegador não suporta detectar múltiplas telas automaticamente (funciona no Chrome/Edge no computador). Você ainda pode abrir uma janela e arrastar manualmente pra outra tela.');
      setScreens([{ label: 'Tela Atual', left:0, top:0, width: window.screen.width, height: window.screen.height }]);
    }
  };

  useEffect(() => { detectScreens(); }, []);

  // Lista combinada — detectadas automaticamente + as que o Paulo cadastrar na mão — usada em toda
  // parte que precisa "todas as telas conhecidas" (habilitar, Projetor, Tela 1/2/3, Transmitir).
  const allScreens = useMemo(() => {
    const detected = screens || [];
    const detectedSigs = detected.map(screenSig);
    return [...detected, ...manualScreens.filter(s => !detectedSigs.includes(screenSig(s)))];
  }, [screens, manualScreens]);

  const toggleEnabled = (scr) => {
    const sig = screenSig(scr);
    setEnabled(list => {
      const exists = list.some(s => screenSig(s) === sig);
      const next = exists ? list.filter(s => screenSig(s) !== sig) : [...list, { ...scr, isProjector: list.length === 0 }];
      saveEnabledScreens(churchId, next);
      return next;
    });
  };
  const setProjector = (sig) => {
    setEnabled(list => {
      const next = list.map(s => ({ ...s, isProjector: screenSig(s) === sig }));
      saveEnabledScreens(churchId, next);
      return next;
    });
  };
  const setReturnScreen = (sig) => {
    setEnabled(list => {
      // Toggle exclusivo: se essa tela já era a de retorno, desmarca; senão, marca só essa.
      const wasOn = (list.find(s => screenSig(s) === sig) || {}).isReturnScreen;
      const next = list.map(s => ({ ...s, isReturnScreen: wasOn ? false : (screenSig(s) === sig) }));
      saveEnabledScreens(churchId, next);
      return next;
    });
  };

  // Adiciona uma tela "na mão" — pra quando o navegador não detecta um monitor/projetor sozinho, ou
  // pra já deixar um slot configurado antes mesmo de plugar o aparelho. O Paulo digita a posição e o
  // tamanho (dá pra ver isso em Configurações de Tela do Windows) e pode testar antes de habilitar.
  const addManualScreen = (data) => {
    const scr = { label: data.label || ('Tela Manual '+(manualScreens.length+1)), left: Number(data.left)||0, top: Number(data.top)||0, width: Math.max(100, Number(data.width)||1280), height: Math.max(100, Number(data.height)||720) };
    setManualScreens(list => {
      const next = [...list, scr];
      saveManualScreens(churchId, next);
      return next;
    });
    setShowAddManual(false);
  };
  const removeManualScreen = (sig) => {
    setManualScreens(list => {
      const next = list.filter(s => screenSig(s) !== sig);
      saveManualScreens(churchId, next);
      return next;
    });
    // Se essa tela estava habilitada, tira ela da lista de habilitadas também.
    setEnabled(list => {
      const exists = list.some(s => screenSig(s) === sig);
      if (!exists) return list;
      const next = list.filter(s => screenSig(s) !== sig);
      saveEnabledScreens(churchId, next);
      return next;
    });
  };
  const testScreen = (scr) => { try { sendToScreenObj(scr, 'texto', scr.label); } catch (e) {} };

  const setChoice = (sig, patch) => setChoices(c => ({ ...c, [sig]: { ...(c[sig]||{type:'blank'}), ...patch } }));

  const sendToScreen = (scr, sig) => {
    const choice = choices[sig] || { type:'blank' };
    if (choice.type === 'media' && mediaOptions[choice.mediaIdx]) sendToScreenObj(scr, 'media', mediaOptions[choice.mediaIdx]);
    else if (choice.type === 'texto') sendToScreenObj(scr, 'texto', choice.text);
    else sendToScreenObj(scr, 'blank');
  };

  const enabledSigs = enabled.map(screenSig);

  return html`
    <div style=${{maxWidth:'700px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'16px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para habilitar quais telas conectadas recebem transmissão e marcar qual delas é o projetor principal. As telas habilitadas aparecem numeradas (Tela 1, Tela 2...) nos botões de projetar da Liturgia, na mesma ordem de baixo.</div>

      ${permissionMsg && html`<div class="glass fade-up" style=${{padding:'12px 14px', borderRadius:'12px', fontSize:'11px', color:'var(--highlight)'}}>${permissionMsg}</div>`}
      <div style=${{display:'flex', gap:'8px', flexWrap:'wrap'}}>
        <button onClick=${detectScreens} style=${{...btnGhost, justifySelf:'start'}}>🔄 Detectar Telas Novamente</button>
        <button onClick=${()=>setShowAddManual(v=>!v)} style=${{...btnGhost, justifySelf:'start'}}>➕ Adicionar Tela Manualmente</button>
        <button onClick=${closeAllProjectionScreens} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🔴 Encerrar em Todas as Telas</button>
      </div>

      ${showAddManual && html`<${AddManualScreenForm} onAdd=${addManualScreen} onClose=${()=>setShowAddManual(false)} suggestedLeft=${allScreens.reduce((sum,s)=>sum+s.width,0)} />`}

      ${!screens ? html`<div style=${{fontSize:'12px', color:'var(--text-dim)'}}>Detectando telas...</div>` : html`
        <div>
          <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'0 0 10px 0'}}>Telas Detectadas (${screens.length})</h3>
          <div style=${{display:'grid', gap:'8px'}}>
            ${screens.map(scr => {
              const sig = screenSig(scr);
              const isOn = enabledSigs.includes(sig);
              const enabledObj = enabled.find(s => screenSig(s) === sig);
              const numLabel = isOn ? 'Tela ' + (enabledSigs.indexOf(sig)+1) : '';
              return html`
                <div key=${sig} class="glass fade-up" style=${{padding:'12px 16px', borderRadius:'14px', display:'flex', alignItems:'center', gap:'10px', flexWrap:'wrap', border: isOn ? '1.5px solid var(--accent-1)' : '1px solid var(--border-soft)'}}>
                  <input type="checkbox" checked=${isOn} onChange=${()=>toggleEnabled(scr)} style=${{width:'18px', height:'18px', flexShrink:0}} />
                  <div style=${{flex:'1 1 160px', minWidth:'160px'}}>
                    <div style=${{fontWeight:700, fontSize:'13px', display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap'}}>${scr.label} ${numLabel && html`<span style=${{fontSize:'9.5px', fontWeight:700, padding:'2px 6px', borderRadius:'999px', background:'rgba(99,102,241,0.16)', color:'var(--accent-1)'}}>${numLabel}</span>`}</div>
                    <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Posição: ${scr.left},${scr.top}</div>
                  </div>
                  ${isOn && html`
                    <div style=${{display:'flex', gap:'8px', flexWrap:'wrap', flexShrink:0}}>
                      <button onClick=${()=>setProjector(sig)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px', color: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--text-dim)', borderColor: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--border-soft)'}}>${enabledObj && enabledObj.isProjector ? '📽️ Projetor' : 'Definir como Projetor'}</button>
                      <button onClick=${()=>setReturnScreen(sig)} title="Tela voltada pra quem está na frente (pregador/apresentador), pra ele ver o cronômetro" style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px', color: enabledObj && enabledObj.isReturnScreen ? 'var(--highlight)' : 'var(--text-dim)', borderColor: enabledObj && enabledObj.isReturnScreen ? 'var(--highlight)' : 'var(--border-soft)'}}>${enabledObj && enabledObj.isReturnScreen ? '📺 Retorno' : 'Definir como Retorno'}</button>
                    </div>
                  `}
                </div>
              `;
            })}
          </div>
        </div>

        ${manualScreens.length > 0 && html`
          <div>
            <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'16px 0 10px 0'}}>Telas Adicionadas Manualmente (${manualScreens.length})</h3>
            <div style=${{display:'grid', gap:'8px'}}>
              ${manualScreens.map(scr => {
                const sig = screenSig(scr);
                const isOn = enabledSigs.includes(sig);
                const enabledObj = enabled.find(s => screenSig(s) === sig);
                const numLabel = isOn ? 'Tela ' + (enabledSigs.indexOf(sig)+1) : '';
                return html`
                  <div key=${sig} class="glass fade-up" style=${{padding:'12px 16px', borderRadius:'14px', display:'flex', alignItems:'center', gap:'10px', flexWrap:'wrap', border: isOn ? '1.5px solid var(--accent-1)' : '1px solid var(--border-soft)'}}>
                    <input type="checkbox" checked=${isOn} onChange=${()=>toggleEnabled(scr)} style=${{width:'18px', height:'18px', flexShrink:0}} />
                    <div style=${{flex:'1 1 160px', minWidth:'160px'}}>
                      <div style=${{fontWeight:700, fontSize:'13px', display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap'}}>${scr.label} ${numLabel && html`<span style=${{fontSize:'9.5px', fontWeight:700, padding:'2px 6px', borderRadius:'999px', background:'rgba(99,102,241,0.16)', color:'var(--accent-1)'}}>${numLabel}</span>`}</div>
                      <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Posição: ${scr.left},${scr.top} • ${scr.width}x${scr.height}</div>
                    </div>
                    <div style=${{display:'flex', gap:'8px', flexWrap:'wrap', flexShrink:0}}>
                      ${isOn && html`<button onClick=${()=>setProjector(sig)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px', color: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--text-dim)', borderColor: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--border-soft)'}}>${enabledObj && enabledObj.isProjector ? '📽️ Projetor' : 'Definir como Projetor'}</button>`}
                      ${isOn && html`<button onClick=${()=>setReturnScreen(sig)} title="Tela voltada pra quem está na frente (pregador/apresentador), pra ele ver o cronômetro" style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px', color: enabledObj && enabledObj.isReturnScreen ? 'var(--highlight)' : 'var(--text-dim)', borderColor: enabledObj && enabledObj.isReturnScreen ? 'var(--highlight)' : 'var(--border-soft)'}}>${enabledObj && enabledObj.isReturnScreen ? '📺 Retorno' : 'Definir como Retorno'}</button>`}
                      <button onClick=${()=>testScreen(scr)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px'}} title="Abre essa tela mostrando o nome dela, pra você arrastar/conferir se caiu no monitor certo">🧪 Testar</button>
                      <button onClick=${()=>removeManualScreen(sig)} style=${{background:'transparent', border:'none', color:'var(--danger)', fontSize:'15px', padding:'4px 6px'}} title="Remover essa tela">✕</button>
                    </div>
                  </div>
                `;
              })}
            </div>
          </div>
        `}

        ${enabled.length > 0 && html`
          <div>
            <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'16px 0 10px 0'}}>Transmitir</h3>
            <div style=${{display:'grid', gap:'12px'}}>
              ${enabled.map(scr => {
                const sig = screenSig(scr);
                const choice = choices[sig] || { type:'blank' };
                return html`
                  <div key=${sig} class="glass fade-up" style=${{padding:'14px', borderRadius:'14px', display:'grid', gap:'8px'}}>
                    <div style=${{fontWeight:700, fontSize:'12.5px'}}>Tela ${enabledSigs.indexOf(sig)+1} — ${scr.label}${scr.isProjector ? ' 📽️' : ''}${scr.isReturnScreen ? ' 📺' : ''}</div>
                    <select value=${choice.type} onChange=${e=>setChoice(sig, {type:e.target.value})} style=${{...inputStyle, fontSize:'12px'}}>
                      <option value="blank">⬛ Tela Preta</option>
                      <option value="media">🎬 Vídeo/Música da Liturgia</option>
                      <option value="texto">🔤 Texto Personalizado</option>
                    </select>
                    ${choice.type === 'media' && html`
                      <select value=${choice.mediaIdx ?? ''} onChange=${e=>setChoice(sig, {mediaIdx: Number(e.target.value)})} style=${{...inputStyle, fontSize:'12px'}}>
                        <option value="">${mediaOptions.length ? '(escolher)' : 'Nenhum vídeo/música anexado na liturgia ainda'}</option>
                        ${mediaOptions.map((m,i) => html`<option key=${i} value=${i}>${m.label}</option>`)}
                      </select>
                    `}
                    ${choice.type === 'texto' && html`
                      <input placeholder="Texto a exibir" value=${choice.text||''} onChange=${e=>setChoice(sig, {text:e.target.value})} style=${{...inputStyle, fontSize:'12px'}} />
                    `}
                    <button onClick=${()=>sendToScreen(scr, sig)} style=${{...btnPrimary, width:'auto', justifySelf:'start', padding:'8px 16px'}}>📤 Enviar para esta Tela</button>
                  </div>
                `;
              })}
            </div>
          </div>
        `}
      `}
    </div>
  `;
}

// Carrega (uma vez só, e guarda pronta pras próximas vezes) a biblioteca que sabe ler um .pptx e
// desenhar os slides num <canvas> — usada só na hora de carregar um PowerPoint na aba Mensagem.
let _pptxLibsPromise = null;
function loadPptxLibs() {
  if (_pptxLibsPromise) return _pptxLibsPromise;
  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Falha ao carregar biblioteca de PowerPoint'));
    document.head.appendChild(s);
  });
  _pptxLibsPromise = (async () => {
    if (!window.JSZip) await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    if (!window.Chart) await loadScript('https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js');
    if (!(window.PptxViewJS && window.PptxViewJS.PPTXViewer)) await loadScript('https://cdn.jsdelivr.net/npm/pptxviewjs/dist/PptxViewJS.min.js');
    return true;
  })();
  return _pptxLibsPromise;
}

// Abre um .pptx de verdade e transforma cada slide numa imagem (PNG), pra cada slide virar um item
// "imagem" comum — o mesmo caminho, já testado e confiável, usado pras fotos. De propósito cada slide
// usa um <canvas> e um "leitor" novos, pra nunca herdar nada desenhado do slide anterior. O tamanho do
// canvas segue a proporção real do PowerPoint (4:3 ou 16:9), lida do próprio arquivo, pra não esticar.
async function pptxToSlideImages(file) {
  await loadPptxLibs();
  const probe = new window.PptxViewJS.PPTXViewer({ canvas: document.createElement('canvas') });
  await probe.loadFile(file);
  const count = probe.getSlideCount();
  const size = (probe.presentation && probe.presentation.slideSize) || { cx: 9144000, cy: 6858000 };
  const ratio = size.cx / size.cy;
  const baseName = file.name.replace(/\.[^.]+$/, '');
  const slides = [];
  for (let i = 0; i < count; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 1600;
    canvas.height = Math.round(1600 / ratio);
    const viewer = new window.PptxViewJS.PPTXViewer({ canvas });
    await viewer.loadFile(file);
    viewer.goToSlide(i);
    await viewer.render(canvas);
    slides.push({
      id: 'msg-' + Date.now() + Math.random().toString(36).slice(2, 6) + '-' + i,
      type: 'imagem',
      title: baseName + ' — Slide ' + (i + 1) + '/' + count,
      dataUrl: canvas.toDataURL('image/png')
    });
  }
  return slides;
}

// Navegador de setas: depois de projetar a primeira foto/slide, ◀ e ▶ avançam ou voltam pra próxima/
// última imagem da lista JÁ projetando na hora — pra dar pra seguir a pregação com um toque só, sem
// precisar caçar o item certo lá embaixo na lista toda vez.
function MensagemGalleryNav({ churchId, items, current, onNavigate }) {
  if (items.length === 0) return '';
  const idx = Math.min(current, items.length - 1);
  const item = items[idx];

  const go = (newIdx) => {
    if (newIdx < 0 || newIdx >= items.length) return;
    onNavigate(newIdx);
    projectMensagemItem(churchId, items[newIdx], 'msg-' + items[newIdx].id);
  };

  return html`
    <div class="glass fade-up" style=${{padding:'10px 12px', borderRadius:'14px', display:'flex', alignItems:'center', gap:'10px', position:'sticky', top:'8px', zIndex:5}}>
      ${item.type === 'imagem'
        ? html`<img src=${item.dataUrl} style=${{width:'44px', height:'44px', objectFit:'cover', borderRadius:'8px', flexShrink:0, background:'#000'}} />`
        : html`<video src=${item.url} muted style=${{width:'44px', height:'44px', objectFit:'cover', borderRadius:'8px', flexShrink:0, background:'#000'}} />`}
      <div style=${{flex:1, minWidth:0}}>
        <div style=${{fontWeight:700, fontSize:'11px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>${item.title}</div>
        <div style=${{fontSize:'10px', color:'var(--text-dim)'}}>${idx+1} de ${items.length} — as setas já projetam</div>
      </div>
      <button type="button" onClick=${()=>go(idx-1)} disabled=${idx===0} style=${{...btnGhost, padding:'8px 13px', fontSize:'14px', opacity: idx===0?0.4:1}} title="Voltar pra anterior">◀</button>
      <button type="button" onClick=${()=>go(idx+1)} disabled=${idx===items.length-1} style=${{...btnGhost, padding:'8px 13px', fontSize:'14px', opacity: idx===items.length-1?0.4:1}} title="Avançar pra próxima">▶</button>
    </div>
  `;
}

// Aba "Mensagem": lugar pra carregar do pendrive, na hora da pregação, as fotos, vídeos e apresentações
// de PowerPoint que vão ser usados e projetar em tela cheia com um toque. De propósito NÃO fica salvo
// entre recarregamentos (fotos/vídeos de pendrive mudam toda semana e vídeo não cabe no armazenamento
// do navegador) — é pensado pra: chegou a hora da mensagem, conecta o pendrive, carrega os arquivos, usa.
function MensagemView({ churchId, items, setItems, current, setCurrent }) {
  const [processing, setProcessing] = useState(false);
  const fileRef = useRef(null);

  const handleFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (files.length === 0) return;
    setProcessing(true);
    try {
      const added = [];
      for (const file of files) {
        try {
          if (file.type.startsWith('image/')) {
            const dataUrl = await readImageFileSmart(file);
            added.push({ id:'msg-'+Date.now()+Math.random().toString(36).slice(2,6), type:'imagem', title: file.name.replace(/\.[^.]+$/,''), dataUrl });
          } else if (file.type.startsWith('video/')) {
            const url = URL.createObjectURL(file);
            added.push({ id:'msg-'+Date.now()+Math.random().toString(36).slice(2,6), type:'video', title: file.name.replace(/\.[^.]+$/,''), url, file });
          } else if (/\.(ppt|pptx)$/i.test(file.name)) {
            try {
              const slides = await pptxToSlideImages(file);
              if (slides.length > 0) added.push(...slides);
              else throw new Error('sem slides');
            } catch (e) {
              // Não conseguiu abrir automaticamente (formato .ppt antigo, arquivo corrompido, etc.) —
              // avisa e deixa o caminho de sempre (exportar como imagem) como alternativa.
              added.push({ id:'msg-'+Date.now()+Math.random().toString(36).slice(2,6), type:'aviso_ppt', title: file.name });
            }
          }
        } catch (e) { /* pula esse arquivo se der erro */ }
      }
      if (added.length) setItems(list => [...list, ...added]);
    } finally {
      setProcessing(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  const remove = (id) => {
    setItems(list => {
      const it = list.find(i => i.id === id);
      if (it && it.url) { try { URL.revokeObjectURL(it.url); } catch (e) {} }
      return list.filter(i => i.id !== id);
    });
  };
  const clearAll = () => {
    if (!confirm('Limpar todos os arquivos carregados desta sessão? Isso não apaga nada do pendrive/computador, só tira daqui.')) return;
    items.forEach(it => { if (it.url) { try { URL.revokeObjectURL(it.url); } catch (e) {} } });
    setItems([]);
    setCurrent(0);
  };

  // Fotos, slides de PowerPoint já convertidos e vídeos — nessa ordem é que as setas navegam.
  const projectable = items.filter(it => it.type === 'imagem' || it.type === 'video');

  return html`
    <div style=${{maxWidth:'760px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'14px'}}>
      <div class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'14px'}}>
        <div style=${{fontWeight:800, fontSize:'13px', color:'var(--text-hi)', marginBottom:'4px'}}>🎤 Projeção da Mensagem</div>
        <div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>Conecte o pendrive, escolha as fotos, vídeos e o PowerPoint da pregação e projete em tela cheia com um toque. Os arquivos ficam só nesta sessão do navegador — ao fechar ou recarregar a página, é preciso carregar de novo (é assim de propósito, pra sempre usar o pendrive certo do dia).</div>
      </div>

      <div class="glass fade-up" style=${{padding:'12px 14px', borderRadius:'12px', fontSize:'11px', color:'var(--text-dim)'}}>
        <b style=${{color:'var(--text-mid)'}}>PowerPoint:</b> ao carregar um .pptx aqui, cada slide já é aberto automaticamente e vira uma imagem pronta pra projetar, na ordem certa. Efeitos, animações e transições do PowerPoint não aparecem (só o conteúdo do slide). Se algum arquivo não abrir sozinho, exporte os slides como imagem antes — no PowerPoint vá em <b>Arquivo → Exportar → Mudar o Tipo de Arquivo → Imagem JPEG → Todos os Slides</b> — e carregue essas imagens aqui do mesmo jeito que fotos.
      </div>

      <label class="glass fade-up" style=${{padding:'20px', borderRadius:'16px', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'8px', border:'1.5px dashed var(--border-soft)', cursor:'pointer', textAlign:'center'}}>
        <div style=${{fontSize:'26px'}}>📁</div>
        <div style=${{fontSize:'12.5px', fontWeight:700}}>${processing ? 'Processando...' : 'Toque para escolher fotos, vídeos ou PowerPoint do pendrive'}</div>
        <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>JPG, PNG, WEBP, MP4, MOV, PPT/PPTX — pode escolher vários de uma vez</div>
        <input ref=${fileRef} type="file" accept="image/*,video/*,.ppt,.pptx" multiple disabled=${processing} onChange=${e=>handleFiles(e.target.files)} style=${{display:'none'}} />
      </label>

      <${MensagemGalleryNav} churchId=${churchId} items=${projectable} current=${current} onNavigate=${setCurrent} />

      ${items.length > 0 && html`
        <button type="button" onClick=${clearAll} style=${{...btnGhost, width:'100%', color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🧹 Limpar Tudo</button>
      `}

      ${items.length === 0 && !processing && html`<div class="glass fade-up" style=${{padding:'22px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'12.5px'}}>Nenhum arquivo carregado ainda nesta sessão.</div>`}

      <div style=${{display:'grid', gap:'12px'}}>
        ${items.map((it,i) => html`
          <div key=${it.id} class="glass fade-up" style=${{padding:'14px', borderRadius:'16px', display:'grid', gap:'10px', animationDelay:(i*0.03)+'s'}}>
            ${it.type === 'aviso_ppt' ? html`
              <div style=${{display:'flex', gap:'10px', alignItems:'center'}}>
                <div style=${{fontSize:'28px'}}>📊</div>
                <div>
                  <div style=${{fontWeight:700, fontSize:'12.5px'}}>${it.title}</div>
                  <div style=${{fontSize:'10.5px', color:'var(--highlight)'}}>Não consegui abrir esse arquivo automaticamente — exporte os slides como imagem JPG (veja a dica ali em cima) e carregue as imagens aqui.</div>
                </div>
              </div>
              <div style=${{display:'flex', justifyContent:'flex-end'}}>
                <button type="button" onClick=${()=>remove(it.id)} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🗑️ Remover</button>
              </div>
            ` : html`
              <div style=${{display:'flex', gap:'12px', alignItems:'flex-start'}}>
                ${it.type === 'imagem'
                  ? html`<img src=${it.dataUrl} style=${{width:'96px', height:'96px', objectFit:'cover', borderRadius:'12px', flexShrink:0, background:'#000'}} />`
                  : html`<video src=${it.url} muted style=${{width:'96px', height:'96px', objectFit:'cover', borderRadius:'12px', flexShrink:0, background:'#000'}} />`}
                <div style=${{flex:1, minWidth:0}}>
                  <div style=${{fontWeight:700, fontSize:'12.5px'}}>${it.type === 'video' ? '🎬 ' : '🖼️ '}${it.title}</div>
                </div>
              </div>
              <div style=${{display:'flex', gap:'8px', justifyContent:'flex-end', flexWrap:'wrap'}}>
                ${it.type === 'imagem'
                  ? html`<${ImageProjectButton} churchId=${churchId} item=${it} itemKey=${'msg-'+it.id} onProjected=${()=>{ const pi = projectable.indexOf(it); if (pi >= 0) setCurrent(pi); }} />`
                  : html`<${LocalVideoProjectButton} churchId=${churchId} item=${it} itemKey=${'msg-'+it.id} onProjected=${()=>{ const pi = projectable.indexOf(it); if (pi >= 0) setCurrent(pi); }} />`}
                <button type="button" onClick=${()=>remove(it.id)} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🗑️ Remover</button>
              </div>
            `}
          </div>
        `)}
      </div>
    </div>
  `;
}

function ytPostCommand(win, func, args) {
  if (!win) return;
  try { win.postMessage(JSON.stringify({ event:'command', func, args: args || [] }), '*'); } catch(e) {}
}

// Sugestões de busca em tempo real (texto), pelo mesmo serviço que alimenta a caixinha de busca do
// próprio youtube.com — é do Google, super confiável e não usa fetch (usa JSONP, que não esbarra em CORS).
// Essa é a base garantida da busca em tempo real.
function fetchYoutubeSuggestions(query, callback) {
  try {
    const cbName = '__ytSuggest_' + Math.random().toString(36).slice(2);
    let done = false;
    const cleanup = () => { try { delete window[cbName]; } catch(e) {} if (script.parentNode) script.parentNode.removeChild(script); };
    const finish = (list) => { if (done) return; done = true; callback(list); cleanup(); };
    window[cbName] = (data) => {
      let list = [];
      try { list = (data && data[1]) ? data[1].map(x => Array.isArray(x) ? x[0] : x).filter(Boolean) : []; } catch(e) {}
      finish(list);
    };
    const script = document.createElement('script');
    script.src = 'https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=' + encodeURIComponent(query) + '&callback=' + cbName;
    script.onerror = () => finish([]);
    document.body.appendChild(script);
    setTimeout(() => finish([]), 4000); // trava de segurança caso a rede nunca responda
  } catch(e) { callback([]); }
}

// Busca de vídeo de verdade (com miniatura, canal, duração) via servidor próprio — só funciona quando
// este arquivo está hospedado junto com o backend Express (rota /api/search-weekly-videos). Dentro do
// Claude, ou em uma hospedagem só estática, essa chamada falha rápido e quem chamou cai no modo
// simples (sugestão de texto + colar link).
async function searchYoutubeServer(query) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch('/api/search-weekly-videos?q=' + encodeURIComponent(query), { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    const data = await res.json();
    return Array.isArray(data.videos) ? data.videos : null;
  } catch (e) { return null; } // sem backend, sem rede, ou bloqueado — retorna null pra cair no fallback
}

// O YouTube não permite (por política própria) que um site como este busque vídeos automaticamente
// sem um servidor próprio. Por isso o caminho aqui é o mais simples e confiável possível: sugestão de
// texto em tempo real (JSONP, do próprio Google) + um clique abre a busca de verdade no youtube.com +
// colar o link do vídeo escolhido de volta aqui.
// Guarda o que cada igreja deixou tocando/escolhido nos Fundos Musicais (só o que dá pra guardar:
// link/vídeo do YouTube, nome e volume — um arquivo de áudio do computador não sobrevive a um
// recarregamento de página, então esse continua precisando ser escolhido de novo). Assim, ao abrir
// o app de novo, os fundos já vêm com o mesmo vídeo carregado e tentando tocar sozinhos, sem
// precisar buscar tudo de novo toda vez.
function bgMusicKey(churchId) { return 'gc_fundos_musicais_' + churchId; }
function loadSavedBgMusic(churchId) {
  try {
    const raw = localStorage.getItem(bgMusicKey(churchId));
    if (!raw) return null;
    const saved = JSON.parse(raw);
    return Array.isArray(saved) ? saved : null;
  } catch(e) { return null; }
}
function saveBgMusic(churchId, tracks) {
  try {
    const toSave = tracks.map(t => ({
      name: t.name,
      mode: t.mode === 'youtube' ? 'youtube' : 'none',
      videoId: t.mode === 'youtube' ? t.videoId : null,
      volume: t.volume
    }));
    localStorage.setItem(bgMusicKey(churchId), JSON.stringify(toSave));
  } catch(e) {}
}
function BackgroundAudioMixer({ churchId, church, onUpdateChurch }) {
  const [tracks, setTracks] = useState(() => {
    const base = [
      { name:'Fundo 1', mode:'none', fileName:'', videoId:null, playing:false, volume:0, search:'', link:'', suggestions:[], results:null, suggestOpen:false, searching:false },
      { name:'Fundo 2', mode:'none', fileName:'', videoId:null, playing:false, volume:0, search:'', link:'', suggestions:[], results:null, suggestOpen:false, searching:false },
      { name:'Fundo 3', mode:'none', fileName:'', videoId:null, playing:false, volume:0, search:'', link:'', suggestions:[], results:null, suggestOpen:false, searching:false },
    ];
    // Prioriza o que estiver salvo na nuvem (funciona em qualquer aparelho); se não tiver, usa o
    // que ficou salvo só neste aparelho (localStorage) de antes dessa opção existir.
    const saved = (church && Array.isArray(church.bgMusic)) ? church.bgMusic : loadSavedBgMusic(churchId);
    if (!saved) return base;
    return base.map((b,i) => {
      const s = saved[i];
      if (!s) return b;
      const isYoutube = s.mode === 'youtube' && s.videoId;
      return { ...b, name: s.name || b.name, mode: isYoutube ? 'youtube' : 'none', videoId: isYoutube ? s.videoId : null, playing: isYoutube, volume: typeof s.volume === 'number' ? s.volume : b.volume };
    });
  });
  const [cloudStatus, setCloudStatus] = useState('idle'); // idle | saving | saved | error
  // Salva sozinho neste aparelho toda vez que o vídeo, o nome ou o volume de algum fundo muda —
  // pra já vir tudo pronto na próxima vez que abrir o app aqui, sem precisar buscar de novo.
  useEffect(() => { saveBgMusic(churchId, tracks); }, [churchId, tracks.map(t=>t.mode+'|'+t.videoId+'|'+t.name+'|'+t.volume).join(';')]);

  // Salvar na nuvem é uma ação separada (botão), não automática — assim dá pra testar um fundo
  // musical sem "sujar" o que está salvo pros outros aparelhos até decidir que é isso mesmo.
  const salvarNaNuvem = async () => {
    const docId = church && (church.fbDocId || church.docId);
    const toSave = tracks.map(t => ({
      name: t.name,
      mode: t.mode === 'youtube' ? 'youtube' : 'none',
      videoId: t.mode === 'youtube' ? t.videoId : null,
      volume: t.volume
    }));
    if (!docId) {
      alert('Não foi possível salvar na nuvem agora (sem conexão com o banco compartilhado). O que já está tocando continua salvo só neste aparelho.');
      return;
    }
    setCloudStatus('saving');
    const ok = await fbUpdateChurchFields(docId, { bgMusic: toSave });
    if (ok) {
      setCloudStatus('saved');
      if (onUpdateChurch && church) onUpdateChurch({ ...church, bgMusic: toSave });
      setTimeout(() => setCloudStatus('idle'), 2500);
    } else {
      setCloudStatus('error');
      setTimeout(() => setCloudStatus('idle'), 3500);
    }
  };
  const audioRefs = [useRef(null), useRef(null), useRef(null)];
  const iframeRefs = [useRef(null), useRef(null), useRef(null)];
  const fileInputRefs = [useRef(null), useRef(null), useRef(null)];
  const debounceRefs = [useRef(null), useRef(null), useRef(null)];

  const updateTrack = (i, patch) => setTracks(list => list.map((t,idx)=>idx===i?{...t,...patch}:t));

  const runSearch = async (i, q) => {
    updateTrack(i, { searching:true, results:null });
    const serverVideos = await searchYoutubeServer(q);
    setTracks(cur => cur.map((t,idx) => {
      if (idx !== i) return t;
      if (t.search.trim() !== q) return t; // usuário já digitou outra coisa
      if (serverVideos) return { ...t, results:serverVideos, suggestions:[], suggestOpen:true, searching:false };
      return { ...t, results:null, suggestOpen:false, searching:false };
    }));
    if (!serverVideos) {
      // sem backend disponível: cai pro modo antigo de sugestões de texto
      fetchYoutubeSuggestions(q, (list) => {
        setTracks(cur => cur.map((t,idx) => {
          if (idx !== i) return t;
          if (t.search.trim() !== q) return t;
          return { ...t, suggestions:list, suggestOpen:true, searching:false };
        }));
      });
    }
  };

  const onSearchChange = (i, val) => {
    updateTrack(i, { search: val, results:null });
    if (debounceRefs[i].current) clearTimeout(debounceRefs[i].current);
    const q = val.trim();
    if (q.length < 2) { updateTrack(i, { suggestions:[], results:null, suggestOpen:false, searching:false }); return; }
    debounceRefs[i].current = setTimeout(() => runSearch(i, q), 400);
  };

  const onSearchEnter = (i) => {
    const q = tracks[i].search.trim();
    if (q) runSearch(i, q);
  };

  const pickTextSuggestion = (i, text) => {
    updateTrack(i, { search:text, suggestOpen:false });
    window.open(youtubeSearchUrl(text), '_blank', 'noopener');
  };

  // Ajusta o volume "de verdade" (arquivo ou player do YouTube) sem passar pelo estado — usado
  // pelo fade, que precisa mudar o volume várias vezes por segundo sem disparar um monte de
  // re-render nem salvar cada passo intermediário como se fosse o volume escolhido pela pessoa.
  const applyLiveVolume = (i, v) => {
    const t = tracks[i];
    if (!t) return;
    const vol = Math.max(0, Math.min(100, v));
    if (t.mode === 'file') {
      const el = audioRefs[i].current;
      if (el) el.volume = vol / 100;
    } else if (t.mode === 'youtube') {
      const frame = iframeRefs[i].current;
      if (frame && frame.contentWindow) ytPostCommand(frame.contentWindow, 'setVolume', [vol]);
    }
  };

  // Desce o volume de uma faixa que já estava tocando até zero e só então pausa — em vez de cortar
  // o áudio seco quando outra faixa toma a prioridade. No fim, devolve o volume real pro valor
  // configurado (a faixa fica pausada, mas pronta pra voltar no volume de sempre da próxima vez).
  const fadeOutAndPause = (i) => {
    const t = tracks[i];
    if (!t || !t.playing) return;
    const startVol = t.volume;
    const finish = () => {
      const cur = tracks[i];
      if (cur && cur.mode === 'file') { const el = audioRefs[i].current; if (el) el.pause(); }
      else if (cur && cur.mode === 'youtube') { const frame = iframeRefs[i].current; if (frame && frame.contentWindow) ytPostCommand(frame.contentWindow, 'pauseVideo'); }
      applyLiveVolume(i, startVol);
      updateTrack(i, { playing:false });
    };
    if (startVol <= 0) { finish(); return; }
    const steps = 12, stepMs = 90;
    let n = 0;
    const iv = setInterval(() => {
      n++;
      applyLiveVolume(i, Math.round(startVol * (1 - n/steps)));
      if (n >= steps) { clearInterval(iv); finish(); }
    }, stepMs);
  };

  // Dá prioridade pro áudio que está começando agora: qualquer outra faixa que já esteja tocando
  // recebe um fade e para, em vez de tocar em cima uma da outra.
  const duckOthers = (i) => { tracks.forEach((other, idx) => { if (idx !== i && other.playing) fadeOutAndPause(idx); }); };

  const pickVideoResult = (i, video) => {
    const audioEl = audioRefs[i].current;
    if (audioEl) { audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }
    duckOthers(i);
    updateTrack(i, { mode:'youtube', videoId: video.videoId, fileName:'', playing:true, link:'', search:'', results:null, suggestOpen:false });
  };

  const pickFile = (i) => { fileInputRefs[i].current && fileInputRefs[i].current.click(); };

  const onFileChosen = (i, e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    duckOthers(i);
    updateTrack(i, { mode:'file', videoId:null });
    const url = URL.createObjectURL(file);
    const el = audioRefs[i].current;
    if (el) {
      el.src = url;
      el.loop = true;
      el.volume = tracks[i].volume / 100;
      el.play().then(() => updateTrack(i, { fileName: file.name, playing:true }))
               .catch(() => updateTrack(i, { fileName: file.name, playing:false }));
    }
    e.target.value = '';
  };

  const useYoutubeLink = (i) => {
    const id = extractYouTubeId((tracks[i].link || '').trim());
    if (!id) { alert('Não consegui reconhecer esse link do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    const audioEl = audioRefs[i].current;
    if (audioEl) { audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }
    duckOthers(i);
    updateTrack(i, { mode:'youtube', videoId:id, fileName:'', playing:true, link:'' });
  };

  const togglePlay = (i) => {
    const t = tracks[i];
    if (t.mode === 'file') {
      const el = audioRefs[i].current;
      if (!el || !el.src) { alert('Carregue um arquivo de áudio primeiro.'); return; }
      if (el.paused) { duckOthers(i); el.play().catch(()=>{}); updateTrack(i, { playing:true }); }
      else { el.pause(); updateTrack(i, { playing:false }); }
    } else if (t.mode === 'youtube') {
      const frame = iframeRefs[i].current;
      if (!frame) { alert('Cole um link do YouTube primeiro.'); return; }
      if (t.playing) { ytPostCommand(frame.contentWindow, 'pauseVideo'); updateTrack(i, { playing:false }); }
      else { duckOthers(i); ytPostCommand(frame.contentWindow, 'playVideo'); updateTrack(i, { playing:true }); }
    } else {
      alert('Carregue um arquivo de áudio ou cole um link do YouTube primeiro.');
    }
  };

  const stopTrack = (i) => {
    const t = tracks[i];
    if (t.mode === 'file') {
      const el = audioRefs[i].current;
      if (el) { el.pause(); el.removeAttribute('src'); el.load(); }
    } else if (t.mode === 'youtube') {
      const frame = iframeRefs[i].current;
      if (frame && frame.contentWindow) ytPostCommand(frame.contentWindow, 'stopVideo');
    }
    updateTrack(i, { mode:'none', fileName:'', videoId:null, playing:false });
  };

  const setVolume = (i, rawVal) => {
    const newVal = Math.max(0, Math.min(100, Number(rawVal)));
    setTracks(prev => {
      const next = prev.map(t => ({...t}));
      const delta = newVal - next[i].volume;
      next[i].volume = newVal;
      if (delta > 0) {
        const others = [0,1,2].filter(idx => idx !== i);
        const othersSum = others.reduce((s,idx) => s + next[idx].volume, 0);
        if (othersSum > 0) {
          others.forEach(idx => {
            const share = next[idx].volume / othersSum;
            next[idx].volume = Math.max(0, Math.round(next[idx].volume - delta * share));
          });
        }
      }
      return next;
    });
  };

  // Mantém o volume real (arquivo local ou player do YouTube) sincronizado sempre que muda
  useEffect(() => {
    tracks.forEach((t, i) => {
      if (t.mode === 'file') {
        const el = audioRefs[i].current;
        if (el) el.volume = t.volume / 100;
      } else if (t.mode === 'youtube') {
        const frame = iframeRefs[i].current;
        if (frame && frame.contentWindow) {
          ytPostCommand(frame.contentWindow, 'setVolume', [t.volume]);
          ytPostCommand(frame.contentWindow, t.volume === 0 ? 'mute' : 'unMute');
        }
      }
    });
  }, [tracks]);

  const onIframeLoad = (i) => {
    // dá um tempinho pro player do YouTube inicializar antes de mandar comandos
    setTimeout(() => {
      const frame = iframeRefs[i].current;
      if (!frame || !frame.contentWindow) return;
      ytPostCommand(frame.contentWindow, 'unMute');
      ytPostCommand(frame.contentWindow, 'setVolume', [tracks[i].volume]);
      ytPostCommand(frame.contentWindow, 'playVideo');
    }, 900);
  };

  return html`
    <div style=${{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'8px', marginBottom:'8px', flexWrap:'wrap'}}>
      <div style=${{fontSize:'10px', color:'var(--text-dim)'}}>Fica salvo neste aparelho sozinho. Pra aparecer também em outros aparelhos, salve na nuvem:</div>
      <button type="button" onClick=${salvarNaNuvem} disabled=${cloudStatus==='saving'} style=${{...btnGhost, padding:'6px 12px', fontSize:'11px', fontWeight:700, opacity: cloudStatus==='saving' ? 0.6 : 1, color: cloudStatus==='saved' ? 'var(--success-1)' : cloudStatus==='error' ? 'var(--danger)' : undefined}}>
        ${cloudStatus==='saving' ? '⏳ Salvando...' : cloudStatus==='saved' ? '✅ Salvo na nuvem!' : cloudStatus==='error' ? '⚠️ Erro — tentar de novo' : '☁️ Salvar na nuvem'}
      </button>
    </div>
    <div style=${{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:'8px', marginBottom:'10px'}}>
      ${tracks.map((t,i) => html`
        <div key=${i} class="glass fade-up" style=${{padding:'10px', borderRadius:'14px', display:'grid', gap:'6px'}}>
          <input value=${t.name} onChange=${e=>updateTrack(i,{name:e.target.value})} style=${{...inputStyle, fontSize:'11px', padding:'6px 8px', fontWeight:700}} />
          <div style=${{fontSize:'9.5px', color:'var(--text-dim)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
            ${t.mode === 'file' ? '🎵 '+t.fileName : t.mode === 'youtube' ? '▶️ Vídeo do YouTube tocando' : 'Nenhum áudio carregado'}
          </div>

          <input type="file" accept="audio/*" ref=${fileInputRefs[i]} style=${{display:'none'}} onChange=${e=>onFileChosen(i,e)} />
          <audio ref=${audioRefs[i]} />
          ${t.mode === 'youtube' && t.videoId && html`
            <iframe
              key=${t.videoId}
              ref=${iframeRefs[i]}
              src=${'https://www.youtube-nocookie.com/embed/'+t.videoId+'?enablejsapi=1&autoplay=1&loop=1&playlist='+t.videoId+'&controls=0&playsinline=1'}
              allow="autoplay; encrypted-media"
              onLoad=${()=>onIframeLoad(i)}
              style=${{width:'1px', height:'1px', opacity:0, position:'absolute', pointerEvents:'none'}}
            ></iframe>
          `}

          <div style=${{display:'flex', gap:'6px'}}>
            <button type="button" onClick=${()=>pickFile(i)} style=${{...btnGhost, padding:'6px 8px', fontSize:'10px', flex:1}}>📁 Arquivo</button>
            <button type="button" onClick=${()=>togglePlay(i)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px'}}>${t.playing ? '⏸' : '▶'}</button>
            <button type="button" onClick=${()=>stopTrack(i)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px'}}>⏹</button>
          </div>

          <div style=${{position:'relative', zIndex: t.suggestOpen ? 300 : 'auto'}}>
            <input
              placeholder="Buscar vídeo no YouTube..." value=${t.search}
              onChange=${e=>onSearchChange(i, e.target.value)}
              onFocus=${()=>{ if ((t.results && t.results.length>0) || t.suggestions.length>0) updateTrack(i,{suggestOpen:true}); }}
              onBlur=${()=>setTimeout(()=>updateTrack(i,{suggestOpen:false}), 150)}
              onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); onSearchEnter(i); } if(e.key==='Escape'){ updateTrack(i,{suggestOpen:false}); } }}
              style=${{...inputStyle, fontSize:'10.5px', padding:'6px 8px', width:'100%'}}
            />
            ${t.searching && html`<div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Buscando...</div>`}
            ${!t.searching && t.suggestOpen && t.results && t.results.length === 0 && html`
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Nenhum resultado encontrado.</div>
            `}
            ${!t.searching && t.suggestOpen && !t.results && t.suggestions.length === 0 && t.search.trim().length >= 2 && html`
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Nenhuma sugestão pra essa palavra-chave. Aperte Enter pra buscar direto no YouTube.</div>
            `}
            ${t.suggestOpen && t.results && t.results.length > 0 && html`
              <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, borderRadius:'10px', padding:'4px', display:'grid', gap:'3px', maxHeight:'260px', overflowY:'auto', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
                <div style=${{fontSize:'9px', color:'var(--text-dim)', padding:'2px 4px'}}>Toque pra tocar direto:</div>
                ${t.results.map((v,vi) => html`
