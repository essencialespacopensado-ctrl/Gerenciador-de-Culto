// Janelas de projeção compartilhadas entre abas/telas da aplicação (evita reabrir com popup toda vez)
const projectionWindows = {};

function screensEnabledKey(churchId) { return 'gc_telas_habilitadas_' + churchId; }
function loadEnabledScreens(churchId) {

}

  try { localStorage.setItem(screensEnabledKey(churchId), JSON.stringify(list)); } catch(e) {}
}
function screenSig(s) { return s.width+'x'+s.height+'@'+s.left+','+s.top; }
function getProjectorScreen(churchId) {
  const list = loadEnabledScreens(churchId);
  return list.find(s => s.isProjector) || (list.length === 1 ? list[0] : null);
}

function videoEmbedHtml(media) {
  const src = media.videoId
    ? 'https://www.youtube.com/embed/'+media.videoId+'?autoplay=1&rel=0'
    : media.playlistId
    ? 'https://www.youtube.com/embed/videoseries?list='+media.playlistId+'&autoplay=1&rel=0'
    : null;
  if (!src) return null;
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Projeção</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;}iframe{position:fixed;inset:0;width:100%;height:100%;border:none;}#fs-fallback{position:fixed;bottom:16px;right:16px;padding:10px 16px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #475569;font-size:14px;cursor:pointer;z-index:10;}</style></head><body><iframe src="'+src+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe><button id="fs-fallback" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();this.style.display=\'none\';">⛶ Tela Cheia</button><scr'+'ipt>try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().then(()=>{var b=document.getElementById(\'fs-fallback\');if(b)b.style.display=\'none\';}).catch(()=>{});}catch(e){}<\/scr'+'ipt></body></html>';
}

function sendToScreenObj(scr, kind, payload) {
  try {
    const sig = screenSig(scr);
    const features = 'left='+scr.left+',top='+scr.top+',width='+scr.width+',height='+scr.height;
    let win = projectionWindows[sig];
    if (!win || win.closed) {
      win = window.open('', 'gc_screen_'+sig, features);
      projectionWindows[sig] = win;
    } else {
      try { win.moveTo(scr.left, scr.top); win.resizeTo(scr.width, scr.height); } catch(e) {}
    }
    if (!win) { alert('Erro: o navegador bloqueou a abertura da janela de projeção. Vá nas configurações do navegador e permita pop-ups pra este site (só precisa autorizar uma vez).'); return; }

    if (kind === 'media') {
      const media = (payload && typeof payload === 'object') ? payload : { url: payload };
      const embedHtml = videoEmbedHtml(media);
      if (embedHtml) {
        win.document.open();
        win.document.write(embedHtml);
        win.document.close();
        // Pede tela cheia aqui mesmo, ainda dentro do clique do usuário (é isso que o navegador exige
        // pra permitir tela cheia automática) — sai mais confiável do que só o script de dentro da janela.
        try {
          const el = win.document.documentElement;
          if (el && el.requestFullscreen) { el.requestFullscreen().catch(()=>{}); }
        } catch(e) {}
      } else if (media.url) {
        win.location.href = media.url;
      } else {
        alert('Erro: esse item não tem vídeo nem link válido pra projetar.');
        return;
      }
    } else if (kind === 'imagem') {
      win.document.open();
      win.document.write(imageEmbedHtml(payload || {}));
      win.document.close();
      // Mesma lógica do vídeo: pede tela cheia aqui, ainda dentro do clique original do usuário.
      try {
        const el = win.document.documentElement;
        if (el && el.requestFullscreen) { el.requestFullscreen().catch(()=>{}); }
      } catch(e) {}
    } else if (kind === 'texto') {
      win.document.open();
      win.document.write(blankWindowHtml('Transmissão', '<h1>'+(payload || '').replace(/</g,'&lt;')+'</h1>'));
      win.document.close();
    } else {
      win.document.open();
      win.document.write(blankWindowHtml('Tela Preta', ''));
      win.document.close();
    }
    win.focus();
  } catch (e) {
    alert('Erro ao enviar para a tela: ' + (e && e.message ? e.message : String(e)));
  }
}

function closeAllProjectionScreens() {
  Object.keys(projectionWindows).forEach(sig => {
    const win = projectionWindows[sig];
    try { if (win && !win.closed) win.close(); } catch(e) {}
    delete projectionWindows[sig];
  });
}

function CronometroTool() {
  const [ms, setMs] = useState(0);
  const [running, setRunning] = useState(false);
  const startRef = useRef(0);
  useEffect(() => {
    if (!running) return;
    startRef.current = Date.now() - ms;
    const id = setInterval(() => setMs(Date.now() - startRef.current), 50);
    return () => clearInterval(id);
  }, [running]);
  const format = (t) => {
    const totalSec = Math.floor(t/1000);
    const m = String(Math.floor(totalSec/60)).padStart(2,'0');
    const s = String(totalSec%60).padStart(2,'0');
    const cs = String(Math.floor((t%1000)/10)).padStart(2,'0');
    return m+':'+s+'.'+cs;
  };
  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px', textAlign:'center'}}>
      <div style=${{fontWeight:800, fontSize:'13px', textAlign:'left'}}>⏱️ Cronômetro</div>
      <div style=${{fontSize:'40px', fontWeight:800, fontVariantNumeric:'tabular-nums'}}>${format(ms)}</div>
      <div style=${{display:'flex', gap:'8px', justifyContent:'center'}}>
        <button onClick=${()=>setRunning(r=>!r)} style=${{...btnPrimary, width:'auto', padding:'9px 18px'}}>${running ? '⏸ Pausar' : '▶ Iniciar'}</button>
        <button onClick=${()=>{ setRunning(false); setMs(0); }} style=${{...btnGhost, padding:'9px 18px'}}>↺ Zerar</button>
      </div>
    </div>
  `;
}

function PowerpointTool({ churchName }) {

  const removeSlide = (i) => setSlides(s => s.filter((_,idx)=>idx!==i));

  const gerar = async () => {
    if (!title.trim()) { alert('Dê um título pra apresentação.'); return; }
    setStatus('Gerando...');
    try {
      const pptx = new window.PptxGenJS();
      const capa = pptx.addSlide();
      capa.background = { color: '1e293b' };
      capa.addText(title, { x:0.5, y:2.2, w:9, h:1.2, fontSize:36, bold:true, color:'FFFFFF', align:'center' });

        if (sl.body.trim()) s.addText(sl.body, { x:0.5, y:1.4, w:9, h:5, fontSize:16, color:'334155' });
      });

      const blob = await pptx.write({ outputType:'blob' });
      const dl = await claude.use('downloads');
      if (!dl) { setStatus('Download não disponível aqui.'); return; }
      const res = await dl.save({ filename: title.replace(/[^a-z0-9áéíóúàâêôãõç \-]/gi,'').trim()+'.pptx', data: blob });
      setStatus(res.status === 'saved' ? '✅ Salvo!' : '');
    } catch (e) {
      setStatus('Não foi possível gerar agora.');

  };

  return html`

function NumberDrawTool({ churchId }) {
  const [min, setMin] = useState(1);
  const [max, setMax] = useState(60);
  const [qty, setQty] = useState(1);
  const [balls, setBalls] = useState([]);
  const [result, setResult] = useState([]);
  const [spinning, setSpinning] = useState(false);
  const [history, setHistory] = useState([]);

  useEffect(() => {
    const lo = Math.min(min, max), hi = Math.max(min, max);
    const range = hi - lo + 1;
    const pool = [];
    for (let i=lo; i<=hi; i++) pool.push(i);
    const count = Math.min(14, range);
    const chosen = [];
    for (let i=0; i<count; i++) {
      const idx = Math.floor(Math.random()*pool.length);
      chosen.push(pool.splice(idx,1)[0]);
    }
    const arr = chosen.map((num, i) => ({
      id: i,
      num,
      dur: 1.6 + Math.random()*1.2,
      delay: Math.random()*0.6,
      size: 34 + Math.random()*14,
      x1: Math.random()*70+5, y1: Math.random()*70+5,
      x2: Math.random()*70+5, y2: Math.random()*70+5,
      x3: Math.random()*70+5, y3: Math.random()*70+5,
      hue: Math.floor(Math.random()*360),
    }));
    setBalls(arr);
  }, [min, max]);

  const sortear = () => {
    const lo = Math.min(min, max), hi = Math.max(min, max);
    const n = Math.max(1, Math.min(qty, hi-lo+1));
    setSpinning(true);
    setResult([]);
    setTimeout(() => {
      const pool = [];
      for (let i=lo; i<=hi; i++) pool.push(i);
      const drawn = [];
      for (let i=0; i<n; i++) {
        const idx = Math.floor(Math.random()*pool.length);
        drawn.push(pool.splice(idx,1)[0]);
      }
      const sorted = drawn.sort((a,b)=>a-b);
      setResult(sorted);
      setHistory(h => [...h, ...sorted]);
      setSpinning(false);
    }, 2400);
  };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'12px'}}>
      <div style=${{fontWeight:800, fontSize:'13px'}}>🎱 Sorteador de Números (Globo)</div>

      <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px'}}>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>De</div>
          <input type="number" value=${min} onChange=${e=>setMin(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>Até</div>
          <input type="number" value=${max} onChange=${e=>setMax(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
        <div>
          <div style=${{fontSize:'10px', color:'var(--text-dim)', marginBottom:'4px'}}>Quantos</div>
          <input type="number" min="1" value=${qty} onChange=${e=>setQty(Number(e.target.value))} style=${{...inputStyle, fontSize:'12px'}} />
        </div>
      </div>

      <div style=${{
        position:'relative', width:'220px', height:'220px', margin:'0 auto', borderRadius:'50%',
        background:'radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 40%, transparent 60%), radial-gradient(circle, rgba(148,163,184,0.12), rgba(15,23,42,0.5))',
        border:'3px solid rgba(148,163,184,0.35)', overflow:'hidden', boxShadow:'inset 0 0 30px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3)'
      }}>
        ${balls.map(b => html`
          <div key=${b.id} style=${{
            position:'absolute', width:b.size+'px', height:b.size+'px', borderRadius:'50%',
            left:'0%', top:'0%',
            background:'hsl('+b.hue+',70%,55%)',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:(b.size*0.4)+'px', fontWeight:800, color:'#fff',
            boxShadow:'inset -3px -3px 6px rgba(0,0,0,0.35), inset 2px 2px 4px rgba(255,255,255,0.4)',
            animation: spinning ? ('ballBounce'+b.id+' '+b.dur+'s ease-in-out '+b.delay+'s infinite alternate') : 'none',
            transform: spinning ? undefined : 'translate(90px,90px)',
            transition: spinning ? 'none' : 'transform 0.6s ease'
          }}>${b.num}</div>
          <style>
            @keyframes ballBounce${b.id} {
              0% { transform: translate(${b.x1}%, ${b.y1}%); }
              50% { transform: translate(${b.x2}%, ${b.y2}%); }
              100% { transform: translate(${b.x3}%, ${b.y3}%); }
            }
          </style>
        `)}
      </div>

      <button onClick=${sortear} disabled=${spinning} style=${{...btnPrimary, width:'auto', justifySelf:'center', padding:'10px 22px'}}>${spinning ? 'Sorteando...' : '🎱 Girar e Sortear'}</button>

      ${result.length > 0 && html`
        <div style=${{display:'grid', gap:'10px'}}>
          <div style=${{display:'flex', gap:'8px', justifyContent:'center', flexWrap:'wrap'}}>
            ${result.map(n => html`
              <div key=${n} style=${{width:'46px', height:'46px', borderRadius:'50%', background:'linear-gradient(135deg,var(--accent-1),var(--accent-2))', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:'16px', boxShadow:'0 4px 10px rgba(0,0,0,0.3)'}}>${n}</div>
            `)}
          </div>
          <button onClick=${()=>{
            const projector = loadEnabledScreens(churchId).find(s=>s.isProjector) || loadEnabledScreens(churchId)[0];
            if (!projector) { alert('Nenhuma tela habilitada ainda. Vá na aba "Telas" e habilite pelo menos uma.'); return; }
            sendToScreenObj(projector, 'texto', result.join('  -  '));
          }} style=${{...btnGhost, justifySelf:'center', padding:'8px 16px'}}>📽️ Projetar no Telão</button>
        </div>
      `}

      ${history.length > 0 && html`
        <div style=${{borderTop:'1px solid var(--border-soft)', paddingTop:'12px', display:'grid', gap:'8px'}}>
          <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em'}}>Já sorteados (${history.length})</div>
            <button onClick=${()=>setHistory([])} style=${{...btnGhost, padding:'5px 10px', fontSize:'10.5px'}}>🗑️ Limpar</button>
          </div>
          <div style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
            ${history.map((n,i) => html`
              <div key=${i} style=${{width:'32px', height:'32px', borderRadius:'50%', background:'rgba(148,163,184,0.16)', color:'var(--text-hi)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:'12px'}}>${n}</div>
            `)}
          </div>
        </div>
      `}
    </div>
  `;
}

function CatalogoMusicasTool({ churchId }) {
  const [collection, setCollection] = useState(SONG_COLLECTIONS[0]);
  const storeKey = 'gc_catalogo_musicas_' + churchId + '_' + collection;
  const load = () => { try { const raw = localStorage.getItem(storeKey); if (raw) return JSON.parse(raw); } catch(e) {} return []; };
  const [items, setItems] = useState(load);
  useEffect(() => { setItems(load()); }, [collection]);
  const save = (list) => { try { localStorage.setItem(storeKey, JSON.stringify(list)); } catch(e) {} };

  const [number, setNumber] = useState('');
  const [title, setTitle] = useState('');
  const [notes, setNotes] = useState('');

  const add = (e) => {
    e.preventDefault();
    if (!title.trim()) return;
    const next = [...items, { id:'cm-'+Date.now(), number:number.trim(), title:title.trim(), notes:notes.trim() }];
    setItems(next); save(next);
    setNumber(''); setTitle(''); setNotes('');

  const remove = (id) => { const next = items.filter(i=>i.id!==id); setItems(next); save(next); };

  return html`

      <div style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
        ${SONG_COLLECTIONS.map(c => html`
          <button key=${c} type="button" onClick=${()=>setCollection(c)} style=${{padding:'6px 12px', borderRadius:'999px', fontSize:'11px', fontWeight:700, border:'1px solid var(--border-soft)', background: collection===c ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: collection===c ? '#fff' : 'var(--text-mid)'}}>${c}</button>
        `)}
      </div>

      <form onSubmit=${add} style=${{display:'grid', gridTemplateColumns:'80px 1fr', gap:'8px'}}>
        <input placeholder="Nº" value=${number} onChange=${e=>setNumber(e.target.value)} style=${{...inputStyle, fontSize:'12px'}} />

        <button type="submit" style=${{...btnPrimary, width:'auto', justifySelf:'start', padding:'9px 16px', gridColumn:'1 / -1'}}>+ Adicionar à ${collection}</button>
      </form>

      <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>${items.length} item(ns) em "${collection}"</div>
      <div style=${{display:'grid', gap:'6px'}}>
        ${items.length === 0 && html`<div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Nenhum item cadastrado nessa coleção ainda.</div>`}
        ${items.map(it => html`
          <div key=${it.id} class="glass fade-up" style=${{padding:'9px 12px', borderRadius:'10px', display:'flex', alignItems:'center', gap:'10px'}}>
            <div style=${{flex:1}}>
              <div style=${{fontWeight:700, fontSize:'12px'}}>${it.number ? '#'+it.number+' — ' : ''}${it.title}</div>

  const [linkingId, setLinkingId] = useState(null);

  useEffect(() => saveColetaneasCustom(churchId, custom), [custom, churchId]);
  useEffect(() => saveColetaneasLinks(churchId, links), [links, churchId]);

  const all = [...COLETANEAS_SEED, ...COLETANEAS_ADORADORES, ...COLETANEAS_CANTORES, ...COLETANEAS_CELEBRASP, ...custom];
  const isTodas = category === 'Todas';

      </div>
      ${adding && html`
        <form onSubmit=${addItem} style=${{display:'flex', gap:'6px', marginBottom:'12px', flexWrap:'wrap'}}>
          <input placeholder="Nome da coletânea" value=${newTitle} onChange=${e=>setNewTitle(e.target.value)} style=${{...inputStyle, fontSize:'12px', flex:1, minWidth:'140px'}} autoFocus />
          <input placeholder="Ano" value=${newYear} onChange=${e=>setNewYear(e.target.value)} style=${{...inputStyle, fontSize:'12px', width:'70px'}} />
          ${isTodas && html`

      <div style=${{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(130px, 1fr))', gap:'10px'}}>
        ${shown.length === 0 && html`<div style=${{fontSize:'12px', color:'var(--text-dim)', gridColumn:'1/-1'}}>Nenhuma coletânea aqui ainda. Toca em "+ Adicionar" pra cadastrar.</div>`}
        ${shown.map((c,i) => {

                    <button onClick=${()=>unlink(c.id)} style=${{fontSize:'10px', fontWeight:700, color:'#fff', background:'rgba(0,0,0,0.2)', border:'none', padding:'3px 7px', borderRadius:'7px'}}>✕</button>

// Busca de vídeo no YouTube pra uso livre (fora dos 3 itens fixos da semana). O YouTube não deixa um
// site como este trazer resultados prontos (com miniatura) sem servidor próprio — então o caminho é:
// sugestão de texto em tempo real (vem direto do Google, sem precisar de servidor) + abrir a busca de
// verdade no youtube.com com um toque + colar o link do vídeo certo de volta aqui pra deixar pronto
// pra tocar e projetar.
function YoutubeQuickSearch({ churchId }) {
  const [search, setSearch] = useState('');
  const [suggestions, setSuggestions] = useState([]);
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [searching, setSearching] = useState(false);
  const [link, setLink] = useState('');
  const [result, setResult] = useState(null);
  const [serverResults, setServerResults] = useState(null); // null = não tentou/sem backend; [] = tentou e veio vazio
  const [serverSearching, setServerSearching] = useState(false);
  const debounceRef = useRef(null);

  const runSearch = (q) => {
    setSearching(true);
    fetchYoutubeSuggestions(q, (list) => {
      setSearching(false);
      setSuggestions(list);
      setSuggestOpen(true); // mostra o resultado mesmo quando vier vazio, pra sempre dar um retorno
    });
  };
  const onSearchChange = (val) => {
    setSearch(val);
    setServerResults(null);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    const q = val.trim();
    if (q.length < 2) { setSuggestions([]); setSuggestOpen(false); setSearching(false); return; }
    debounceRef.current = setTimeout(() => runSearch(q), 400);
  };
  const openSearch = (q) => { if (q.trim()) window.open(youtubeSearchUrl(q.trim()), '_blank', 'noopener'); };
  const pickSuggestion = (text) => { setSearch(text); setSuggestOpen(false); doServerSearch(text); };

  // Tenta buscar de verdade (com miniatura) pelo servidor próprio primeiro; se não tiver servidor
  // (como aqui dentro do Claude, ou hospedagem só estática), cai pro fluxo simples de sempre.
  const doServerSearch = async (q) => {
    const query = (q || search).trim();
    if (!query) return;
    setSuggestOpen(false);
    setServerSearching(true);
    const videos = await searchYoutubeServer(query);
    setServerSearching(false);
    if (videos && videos.length > 0) { setServerResults(videos); return; }
    setServerResults(videos && videos.length === 0 ? [] : null);
    if (!videos) openSearch(query); // sem backend disponível — abre a busca real do YouTube como sempre
  };

  const pickServerResult = (v) => {
    setResult({ title: v.title, videoId: v.videoId, url: v.watchUrl || ('https://www.youtube.com/watch?v='+v.videoId), thumbnail: v.thumbnail, channel: v.channel });
    setServerResults(null);
  };

  const confirmLink = (e) => {
    e.preventDefault();
    const id = extractYouTubeId(link.trim());
    if (!id) { alert('Não consegui reconhecer esse link como um vídeo do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    setResult({ title: search.trim() || 'Vídeo buscado', videoId: id, url: 'https://www.youtube.com/watch?v='+id });
    setLink('');
  };
  const newSearch = () => { setResult(null); setSearch(''); setLink(''); setServerResults(null); };

  return html`
    <div class="glass fade-up" style=${{padding:'16px', borderRadius:'16px', display:'grid', gap:'10px'}}>
      <div style=${{fontWeight:800, fontSize:'13.5px'}}>🔎 Buscar vídeo no YouTube</div>
      <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Digite pra ver sugestões em tempo real, toque numa delas (ou aperte Enter) pra abrir a busca de verdade no YouTube, ache o vídeo certo e cole o link dele aqui embaixo pra deixar pronto pra tocar/projetar.</div>

      ${!result ? html`
        <div style=${{position:'relative', zIndex: suggestOpen ? 300 : 'auto'}}>
          <div style=${{display:'flex', gap:'6px'}}>
            <input
              placeholder="Buscar no YouTube e apertar Enter..." value=${search}
              onChange=${e=>onSearchChange(e.target.value)}
              onFocus=${()=>{ if (suggestions.length>0) setSuggestOpen(true); }}
              onBlur=${()=>setTimeout(()=>setSuggestOpen(false), 150)}
              onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); doServerSearch(); } if(e.key==='Escape'){ setSuggestOpen(false); } }}
              style=${{...inputStyle, fontSize:'12px', flex:1}}
            />
            <button type="button" onClick=${()=>doServerSearch()} disabled=${!search.trim() || serverSearching} style=${{...btnPrimary, width:'auto', padding:'9px 14px', opacity: (search.trim() && !serverSearching) ? 1 : 0.5}}>${serverSearching ? '⏳' : '🔎'} Buscar</button>
          </div>
          ${searching && html`<div style=${{fontSize:'10.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Buscando sugestões...</div>`}
          ${!searching && suggestOpen && suggestions.length === 0 && search.trim().length >= 2 && html`
            <div style=${{fontSize:'10.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Não veio nenhuma sugestão agora (pode ser instabilidade da rede). Toque em "🔎 Buscar" pra ir direto pro YouTube com o que você digitou.</div>
          `}
          ${suggestOpen && suggestions.length > 0 && html`
            <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, borderRadius:'10px', padding:'4px', display:'grid', gap:'2px', maxHeight:'220px', overflowY:'auto', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'2px 4px'}}>Toque pra buscar (com miniatura, quando disponível):</div>
              ${suggestions.map((s,si) => html`
                <button key=${si} type="button" onMouseDown=${e=>e.preventDefault()} onClick=${()=>pickSuggestion(s)} style=${{textAlign:'left', padding:'7px 9px', borderRadius:'7px', border:'none', background:'transparent', color:'var(--text-mid)', fontSize:'11.5px'}}>🔎 ${s}</button>
              `)}
            </div>
          `}
        </div>

        ${serverResults && serverResults.length > 0 && html`
          <div style=${{display:'grid', gap:'6px', maxHeight:'320px', overflowY:'auto'}}>
            ${serverResults.map((v,vi) => html`
              <button key=${v.videoId+vi} type="button" onClick=${()=>pickServerResult(v)} style=${{display:'flex', gap:'10px', alignItems:'center', padding:'6px', borderRadius:'10px', border:'1px solid var(--border-soft)', background:'var(--glass-bg)', textAlign:'left'}}>
                <img src=${v.thumbnail} alt="" style=${{width:'72px', height:'42px', objectFit:'cover', borderRadius:'6px', flexShrink:0}} />
                <div style=${{minWidth:0}}>
                  <div style=${{fontSize:'11.5px', fontWeight:700, color:'var(--text-hi)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>${v.title}</div>
                  <div style=${{fontSize:'10px', color:'var(--text-dim)'}}>${v.channel || ''}${v.duration ? ' • '+v.duration : ''}</div>
                </div>
              </button>
            `)}
          </div>
        `}
        ${serverResults && serverResults.length === 0 && html`
          <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Nenhum resultado encontrado pelo servidor pra essa busca.</div>
        `}

        <form onSubmit=${confirmLink} style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
          <input placeholder="Ou colar aqui o link do vídeo (se você já tiver achado no YouTube)" value=${link} onChange=${e=>setLink(e.target.value)} style=${{...inputStyle, fontSize:'11.5px', flex:1, minWidth:'200px'}} />
          <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 16px'}}>✅ Confirmar</button>
        </form>
      ` : html`
        <div class="fade-up" style=${{borderRadius:'14px', padding:'14px', display:'flex', flexDirection:'column', gap:'8px', background:'linear-gradient(150deg,#2563eb,#1e3a8a)', color:'#fff'}}>
          <div style=${{fontWeight:800, fontSize:'12.5px'}}>🎬 ${result.title}</div>
          <div style=${{display:'flex', gap:'8px', flexWrap:'wrap'}}>
            <button type="button" onClick=${()=>openMediaInNewTab(result)} style=${{fontSize:'11px', fontWeight:700, color:'#fff', background:'rgba(255,255,255,0.22)', border:'none', padding:'6px 12px', borderRadius:'9px'}}>▶ Play</button>
            <${ProjectButton} churchId=${churchId} media=${result} />
            <button type="button" onClick=${newSearch} style=${{fontSize:'11px', fontWeight:700, color:'#fff', background:'rgba(0,0,0,0.2)', border:'none', padding:'6px 12px', borderRadius:'9px'}}>🔄 Nova busca</button>
          </div>
        </div>
      `}
    </div>
  `;
}

function TelasView({ churchId }) {
  const [screens, setScreens] = useState(null);
  const [permissionMsg, setPermissionMsg] = useState('');
  const [enabled, setEnabled] = useState(() => loadEnabledScreens(churchId));
  const [choices, setChoices] = useState({});
  const activities = loadActivities(churchId);

  const mediaOptions = activities.filter(a => a.media && a.media.title).map(a => ({ label: a.name+' — '+a.media.title, url: a.media.url, playlistId: a.media.playlistId || null, videoId: a.media.videoId || null }));

  const detectScreens = async () => {
    setPermissionMsg('');
    if ('getScreenDetails' in window) {
      try {
        const details = await window.getScreenDetails();
        const list = details.screens.map((s,i) => ({ label: (s.isPrimary ? 'Tela Principal' : 'Tela '+(i+1))+' — '+s.width+'x'+s.height, left: s.left, top: s.top, width: s.width, height: s.height }));
        setScreens(list);
      } catch (e) {
        setPermissionMsg('Permissão de telas negada ou indisponível. Usando apenas a tela atual.');
        setScreens([{ label: 'Tela Atual', left:0, top:0, width: window.screen.width, height: window.screen.height }]);
      }
    } else {
      setPermissionMsg('Seu navegador não suporta detectar múltiplas telas automaticamente (funciona no Chrome/Edge no computador). Você ainda pode abrir uma janela e arrastar manualmente pra outra tela.');
      setScreens([{ label: 'Tela Atual', left:0, top:0, width: window.screen.width, height: window.screen.height }]);
    }
  };

  useEffect(() => { detectScreens(); }, []);

  const toggleEnabled = (scr) => {
    const sig = screenSig(scr);
    setEnabled(list => {
      const exists = list.some(s => screenSig(s) === sig);
      const next = exists ? list.filter(s => screenSig(s) !== sig) : [...list, { ...scr, isProjector: list.length === 0 }];
      saveEnabledScreens(churchId, next);
      return next;
    });
  };
  const setProjector = (sig) => {
    setEnabled(list => {
      const next = list.map(s => ({ ...s, isProjector: screenSig(s) === sig }));
      saveEnabledScreens(churchId, next);
      return next;
    });
  };

  const setChoice = (sig, patch) => setChoices(c => ({ ...c, [sig]: { ...(c[sig]||{type:'blank'}), ...patch } }));

  const sendToScreen = (scr, sig) => {
    const choice = choices[sig] || { type:'blank' };
    if (choice.type === 'media' && mediaOptions[choice.mediaIdx]) sendToScreenObj(scr, 'media', mediaOptions[choice.mediaIdx]);
    else if (choice.type === 'texto') sendToScreenObj(scr, 'texto', choice.text);
    else sendToScreenObj(scr, 'blank');
  };

  const enabledSigs = enabled.map(screenSig);

  return html`
    <div style=${{maxWidth:'700px', margin:'0 auto', padding:'20px 16px 60px', display:'grid', gap:'16px'}}>
      <div style=${{fontSize:'11.5px', color:'var(--text-dim)'}}>Essa aba é para habilitar quais telas conectadas recebem transmissão e marcar qual delas é o projetor principal.</div>

      ${permissionMsg && html`<div class="glass fade-up" style=${{padding:'12px 14px', borderRadius:'12px', fontSize:'11px', color:'var(--highlight)'}}>${permissionMsg}</div>`}
      <div style=${{display:'flex', gap:'8px', flexWrap:'wrap'}}>
        <button onClick=${detectScreens} style=${{...btnGhost, justifySelf:'start'}}>🔄 Detectar Telas Novamente</button>
        <button onClick=${closeAllProjectionScreens} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🔴 Encerrar em Todas as Telas</button>
      </div>

      ${!screens ? html`<div style=${{fontSize:'12px', color:'var(--text-dim)'}}>Detectando telas...</div>` : html`
        <div>
          <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'0 0 10px 0'}}>Telas Detectadas (${screens.length})</h3>
          <div style=${{display:'grid', gap:'8px'}}>
            ${screens.map(scr => {
              const sig = screenSig(scr);
              const isOn = enabledSigs.includes(sig);
              const enabledObj = enabled.find(s => screenSig(s) === sig);
              return html`
                <div key=${sig} class="glass fade-up" style=${{padding:'12px 16px', borderRadius:'14px', display:'flex', alignItems:'center', gap:'12px', border: isOn ? '1.5px solid var(--accent-1)' : '1px solid var(--border-soft)'}}>
                  <input type="checkbox" checked=${isOn} onChange=${()=>toggleEnabled(scr)} style=${{width:'18px', height:'18px'}} />
                  <div style=${{flex:1}}>
                    <div style=${{fontWeight:700, fontSize:'13px'}}>${scr.label}</div>
                    <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Posição: ${scr.left},${scr.top}</div>
                  </div>
                  ${isOn && html`
                    <button onClick=${()=>setProjector(sig)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px', color: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--text-dim)', borderColor: enabledObj && enabledObj.isProjector ? 'var(--highlight)' : 'var(--border-soft)'}}>${enabledObj && enabledObj.isProjector ? '📽️ Projetor' : 'Definir como Projetor'}</button>
                  `}
                </div>
              `;
            })}
          </div>
        </div>

        ${enabled.length > 0 && html`
          <div>
            <h3 style=${{fontSize:'13px', fontWeight:800, color:'var(--text-mid)', textTransform:'uppercase', letterSpacing:'0.04em', margin:'16px 0 10px 0'}}>Transmitir</h3>
            <div style=${{display:'grid', gap:'12px'}}>
              ${enabled.map(scr => {
                const sig = screenSig(scr);
                const choice = choices[sig] || { type:'blank' };
                return html`
                  <div key=${sig} class="glass fade-up" style=${{padding:'14px', borderRadius:'14px', display:'grid', gap:'8px'}}>
                    <div style=${{fontWeight:700, fontSize:'12.5px'}}>${scr.label}${scr.isProjector ? ' 📽️' : ''}</div>
                    <select value=${choice.type} onChange=${e=>setChoice(sig, {type:e.target.value})} style=${{...inputStyle, fontSize:'12px'}}>
                      <option value="blank">⬛ Tela Preta</option>
                      <option value="media">🎬 Vídeo/Música da Liturgia</option>
                      <option value="texto">🔤 Texto Personalizado</option>
                    </select>
                    ${choice.type === 'media' && html`
                      <select value=${choice.mediaIdx ?? ''} onChange=${e=>setChoice(sig, {mediaIdx: Number(e.target.value)})} style=${{...inputStyle, fontSize:'12px'}}>
                        <option value="">${mediaOptions.length ? '(escolher)' : 'Nenhum vídeo/música anexado na liturgia ainda'}</option>
                        ${mediaOptions.map((m,i) => html`<option key=${i} value=${i}>${m.label}</option>`)}
                      </select>
                    `}
                    ${choice.type === 'texto' && html`
                      <input placeholder="Texto a exibir" value=${choice.text||''} onChange=${e=>setChoice(sig, {text:e.target.value})} style=${{...inputStyle, fontSize:'12px'}} />
                    `}
                    <button onClick=${()=>sendToScreen(scr, sig)} style=${{...btnPrimary, width:'auto', justifySelf:'start', padding:'8px 16px'}}>📤 Enviar para esta Tela</button>
                  </div>
                `;
              })}
            </div>
          </div>
        `}
      `}
    </div>
  `;
}

function ytPostCommand(win, func, args) {
  if (!win) return;
  try { win.postMessage(JSON.stringify({ event:'command', func, args: args || [] }), '*'); } catch(e) {}
}

// Sugestões de busca em tempo real (texto), pelo mesmo serviço que alimenta a caixinha de busca do
// próprio youtube.com — é do Google, super confiável e não usa fetch (usa JSONP, que não esbarra em CORS).
// Essa é a base garantida da busca em tempo real.
function fetchYoutubeSuggestions(query, callback) {
  try {
    const cbName = '__ytSuggest_' + Math.random().toString(36).slice(2);
    let done = false;
    const cleanup = () => { try { delete window[cbName]; } catch(e) {} if (script.parentNode) script.parentNode.removeChild(script); };
    const finish = (list) => { if (done) return; done = true; callback(list); cleanup(); };
    window[cbName] = (data) => {
      let list = [];
      try { list = (data && data[1]) ? data[1].map(x => Array.isArray(x) ? x[0] : x).filter(Boolean) : []; } catch(e) {}
      finish(list);
    };
    const script = document.createElement('script');
    script.src = 'https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=' + encodeURIComponent(query) + '&callback=' + cbName;
    script.onerror = () => finish([]);
    document.body.appendChild(script);
    setTimeout(() => finish([]), 4000); // trava de segurança caso a rede nunca responda
  } catch(e) { callback([]); }
}

// Busca de vídeo de verdade (com miniatura, canal, duração) via servidor próprio — só funciona quando
// este arquivo está hospedado junto com o backend Express (rota /api/search-weekly-videos). Dentro do
// Claude, ou em uma hospedagem só estática, essa chamada falha rápido e quem chamou cai no modo
// simples (sugestão de texto + colar link).
async function searchYoutubeServer(query) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch('/api/search-weekly-videos?q=' + encodeURIComponent(query), { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    const data = await res.json();
    return Array.isArray(data.videos) ? data.videos : null;
  } catch (e) { return null; } // sem backend, sem rede, ou bloqueado — retorna null pra cair no fallback
}

// O YouTube não permite (por política própria) que um site como este busque vídeos automaticamente
// sem um servidor próprio. Por isso o caminho aqui é o mais simples e confiável possível: sugestão de
// texto em tempo real (JSONP, do próprio Google) + um clique abre a busca de verdade no youtube.com +
// colar o link do vídeo escolhido de volta aqui.
function BackgroundAudioMixer() {
  const [tracks, setTracks] = useState([
    { name:'Fundo 1', mode:'none', fileName:'', videoId:null, playing:false, volume:60, search:'', link:'', suggestions:[], results:null, suggestOpen:false, searching:false },
    { name:'Fundo 2', mode:'none', fileName:'', videoId:null, playing:false, volume:60, search:'', link:'', suggestions:[], results:null, suggestOpen:false, searching:false },
    { name:'Fundo 3', mode:'none', fileName:'', videoId:null, playing:false, volume:60, search:'', link:'', suggestions:[], results:null, suggestOpen:false, searching:false },
  ]);
  const audioRefs = [useRef(null), useRef(null), useRef(null)];
  const iframeRefs = [useRef(null), useRef(null), useRef(null)];
  const fileInputRefs = [useRef(null), useRef(null), useRef(null)];
  const debounceRefs = [useRef(null), useRef(null), useRef(null)];

  const updateTrack = (i, patch) => setTracks(list => list.map((t,idx)=>idx===i?{...t,...patch}:t));

  const runSearch = async (i, q) => {
    updateTrack(i, { searching:true, results:null });
    const serverVideos = await searchYoutubeServer(q);
    setTracks(cur => cur.map((t,idx) => {
      if (idx !== i) return t;
      if (t.search.trim() !== q) return t; // usuário já digitou outra coisa
      if (serverVideos) return { ...t, results:serverVideos, suggestions:[], suggestOpen:true, searching:false };
      return { ...t, results:null, suggestOpen:false, searching:false };
    }));
    if (!serverVideos) {
      // sem backend disponível: cai pro modo antigo de sugestões de texto
      fetchYoutubeSuggestions(q, (list) => {
        setTracks(cur => cur.map((t,idx) => {
          if (idx !== i) return t;
          if (t.search.trim() !== q) return t;
          return { ...t, suggestions:list, suggestOpen:true, searching:false };
        }));
      });
    }
  };

  const onSearchChange = (i, val) => {
    updateTrack(i, { search: val, results:null });
    if (debounceRefs[i].current) clearTimeout(debounceRefs[i].current);
    const q = val.trim();
    if (q.length < 2) { updateTrack(i, { suggestions:[], results:null, suggestOpen:false, searching:false }); return; }
    debounceRefs[i].current = setTimeout(() => runSearch(i, q), 400);
  };

  const onSearchEnter = (i) => {
    const q = tracks[i].search.trim();
    if (q) runSearch(i, q);
  };

  const pickTextSuggestion = (i, text) => {
    updateTrack(i, { search:text, suggestOpen:false });
    window.open(youtubeSearchUrl(text), '_blank', 'noopener');
  };

  const pickVideoResult = (i, video) => {
    const audioEl = audioRefs[i].current;
    if (audioEl) { audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }
    updateTrack(i, { mode:'youtube', videoId: video.videoId, fileName:'', playing:true, link:'', search:'', results:null, suggestOpen:false });
  };

  const pickFile = (i) => { fileInputRefs[i].current && fileInputRefs[i].current.click(); };

  const onFileChosen = (i, e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    updateTrack(i, { mode:'file', videoId:null });
    const url = URL.createObjectURL(file);
    const el = audioRefs[i].current;
    if (el) {
      el.src = url;
      el.loop = true;
      el.volume = tracks[i].volume / 100;
      el.play().then(() => updateTrack(i, { fileName: file.name, playing:true }))
               .catch(() => updateTrack(i, { fileName: file.name, playing:false }));
    }
    e.target.value = '';
  };

  const useYoutubeLink = (i) => {
    const id = extractYouTubeId((tracks[i].link || '').trim());
    if (!id) { alert('Não consegui reconhecer esse link do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    const audioEl = audioRefs[i].current;
    if (audioEl) { audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load(); }
    updateTrack(i, { mode:'youtube', videoId:id, fileName:'', playing:true, link:'' });
  };

  const togglePlay = (i) => {
    const t = tracks[i];
    if (t.mode === 'file') {
      const el = audioRefs[i].current;
      if (!el || !el.src) { alert('Carregue um arquivo de áudio primeiro.'); return; }
      if (el.paused) { el.play().catch(()=>{}); updateTrack(i, { playing:true }); }
      else { el.pause(); updateTrack(i, { playing:false }); }
    } else if (t.mode === 'youtube') {
      const frame = iframeRefs[i].current;
      if (!frame) { alert('Cole um link do YouTube primeiro.'); return; }
      if (t.playing) { ytPostCommand(frame.contentWindow, 'pauseVideo'); updateTrack(i, { playing:false }); }
      else { ytPostCommand(frame.contentWindow, 'playVideo'); updateTrack(i, { playing:true }); }
    } else {
      alert('Carregue um arquivo de áudio ou cole um link do YouTube primeiro.');
    }
  };

  const stopTrack = (i) => {
    const t = tracks[i];
    if (t.mode === 'file') {
      const el = audioRefs[i].current;
      if (el) { el.pause(); el.removeAttribute('src'); el.load(); }
    } else if (t.mode === 'youtube') {
      const frame = iframeRefs[i].current;
      if (frame && frame.contentWindow) ytPostCommand(frame.contentWindow, 'stopVideo');
    }
    updateTrack(i, { mode:'none', fileName:'', videoId:null, playing:false });
  };

  const setVolume = (i, rawVal) => {
    const newVal = Math.max(0, Math.min(100, Number(rawVal)));
    setTracks(prev => {
      const next = prev.map(t => ({...t}));
      const delta = newVal - next[i].volume;
      next[i].volume = newVal;
      if (delta > 0) {
        const others = [0,1,2].filter(idx => idx !== i);
        const othersSum = others.reduce((s,idx) => s + next[idx].volume, 0);
        if (othersSum > 0) {
          others.forEach(idx => {
            const share = next[idx].volume / othersSum;
            next[idx].volume = Math.max(0, Math.round(next[idx].volume - delta * share));
          });
        }
      }
      return next;
    });
  };

  // Mantém o volume real (arquivo local ou player do YouTube) sincronizado sempre que muda
  useEffect(() => {
    tracks.forEach((t, i) => {
      if (t.mode === 'file') {
        const el = audioRefs[i].current;
        if (el) el.volume = t.volume / 100;
      } else if (t.mode === 'youtube') {
        const frame = iframeRefs[i].current;
        if (frame && frame.contentWindow) {
          ytPostCommand(frame.contentWindow, 'setVolume', [t.volume]);
          ytPostCommand(frame.contentWindow, t.volume === 0 ? 'mute' : 'unMute');
        }
      }
    });
  }, [tracks]);

  const onIframeLoad = (i) => {
    // dá um tempinho pro player do YouTube inicializar antes de mandar comandos
    setTimeout(() => {
      const frame = iframeRefs[i].current;
      if (!frame || !frame.contentWindow) return;
      ytPostCommand(frame.contentWindow, 'unMute');
      ytPostCommand(frame.contentWindow, 'setVolume', [tracks[i].volume]);
      ytPostCommand(frame.contentWindow, 'playVideo');
    }, 900);
  };

  return html`
    <div style=${{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:'8px', marginBottom:'10px'}}>
      ${tracks.map((t,i) => html`
        <div key=${i} class="glass fade-up" style=${{padding:'10px', borderRadius:'14px', display:'grid', gap:'6px'}}>
          <input value=${t.name} onChange=${e=>updateTrack(i,{name:e.target.value})} style=${{...inputStyle, fontSize:'11px', padding:'6px 8px', fontWeight:700}} />
          <div style=${{fontSize:'9.5px', color:'var(--text-dim)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
            ${t.mode === 'file' ? '🎵 '+t.fileName : t.mode === 'youtube' ? '▶️ Vídeo do YouTube tocando' : 'Nenhum áudio carregado'}
          </div>

          <input type="file" accept="audio/*" ref=${fileInputRefs[i]} style=${{display:'none'}} onChange=${e=>onFileChosen(i,e)} />
          <audio ref=${audioRefs[i]} />
          ${t.mode === 'youtube' && t.videoId && html`
            <iframe
              key=${t.videoId}
              ref=${iframeRefs[i]}
              src=${'https://www.youtube.com/embed/'+t.videoId+'?enablejsapi=1&autoplay=1&loop=1&playlist='+t.videoId+'&controls=0'}
              allow="autoplay; encrypted-media"
              onLoad=${()=>onIframeLoad(i)}
              style=${{width:'1px', height:'1px', opacity:0, position:'absolute', pointerEvents:'none'}}
            ></iframe>
          `}

          <div style=${{display:'flex', gap:'6px'}}>
            <button type="button" onClick=${()=>pickFile(i)} style=${{...btnGhost, padding:'6px 8px', fontSize:'10px', flex:1}}>📁 Arquivo</button>
            <button type="button" onClick=${()=>togglePlay(i)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px'}}>${t.playing ? '⏸' : '▶'}</button>
            <button type="button" onClick=${()=>stopTrack(i)} style=${{...btnGhost, padding:'6px 10px', fontSize:'10.5px'}}>⏹</button>
          </div>

          <div style=${{position:'relative', zIndex: t.suggestOpen ? 300 : 'auto'}}>
            <input
              placeholder="Buscar vídeo no YouTube..." value=${t.search}
              onChange=${e=>onSearchChange(i, e.target.value)}
              onFocus=${()=>{ if ((t.results && t.results.length>0) || t.suggestions.length>0) updateTrack(i,{suggestOpen:true}); }}
              onBlur=${()=>setTimeout(()=>updateTrack(i,{suggestOpen:false}), 150)}
              onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); onSearchEnter(i); } if(e.key==='Escape'){ updateTrack(i,{suggestOpen:false}); } }}
              style=${{...inputStyle, fontSize:'10.5px', padding:'6px 8px', width:'100%'}}
            />
            ${t.searching && html`<div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Buscando...</div>`}
            ${!t.searching && t.suggestOpen && t.results && t.results.length === 0 && html`
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Nenhum resultado encontrado.</div>
            `}
            ${!t.searching && t.suggestOpen && !t.results && t.suggestions.length === 0 && t.search.trim().length >= 2 && html`
              <div style=${{fontSize:'9.5px', color:'var(--text-dim)', padding:'3px 2px'}}>Nenhuma sugestão pra essa palavra-chave. Aperte Enter pra buscar direto no YouTube.</div>
            `}
            ${t.suggestOpen && t.results && t.results.length > 0 && html`
              <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, borderRadius:'10px', padding:'4px', display:'grid', gap:'3px', maxHeight:'260px', overflowY:'auto', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
                <div style=${{fontSize:'9px', color:'var(--text-dim)', padding:'2px 4px'}}>Toque pra tocar direto:</div>
                ${t.results.map((v,vi) => html`
                  <button key=${v.videoId+vi} type="button" onMouseDown=${e=>e.preventDefault()} onClick=${()=>pickVideoResult(i, v)} style=${{display:'flex', gap:'6px', alignItems:'center', padding:'4px', borderRadius:'7px', border:'none', background:'transparent', textAlign:'left', width:'100%'}}>
                    <img src=${v.thumbnail} alt="" style=${{width:'44px', height:'26px', objectFit:'cover', borderRadius:'4px', flexShrink:0}} />
                    <span style=${{fontSize:'10px', color:'var(--text-mid)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>${v.title}</span>
                  </button>
                `)}
              </div>
            `}
            ${t.suggestOpen && !t.results && t.suggestions.length > 0 && html`
              <div class="glass fade-up" style=${{position:'absolute', top:'calc(100% + 4px)', left:0, right:0, borderRadius:'10px', padding:'4px', display:'grid', gap:'2px', maxHeight:'220px', overflowY:'auto', boxShadow:'0 12px 26px -8px rgba(0,0,0,0.5)'}}>
                <div style=${{fontSize:'9px', color:'var(--text-dim)', padding:'2px 4px'}}>Toque pra abrir a busca no YouTube:</div>
                ${t.suggestions.map((s,si) => html`
                  <button key=${si} type="button" onMouseDown=${e=>e.preventDefault()} onClick=${()=>pickTextSuggestion(i, s)} style=${{textAlign:'left', padding:'6px 8px', borderRadius:'7px', border:'none', background:'transparent', color:'var(--text-mid)', fontSize:'11px'}}>🔎 ${s}</button>
                `)}
              </div>
            `}
          </div>
          <div style=${{display:'flex', gap:'4px'}}>
            <input placeholder="ou colar link do vídeo" value=${t.link} onChange=${e=>updateTrack(i,{link:e.target.value})} onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); useYoutubeLink(i); } }} style=${{...inputStyle, fontSize:'10.5px', padding:'6px 8px', flex:1}} />
            <button type="button" onClick=${()=>useYoutubeLink(i)} style=${{...btnGhost, padding:'6px 8px', fontSize:'10.5px'}}>✅</button>
          </div>

          <input type="range" min="0" max="100" value=${t.volume} onChange=${e=>setVolume(i, e.target.value)} style=${{width:'100%'}} />
          <div style=${{fontSize:'10px', color:'var(--text-dim)', textAlign:'center'}}>🔊 ${t.volume}%</div>
        </div>
      `)}
    </div>
  `;
}

// Modo Ao Vivo: uma tela em foco total pro operador seguir durante o culto de verdade — mostra só a
// etapa atual (bem grande) e a próxima, com um botão único e óbvio pra avançar. Sem distração, sem menu.
function CultoLiveMode({ activities, sections, churchId, onAdvance, onClose, onOpenFinalize }) {
  const ordered = useMemo(() => sections.flatMap(sec => activities.filter(a => a.section === sec)), [activities, sections]);
  const firstPending = ordered.findIndex(a => !a.done);
  const [idx, setIdx] = useState(firstPending === -1 ? 0 : firstPending);

  const current = ordered[idx];
  const next = ordered[idx+1];
  const isLast = idx >= ordered.length - 1;

  if (!current) {
    return html`
      <div style=${{position:'fixed', inset:0, background:'var(--bg-1, #0b1120)', zIndex:200, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'16px', padding:'24px', textAlign:'center'}}>
        <div style=${{fontSize:'40px'}}>📋</div>
        <div style=${{fontWeight:800, fontSize:'18px'}}>Nenhuma atividade cadastrada ainda</div>
        <button onClick=${onClose} style=${{...btnGhost, padding:'12px 24px'}}>Fechar</button>
      </div>
    `;
  }

  const goNext = () => {
    onAdvance(current.id);
    if (isLast) { onOpenFinalize(); return; }
    setIdx(i => Math.min(i+1, ordered.length-1));
  };
  const goBack = () => setIdx(i => Math.max(i-1, 0));

  return html`
    <div style=${{position:'fixed', inset:0, background:'var(--bg-1, #0b1120)', zIndex:200, display:'flex', flexDirection:'column', padding:'20px 16px', overflowY:'auto'}}>
      <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'18px'}}>
        <div style=${{fontSize:'11.5px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.05em'}}>
          Etapa ${idx+1} de ${ordered.length} • ${SECTION_LABELS[current.section]}
        </div>
        <button onClick=${onClose} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'20px', padding:'4px 8px'}} title="Sair do Modo Ao Vivo">✕</button>
      </div>

      <div style=${{width:'100%', height:'6px', borderRadius:'999px', background:'rgba(148,163,184,0.18)', overflow:'hidden', marginBottom:'24px'}}>
        <div style=${{width: ((idx)/ordered.length*100)+'%', height:'100%', background:'linear-gradient(90deg,var(--success-1),var(--success-2))', transition:'width .3s'}}></div>
      </div>

      <div style=${{flex:1, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', textAlign:'center', gap:'18px'}}>
        <div style=${{fontSize:'11px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase', letterSpacing:'0.08em'}}>Agora</div>
        <div style=${{fontSize:'56px', lineHeight:1}}>${CATEGORY_ICON[current.category] || '📌'}</div>
        <div style=${{fontWeight:900, fontSize:'28px', lineHeight:1.2, maxWidth:'560px'}}>${current.name}</div>
        <div style=${{fontSize:'15px', color:'var(--text-mid)', fontWeight:600}}>${current.responsible}${current.time && current.time !== '--:--' ? ' • ' + current.time : ''}</div>
        ${current.media && current.media.title && html`
          <div style=${{display:'flex', flexDirection:'column', alignItems:'center', gap:'8px', marginTop:'4px'}}>
            <div style=${{fontSize:'12.5px', color:'var(--text-mid)'}}>🎬 ${current.media.title}</div>
            <${ProjectButton} churchId=${churchId} media=${current.media} />
          </div>
        `}

        ${next && html`
          <div class="glass fade-up" style=${{marginTop:'28px', padding:'12px 20px', borderRadius:'14px', display:'flex', alignItems:'center', gap:'10px', maxWidth:'420px'}}>
            <span style=${{fontSize:'10.5px', fontWeight:800, color:'var(--text-dim)', textTransform:'uppercase'}}>A seguir</span>
            <span style=${{fontSize:'18px'}}>${CATEGORY_ICON[next.category] || '📌'}</span>
            <span style=${{fontWeight:700, fontSize:'13px'}}>${next.name}</span>
          </div>
        `}
        ${!next && html`
          <div style=${{marginTop:'28px', fontSize:'12.5px', color:'var(--text-dim)'}}>Última etapa do culto 🎉</div>
        `}
      </div>

function LiturgiaView({ churchId, churchName }) {
  const [activities, setActivities] = useState(() => loadActivities(churchId));
  const [adding, setAdding] = useState(false);
  const [assistantOpen, setAssistantOpen] = useState(false);
  const [finalizeOpen, setFinalizeOpen] = useState(false);

  useEffect(() => saveActivities(churchId, activities), [activities, churchId]);

  // Atualiza sozinho o link de itens dinâmicos (Provai e Vede / Informativo) e completa quem ainda não tem
  useEffect(() => {
    setActivities(list => {
      let changed = false;
      const next = list.map(a => {
        if (a.media && a.media.dynamic) {
          const lib = MEDIA_LIBRARY.find(m => m.title === a.media.libTitle);
          if (lib) {
            const freshUrl = mediaLibraryUrl(lib);
            if (freshUrl !== a.media.url || lib.playlistId !== a.media.playlistId) {
              changed = true;
              return { ...a, media: { ...a.media, url: freshUrl, playlistId: lib.playlistId || null } };
            }
          }
          return a;
        }
        // Completa automaticamente quem ainda não tem mídia nenhuma (liturgias salvas antes dessa função existir)
        if (!a.media) {
          let lib = null;
          if (a.id === 'a5' || a.name.toLowerCase().includes('informativo mundial')) lib = MEDIA_LIBRARY.find(m => m.title === 'Informativo Mundial das Missões');
          else if (a.id === 'b3' || a.name.toLowerCase().includes('provai e vede')) lib = MEDIA_LIBRARY.find(m => m.title === 'Provai e Vede - Vídeo Oficial');
          if (lib) {
            changed = true;
            return { ...a, media: { title: lib.title, url: mediaLibraryUrl(lib), dynamic:true, libTitle: lib.title, playlistId: lib.playlistId || null } };
          }
        }
        return a;
      });
      return changed ? next : list;
    });
  }, [churchId]);

  const toggle = (id) => setActivities(list => list.map(a => a.id===id ? {...a, done: !a.done} : a));
  const markDone = (id) => setActivities(list => list.map(a => a.id===id ? {...a, done:true} : a));
  const [liveMode, setLiveMode] = useState(false);
  const remove = (id) => setActivities(list => list.filter(a => a.id !== id));
  const edit = (updated) => setActivities(list => list.map(a => a.id === updated.id ? updated : a));
  const toggleFix = (id) => setActivities(list => list.map(a => a.id===id ? {...a, fixed: !a.fixed} : a));
  const zerarProgramacao = () => {
    if (!window.confirm('Isso vai apagar o responsável, horário e marcação de concluído de todas as atividades NÃO fixadas (🔒). As fixadas continuam intactas. Continuar?')) return;
    setActivities(list => list.map(a => a.fixed ? a : { ...a, responsible:'A definir', time:'--:--', done:false }));
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Programação zerada (atividades fixadas preservadas)' });
  };
  const addAt = (act, refId, position) => {
    setActivities(list => {
      if (!refId) return [...list, act];
      const idx = list.findIndex(a => a.id === refId);
      if (idx === -1) return [...list, act];
      const insertAt = position === 'antes' ? idx : idx + 1;
      const next = [...list];
      next.splice(insertAt, 0, act);
      return next;
    });
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Nova atividade: '+act.name });
  };
  const importFromAssistant = (drafts) => {
    const newActs = drafts.map((d,i) => ({
      id: 'act-'+Date.now()+'-'+i, name: d.name.trim(), section: d.section, category: d.category,
      responsible: (d.responsible || 'A definir').trim(), time: d.time || '--:--', dur: 5, done:false, media:null
    }));
    setActivities(list => [...list, ...newActs]);
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Assistente de liturgia: '+newActs.length+' atividade(s) adicionada(s) por texto' });
  };

  const savedDefault = loadDefaultLiturgy(churchId);

  const applyVersion = (version) => {
    setActivities(version.list.map(a => ({...a, done:false})));
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Liturgia restaurada para o padrão de '+new Date(version.at).toLocaleString('pt-BR') });
  };
  const resetToDefault = () => {
    if (!savedDefault || !savedDefault.versions || savedDefault.versions.length === 0) {
      alert('Ainda não existe uma liturgia padrão definida. Vá na aba Gestão > Liturgia Padrão para criar uma primeiro.');
      return;
    }
    if (!window.confirm('Isso vai substituir toda a liturgia atual pela versão mais recente do padrão. Continuar?')) return;
    applyVersion(savedDefault.versions[0]);
  };

  const buildFinalizeSummary = () => {
    const church = loadDB().find(c => c.id === churchId) || {};
    const teams = loadTeams(churchId);
    const targetKey = getSaturdaysForMonths(3)[0];
    const sono = getScheduledGroupForDate(churchId, 'sonoplastia', teams.sonoplastia, targetKey);
    const midia = getScheduledGroupForDate(churchId, 'midia', teams.midia, targetKey);
    const louvor = getScheduledLouvorForDate(churchId, teams.louvorTeams, targetKey);
    return {
      church, teams, targetKey, sono, midia, louvor,
      dateLabel: formatSaturday(keyToDate(targetKey)),
      activitiesCount: activities.length,
      pastorName: church.pastorName, elderName: church.elderName,
      sonoNames: sono.map(m=>m.name).join(', '),
      midiaNames: midia.map(m=>m.name).join(', '),
      louvorTeamName: louvor.team ? louvor.team.teamName : '',

    };

  const [finalizeSummary, setFinalizeSummary] = useState(null);
  const openFinalize = () => { setFinalizeSummary(buildFinalizeSummary()); setFinalizeOpen(true); };
  const confirmFinalize = () => {
    const s = finalizeSummary;
    const record = {
      id: 'culto-'+Date.now(),
      date: s.targetKey,
      finalizedAt: new Date().toISOString(),
      activities: activities.map(a => ({...a})),
      church: { name: s.church.name, pastorName: s.church.pastorName, elderName: s.church.elderName, association: s.church.association, district: s.church.district },
      sonoplastia: s.sono.map(m => ({ name:m.name, function:m.function })),
      midia: s.midia.map(m => ({ name:m.name, function:m.function })),
      louvor: { teamName: s.louvorTeamName, musica: s.musica, members: s.louvor.team ? s.louvor.team.members.map(m=>({name:m.name, function:m.function})) : [] },
    };
    const arch = loadArchive(churchId);
    saveArchive(churchId, [record, ...arch]);
    pushLog(loadLog(), { type:'atualizacao', churchName: churchName, churchId: churchId, detail: 'Culto finalizado e arquivado ('+s.dateLabel+')' });

/* ============ ESCALA AUTOMÁTICA (3 meses, editável, com datas extras) ============ */

const SCHEDULE_EPOCH = new Date('2024-01-06T00:00:00'); // um sábado de referência

function getSaturdaysForMonths(months) {
  const today = new Date();
  const result = [];
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const daysUntilSaturday = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + (daysUntilSaturday === 0 ? 0 : daysUntilSaturday));
  const limit = new Date(today.getFullYear(), today.getMonth() + months, today.getDate());
  while (d <= limit) {
    result.push(dateKey(new Date(d)));
    d.setDate(d.getDate() + 7);
  }
  return result;
}
function dateKey(date) {
  const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2,'0'), d = String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}
function keyToDate(key) {
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
function weeksSinceEpoch(date) {
  return Math.round((date - SCHEDULE_EPOCH) / (7 * 24 * 60 * 60 * 1000));
}
function formatSaturday(date) {
  return date.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}
function autoGroupForDate(dateKeyStr, teamKey, validMembers, groupSize) {
  if (validMembers.length === 0) return [];
  const n = validMembers.length;
  const size = Math.max(1, Math.min(groupSize || 2, n));
  const w = weeksSinceEpoch(keyToDate(dateKeyStr)) + (teamKey ? teamKey.length : 0);
  const result = [];
  const usedIdx = new Set();
  for (let i = 0; i < size; i++) {
    const idx = ((w + i) % n + n) % n;
    if (!usedIdx.has(idx)) { usedIdx.add(idx); result.push(validMembers[idx]); }
  }
  return result;
}

function scheduleStoreKey(churchId, teamKey) { return 'gc_schedule_' + churchId + '_' + teamKey; }
function loadSchedule(churchId, teamKey) {
  try { const raw = localStorage.getItem(scheduleStoreKey(churchId, teamKey)); if (raw) return JSON.parse(raw); } catch(e) {}
  return { overrides:{}, extraDates:[], groupSize:2 };

function getScheduledGroupForDate(churchId, teamKey, allMembers, dKey) {

}

  }

// Lê o arquivo e devolve na melhor qualidade possível: se já for um arquivo leve, mantém do
// jeito que foi enviado; se for muito grande, redimensiona (mantendo proporção) pra caber numa
// tela cheia sem pesar demais no armazenamento do navegador.
function readImageFileSmart(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler o arquivo.'));
    reader.onload = () => {
      const originalDataUrl = reader.result;
      if (file.size <= 700 * 1024) { resolve(originalDataUrl); return; }
      const img = new Image();
      img.onerror = () => resolve(originalDataUrl);
      img.onload = () => {
        try {
          const maxSide = 2000;
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            const scale = maxSide / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.9));
        } catch (e) { resolve(originalDataUrl); }
      };
      img.src = originalDataUrl;
    };
    reader.readAsDataURL(file);
  });
}

function AnunciosTool({ churchId }) {
  const [items, setItems] = useState(() => loadAnuncios(churchId));
  const [loading, setLoading] = useState(false);
  const fileRef = useRef(null);

  const persist = (next) => { setItems(next); saveAnuncios(churchId, next); };

  const handleFiles = async (fileList) => {
    const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
    if (files.length === 0) return;
    setLoading(true);
    try {
      const added = [];
      for (const file of files) {
        try {
          const dataUrl = await readImageFileSmart(file);
          added.push({ id:'an-'+Date.now()+Math.random().toString(36).slice(2,6), title: file.name.replace(/\.[^.]+$/,''), dataUrl, addedAt: new Date().toISOString() });
        } catch (e) { /* pula esse arquivo se der erro */ }
      }
      if (added.length) persist([...added, ...items]);
    } finally {
      setLoading(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  const rename = (id, title) => persist(items.map(it => it.id === id ? { ...it, title } : it));
  const remove = (id) => { if (confirm('Remover esse anúncio?')) persist(items.filter(it => it.id !== id)); };

  return html`

      </label>

      ${items.length === 0 && html`<div class="glass fade-up" style=${{padding:'22px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'12.5px'}}>Nenhum anúncio cadastrado ainda.</div>`}

function FunctionEditRow({ name, onRename, onRemove }) {
  const [value, setValue] = useState(name);
  useEffect(() => setValue(name), [name]);
  const commit = () => { const v = value.trim(); if (v && v !== name) onRename(name, v); else setValue(name); };
  return html`
    <div style=${{display:'flex', alignItems:'center', gap:'6px'}}>
      <input value=${value} onChange=${e=>setValue(e.target.value)} onBlur=${commit} onKeyDown=${e=>{ if (e.key==='Enter') e.target.blur(); }} style=${{...inputStyle, padding:'6px 10px', fontSize:'11.5px', flex:1}} />
      <button onClick=${()=>onRemove(name)} style=${{background:'transparent', border:'none', color:'var(--danger)', fontSize:'14px', padding:'2px 6px'}} title="Remover função">✕</button>
    </div>
  `;
}
