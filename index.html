// ---- Sincronização com o banco compartilhado (Firebase) ----
// Guarda o essencial pra visualização no Painel do Desenvolvedor E pra permitir que cada
// igreja entre no sistema de qualquer aparelho (não só do aparelho onde se cadastrou).
// A senha e a resposta de segurança NUNCA são enviadas em texto puro — só um hash (versão
// embaralhada, irreversível) delas, suficiente para conferir login sem expor a senha real.
// Falha em silêncio se o Firebase não estiver configurado (ver window.__FIREBASE_CONFIG__
// no <head>) ou sem rede — nesse caso o app segue funcionando só com os dados locais.
function fbIsReady() { return !!(window.__fb && window.__fb.ready && window.__fb.db); }

// Hash simples (não é criptografia forte, mas evita guardar senha em texto puro no banco).
function simpleHash(str) {
  const s = 'gc-salt-2026::' + String(str || '');
  let h1 = 0x811c9dc5, h2 = 0xdeadbeef;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619);
    h2 = Math.imul(h2 ^ c, 2654435761);
  }
  h1 >>>= 0; h2 >>>= 0;
  return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}

// Gera um ID de documento determinístico a partir do login (minúsculo), pra usar como "trava"
// natural do Firestore: dois cadastros com o mesmo login sempre disputam o MESMO documento, então
// mesmo que aconteçam ao mesmo tempo (dois aparelhos clicando "Cadastrar" no mesmo segundo), a
// transação abaixo garante que só um vence.
function loginDocId(loginLower) {
  let id = (loginLower || '').trim();
  if (!id) return null;
  if (/^__.*__$/.test(id)) id = 'login-' + id; // IDs assim são reservados pelo Firestore
  return id;
}

// Cadastra uma igreja no banco compartilhado usando uma TRANSAÇÃO do Firestore: o documento
// dessa igreja usa como ID o próprio login (em minúsculo), então duas tentativas de cadastro com
// o mesmo login sempre disputam o mesmo documento. A transação lê o documento e só cria se ele
// não existir (ou se existir mas estiver marcado como removido — permite reaproveitar o login de
// uma igreja removida). Isso impede a duplicidade mesmo se dois cadastros acontecerem no mesmo
// instante em aparelhos diferentes — só um dos dois vence de verdade.
// Retorna { docId, loginTaken } — loginTaken:true significa que outra igreja ativa já usa esse login.
async function fbAddChurch(church) {
  if (!fbIsReady()) return { docId: null, loginTaken: false, offline: true };
  try {
    const { doc, runTransaction, serverTimestamp } = window.__fb.helpers;
    const loginLower = (church.login || '').trim().toLowerCase();
    const docId = loginDocId(loginLower);
    if (!docId) return { docId: null, loginTaken: false, offline: true };
    const ref = doc(window.__fb.db, 'igrejas', docId);
    let loginTaken = false;
    await runTransaction(window.__fb.db, async (tx) => {
      const snap = await tx.get(ref);
      if (snap.exists() && !snap.data().removed) { loginTaken = true; return; }
      tx.set(ref, {
        churchId: church.id, name: church.name, city: church.city || '', state: church.state || '',
        division: church.division || '', union: church.union || '',
        association: church.association || '', district: church.district || '',
        pastorName: church.pastorName || '', login: church.login,
        passwordHash: church.passwordHash || null,
        recoveryQuestion: church.recoveryQuestion || '',
        recoveryAnswerHash: church.recoveryAnswerHash || null,
        paused: !!church.paused, removed: false, purged: false,
        createdAt: church.createdAt, syncedAt: serverTimestamp()
      });
    });
    return loginTaken ? { docId: null, loginTaken: true } : { docId, loginTaken: false };
  } catch(e) { return { docId: null, loginTaken: false, error: true }; }
}

async function fbUpdateChurchPassword(docId, passwordHash) {
  return fbUpdateChurchFields(docId, { passwordHash });
}

// Atualiza campos administrativos da igreja no banco compartilhado (senha, pausada, removida).
// Nunca manda senha em texto puro — só os campos passados explicitamente.
async function fbUpdateChurchFields(docId, fields) {
  if (!fbIsReady() || !docId) return false;
  try {
    const { doc, updateDoc } = window.__fb.helpers;
    await updateDoc(doc(window.__fb.db, 'igrejas', docId), fields);

}

// ---- Histórico de atividades (visível no Painel do Desenvolvedor, de qualquer aparelho) ----
// Guarda só o essencial (tipo, nome da igreja, detalhe curto, data) — nunca senha ou resposta
// de recuperação. Serve pra Paulo acompanhar cadastros, remoções, pausas e logins de qualquer lugar.
async function fbAddActivity(entry) {
  if (!fbIsReady()) return null;
  try {
    const { collection, addDoc, serverTimestamp } = window.__fb.helpers;
    const ref = await addDoc(collection(window.__fb.db, 'atividades'), {
      localId: entry.id, type: entry.type, churchName: entry.churchName || '',
      churchId: entry.churchId || '', detail: entry.detail || '',
      at: entry.at, syncedAt: serverTimestamp()

    return ref.id;
  } catch(e) { return null; }
}

// O Firebase carrega em segundo plano (é um import assíncrono) e normalmente ainda não está
// pronto no exato instante em que a tela monta e chama fbListenChurches/Suggestions/Activities.
// Sem isso, a checagem "if (!fbIsReady())" desistia na hora e NUNCA mais tentava de novo — mesmo
// segundos depois, quando o Firebase já estava pronto — deixando o app preso só com os dados
// deste aparelho (essa era a causa raiz de igrejas cadastradas em outro aparelho não aparecerem).
// Esta função espera o evento "fb-ready" (disparado quando o Firebase termina de carregar) antes
// de tentar de novo, e só desiste de vez se o componente for desmontado antes disso.
function fbListenWhenReady(startListening) {
  if (fbIsReady()) return startListening();
  let stopped = false;
  let unsub = () => {};
  const onReady = () => {
    if (stopped) return;
    unsub = startListening();
  };
  window.addEventListener('fb-ready', onReady, { once: true });
  return () => { stopped = true; window.removeEventListener('fb-ready', onReady); unsub(); };
}

function fbListenActivities(callback) {
  return fbListenWhenReady(() => {
    try {
      const { collection, onSnapshot, query, orderBy, limit } = window.__fb.helpers;
      const base = collection(window.__fb.db, 'atividades');
      const q = limit ? query(base, orderBy('at', 'desc'), limit(300)) : query(base, orderBy('at', 'desc'));
      return onSnapshot(q, snap => callback(snap.docs.map(d => ({ docId: d.id, ...d.data() }))), () => {});
    } catch(e) { return () => {}; }
  });
}

// callback(list) é chamado sempre que a lista mudar (tempo real). Retorna uma função pra parar de escutar.
function fbListenChurches(callback) {
  return fbListenWhenReady(() => {
    try {
      const { collection, onSnapshot, query, orderBy } = window.__fb.helpers;
      const q = query(collection(window.__fb.db, 'igrejas'), orderBy('createdAt', 'desc'));
      return onSnapshot(q, snap => callback(snap.docs.map(d => ({ docId: d.id, ...d.data() }))), () => {});
    } catch(e) { return () => {}; }
  });
}

// Sem churchId: escuta todas as sugestões (uso do Painel do Desenvolvedor). Com churchId: só as dessa igreja.
function fbListenSuggestions(callback, churchId) {
  return fbListenWhenReady(() => {
    try {
      const { collection, onSnapshot, query, where } = window.__fb.helpers;
      const base = collection(window.__fb.db, 'sugestoes');
      const q = churchId ? query(base, where('churchId', '==', churchId)) : base;
      return onSnapshot(q, snap => callback(snap.docs.map(d => ({ docId: d.id, ...d.data() }))), () => {});
    } catch(e) { return () => {}; }
  });
}

// Lista de igrejas pra tela de login/recuperação: mistura as cadastradas neste aparelho com
// as que vieram do banco compartilhado (cadastradas em qualquer outro aparelho), e cacheia
// as remotas localmente (com hash de senha) pra permitir login mesmo depois de perder a rede.
function useSyncedChurches() {
  const [local, setLocal] = useState(loadDB);
  useEffect(() => {
    const unsub = fbListenChurches(remote => {
      if (!remote) return;
      const current = loadDB();
      const currentLogins = new Set(current.map(c => (c.login||'').toLowerCase()));
      let changed = false;
      const merged = [...current];
      // Se por algum motivo existir mais de um cadastro remoto com o mesmo login (por exemplo,
      // uma igreja que se cadastrou de novo depois de já existir), só o mais recente (a consulta
      // já vem ordenada do mais novo pro mais antigo) é considerado — evita que o app fique
      // "brigando" entre dois registros e revertendo pausa/remoção sozinho.
      const remoteByLogin = new Map();
      remote.forEach(rc => {
        if (!rc.login) return;
        const loginLower = rc.login.toLowerCase();
        if (!remoteByLogin.has(loginLower)) remoteByLogin.set(loginLower, rc);
      });
      // Campos "de conteúdo" da igreja (programação, equipes, escalas etc.) — além do bgMusic, que já
      // era tratado assim. Precisam vir junto AQUI (na lista que fica pronta ANTES da tela de login,
      // enquanto a pessoa ainda está digitando usuário/senha) e não só através do "ouvinte" de dentro
      // do painel da igreja: senão, ao abrir uma aba (Liturgia, Gestão...) pela primeira vez num
      // aparelho novo — ou depois de limpar o cache — ela nasce sem saber que já existe algo salvo na
      // nuvem, assume que está "vazia" e pode acabar regravando por cima do que já tinha, apagando de
      // verdade o que a pessoa cadastrou. Corrigido em 24/09.
      const CONTENT_FIELDS = ['activities', 'defaultLiturgy', 'archive', 'teams', 'functionsList', 'schedules', 'churchLocation', 'presence', 'lembretesAtivo', 'lembretesStatus', 'fixedTracks'];
      remoteByLogin.forEach((rc, loginLower) => {
        if (!currentLogins.has(loginLower)) {
          const entry = {
            id: rc.churchId || ('igreja-remote-' + rc.docId),
            name: rc.name, city: rc.city || '', state: rc.state || '',
            division: rc.division || '', union: rc.union || '',
            association: rc.association || '', district: rc.district || '',
            pastorName: rc.pastorName || '', login: rc.login,
            passwordHash: rc.passwordHash || null,
            recoveryQuestion: rc.recoveryQuestion || '',
            recoveryAnswerHash: rc.recoveryAnswerHash || null,
            paused: !!rc.paused, removed: !!rc.removed, bgMusic: rc.bgMusic || null,
            createdAt: rc.createdAt, fbDocId: rc.docId, remoteOnly: true
          };
          CONTENT_FIELDS.forEach(f => { if (rc[f] !== undefined) entry[f] = rc[f]; });
          merged.push(entry);
          currentLogins.add(loginLower);
          changed = true;
        } else {
          const idx = merged.findIndex(c => (c.login||'').toLowerCase() === loginLower);
          if (idx >= 0) {
            const cur = merged[idx];
            const patch = {};
            if (!cur.fbDocId && rc.docId) patch.fbDocId = rc.docId;
            if (rc.passwordHash && rc.passwordHash !== cur.passwordHash) patch.passwordHash = rc.passwordHash;
            if (!!rc.paused !== !!cur.paused) patch.paused = !!rc.paused;
            if (!!rc.removed !== !!cur.removed) patch.removed = !!rc.removed;
            // bgMusic e os campos de conteúdo (programação, equipes, escalas...) são comparados como
            // texto porque são objetos/listas — só atualiza o cache local (e assim o próximo login
            // neste aparelho já vem com o que foi salvo em outro aparelho) quando realmente mudou, pra
            // não ficar regravando localStorage sem necessidade.
            if (JSON.stringify(rc.bgMusic || null) !== JSON.stringify(cur.bgMusic || null)) patch.bgMusic = rc.bgMusic || null;
            CONTENT_FIELDS.forEach(f => {
              if (rc[f] !== undefined && JSON.stringify(rc[f]) !== JSON.stringify(cur[f])) patch[f] = rc[f];
            });
            if (Object.keys(patch).length) { merged[idx] = { ...cur, ...patch }; changed = true; }
          }
        }
      });
      if (changed) { saveDB(merged); setLocal(merged); }
    });
    return unsub;
  }, []);
  return local;
}

/* ============ ESTRUTURA ADMINISTRATIVA DA IGREJA ADVENTISTA (Divisão > União > Associação/Missão) ============
   Levantada a partir de fontes oficiais (Enciclopédia Adventista - encyclopedia.adventist.org - e
   sites oficiais das uniões) em setembro de 2026. A estrutura da igreja é reorganizada de tempos em
   tempos (associações se dividem, mudam de nome), então esta lista pode ficar desatualizada — por
   isso toda união e associação tem sempre a opção "Outra / não está na lista", que libera digitar
   manualmente, pra nunca travar um cadastro por falta de dado aqui. */
const BRAZIL_STATES = [

// Seletor em cascata Divisão > União > Estado > Associação/Missão: cada escolha filtra a próxima
// (elimina o que não pertence a ela), sempre com botões de seleção — nunca precisa digitar, exceto
// quando a opção "Outra / não está na lista" é escolhida (a estrutura da igreja muda com o tempo,
// então essa válvula de escape garante que o cadastro nunca fique travado por dado desatualizado).
// initial* permite pré-carregar um valor já salvo (ex: editando uma igreja existente) sem tentar
// "adivinhar" a que opção da lista ele corresponde — nesse caso cai em "Outra" com o texto já preenchido.
function SdaHierarchyPicker({ onChange, initialDivision, initialUnion, initialState, initialAssociation }) {
  const [divisionId, setDivisionId] = useState('dsa');
  const [unionId, setUnionId] = useState(initialUnion ? '__outra__' : '');
  const [unionOther, setUnionOther] = useState(initialUnion || '');
  const [stateSel, setStateSel] = useState(initialState ? '__outro__' : '');
  const [stateOther, setStateOther] = useState(initialState || '');
  const [assocSel, setAssocSel] = useState(initialAssociation ? '__outra__' : '');
  const [assocOther, setAssocOther] = useState(initialAssociation || '');

  const emit = (patch) => {
    const dId = patch.divisionId ?? divisionId;
    const uId = patch.unionId ?? unionId;
    const uOther = patch.unionOther ?? unionOther;
    const sSel = patch.stateSel ?? stateSel;
    const sOther = patch.stateOther ?? stateOther;
    const aSel = patch.assocSel ?? assocSel;
    const aOther = patch.assocOther ?? assocOther;
    const uList = SDA_UNIONS[dId] || [];
    const uObj = uList.find(u => u.id === uId);
    onChange({
      division: (SDA_DIVISIONS.find(d => d.id === dId) || {}).name || '',
      union: uId === '__outra__' ? uOther.trim() : (uObj ? uObj.name : ''),
      state: sSel === '__outro__' ? sOther.trim() : ((BRAZIL_STATES.find(s => s.uf === sSel) || {}).name || ''),
      association: aSel === '__outra__' ? aOther.trim() : aSel
    });
  };

  const handleDivision = (v) => { setDivisionId(v); setUnionId(''); setUnionOther(''); setStateSel(''); setStateOther(''); setAssocSel(''); setAssocOther(''); emit({ divisionId:v, unionId:'', unionOther:'', stateSel:'', stateOther:'', assocSel:'', assocOther:'' }); };
  const handleUnion = (v) => { setUnionId(v); setStateSel(''); setStateOther(''); setAssocSel(''); setAssocOther(''); emit({ unionId:v, stateSel:'', stateOther:'', assocSel:'', assocOther:'' }); };
  const handleUnionOther = (v) => { setUnionOther(v); emit({ unionOther:v }); };
  const handleState = (v) => { setStateSel(v); setStateOther(''); emit({ stateSel:v, stateOther:'' }); };
  const handleStateOther = (v) => { setStateOther(v); emit({ stateOther:v }); };
  const handleAssoc = (v) => { setAssocSel(v); setAssocOther(''); emit({ assocSel:v, assocOther:'' }); };
  const handleAssocOther = (v) => { setAssocOther(v); emit({ assocOther:v }); };

  const unions = SDA_UNIONS[divisionId] || [];
  const selectedUnion = unions.find(u => u.id === unionId);
  const availableStates = (selectedUnion && selectedUnion.states.length > 0) ? BRAZIL_STATES.filter(s => selectedUnion.states.includes(s.uf)) : BRAZIL_STATES;
  const availableAssocs = selectedUnion ? selectedUnion.associations : [];

  return html`
    <div style=${{display:'grid', gap:'8px'}}>
      <select value=${divisionId} onChange=${e=>handleDivision(e.target.value)} style=${inputStyle}>
        ${SDA_DIVISIONS.map(d => html`<option key=${d.id} value=${d.id}>${d.name}</option>`)}
      </select>
      <select value=${unionId} onChange=${e=>handleUnion(e.target.value)} style=${inputStyle}>
        <option value="">Selecione a União...</option>
        ${unions.map(u => html`<option key=${u.id} value=${u.id}>${u.name}</option>`)}
        <option value="__outra__">Outra / não está na lista</option>
      </select>
      ${unionId === '__outra__' && html`<input placeholder="Nome da União" value=${unionOther} onChange=${e=>handleUnionOther(e.target.value)} style=${inputStyle} />`}

      <div style=${{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px'}}>
        <div>
          <select value=${stateSel} onChange=${e=>handleState(e.target.value)} disabled=${!unionId} style=${{...inputStyle, opacity: unionId ? 1 : 0.6}}>
            <option value="">Estado...</option>
            ${availableStates.map(s => html`<option key=${s.uf} value=${s.uf}>${s.name}</option>`)}
            <option value="__outro__">Outro / fora do Brasil</option>
          </select>
          ${stateSel === '__outro__' && html`<input placeholder="Estado / país" value=${stateOther} onChange=${e=>handleStateOther(e.target.value)} style=${{...inputStyle, marginTop:'6px'}} />`}
        </div>
        <div>
          <select value=${assocSel} onChange=${e=>handleAssoc(e.target.value)} disabled=${!unionId} style=${{...inputStyle, opacity: unionId ? 1 : 0.6}}>
            <option value="">Associação/Missão...</option>
            ${availableAssocs.map(a => html`<option key=${a} value=${a}>${a}</option>`)}
            <option value="__outra__">Outra / não está na lista</option>
          </select>
          ${assocSel === '__outra__' && html`<input placeholder="Nome da associação/missão" value=${assocOther} onChange=${e=>handleAssocOther(e.target.value)} style=${{...inputStyle, marginTop:'6px'}} />`}
        </div>
      </div>
      ${unionId && unionId !== '__outra__' && availableAssocs.length === 0 && html`
        <div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Ainda não tenho a lista de associações dessa união cadastrada aqui — escolha "Outra / não está na lista" e digite o nome.</div>
      `}
    </div>
  `;
}

function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [selectedChurchLogin, setSelectedChurchLogin] = useState('');
  const [selectedAssoc, setSelectedAssoc] = useState('');
  const [selectedDistrict, setSelectedDistrict] = useState('');
  const [login, setLogin] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [forgotOpen, setForgotOpen] = useState(false);
  const [showPassword, setShowPassword] = useState(false);
  const [showNewPassword, setShowNewPassword] = useState(false);
  const [checking, setChecking] = useState(false);
  const [remember, setRemember] = useState(true);
  const churches = useSyncedChurches();

  // Filtro em cascata pra achar a igreja no login: Associação/Missão > Distrito > Igreja — cada
  // escolha elimina o que não pertence a ela, sem precisar digitar nada.
  const activeChurches = useMemo(() => churches.filter(c => !c.removed), [churches]);
  const assocOptions = useMemo(() => {
    const set = new Set(activeChurches.map(c => (c.association||'').trim() || 'Sem associação definida'));
    return [...set].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  }, [activeChurches]);
  const districtOptions = useMemo(() => {
    if (!selectedAssoc) return [];
    const set = new Set(activeChurches.filter(c => ((c.association||'').trim() || 'Sem associação definida') === selectedAssoc).map(c => (c.district||'').trim() || 'Sem distrito definido'));
    return [...set].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  }, [activeChurches, selectedAssoc]);
  const churchOptions = useMemo(() => {
    if (!selectedAssoc || !selectedDistrict) return [];
    return activeChurches
      .filter(c => ((c.association||'').trim() || 'Sem associação definida') === selectedAssoc && ((c.district||'').trim() || 'Sem distrito definido') === selectedDistrict)
      .sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  }, [activeChurches, selectedAssoc, selectedDistrict]);
  const handleAssocSelect = (v) => { setSelectedAssoc(v); setSelectedDistrict(''); setSelectedChurchLogin(''); setLogin(v === '__dev__' ? login : ''); };
  const handleDistrictSelect = (v) => { setSelectedDistrict(v); setSelectedChurchLogin(''); setLogin(''); };
  const handleChurchSelect = (v) => { setSelectedChurchLogin(v); setLogin(v); };

  const [name, setName] = useState('');
  const [city, setCity] = useState('');
  const [state, setState] = useState('');
  const [address, setAddress] = useState('');
  const [division, setDivision] = useState('');
  const [union, setUnion] = useState('');
  const [association, setAssociation] = useState('');
  const [district, setDistrict] = useState('');
  const [isDistrictSeat, setIsDistrictSeat] = useState(false);
  const [pastorName, setPastorName] = useState('');
  const [elderName, setElderName] = useState('');
  const [ministryLeaders, setMinistryLeaders] = useState([{ ministry:'', leader:'' }]);
  const [newLogin, setNewLogin] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [recoveryQuestion, setRecoveryQuestion] = useState('');
  const [recoveryAnswer, setRecoveryAnswer] = useState('');

  const updateLeaderRow = (idx, field, value) => {
    setMinistryLeaders(rows => rows.map((r,i) => i===idx ? {...r, [field]: value} : r));
  };
  const addLeaderRow = () => setMinistryLeaders(rows => [...rows, { ministry:'', leader:'' }]);
  const removeLeaderRow = (idx) => setMinistryLeaders(rows => rows.length > 1 ? rows.filter((_,i)=>i!==idx) : rows);


  const doLogin = (e) => {
    e.preventDefault();
    setError('');
    if (!login.trim() || !password.trim()) { setError('Digite usuário e senha.'); return; }

    if (login.trim().toLowerCase() === DEV_ACCOUNT.login && password === DEV_ACCOUNT.password) {
      onLogin({ type:'developer', name: DEV_ACCOUNT.name }, remember);
      return;
    }

    const db = loadDB();
    const loginLower = login.trim().toLowerCase();
    const passHash = simpleHash(password);
    const church = db.find(c => c.login.toLowerCase() === loginLower && (
      (c.passwordHash && c.passwordHash === passHash) ||
      (c.password !== undefined && c.password === password)
    ));
    if (!church) { setError('Usuário ou senha incorretos.'); return; }
    if (church.removed) { setError('Esse cadastro foi removido. Fale com o desenvolvedor (Paulo) se isso for engano.'); return; }
    if (church.paused) { setError('O acesso dessa igreja está pausado no momento. Fale com o desenvolvedor (Paulo) pra reativar.'); return; }
    pushLog(loadLog(), { type:'login', churchName: church.name, churchId: church.id });
    fbAddActivity({ id:'log-'+Date.now(), type:'login', churchName: church.name, churchId: church.id, at: new Date().toISOString() });
    onLogin({ type:'church', church }, remember);
  };

  const doRegister = async (e) => {
    e.preventDefault();
    setError('');
    if (!name.trim()) { setError('Informe o nome da igreja.'); return; }
    if (!newLogin.trim()) { setError('Escolha um login de acesso.'); return; }
    if (!newPassword.trim() || newPassword.length < 4) { setError('A senha deve ter no mínimo 4 caracteres.'); return; }
    if (!recoveryQuestion.trim() || !recoveryAnswer.trim()) { setError('Preencha a pergunta e a resposta de segurança — é por elas que você vai recuperar a senha se esquecer.'); return; }
    if (!union.trim() || !association.trim()) { setError('Selecione a União e a Associação/Missão da sua igreja.'); return; }

    // Trava contra cadastro duplicado (pedido dele, 23/09): se já existe outra igreja ativa com a
    // MESMA cidade e o MESMO endereço, é quase certo que é a mesma igreja se cadastrando de novo
    // por engano (gerando um segundo login pra quem já tinha acesso) — bloqueia aqui, antes de criar
    // conta nova, e manda a pessoa entrar com o acesso já existente em vez disso.
    const normLoc = (s) => (s||'').trim().toLowerCase().replace(/\s+/g,' ');
    if (city.trim() && address.trim() && churches.some(c => !c.removed && normLoc(c.city) === normLoc(city) && normLoc(c.address) === normLoc(address))) {
      setError('Já existe uma igreja cadastrada com essa mesma cidade e endereço. Se essa é a sua igreja, peça o login de acesso a quem já cadastrou (ou ao Paulo) em vez de criar um cadastro novo — dois logins pra igreja causam confusão e dados divididos.');
      return;
    }

    const newLoginLower = newLogin.trim().toLowerCase();
    const db = loadDB();
    // Checagem local rápida primeiro (evita esperar a rede pra um erro óbvio).
    if (db.some(c => !c.removed && c.login.toLowerCase() === newLoginLower) || newLoginLower === DEV_ACCOUNT.login) {
      setError('Esse login já está em uso. Escolha outro.');
      return;
    }

    const now = new Date().toISOString();
    const recoveryAnswerLower = recoveryAnswer.trim().toLowerCase();
    const church = {
      id:'igreja-'+Date.now(), name:name.trim(), city:city.trim(), state:state.trim(),
      address: address.trim(), division: division.trim(), union: union.trim(),
      association: association.trim(), district: district.trim(),
      isDistrictSeat, pastorName: pastorName.trim(), elderName: elderName.trim(),
      ministryLeaders: ministryLeaders.filter(r => r.ministry.trim() || r.leader.trim()),
      login:newLogin.trim(), password:newPassword, passwordHash: simpleHash(newPassword),
      recoveryQuestion: recoveryQuestion.trim(), recoveryAnswer: recoveryAnswerLower,
      recoveryAnswerHash: simpleHash(recoveryAnswerLower),
      createdAt: now, updatedAt: now
    };

    // A checagem que realmente decide é a transação do Firestore (fbAddChurch): ela usa o login
    // como ID do documento, então dois cadastros com o mesmo login — mesmo em aparelhos
    // diferentes, mesmo no mesmo instante — sempre disputam o mesmo documento, e só um vence.
    // Por isso salvamos localmente só DEPOIS de confirmar que ninguém "roubou" o login na frente.
    setChecking(true);
    const result = await fbAddChurch(church);
    setChecking(false);
    if (result.loginTaken) {
      setError('Esse login já está em uso por outra igreja. Escolha outro.');
      return;
    }
    if (result.docId) church.fbDocId = result.docId;
    // Se o banco compartilhado não estiver disponível (offline ou sem configuração), segue só
    // localmente, como antes — nesse caso não há como conflitar com outro aparelho mesmo assim.

    const nextDB = [...db, church];
    saveDB(nextDB);
    pushLog(loadLog(), { type:'cadastro', churchName: church.name, churchId: church.id });
    fbAddActivity({ id:'log-'+Date.now(), type:'cadastro', churchName: church.name, churchId: church.id, at: now });

    onLogin({ type:'church', church });
  };

  return html`
    <div style=${{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'20px'}}>
      <div class="fade-up" style=${{width:'100%', maxWidth: mode==='register' ? '480px' : '420px'}}>
        <${Brand} />
        <div class="glass" style=${{borderRadius:'20px', padding:'22px', display:'grid', gap:'16px', maxHeight:'80vh', overflowY:'auto'}}>
          <div style=${{display:'flex', padding:'4px', background:'rgba(15,23,42,0.5)', borderRadius:'12px', border:'1px solid var(--border-soft)', position:'sticky', top:0}}>
            <button onClick=${()=>{setMode('login'); setError('');}} style=${{flex:1, padding:'9px', borderRadius:'8px', border:'none', fontSize:'12.5px', fontWeight:700, background: mode==='login' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: mode==='login' ? '#fff' : 'var(--text-mid)'}}>Entrar</button>
            <button onClick=${()=>{setMode('register'); setError('');}} style=${{flex:1, padding:'9px', borderRadius:'8px', border:'none', fontSize:'12.5px', fontWeight:700, background: mode==='register' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: mode==='register' ? '#fff' : 'var(--text-mid)'}}>Cadastrar Igreja</button>
          </div>

          ${error && html`<div style=${errorBox}>${error}</div>`}

          ${mode === 'login' ? html`
            <form onSubmit=${doLogin} style=${{display:'grid', gap:'10px'}}>
              <select value=${selectedAssoc} onChange=${e=>handleAssocSelect(e.target.value)} style=${inputStyle}>
                <option value="">Associação/Missão...</option>
                ${assocOptions.map(a => html`<option key=${a} value=${a}>${a}</option>`)}
                <option value="__dev__">🔑 Acesso do Desenvolvedor</option>
              </select>
              ${selectedAssoc && selectedAssoc !== '__dev__' && html`
                <select value=${selectedDistrict} onChange=${e=>handleDistrictSelect(e.target.value)} style=${inputStyle}>
                  <option value="">Distrito...</option>
                  ${districtOptions.map(d => html`<option key=${d} value=${d}>${d}</option>`)}
                </select>
              `}
              ${selectedDistrict && selectedAssoc !== '__dev__' && html`
                <select value=${selectedChurchLogin} onChange=${e=>handleChurchSelect(e.target.value)} style=${inputStyle}>
                  <option value="">Igreja...</option>
                  ${churchOptions.map(c => html`<option key=${c.id} value=${c.login}>${c.name}${c.city ? ' — '+c.city : ''}</option>`)}
                </select>
              `}
              ${selectedAssoc === '__dev__' && html`
                <input placeholder="Usuário do desenvolvedor" value=${login} onChange=${e=>setLogin(e.target.value)} style=${inputStyle} />
              `}
              <div style=${{position:'relative'}}>
                <input type=${showPassword ? 'text' : 'password'} placeholder="Senha" value=${password} onChange=${e=>setPassword(e.target.value)} style=${{...inputStyle, paddingRight:'42px'}} />
                <button type="button" onClick=${()=>setShowPassword(v=>!v)} style=${{position:'absolute', right:'6px', top:'50%', transform:'translateY(-50%)', background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'15px', padding:'4px 6px', cursor:'pointer'}} title=${showPassword ? 'Ocultar senha' : 'Mostrar senha'}>${showPassword ? '🙈' : '👁️'}</button>

function ForgotPasswordModal({ onClose }) {
  const [step, setStep] = useState('select'); // select | answer | reset | done
  const [churchLogin, setChurchLogin] = useState('');
  const [answer, setAnswer] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [showNewPassword, setShowNewPassword] = useState(false);
  const [error, setError] = useState('');
  const churches = useSyncedChurches();
  const church = churches.find(c => c.login === churchLogin);

  const goAnswer = (e) => {
    e.preventDefault();
    setError('');
    if (!churchLogin) { setError('Selecione sua igreja.'); return; }
    if (!church || !church.recoveryQuestion) {
      setError('Essa igreja ainda não tem uma pergunta de segurança cadastrada. Peça ao desenvolvedor (Paulo) para redefinir a senha pelo Painel do Desenvolvedor.');
      return;
    }
    setStep('answer');
  };

  const checkAnswer = (e) => {
    e.preventDefault();
    setError('');
    const givenLower = answer.trim().toLowerCase();
    const ok = church.recoveryAnswerHash
      ? simpleHash(givenLower) === church.recoveryAnswerHash
      : givenLower === (church.recoveryAnswer || '');
    if (!ok) { setError('Resposta incorreta. Tente novamente.'); return; }
    setStep('reset');
  };

  const doReset = (e) => {
    e.preventDefault();
    setError('');
    if (!newPassword.trim() || newPassword.length < 4) { setError('A nova senha deve ter no mínimo 4 caracteres.'); return; }
    if (newPassword !== confirmPassword) { setError('As senhas não conferem.'); return; }
    const db = loadDB();
    const passwordHash = simpleHash(newPassword);
    const next = db.map(c => c.id === church.id ? { ...c, password: newPassword, passwordHash, updatedAt: new Date().toISOString() } : c);
    saveDB(next);
    pushLog(loadLog(), { type:'atualizacao', churchName: church.name, churchId: church.id, detail: 'Senha redefinida via recuperação de senha' });
    if (church.fbDocId) fbUpdateChurchPassword(church.fbDocId, passwordHash);
    setStep('done');
  };

  return html`
    <div style=${{position:'fixed', inset:0, background:'rgba(2,6,23,0.65)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:220, padding:'16px'}} onClick=${onClose}>
      <div class="glass fade-up" style=${{maxWidth:'400px', width:'100%', padding:'22px', borderRadius:'20px', display:'grid', gap:'12px'}} onClick=${e=>e.stopPropagation()}>
        <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div style=${{fontWeight:800, fontSize:'15px'}}>🔑 Recuperar Senha</div>
          <button onClick=${onClose} style=${{background:'transparent', border:'none', color:'var(--text-mid)', fontSize:'18px'}}>✕</button>
        </div>

        ${error && html`<div style=${errorBox}>${error}</div>`}

        ${step === 'select' && html`
          <form onSubmit=${goAnswer} style=${{display:'grid', gap:'10px'}}>
            <div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>Selecione sua igreja para ver sua pergunta de segurança.</div>
            <select value=${churchLogin} onChange=${e=>setChurchLogin(e.target.value)} style=${inputStyle} autoFocus>
              <option value="">Selecione sua igreja...</option>
              ${churches.filter(c => !c.removed).map(c => html`<option key=${c.id} value=${c.login}>${c.name}${c.city ? ' — '+c.city : ''}</option>`)}
            </select>
            <button type="submit" style=${btnPrimary}>Continuar</button>
          </form>
        `}

        ${step === 'answer' && church && html`
          <form onSubmit=${checkAnswer} style=${{display:'grid', gap:'10px'}}>
            <div style=${{fontSize:'12px', color:'var(--text-hi)'}}><b>${church.recoveryQuestion}</b></div>
            <input placeholder="Sua resposta" value=${answer} onChange=${e=>setAnswer(e.target.value)} style=${inputStyle} autoFocus />
            <div style=${{display:'flex', gap:'8px', justifyContent:'flex-end'}}>
              <button type="button" onClick=${()=>{ setStep('select'); setError(''); }} style=${btnGhost}>Voltar</button>
              <button type="submit" style=${{...btnPrimary, width:'auto', padding:'9px 18px'}}>Confirmar</button>
            </div>
          </form>
        `}

        ${step === 'reset' && html`
          <form onSubmit=${doReset} style=${{display:'grid', gap:'10px'}}>
            <div style=${{fontSize:'11.5px', color:'var(--text-mid)'}}>Resposta certa! Agora crie sua nova senha.</div>
            <div style=${{position:'relative'}}>
              <input type=${showNewPassword ? 'text' : 'password'} placeholder="Nova senha (mínimo 4 caracteres)" value=${newPassword} onChange=${e=>setNewPassword(e.target.value)} style=${{...inputStyle, paddingRight:'42px'}} autoFocus />
              <button type="button" onClick=${()=>setShowNewPassword(v=>!v)} style=${{position:'absolute', right:'6px', top:'50%', transform:'translateY(-50%)', background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'15px', padding:'4px 6px', cursor:'pointer'}} title=${showNewPassword ? 'Ocultar senha' : 'Mostrar senha'}>${showNewPassword ? '🙈' : '👁️'}</button>
            </div>
            <input type=${showNewPassword ? 'text' : 'password'} placeholder="Confirmar nova senha" value=${confirmPassword} onChange=${e=>setConfirmPassword(e.target.value)} style=${inputStyle} />
            <button type="submit" style=${btnPrimary}>Salvar Nova Senha</button>
          </form>
        `}

        ${step === 'done' && html`
          <div style=${{display:'grid', gap:'12px', textAlign:'center'}}>
            <div style=${{fontSize:'28px'}}>✅</div>
            <div style=${{fontSize:'12.5px', color:'var(--text-hi)'}}>Senha redefinida com sucesso! Já pode entrar com a nova senha.</div>
            <button onClick=${onClose} style=${btnPrimary}>Fechar</button>
          </div>
        `}
      </div>
    </div>
  `;
}

function DeveloperPanel({ onLogout }) {
  const [db, setDb] = useState(loadDB);
  const [log, setLog] = useState(loadLog);
  const [localSuggestions, setLocalSuggestions] = useState(loadSuggestions);
  const [remoteChurches, setRemoteChurches] = useState(null);
  const [remoteSuggestions, setRemoteSuggestions] = useState(null);
  const [remoteActivities, setRemoteActivities] = useState(null);
  const [syncStatus, setSyncStatus] = useState(fbIsReady() ? 'ready' : (window.__fb && window.__fb.error === 'no-config' ? 'no-config' : 'connecting'));
  const [tab, setTab] = useState('igrejas');
  const [expandedId, setExpandedId] = useState(null);
  const [resetId, setResetId] = useState(null);
  const [showRemoved, setShowRemoved] = useState(false);
  const [addOpen, setAddOpen] = useState(false);

  useEffect(() => {
    const onReady = () => { setSyncStatus('ready'); };
    const onError = () => { setSyncStatus(window.__fb && window.__fb.error === 'no-config' ? 'no-config' : 'error'); };
    window.addEventListener('fb-ready', onReady);
    window.addEventListener('fb-error', onError);
    if (fbIsReady()) setSyncStatus('ready');
    const unsub1 = fbListenChurches(list => setRemoteChurches(list));
    const unsub2 = fbListenSuggestions(list => setRemoteSuggestions(list));
    const unsub3 = fbListenActivities(list => setRemoteActivities(list));
    return () => {
      window.removeEventListener('fb-ready', onReady);
      window.removeEventListener('fb-error', onError);
      if (typeof unsub1 === 'function') unsub1();
      if (typeof unsub2 === 'function') unsub2();
      if (typeof unsub3 === 'function') unsub3();
    };
  }, []);

  // Igrejas: mistura o que veio do banco compartilhado (de qualquer aparelho) com igrejas
  // cadastradas só neste aparelho antes de o banco compartilhado existir (ou sem sincronizar ainda).
  // Se este aparelho tiver uma cópia local da igreja (por ex. porque uma ação administrativa —
  // pausar/remover/restaurar — foi feita aqui), o estado local de pausado/removido tem prioridade
  // sobre o que veio do banco: isso garante que a ação apareça na hora, mesmo que a sincronização
  // com o Firestore ainda não esteja liberada pelas regras de segurança.
  const db_merged = useMemo(() => {
    if (!remoteChurches) return db;
    const localById = new Map(db.map(c => [c.id, c]));
    const remoteIds = new Set(remoteChurches.map(r => r.churchId));
    const localOnly = db.filter(c => !remoteIds.has(c.id));
    const remoteMapped = remoteChurches.map(r => {
      const local = localById.get(r.churchId);
      return {
        id: r.churchId, name: r.name, city: r.city, state: r.state, login: r.login,
        division: r.division, union: r.union,
        association: r.association, district: r.district, pastorName: r.pastorName,
        paused: local ? !!local.paused : !!r.paused,
        removed: local ? !!local.removed : !!r.removed,
        purged: local ? !!local.purged : !!r.purged,
        fbDocId: r.docId || (local && local.fbDocId),
        createdAt: r.createdAt, __remote: !local
      };
    });
    return [...remoteMapped, ...localOnly];
  }, [remoteChurches, db]);

  const visibleChurches = useMemo(() => db_merged.filter(c => !c.purged && (showRemoved ? c.removed : !c.removed)), [db_merged, showRemoved]);
  const removedCount = useMemo(() => db_merged.filter(c => c.removed && !c.purged).length, [db_merged]);

  // Detecta logins duplicados de verdade: duas ou mais igrejas ATIVAS (não removidas, não
  // limpas) cadastradas com o mesmo login ao mesmo tempo — isso sim é um conflito real, porque
  // as duas disputam o mesmo login pra entrar no sistema e uma ação numa pode "vazar" pra outra.
  // Uma igreja removida com o mesmo login de uma igreja ativa NÃO entra aqui: isso é esperado
  // (o login foi reaproveitado depois da remoção) e não é motivo de aviso.
  const duplicateLoginGroups = useMemo(() => {
    const byLogin = new Map();
    db_merged.forEach(c => {
      if (c.purged || c.removed) return;
      const key = (c.login || '').trim().toLowerCase();
      if (!key) return;
      if (!byLogin.has(key)) byLogin.set(key, []);
      byLogin.get(key).push(c);
    });
    return [...byLogin.entries()].filter(([, list]) => list.length > 1);
  }, [db_merged]);

  const suggestions = useMemo(() => {
    if (!remoteSuggestions) return localSuggestions;
    const remoteLocalIds = new Set(remoteSuggestions.map(r => r.localId).filter(Boolean));
    const localOnly = localSuggestions.filter(s => !remoteLocalIds.has(s.id));
    const remoteMapped = remoteSuggestions.map(r => ({
      id: r.localId || r.docId, docId: r.docId, churchId: r.churchId, churchName: r.churchName,
      text: r.text, createdAt: r.createdAt, status: r.status, response: r.response, respondedAt: r.respondedAt
    }));
    return [...remoteMapped, ...localOnly].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  }, [remoteSuggestions, localSuggestions]);

  // Histórico de atividade: mistura o log deste aparelho com o que veio de qualquer outro aparelho
  // (cadastros, remoções, pausas, reativações e logins de igrejas) — visão central pro desenvolvedor.
  const activities = useMemo(() => {
    if (!remoteActivities) return log;
    const remoteLocalIds = new Set(remoteActivities.map(r => r.localId).filter(Boolean));
    const localOnly = log.filter(l => !remoteLocalIds.has(l.id));
    const remoteMapped = remoteActivities.map(r => ({
      id: r.localId || r.docId, type: r.type, churchName: r.churchName, churchId: r.churchId,
      detail: r.detail, at: r.at
    }));
    return [...remoteMapped, ...localOnly].sort((a,b) => new Date(b.at) - new Date(a.at)).slice(0, 300);
  }, [remoteActivities, log]);

  const refresh = () => { setDb(loadDB()); setLog(loadLog()); setLocalSuggestions(loadSuggestions()); };

  // Aplica uma mudança administrativa (pausar, reativar, remover, restaurar, redefinir senha) numa
  // igreja: atualiza local sempre (mesmo que essa igreja tenha se cadastrado em outro aparelho —
  // nesse caso cria uma cópia local só com o essencial, pra a mudança aparecer na hora aqui),
  // sincroniza com o banco compartilhado (se já tiver docId) e registra no histórico de atividade,
  // visível em qualquer aparelho.
  const updateChurchAdmin = (c, patch, logType, logDetail) => {
    const localMatch = db.find(x => x.id === c.id);
    const next = localMatch
      ? db.map(x => x.id === c.id ? { ...x, ...patch, updatedAt: new Date().toISOString() } : x)
      : [...db, { ...c, ...patch, updatedAt: new Date().toISOString() }];
    saveDB(next); setDb(next);
    const docId = c.fbDocId || c.docId;
    if (docId) fbUpdateChurchFields(docId, patch);
    const nl = pushLog(loadLog(), { type: logType, churchName: c.name, churchId: c.id, detail: logDetail });
    setLog(nl);
    fbAddActivity({ id:'log-'+Date.now(), type: logType, churchName: c.name, churchId: c.id, detail: logDetail, at: new Date().toISOString() });
  };

  const pauseChurch = (c) => updateChurchAdmin(c, { paused: true }, 'pausa', 'Acesso pausado pelo desenvolvedor');
  const reactivateChurch = (c) => updateChurchAdmin(c, { paused: false }, 'reativacao', 'Acesso reativado pelo desenvolvedor');
  const removeChurch = (c) => {
    if (!confirm('Remover "'+c.name+'"? Ela deixa de conseguir entrar no sistema, mas você pode restaurar depois se precisar.')) return;
    updateChurchAdmin(c, { removed: true }, 'remocao', 'Igreja removida pelo desenvolvedor');
    setExpandedId(null); setResetId(null);
  };
  const restoreChurch = (c) => updateChurchAdmin(c, { removed: false }, 'restauracao', 'Igreja restaurada pelo desenvolvedor');

  // Limpa (some da lista, inclusive da lista de removidas) uma única igreja. Só pode ser usado
  // numa igreja já removida — pra evitar apagar da lista uma igreja que ainda está em uso.
  const clearOneChurch = (c) => {
    if (!confirm('Limpar "'+c.name+'" de vez da lista? Ela some de todo o painel (não aparece nem em "Ver removidas"). Essa ação não pode ser desfeita.')) return;
    updateChurchAdmin(c, { purged: true }, 'limpeza', 'Removida da lista de removidas pelo desenvolvedor');
  };

  // Limpa (some da lista, inclusive da lista de removidas) todas as igrejas atualmente removidas.
  // Como o Firestore não permite apagar o registro de verdade (regra de segurança), isso marca as
  // igrejas com "purged: true" — elas continuam existindo no banco, mas somem de todo o painel.
  const clearRemovedChurches = () => {
    const removedList = db_merged.filter(c => c.removed && !c.purged);
    if (removedList.length === 0) return;
    if (!confirm('Limpar '+removedList.length+' igreja(s) removida(s) da lista? Elas somem de vez do painel (não aparecem nem em "Ver removidas"). Essa ação não pode ser desfeita.')) return;
    removedList.forEach(c => updateChurchAdmin(c, { purged: true }, 'limpeza', 'Removida da lista de removidas pelo desenvolvedor'));
    setShowRemoved(false);
  };

  // "Assistente" da aba do desenvolvedor: não é um chat, é uma varredura automática que roda a
  // cada mudança nos dados (igrejas, sugestões, histórico) e aponta problemas reais — com um
  // botão de ação pronto pra resolver cada um, sem precisar caçar informação pelas outras abas.
  const diagnostics = useMemo(() => {
    const out = [];
    const daysSince = (iso) => iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : Infinity;

    // 1) Logins duplicados de verdade (duas+ igrejas ativas com o mesmo login).
    duplicateLoginGroups.forEach(([login, list]) => {
      out.push({
        id: 'dup-'+login, severity: 'critica', icon: '⚠️',
        title: 'Login duplicado: "'+login+'"',
        description: list.length+' igrejas ativas estão cadastradas com esse mesmo login: '+list.map(c=>c.name).join(', ')+'. Enquanto isso não for resolvido, uma ação numa dessas igrejas pode acabar afetando a outra por engano.',
        actions: [
          { label: '👁️ Ver na lista', onClick: () => setTab('igrejas') },
          ...list.map(c => ({ label: '🗑️ Remover "'+c.name+'"', danger: true, onClick: () => removeChurch(c) }))
        ]
      });
    });

    // 2) Muitas igrejas removidas acumuladas sem limpar.
    if (removedCount >= 5) {
      out.push({
        id: 'removidas-acumuladas', severity: 'atencao', icon: '🗑️',
        title: removedCount+' igrejas removidas acumuladas',
        description: 'Isso não atrapalha o funcionamento, mas deixa o painel mais cheio do que precisa. Você pode limpar as que não vai mais usar.',
        actions: [
          { label: '👁️ Ver removidas', onClick: () => { setTab('igrejas'); setShowRemoved(true); } },
          { label: '🧹 Limpar todas', danger: true, onClick: clearRemovedChurches }
        ]
      });
    }

    // 3) Igrejas pausadas há muito tempo (podem ter sido esquecidas).
    db_merged.filter(c => c.paused && !c.removed && !c.purged && daysSince(c.updatedAt || c.createdAt) >= 14).forEach(c => {
      out.push({
        id: 'pausada-'+c.id, severity: 'atencao', icon: '⏸️',
        title: '"'+c.name+'" está pausada há mais de 2 semanas',
        description: 'Se foi um esquecimento, reative o acesso. Se não é mais pra usar o sistema, considere remover.',
        actions: [
          { label: '▶️ Reativar', onClick: () => reactivateChurch(c) },
          { label: '🗑️ Remover', danger: true, onClick: () => removeChurch(c) }
        ]
      });
    });

    // 4) Sugestões esperando resposta há muito tempo.
    const oldPending = suggestions.filter(s => s.status !== 'answered' && daysSince(s.createdAt) >= 5);
    if (oldPending.length > 0) {
      out.push({
        id: 'sugestoes-pendentes', severity: 'atencao', icon: '💡',
        title: oldPending.length+' sugestão(ões) esperando resposta há mais de 5 dias',
        description: 'Igrejas enviaram sugestões e ainda não tiveram retorno: '+oldPending.slice(0,4).map(s=>s.churchName).join(', ')+(oldPending.length>4?'...':'')+'.',
        actions: [ { label: '👁️ Ver sugestões', onClick: () => setTab('sugestoes') } ]
      });
    }

    // 5) Conflitos de sincronização recentes (login disputado durante backfill).
    const recentConflicts = activities.filter(a => a.type === 'conflito' && daysSince(a.at) <= 14);
    if (recentConflicts.length > 0) {
      out.push({
        id: 'conflitos-sync', severity: 'atencao', icon: '🔀',
        title: recentConflicts.length+' conflito(s) de sincronização recente(s)',
        description: 'Uma igreja cadastrada só num aparelho tentou sincronizar, mas o login dela já tinha sido ocupado por outra. Vale conferir se é uma duplicata: '+recentConflicts.slice(0,3).map(a=>a.churchName).join(', ')+'.',
        actions: [ { label: '👁️ Ver no histórico', onClick: () => setTab('log') } ]
      });
    }

    // 6) Banco compartilhado fora do ar.
    if (syncStatus === 'error') {
      out.push({
        id: 'sync-erro', severity: 'critica', icon: '📴',
        title: 'Sem conexão com o banco compartilhado agora',
        description: 'Enquanto isso durar, cadastros e ações feitas neste aparelho não aparecem nos outros. Verifique sua internet ou tente atualizar a página.',
        actions: [ { label: '↻ Tentar de novo', onClick: () => window.location.reload() } ]
      });
    }

    const order = { critica: 0, atencao: 1 };
    return out.sort((a,b) => order[a.severity] - order[b.severity]);
  }, [duplicateLoginGroups, removedCount, db_merged, suggestions, activities, syncStatus]);

  const resetChurchPassword = (c, newPass) => {
    const passwordHash = simpleHash(newPass);
    updateChurchAdmin(c, { passwordHash }, 'atualizacao', 'Senha redefinida pelo desenvolvedor');
    const localMatch = db.find(x => x.id === c.id);
    if (localMatch) {
      const next = loadDB().map(x => x.id === c.id ? { ...x, password: newPass } : x);
      saveDB(next); setDb(next);
    }
    setResetId(null);
  };

  // Retorna undefined em caso de sucesso, ou uma mensagem de erro (login já em uso) pra
  // AddChurchForm mostrar sem fechar o formulário. A transação do Firestore em fbAddChurch é
  // quem decide de verdade — evita duas igrejas com o mesmo login mesmo cadastradas ao mesmo tempo.
  const addChurchByDev = async (data) => {
    const now = new Date().toISOString();
    const church = {
      id: 'igreja-'+Date.now(), name: data.name, city: data.city, state: data.state,
      division: data.division, union: data.union,
      association: data.association, district: data.district, pastorName: data.pastorName,
      login: data.login, password: data.password, passwordHash: simpleHash(data.password),
      recoveryQuestion: '', recoveryAnswer: '', recoveryAnswerHash: null,
      createdAt: now, updatedAt: now, paused: false, removed: false
    };
    const result = await fbAddChurch(church);
    if (result.loginTaken) return 'Esse login já está em uso por outra igreja. Escolha outro.';
    if (result.docId) church.fbDocId = result.docId;

    const next = [...loadDB(), church];
    saveDB(next); setDb(next);
    const nl = pushLog(loadLog(), { type:'cadastro', churchName: church.name, churchId: church.id, detail: 'Cadastrada pelo desenvolvedor' });
    setLog(nl);
    fbAddActivity({ id:'log-'+Date.now(), type:'cadastro', churchName: church.name, churchId: church.id, detail: 'Cadastrada pelo desenvolvedor', at: now });
    setAddOpen(false);
  };

  const respondSuggestion = (s, response) => {
    if (s.docId) {
      fbRespondSuggestion(s.docId, response);
      return;
    }
    setLocalSuggestions(list => {
      const next = list.map(x => x.id===s.id ? { ...x, response, status:'answered', respondedAt: new Date().toISOString() } : x);
      saveSuggestions(next);
      return next;
    });
  };
  const pendingCount = suggestions.filter(s => s.status !== 'answered').length;

  return html`
    <div style=${{maxWidth:'820px', margin:'0 auto', padding:'20px 16px 60px'}}>
      <div class="glass fade-up" style=${{padding:'16px 20px', borderRadius:'18px', marginBottom:'18px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'10px'}}>
        <div style=${{display:'flex', alignItems:'center', gap:'10px'}}>
          <div class="breathe" style=${{width:'38px',height:'38px',borderRadius:'12px',background:'linear-gradient(135deg,var(--accent-1),var(--accent-2),var(--accent-3))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}}>👑</div>
          <div>
            <div style=${{fontWeight:800, fontSize:'14px'}}>Painel do Desenvolvedor</div>
            <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>${visibleChurches.length} igreja(s) cadastrada(s)</div>
          </div>
        </div>
        <div style=${{display:'flex', alignItems:'center', gap:'10px'}}>
          <span style=${{fontSize:'10px', fontWeight:700, padding:'4px 9px', borderRadius:'999px',
            background: syncStatus==='ready' ? 'color-mix(in srgb, var(--success-1) 20%, transparent)' : syncStatus==='connecting' ? 'color-mix(in srgb, var(--highlight) 20%, transparent)' : 'rgba(148,163,184,0.15)',
            color: syncStatus==='ready' ? 'var(--success-1)' : syncStatus==='connecting' ? 'var(--highlight)' : 'var(--text-dim)'}}>
            ${syncStatus==='ready' ? '☁️ Sincronizado' : syncStatus==='connecting' ? '⏳ Conectando...' : syncStatus==='no-config' ? '📴 Só neste aparelho' : '⚠️ Sem conexão'}
          </span>
          <button onClick=${onLogout} style=${btnGhost}>Sair</button>
        </div>
      </div>

      <div style=${{display:'flex', gap:'6px', marginBottom:'16px', flexWrap:'wrap'}}>
        <button onClick=${()=>setTab('assistente')} style=${{padding:'8px 16px', borderRadius:'10px', fontSize:'12px', fontWeight:700, border:'1px solid var(--border-soft)', background: tab==='assistente' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: tab==='assistente' ? '#fff' : 'var(--text-mid)', display:'flex', alignItems:'center', gap:'6px'}}>
          🤖 Assistente
          ${diagnostics.length > 0 && html`<span style=${{padding:'1px 7px', borderRadius:'999px', fontSize:'10px', background: diagnostics.some(d=>d.severity==='critica') ? 'var(--danger)' : 'var(--highlight)', color:'#fff', fontWeight:800}}>${diagnostics.length}</span>`}
        </button>
        <button onClick=${()=>setTab('igrejas')} style=${{padding:'8px 16px', borderRadius:'10px', fontSize:'12px', fontWeight:700, border:'1px solid var(--border-soft)', background: tab==='igrejas' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: tab==='igrejas' ? '#fff' : 'var(--text-mid)'}}>Igrejas Cadastradas</button>
        <button onClick=${()=>setTab('log')} style=${{padding:'8px 16px', borderRadius:'10px', fontSize:'12px', fontWeight:700, border:'1px solid var(--border-soft)', background: tab==='log' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: tab==='log' ? '#fff' : 'var(--text-mid)'}}>Histórico de Atividade</button>
        <button onClick=${()=>setTab('sugestoes')} style=${{padding:'8px 16px', borderRadius:'10px', fontSize:'12px', fontWeight:700, border:'1px solid var(--border-soft)', background: tab==='sugestoes' ? 'linear-gradient(90deg,var(--accent-1),var(--accent-2))' : 'transparent', color: tab==='sugestoes' ? '#fff' : 'var(--text-mid)', display:'flex', alignItems:'center', gap:'6px'}}>
          💡 Sugestões
          ${pendingCount > 0 && html`<span style=${{padding:'1px 7px', borderRadius:'999px', fontSize:'10px', background:'var(--highlight)', color:'var(--text-on-highlight)', fontWeight:800}}>${pendingCount}</span>`}
        </button>
        <button onClick=${refresh} style=${btnGhost}>↻ Atualizar</button>
      </div>

      ${duplicateLoginGroups.length > 0 && tab !== 'assistente' && html`
        <div class="glass fade-up" style=${{padding:'14px 18px', borderRadius:'14px', marginBottom:'16px', border:'1.5px solid color-mix(in srgb, var(--danger) 45%, transparent)', background:'color-mix(in srgb, var(--danger) 10%, transparent)'}}>
          <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center', gap:'10px', flexWrap:'wrap'}}>
            <div style=${{fontWeight:800, fontSize:'13px', color:'var(--danger)'}}>⚠️ Login duplicado detectado</div>
            <button onClick=${()=>setTab('assistente')} style=${{...btnGhost, padding:'5px 12px', fontSize:'11px'}}>🤖 Resolver no Assistente</button>
          </div>
          <div style=${{fontSize:'12px', color:'var(--text-mid)', lineHeight:1.5, marginTop:'4px'}}>
            ${duplicateLoginGroups.length === 1 ? 'Existe mais de uma igreja ativa usando o mesmo login abaixo.' : 'Existem igrejas ativas usando o mesmo login em alguns casos abaixo.'}
          </div>
          <ul style=${{margin:'8px 0 0', paddingLeft:'18px', fontSize:'12px', color:'var(--text-hi)'}}>
            ${duplicateLoginGroups.map(([login, list]) => html`
              <li key=${login} style=${{marginBottom:'2px'}}>
                <strong>${login}</strong>: ${list.map(c => c.name).join(', ')}
              </li>
            `)}
          </ul>
        </div>
      `}

      ${tab === 'assistente' && html`
        <div style=${{display:'grid', gap:'12px'}}>
          <div class="glass fade-up" style=${{padding:'14px 18px', borderRadius:'16px'}}>
            <div style=${{fontWeight:800, fontSize:'13.5px', marginBottom:'4px'}}>🤖 Assistente do Painel</div>
            <div style=${{fontSize:'11.5px', color:'var(--text-dim)', lineHeight:1.5}}>Faço uma varredura automática toda vez que algo muda — igrejas, sugestões, histórico — e aponto aqui só o que realmente precisa da sua atenção, com um botão pronto pra resolver.</div>
          </div>

          ${diagnostics.length === 0 && html`
            <div class="glass fade-up" style=${{padding:'28px', borderRadius:'16px', textAlign:'center'}}>
              <div style=${{fontSize:'30px', marginBottom:'6px'}}>✅</div>
              <div style=${{fontSize:'13px', fontWeight:700, color:'var(--text-hi)'}}>Tudo certo por aqui!</div>
              <div style=${{fontSize:'11.5px', color:'var(--text-dim)', marginTop:'2px'}}>Não encontrei nenhum problema agora. Assim que algo precisar da sua atenção, aparece aqui.</div>
            </div>
          `}

          ${diagnostics.map(d => html`
            <div key=${d.id} class="glass fade-up" style=${{padding:'14px 18px', borderRadius:'14px', border: '1.5px solid color-mix(in srgb, '+(d.severity==='critica'?'var(--danger)':'var(--highlight)')+' 45%, transparent)', background: 'color-mix(in srgb, '+(d.severity==='critica'?'var(--danger)':'var(--highlight)')+' 8%, transparent)'}}>
              <div style=${{display:'flex', alignItems:'flex-start', gap:'10px'}}>
                <span style=${{fontSize:'18px'}}>${d.icon}</span>
                <div style=${{flex:1}}>
                  <div style=${{fontWeight:800, fontSize:'13px', color: d.severity==='critica' ? 'var(--danger)' : 'var(--text-hi)'}}>${d.title}</div>
                  <div style=${{fontSize:'12px', color:'var(--text-mid)', marginTop:'3px', lineHeight:1.5}}>${d.description}</div>
                  <div style=${{display:'flex', gap:'6px', flexWrap:'wrap', marginTop:'10px'}}>
                    ${d.actions.map((a,i) => html`<button key=${i} onClick=${a.onClick} style=${a.danger ? {...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'} : btnGhost}>${a.label}</button>`)}
                  </div>
                </div>
              </div>
            </div>
          `)}
        </div>
      `}

      ${tab === 'igrejas' && html`
        <div style=${{display:'grid', gap:'10px'}}>
          ${!addOpen ? html`
            <button onClick=${()=>setAddOpen(true)} class="glass fade-up" style=${{padding:'14px 18px', borderRadius:'16px', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', fontSize:'13px', fontWeight:700, color:'var(--text-hi)', border:'1.5px dashed var(--border-soft)'}}>➕ Adicionar Igreja</button>
          ` : html`<${AddChurchForm} onAdd=${addChurchByDev} onCancel=${()=>setAddOpen(false)} />`}

          ${removedCount > 0 && html`
            <div style=${{display:'flex', gap:'8px', flexWrap:'wrap'}}>
              <button onClick=${()=>setShowRemoved(v=>!v)} style=${{...btnGhost, justifySelf:'start'}}>${showRemoved ? '← Ver igrejas ativas' : '🗑️ Ver removidas ('+removedCount+')'}</button>
              ${showRemoved && html`<button onClick=${clearRemovedChurches} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🧹 Limpar removidas</button>`}
            </div>
          `}

          ${visibleChurches.length === 0 && html`<div class="glass fade-up" style=${{padding:'24px', borderRadius:'16px', textAlign:'center', color:'var(--text-dim)', fontSize:'13px'}}>${showRemoved ? 'Nenhuma igreja removida.' : 'Nenhuma igreja cadastrada ainda.'}</div>`}
          ${visibleChurches.map((c,i) => html`
            <div key=${c.id} class="glass fade-up" style=${{padding:'14px 16px', borderRadius:'14px', animationDelay:(i*0.03)+'s', opacity: c.paused ? 0.7 : 1}}>
              <div style=${{display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px', flexWrap:'wrap'}}>
                <div>
                  <div style=${{display:'flex', alignItems:'center', gap:'6px', flexWrap:'wrap'}}>
                    <span style=${{fontWeight:700, fontSize:'13.5px'}}>${c.name}</span>
                    ${c.__remote && html`<span style=${{fontSize:'9px', fontWeight:800, padding:'2px 7px', borderRadius:'999px', background:'color-mix(in srgb, var(--accent-1) 20%, transparent)', color:'var(--accent-1)'}}>☁️ outro aparelho</span>`}
                    ${c.paused && html`<span style=${{fontSize:'9px', fontWeight:800, padding:'2px 7px', borderRadius:'999px', background:'color-mix(in srgb, var(--highlight) 22%, transparent)', color:'var(--highlight)'}}>⏸️ pausada</span>`}
                  </div>
                  <div style=${{fontSize:'11px', color:'var(--text-mid)'}}>${c.city}${c.state ? ' - '+c.state : ''} • login: ${c.login}</div>
                  <div style=${{fontSize:'10px', color:'var(--text-dim)', marginTop:'2px'}}>Cadastrada em ${new Date(c.createdAt).toLocaleString('pt-BR')}</div>
                </div>
                <div style=${{display:'flex', gap:'6px', flexWrap:'wrap'}}>
                  ${c.removed ? html`
                    <button onClick=${()=>restoreChurch(c)} style=${btnGhost}>↺ Restaurar</button>
                    <button onClick=${()=>clearOneChurch(c)} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🧹 Limpar</button>
                  ` : html`
                    ${!c.__remote && html`<button onClick=${()=>setExpandedId(expandedId===c.id ? null : c.id)} style=${btnGhost}>${expandedId===c.id ? 'Fechar' : 'Ver detalhes'}</button>`}
                    <button onClick=${()=>{ setResetId(resetId===c.id ? null : c.id); }} style=${btnGhost}>🔑 Redefinir Senha</button>
                    ${c.paused
                      ? html`<button onClick=${()=>reactivateChurch(c)} style=${{...btnGhost, color:'var(--success-1)', borderColor:'color-mix(in srgb, var(--success-1) 32%, transparent)'}}>▶️ Reativar</button>`
                      : html`<button onClick=${()=>pauseChurch(c)} style=${btnGhost}>⏸️ Pausar</button>`}
                    <button onClick=${()=>removeChurch(c)} style=${{...btnGhost, color:'var(--danger)', borderColor:'color-mix(in srgb, var(--danger) 32%, transparent)'}}>🗑️ Remover</button>
                  `}
                </div>
              </div>
              ${resetId === c.id && !c.removed && html`<${PasswordResetRow} church=${c} onReset=${(pass)=>resetChurchPassword(c, pass)} onCancel=${()=>setResetId(null)} />`}
              ${expandedId === c.id && !c.__remote && html`<${ChurchDetailExpanded} church=${c} />`}
            </div>
          `)}
        </div>
      `}

      ${tab === 'log' && html`
        <div style=${{display:'grid', gap:'8px'}}>

// "query" de busca, não um vídeo real vinculado (só os 3 "dinâmicos" — Provai e Vede, Informativo,
// Vida e Saúde — têm playlistId de verdade). Sem um vídeo real, escolher um desses itens na
// Liturgia abria a BUSCA do YouTube em vez de já tocar o vídeo (bug relatado por ele em 25/09).
// Trilhas Fixas resolve isso: em Gestão, Paulo cadastra o link exato do YouTube pra cada "momento"
// que se repete toda semana (nome + URL) — a partir daí, escolher esse momento na Liturgia já toca
// direto aquele vídeo específico, sem nenhuma busca. Sincroniza com a nuvem igual equipes/escalas.
function fixedTracksKey(churchId) { return 'gc_trilhas_fixas_' + churchId; }
function loadFixedTracks(churchId) {
  try { const raw = localStorage.getItem(fixedTracksKey(churchId)); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function saveFixedTracks(churchId, list) {
  try { localStorage.setItem(fixedTracksKey(churchId), JSON.stringify(list)); } catch(e) {}
}
// Acha uma trilha fixa cadastrada pra esse nome (comparação sem diferenciar maiúsculas/espaços nas
// pontas) — usado tanto pros nomes já sugeridos (MEDIA_LIBRARY) quanto pra qualquer nome próprio que
// o Paulo tenha cadastrado.
function findFixedTrack(fixedTracks, name) {
  if (!fixedTracks || !name) return null;
  const norm = String(name).trim().toLowerCase();
  return fixedTracks.find(t => (t.name || '').trim().toLowerCase() === norm) || null;
}

function TrilhasFixasRow({ track, onChange, onRemove }) {
  const [name, setName] = useState(track.name);
  const [link, setLink] = useState(track.url || '');
  useEffect(() => { setName(track.name); setLink(track.url || ''); }, [track.id]);
  const saveName = () => { const clean = name.trim(); if (clean && clean !== track.name) onChange({ ...track, name: clean }); else setName(track.name); };
  const saveLink = (e) => {
    e.preventDefault();
    const clean = link.trim();
    if (!clean) { onChange({ ...track, url: '', videoId: null }); return; }
    const id = extractYouTubeId(clean);
    if (!id) { alert('Não consegui reconhecer esse link como um vídeo do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    onChange({ ...track, url: 'https://www.youtube.com/watch?v='+id, videoId: id });
  };
  return html`
    <div class="glass" style=${{padding:'12px 14px', borderRadius:'12px', display:'grid', gap:'8px'}}>
      <div style=${{display:'flex', gap:'8px', alignItems:'center'}}>

}

function youtubeSearchUrl(query) { return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query); }
function weekDateSuffix() {
  const sat = keyToDate(getSaturdaysForMonths(1)[0]);
  return sat.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
}
function mediaLibraryUrl(m) {
  if (m.directUrl) return m.directUrl;
  return youtubeSearchUrl(m.dynamic ? m.query + ' ' + weekDateSuffix() : m.query);
}

function extractYouTubeId(url) {
  if (!url) return null;
  const patterns = [/[?&]v=([^&]+)/, /youtu\.be\/([^?&]+)/, /embed\/([^?&]+)/];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

  const confirm = (e) => {
    e.preventDefault();
    const id = extractYouTubeId(link);
    if (!id) { alert('Não consegui reconhecer esse link como um vídeo do YouTube. Copie o link da barra de endereço do vídeo (não da busca).'); return; }
    onChange({ ...media, videoId: id, url: 'https://www.youtube.com/watch?v='+id });
  };
  return html`
    <form onSubmit=${confirm} style=${{display:'flex', gap:'6px'}}>
      <input placeholder="Colar aqui o link do vídeo certo (depois de achar no YouTube)" value=${link} onChange=${e=>setLink(e.target.value)} style=${{...inputStyle, fontSize:'11px'}} />
      <button type="submit" style=${{...btnGhost, padding:'7px 10px', fontSize:'11px', whiteSpace:'nowrap'}}>✅ Confirmar</button>
    </form>
  `;
}

// Guarda o que a pessoa digitou/achou na busca de mídia, pra não sumir se ela trocar de aba,
// editar outra atividade ou o app recarregar o componente — só troca quando ela mesma faz outra
// busca (ou escolhe um resultado). Cada campo de busca tem sua própria chave (geralmente o id da
// atividade), então a busca de uma atividade nunca se mistura com a de outra.
function mediaSearchStorageKey(searchKey) { return 'gc_media_search_' + searchKey; }
function loadMediaSearchState(searchKey) {
  if (!searchKey) return null;
  try {
    const raw = localStorage.getItem(mediaSearchStorageKey(searchKey));
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function saveMediaSearchState(searchKey, state) {
  if (!searchKey) return;
  try { localStorage.setItem(mediaSearchStorageKey(searchKey), JSON.stringify(state)); } catch(e) {}
}
function clearMediaSearchState(searchKey) {
  if (!searchKey) return;
  try { localStorage.removeItem(mediaSearchStorageKey(searchKey)); } catch(e) {}
}

function MediaSearchField({ media, onChange, searchKey }) {
  const [q, setQ] = useState(() => { const s = loadMediaSearchState(searchKey); return (s && s.q) || ''; });
  const [videos, setVideos] = useState(() => { const s = loadMediaSearchState(searchKey); return s && s.videos !== undefined ? s.videos : null; }); // null = não buscou ainda; [] = buscou e veio vazio
  const [searching, setSearching] = useState(false);
  const matches = q.trim() ? MEDIA_LIBRARY.filter(m => m.title.toLowerCase().includes(q.toLowerCase())).slice(0,5) : [];

  useEffect(() => {
    if (!searchKey) return;
    if (!q.trim() && videos === null) { clearMediaSearchState(searchKey); return; }
    saveMediaSearchState(searchKey, { q, videos });
  }, [searchKey, q, videos]);

  const doSearch = async () => {
    const query = q.trim();
    if (!query) return;
    setSearching(true);
    const result = await searchYoutubeServer(query);
    setSearching(false);
    if (result) { setVideos(result); return; }
    window.open(youtubeSearchUrl(query), '_blank', 'noopener'); // sem servidor de busca disponível
  };

  const pick = (payload) => {
    clearMediaSearchState(searchKey);
    onChange(payload);
  };

  // Escolher uma sugestão da MEDIA_LIBRARY (25/09, corrigido): os itens "dinâmicos" (Provai e Vede,
  // Informativo, Vida e Saúde) já têm um vídeo/playlist real vinculado e tocam na hora. Os outros só
  // tinham uma "query" de busca — clicar neles antes abria direto a URL de BUSCA do YouTube (sem
  // nenhum vídeo selecionado), que é exatamente o bug relatado pelo Paulo ("abre o YouTube com a
  // busca, mas não o vídeo selecionado"). Agora, pra esses, a gente já faz a busca de verdade aqui
  // mesmo e mostra os resultados reais pra escolher — igual clicar em "🔍 Buscar".
  const pickLibrary = async (m) => {
    if (m.dynamic) {
      // Busca de verdade (25/09, corrigido — pedido do Paulo) o vídeo já LANÇADO mais recente, em vez
      // de usar direto a playlist de uploads do canal: essa playlist já lista pré-estreias/vídeos
      // agendados (ainda não foram ao ar) ANTES dos que já foram lançados, e a busca normal do
      // YouTube não traz esses agendados — só os que já estão no ar de verdade.
      setSearching(true);
      const results = await searchYoutubeServer(m.query);
      setSearching(false);
      const videoId = (results && results[0] && results[0].videoId) || null;
      pick({ title: m.title + ' ('+weekDateSuffix()+')', url: mediaLibraryUrl(m), playlistId: m.playlistId || null, videoId });
      return;
    }
    setQ(m.title);
    setSearching(true);
    const result = await searchYoutubeServer(m.query);
    setSearching(false);
    if (result && result.length) { setVideos(result); return; }
    window.open(youtubeSearchUrl(m.query), '_blank', 'noopener');
  };

  if (media && media.title) {
    return html`
      <div style=${{display:'flex', alignItems:'center', gap:'8px', padding:'8px 10px', borderRadius:'10px', background:'rgba(99,102,241,0.1)'}}>
        <span style=${{fontSize:'14px'}}>🎬</span>
        <span style=${{flex:1, fontSize:'12px', color:'var(--text-hi)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>${media.title}</span>
        <button type="button" onClick=${()=>openMediaInNewTab(media)} style=${{...btnGhost, padding:'6px 12px', fontSize:'11px', whiteSpace:'nowrap'}}>▶ Play</button>
        <button type="button" onClick=${()=>onChange(null)} style=${{background:'transparent', border:'none', color:'var(--text-dim)', fontSize:'13px'}}>✕</button>
      </div>
    `;
  }

  return html`
    <div style=${{display:'grid', gap:'6px'}}>
      <div style=${{display:'flex', gap:'6px'}}>
        <input placeholder="Buscar mensagem musical ou vídeo..." value=${q} onChange=${e=>{setQ(e.target.value); setVideos(null);}} onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); doSearch(); } }} style=${{...inputStyle, fontSize:'12px'}} />
        <button type="button" onClick=${doSearch} disabled=${!q.trim() || searching} style=${{...btnGhost, padding:'8px 12px', fontSize:'11px', whiteSpace:'nowrap', opacity: (q.trim() && !searching) ? 1 : 0.4}}>${searching ? '⏳' : '🔍'} Buscar</button>
      </div>
      ${matches.length > 0 && html`
        <div style=${{display:'grid', gap:'4px'}}>
          ${matches.map(m => html`
            <button key=${m.title} type="button" onClick=${()=>pickLibrary(m)} disabled=${searching} style=${{textAlign:'left', padding:'7px 10px', borderRadius:'8px', border:'1px solid var(--border-soft)', background:'transparent', fontSize:'11.5px', color:'var(--text-mid)'}}>🎵 ${m.title}${m.dynamic ? ' 📅' : ''}</button>
          `)}
        </div>
      `}
      ${videos && videos.length > 0 && html`
        <div style=${{display:'grid', gap:'4px', maxHeight:'260px', overflowY:'auto'}}>
          ${videos.map((v,vi) => html`
            <button key=${v.videoId+vi} type="button" onClick=${()=>pick({ title: v.title, url: v.watchUrl || ('https://www.youtube.com/watch?v='+v.videoId), videoId: v.videoId })} style=${{display:'flex', gap:'8px', alignItems:'center', padding:'5px', borderRadius:'8px', border:'1px solid var(--border-soft)', background:'transparent', textAlign:'left'}}>
              <img src=${v.thumbnail} alt="" style=${{width:'56px', height:'32px', objectFit:'cover', borderRadius:'5px', flexShrink:0}} />
              <span style=${{fontSize:'11px', color:'var(--text-hi)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>${v.title}</span>
            </button>
          `)}
        </div>
      `}
      ${videos && videos.length === 0 && html`<div style=${{fontSize:'10.5px', color:'var(--text-dim)'}}>Nenhum resultado encontrado.</div>`}
    </div>
  `;
}

function defaultLiturgyKey(churchId) { return 'gc_default_liturgy_' + churchId; }
function loadDefaultLiturgy(churchId) {
  try {
    const raw = localStorage.getItem(defaultLiturgyKey(churchId));
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.list) && !Array.isArray(data.versions)) {
        // Formato antigo (uma única lista) — migra automaticamente para o novo formato com versões
        const migrated = { password: data.password, versions: [{ at: new Date().toISOString(), list: data.list }] };
        try { localStorage.setItem(defaultLiturgyKey(churchId), JSON.stringify(migrated)); } catch(e) {}
        return migrated;
      }
      return data;
    }
  } catch(e) {}
  return null;
}
function saveDefaultLiturgyVersion(churchId, list, password) {
  const current = loadDefaultLiturgy(churchId) || { password, versions: [] };
  const versions = [{ at: new Date().toISOString(), list }, ...current.versions].slice(0, 10);
  const data = { password: current.password || password, versions };
  try { localStorage.setItem(defaultLiturgyKey(churchId), JSON.stringify(data)); } catch(e) {}
  return data;
}

// Detecta tela pequena (celular) pra decidir se o menu do cabeçalho começa fechado, economizando
// espaço vertical — sem isso o cabeçalho com todos os grupos abertos ocupava quase a tela toda
// num celular. Olha tanto a largura (celular em pé) quanto a altura (celular deitado — na
// horizontal a largura fica grande, mas a altura fica bem curta, e é isso que faz o cabeçalho
// tomar a tela toda e esconder os botões de baixo). Reage a giro de tela / redimensionamento.
function isCompactScreen() {
  if (typeof window === 'undefined') return false;
  return window.innerWidth <= 680 || window.innerHeight <= 480;
}
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(isCompactScreen);
  useEffect(() => {
    const onResize = () => setIsMobile(isCompactScreen());
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => { window.removeEventListener('resize', onResize); window.removeEventListener('orientationchange', onResize); };
  }, []);
  return isMobile;
}

// Compartilha o link do próprio app (a página que está aberta agora) — usa o menu nativo de
// compartilhamento do celular quando existe (WhatsApp, e-mail, etc.); no computador, ou quando o
// celular não oferece esse menu, copia o link pra área de transferência pra colar onde quiser.
async function shareAppLink() {
  const url = window.location.href;
  const title = 'Gerenciador de Culto & Hinário Adventista';
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(url);
    alert('Link copiado! Agora é só colar (Ctrl+V ou manter apertado e colar) onde quiser mandar.');
  } catch(e) {
    window.prompt('Copie o link abaixo:', url);
  }
}

// Igual ao shareAppLink, mas pra um link específico (não o da página atual) — usado pelos links
// públicos de cadastro (Momentos de Louvor / Mensagem Musical) que Paulo manda pra quem vai cantar
// ou reger, sem precisar entrar no app.
async function shareLinkUrl(url, title) {
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(url);
    alert('Link copiado! Agora é só colar (Ctrl+V ou manter apertado e colar) onde quiser mandar.');
  } catch(e) {
    window.prompt('Copie o link abaixo:', url);
  }
}

// Botõezinhos "🖥️ Tela 1", "Tela 2"... um pra cada tela habilitada — pedido do Paulo (25/09) pra
// poder mandar direto pra uma tela específica (numeradas na mesma ordem de "Telas"), sem precisar
// abrir o seletor. Só aparece com 2+ telas habilitadas (com 0 ou 1 não tem o que escolher). Devolve
// uma lista de botões prontos (não o JSX em si) pra poder entrar na mesma grade do ScreenSendRow.
function screenQuickButtonDefs(churchId, onSendToScreen) {
  const enabled = loadEnabledScreens(churchId);
  if (enabled.length < 2) return [];
  return enabled.map((scr, i) => ({
    text: '🖥️ Tela ' + (i+1),
    title: scr.label + (scr.isProjector ? ' (projetor)' : ''),
    onClick: () => onSendToScreen(scr),
  }));
